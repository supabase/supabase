name: Testagram Core Image Build Verification

on:
  push:
    branches:
      - testagram/core-platform-foundation
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - name: auth
            context: core/services/auth
            file: core/services/auth/Dockerfile
            target: ""
          - name: realtime
            context: core/services/realtime
            file: core/services/realtime/Dockerfile
            target: ""
          - name: storage
            context: core/services/storage
            file: core/services/storage/Dockerfile
            target: final
          - name: postgres-meta
            context: core/services/postgres-meta
            file: core/services/postgres-meta/Dockerfile
            target: ""
          - name: edge-runtime
            context: core/services/edge-runtime
            file: core/services/edge-runtime/Dockerfile
            target: edge-runtime
          - name: supavisor
            context: core/services/supavisor
            file: core/services/supavisor/Dockerfile
            target: ""
          - name: postgrest
            context: core/services/postgrest
            file: core/services/postgrest/Dockerfile
            target: ""
          - name: postgres
            context: core/services/postgres
            file: core/services/postgres/Dockerfile-17
            target: production
          - name: studio
            context: .
            file: apps/studio/Dockerfile
            target: production

    steps:
      - name: Checkout foundation branch
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Verify Docker build inputs
        run: |
          set -euo pipefail
          test -f "${{ matrix.file }}"
          test -d "${{ matrix.context }}"
          echo "verified build context: ${{ matrix.context }}"
          echo "verified Dockerfile: ${{ matrix.file }}"

      - name: Build image
        env:
          DOCKER_BUILDKIT: "1"
        run: |
          set -euo pipefail
          args=(
            build
            --pull
            --progress=plain
            -f "${{ matrix.file }}"
            -t "testagram-build/${{ matrix.name }}:${GITHUB_SHA}"
          )
          if [[ -n "${{ matrix.target }}" ]]; then
            args+=(--target "${{ matrix.target }}")
          fi
          if [[ "${{ matrix.name }}" == "storage" ]]; then
            args+=(--secret id=npmrc,src=/dev/null)
          fi
          docker "${args[@]}" "${{ matrix.context }}"

      - name: Inspect image
        run: |
          set -euo pipefail
          docker image inspect "testagram-build/${{ matrix.name }}:${GITHUB_SHA}" \
            --format '{{.Id}} {{.Architecture}} {{.Os}}'
