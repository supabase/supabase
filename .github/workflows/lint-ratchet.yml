name: Ratchet lint checks

on:
  pull_request:
    branches:
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      apps: ${{ steps.filter.outputs.changes }}
    steps:
      - uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3.0.2
        id: filter
        with:
          filters: |
            shared: &shared
              - 'packages/**'
              - 'pnpm-lock.yaml'
            www:
              - *shared
              - 'apps/www/**'
            docs:
              - *shared
              - 'apps/docs/**'
            design-system:
              - *shared
              - 'apps/design-system/**'
            ui-library:
              - *shared
              - 'apps/ui-library/**'
            learn:
              - *shared
              - 'apps/learn/**'

  ratchet:
    needs: changes
    if: ${{ needs.changes.outputs.apps != '[]' }}
    # Uses larger hosted runner as it significantly decreases build times
    runs-on: blacksmith-4vcpu-ubuntu-2404
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.changes.outputs.apps) }}
        exclude:
          - app: shared

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          sparse-checkout: |
            apps/${{ matrix.app }}
            packages
            patches

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        name: Install pnpm
        with:
          run_install: false

      - name: Use Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install deps
        run: pnpm install --frozen-lockfile

      # pnpm runs the script from the app directory, which is where the
      # baselines were generated, so per-file keys line up.
      - name: Run ratchet script
        env:
          APP: ${{ matrix.app }}
        run: pnpm --filter "./apps/$APP" run lint:ratchet
