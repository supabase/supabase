name: Partner intake form / HubSpot sync check

# Deliberately its own workflow, path-filtered to only the files this check
# actually concerns — NOT part of www-tests.yml's `pnpm test` run, which
# gates every apps/www PR. A HubSpot-side change surfaced by the scheduled
# www-partner-form-sync.yml bot PR (which touches only the generated
# snapshot) should fail *this* check, not block unrelated apps/www work.
on:
  pull_request:
    branches: ['master']
    paths:
      - 'apps/www/components/Partners/PartnerIntakeForm.fields.ts'
      - 'apps/www/components/Partners/PartnerIntakeForm.sync.test.ts'
      - 'apps/www/components/Partners/__generated__/partner-intake-form.hubspot.json'
      - 'apps/www/lib/staticFormCrm.ts'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CI: true

jobs:
  check:
    runs-on: blacksmith-4vcpu-ubuntu-2404

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          sparse-checkout: |
            apps/www
            packages
            supabase
            patches

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        name: Install pnpm
        with:
          run_install: false

      - name: Use Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Run partner intake form / HubSpot sync check
        run: pnpm run test:partner-form-sync
        working-directory: ./apps/www
