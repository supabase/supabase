version: "3.8"

# Multi-database Supabase docker-compose
# Each database gets its own GoTrue (auth) and PostgREST (rest) sidecar.
# Envoy routes requests to the correct sidecar via X-Project-Ref header.

networks:
  supabase-net:
    driver: bridge

volumes:
  db-default-data:
  db-project-alpha-data:
  db-project-beta-data:
  supabase-storage-data:

services:

  # ============================================================
  # Envoy API Gateway
  # ============================================================
  envoy:
    image: envoyproxy/envoy:v1.30-latest
    restart: unless-stopped
    ports:
      - "8000:8000"   # Public API port
      - "9901:9901"   # Envoy admin interface
    volumes:
      - ./volumes/api/envoy/envoy.yaml:/etc/envoy/envoy.yaml:ro
      - ./volumes/api/envoy/cds.yaml:/etc/envoy/cds.yaml:ro
      - ./volumes/api/envoy/lds.template.yaml:/etc/envoy/lds.yaml:ro
    command: >
      envoy
        -c /etc/envoy/envoy.yaml
        --log-level warn
    networks:
      - supabase-net
    healthcheck:
      test: ["CMD-SHELL", "test -f /proc/1/status"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ============================================================
  # Default database + services
  # ============================================================
  db-default:
    image: supabase/postgres:15.1.0.117
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: postgres
    volumes:
      - db-default-data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    networks:
      - supabase-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  supabase-auth:
    image: supabase/gotrue:v2.143.0
    restart: unless-stopped
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      API_EXTERNAL_URL: ${API_EXTERNAL_URL:-http://localhost:8000}
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:${POSTGRES_PASSWORD:-postgres}@db-default:5432/postgres
      GOTRUE_SITE_URL: ${SITE_URL:-http://localhost:3000}
      GOTRUE_JWT_SECRET: ${JWT_SECRET:-super-secret-jwt-token-with-at-least-32-characters-long}
      GOTRUE_JWT_EXP: ${JWT_EXPIRY:-3600}
    depends_on:
      db-default:
        condition: service_healthy
    networks:
      - supabase-net
    healthcheck:
      test: ["CMD-SHELL", "echo > /dev/tcp/localhost/9999"]
      interval: 10s
      timeout: 5s
      retries: 5

  supabase-rest:
    image: postgrest/postgrest:v12.0.2
    restart: unless-stopped
    environment:
      PGRST_DB_URI: postgres://authenticator:${POSTGRES_PASSWORD:-postgres}@db-default:5432/postgres
      PGRST_DB_SCHEMAS: ${PGRST_DB_SCHEMAS:-public,storage,graphql_public}
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${JWT_SECRET:-super-secret-jwt-token-with-at-least-32-characters-long}
      PGRST_DB_USE_LEGACY_GUCS: "false"
    depends_on:
      db-default:
        condition: service_healthy
    networks:
      - supabase-net
    healthcheck:
      disable: true  # PostgREST is distroless - no shell available; monitored via Envoy
      test: ["CMD-SHELL", "true"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================================
  # project-alpha database + services
  # ============================================================
  db-project-alpha:
    image: supabase/postgres:15.1.0.117
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD_ALPHA:-postgres}
      POSTGRES_DB: postgres
    volumes:
      - db-project-alpha-data:/var/lib/postgresql/data
    networks:
      - supabase-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  supabase-auth-project-alpha:
    image: supabase/gotrue:v2.143.0
    restart: unless-stopped
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      API_EXTERNAL_URL: ${API_EXTERNAL_URL:-http://localhost:8000}
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:${POSTGRES_PASSWORD_ALPHA:-postgres}@db-project-alpha:5432/postgres
      GOTRUE_SITE_URL: ${SITE_URL:-http://localhost:3000}
      GOTRUE_JWT_SECRET: ${JWT_SECRET_ALPHA:-super-secret-jwt-token-with-at-least-32-characters-long}
      GOTRUE_JWT_EXP: ${JWT_EXPIRY:-3600}
    depends_on:
      db-project-alpha:
        condition: service_healthy
    networks:
      - supabase-net
    healthcheck:
      test: ["CMD-SHELL", "echo > /dev/tcp/localhost/9999"]
      interval: 10s
      timeout: 5s
      retries: 5

  supabase-rest-project-alpha:
    image: postgrest/postgrest:v12.0.2
    restart: unless-stopped
    environment:
      PGRST_DB_URI: postgres://authenticator:${POSTGRES_PASSWORD_ALPHA:-postgres}@db-project-alpha:5432/postgres
      PGRST_DB_SCHEMAS: ${PGRST_DB_SCHEMAS:-public,storage,graphql_public}
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${JWT_SECRET_ALPHA:-super-secret-jwt-token-with-at-least-32-characters-long}
      PGRST_DB_USE_LEGACY_GUCS: "false"
    depends_on:
      db-project-alpha:
        condition: service_healthy
    networks:
      - supabase-net
    healthcheck:
      disable: true  # PostgREST is distroless - no shell available; monitored via Envoy
      test: ["CMD-SHELL", "true"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================================
  # project-beta database + services
  # ============================================================
  db-project-beta:
    image: supabase/postgres:15.1.0.117
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD_BETA:-postgres}
      POSTGRES_DB: postgres
    volumes:
      - db-project-beta-data:/var/lib/postgresql/data
    networks:
      - supabase-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  supabase-auth-project-beta:
    image: supabase/gotrue:v2.143.0
    restart: unless-stopped
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      API_EXTERNAL_URL: ${API_EXTERNAL_URL:-http://localhost:8000}
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:${POSTGRES_PASSWORD_BETA:-postgres}@db-project-beta:5432/postgres
      GOTRUE_SITE_URL: ${SITE_URL:-http://localhost:3000}
      GOTRUE_JWT_SECRET: ${JWT_SECRET_BETA:-super-secret-jwt-token-with-at-least-32-characters-long}
      GOTRUE_JWT_EXP: ${JWT_EXPIRY:-3600}
    depends_on:
      db-project-beta:
        condition: service_healthy
    networks:
      - supabase-net
    healthcheck:
      test: ["CMD-SHELL", "echo > /dev/tcp/localhost/9999"]
      interval: 10s
      timeout: 5s
      retries: 5

  supabase-rest-project-beta:
    image: postgrest/postgrest:v12.0.2
    restart: unless-stopped
    environment:
      PGRST_DB_URI: postgres://authenticator:${POSTGRES_PASSWORD_BETA:-postgres}@db-project-beta:5432/postgres
      PGRST_DB_SCHEMAS: ${PGRST_DB_SCHEMAS:-public,storage,graphql_public}
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${JWT_SECRET_BETA:-super-secret-jwt-token-with-at-least-32-characters-long}
      PGRST_DB_USE_LEGACY_GUCS: "false"
    depends_on:
      db-project-beta:
        condition: service_healthy
    networks:
      - supabase-net
    healthcheck:
      disable: true  # PostgREST is distroless - no shell available; monitored via Envoy
      test: ["CMD-SHELL", "true"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================================
  # Realtime (multi-tenant, one per database entry in registry)
  # ============================================================
  realtime:
    image: supabase/realtime:v2.102.3
    container_name: realtime-dev.supabase-realtime
    restart: unless-stopped
    depends_on:
      db-default:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -sSfL --head -o /dev/null -H 'Authorization: Bearer ${ANON_KEY}' http://localhost:4000/api/tenants/realtime-dev/health"
        ]
      timeout: 5s
      interval: 30s
      retries: 3
      start_period: 10s
    environment:
      PORT: 4000
      DB_HOST: db-default
      DB_PORT: 5432
      DB_USER: supabase_admin
      DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      DB_NAME: postgres
      DB_AFTER_CONNECT_QUERY: "SET search_path TO _realtime"
      DB_ENC_KEY: supabaserealtime
      API_JWT_SECRET: ${JWT_SECRET:-super-secret-jwt-token-with-at-least-32-characters-long}
      SECRET_KEY_BASE: ${SECRET_KEY_BASE:-UpNVntn3cDxHJpq99YMc1T1AQgQpc8kfYTuRgBiYa15BLrx8etQoXz3gZv1/u2oq}
      METRICS_JWT_SECRET: ${JWT_SECRET:-super-secret-jwt-token-with-at-least-32-characters-long}
      ERL_AFLAGS: -proto_dist inet_tcp
      DNS_NODES: "''"
      RLIMIT_NOFILE: "10000"
      APP_NAME: realtime
      SEED_SELF_HOST: "false"
      RUN_JANITOR: "true"
      DISABLE_HEALTHCHECK_LOGGING: "true"
    volumes:
      - ./volumes/registry/databases.json:/etc/supabase/databases.json:ro
    networks:
      - supabase-net

  realtime-init:
    image: python:3.12-alpine
    depends_on:
      realtime:
        condition: service_healthy
    environment:
      REALTIME_URL: http://realtime:4000
      ANON_KEY: ${ANON_KEY:-eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJyb2xlIjoiYW5vbiIsImlhdCI6MTY0MTc2OTIwMCwiZXhwIjo0Nzk3NDQyODAwfQ.dc_X5iR_VP_qroQgYkEbFTkVh5nNRbQRYBN30jO_h7k}
      DATABASE_REGISTRY_PATH: /etc/supabase/databases.json
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      JWT_SECRET: ${JWT_SECRET:-super-secret-jwt-token-with-at-least-32-characters-long}
    volumes:
      - ./volumes/registry/databases.json:/etc/supabase/databases.json:ro
      - ./scripts/init-realtime-tenants.sh:/init-realtime-tenants.sh:ro
    command: ["sh", "/init-realtime-tenants.sh"]
    restart: "no"
    networks:
      - supabase-net

  # ============================================================
  # Pooler (Supavisor — multi-tenant, one tenant per database)
  # ============================================================
  pooler:
    image: supabase/supavisor:2.5.1
    restart: unless-stopped
    ports:
      - "5434:5432"   # Session-mode pooling (host 5434 → container 5432, avoids local PG conflict)
      - "${POOLER_PROXY_PORT_TRANSACTION:-6543}:6543"  # Transaction-mode pooling
    volumes:
      - ./volumes/pooler/pooler.exs:/etc/pooler/pooler.exs:ro
      - ./volumes/registry/databases.json:/etc/supabase/databases.json:ro
    depends_on:
      db-default:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -sSf http://localhost:4000/api/health || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    environment:
      PORT: 4000
      POSTGRES_HOST: db-default
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      DATABASE_URL: ecto://supabase_admin:${POSTGRES_PASSWORD:-postgres}@db-default:5432/postgres
      CLUSTER_POSTGRES: "true"
      SECRET_KEY_BASE: ${SECRET_KEY_BASE:-UpNVntn3cDxHJpq99YMc1T1AQgQpc8kfYTuRgBiYa15BLrx8etQoXz3gZv1/u2oq}
      VAULT_ENC_KEY: ${VAULT_ENC_KEY:-your-encryption-key-32-chars-long}
      API_JWT_SECRET: ${JWT_SECRET:-super-secret-jwt-token-with-at-least-32-characters-long}
      METRICS_JWT_SECRET: ${JWT_SECRET:-super-secret-jwt-token-with-at-least-32-characters-long}
      POOLER_TENANT_ID: ${POOLER_TENANT_ID:-realtime-dev}
      POOLER_DEFAULT_POOL_SIZE: ${POOLER_DEFAULT_POOL_SIZE:-20}
      POOLER_MAX_CLIENT_CONN: ${POOLER_MAX_CLIENT_CONN:-100}
      POOLER_POOL_MODE: ${POOLER_POOL_MODE:-transaction}
      POOLER_DB_POOL_SIZE: ${POOLER_DB_POOL_SIZE:-5}
      DATABASE_REGISTRY_PATH: /etc/supabase/databases.json
      REGION: local
      ERL_AFLAGS: -proto_dist inet_tcp
    cap_add:
      - SYS_RESOURCE
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    command: ["/bin/sh", "-c", "/app/bin/supavisor eval \"$$(cat /etc/pooler/pooler.exs)\" && /app/bin/server"]
    networks:
      - supabase-net

  # ============================================================
  # pg-meta (Postgres metadata API — used by Studio)
  # ============================================================
  supabase-meta:
    container_name: supabase-meta
    image: supabase/postgres-meta:v0.96.6
    restart: unless-stopped
    depends_on:
      db-default:
        condition: service_healthy
    environment:
      PG_META_PORT: 8080
      PG_META_DB_HOST: db-default
      PG_META_DB_PORT: 5432
      PG_META_DB_NAME: ${POSTGRES_DB:-postgres}
      PG_META_DB_USER: supabase_admin
      PG_META_DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      PG_META_DB_SSL_MODE: disable
      PG_META_CRYPTO_KEY: ${PG_META_CRYPTO_KEY:-af32d6ff9af8b539f9d1b8579f702cd4}
      CRYPTO_KEY: ${PG_META_CRYPTO_KEY:-af32d6ff9af8b539f9d1b8579f702cd4}
    ports:
      - "5555:8080"
    networks:
      - supabase-net

  # ============================================================
  # Storage API
  # ============================================================
  supabase-storage:
    container_name: supabase-storage
    image: supabase/storage-api:v1.60.4
    restart: unless-stopped
    depends_on:
      db-default:
        condition: service_healthy
      supabase-rest:
        condition: service_started
    environment:
      ANON_KEY: ${ANON_KEY}
      SERVICE_KEY: ${SERVICE_ROLE_KEY}
      POSTGREST_URL: http://supabase-rest:3000
      PGRST_JWT_SECRET: ${JWT_SECRET}
      DATABASE_URL: postgresql://supabase_storage_admin:${POSTGRES_PASSWORD}@db-default:5432/${POSTGRES_DB:-postgres}
      FILE_SIZE_LIMIT: 52428800
      STORAGE_BACKEND: file
      FILE_STORAGE_BACKEND_PATH: /var/lib/storage
      TENANT_ID: stub
      REGION: stub
      GLOBAL_S3_BUCKET: stub
      ENABLE_IMAGE_TRANSFORMATION: "true"
      IMGPROXY_URL: http://supabase-imgproxy:8080
    volumes:
      - supabase-storage-data:/var/lib/storage
    networks:
      - supabase-net

  # ============================================================
  # Edge Functions runtime
  # ============================================================
  supabase-edge-functions:
    container_name: supabase-edge-functions
    image: supabase/edge-runtime:v1.74.0
    restart: unless-stopped
    environment:
      JWT_SECRET: ${JWT_SECRET}
      SUPABASE_URL: http://envoy:8000
      SUPABASE_ANON_KEY: ${ANON_KEY}
      SUPABASE_SERVICE_ROLE_KEY: ${SERVICE_ROLE_KEY}
      SUPABASE_DB_URL: postgresql://postgresql://supabase_admin:${POSTGRES_PASSWORD}@db-default:5432/${POSTGRES_DB:-postgres}
    volumes:
      - ../supabase/functions:/home/deno/functions:Z
    networks:
      - supabase-net


  # ============================================================
  # Studio (Dashboard)
  # ============================================================
  studio:
    container_name: supabase-studio
    build:
      context: ..
      dockerfile: apps/studio/Dockerfile
      target: dev
    restart: unless-stopped
    depends_on:
      db-default:
        condition: service_healthy
      supabase-meta:
        condition: service_started
      envoy:
        condition: service_started
    ports:
      - "8082:8082"
    environment:
      STUDIO_PG_META_URL: http://supabase-meta:8080
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      DEFAULT_ORGANIZATION_NAME: ${DEFAULT_ORGANIZATION_NAME:-Default Organization}
      DEFAULT_PROJECT_NAME: ${DEFAULT_PROJECT_NAME:-Default Project}
      DASHBOARD_USERNAME: ${DASHBOARD_USERNAME:-supabase}
      DASHBOARD_PASSWORD: ${DASHBOARD_PASSWORD:-this_password_is_insecure_and_should_be_updated}
      SUPABASE_URL: http://envoy:8000
      SUPABASE_PUBLIC_URL: ${SUPABASE_PUBLIC_URL:-http://localhost:8000}
      SUPABASE_ANON_KEY: ${ANON_KEY:-eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyAgCiAgICAicm9sZSI6ICJhbm9uIiwKICAgICJpc3MiOiAic3VwYWJhc2UtZGVtbyIsCiAgICAiaWF0IjogMTY0MTc2OTIwMCwKICAgICJleHAiOiAxNzk5NTM1NjAwCn0.dc_X5iR_VP_qT0zsiyj_I_OZ2T9FtRU2BBNWN8Bu4GE}
      SUPABASE_SERVICE_KEY: ${SERVICE_ROLE_KEY:-eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyAgCiAgICAicm9sZSI6ICJzZXJ2aWNlX3JvbGUiLAogICAgImlzcyI6ICJzdXBhYmFzZS1kZW1vIiwKICAgICJpYXQiOiAxNjQxNzY5MjAwLAogICAgImV4cCI6IDE3OTk1MzU2MDAKfQ.DaYlNEoUrrEn2Ig7tqibS-PHK5vgusbcbo7X36XVt4Q}
      NEXT_PUBLIC_SITE_URL: ${SUPABASE_PUBLIC_URL:-http://localhost:8000}
      NEXT_PUBLIC_GOTRUE_URL: ${SUPABASE_PUBLIC_URL:-http://localhost:8000}/auth/v1
      SENTRY_IGNORE_API_RESOLUTION_ERROR: "1"
      POSTGRES_HOST: db-default
      POSTGRES_DOCKER_HOST: db-default
      POSTGRES_PORT: 5432
      PG_META_CRYPTO_KEY: ${PG_META_CRYPTO_KEY:-af32d6ff9af8b539f9d1b8579f702cd4}
    networks:
      - supabase-net
