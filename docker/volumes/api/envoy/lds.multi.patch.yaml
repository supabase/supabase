# Patch file: per-database header-based routes for multi-database Supabase
#
# HOW TO APPLY:
#   Insert the route blocks below into lds.template.yaml (or lds.yaml) BEFORE the
#   existing "- name: auth-v1-protected" route entry.
#   Envoy matches routes top-to-bottom, so project-specific routes MUST appear first.
#
# GENERATED BY: scripts/generate-envoy-config.py --lds
# REGENERATE:   python3 scripts/generate-envoy-config.py --lds >> lds.multi.patch.yaml
#
# ============================================================
# Example for project-alpha database:
# ============================================================
#
# - match:
#     prefix: /auth/v1/
#     headers:
#       - name: X-Project-Ref
#         string_match:
#           exact: project-alpha
#   route:
#     cluster: auth-project-alpha
#     prefix_rewrite: /
#
# - match:
#     prefix: /rest/v1/
#     headers:
#       - name: X-Project-Ref
#         string_match:
#           exact: project-alpha
#   route:
#     cluster: rest-project-alpha
#     prefix_rewrite: /
#
# ============================================================
# Example for project-beta database:
# ============================================================
#
# - match:
#     prefix: /auth/v1/
#     headers:
#       - name: X-Project-Ref
#         string_match:
#           exact: project-beta
#   route:
#     cluster: auth-project-beta
#     prefix_rewrite: /
#
# - match:
#     prefix: /rest/v1/
#     headers:
#       - name: X-Project-Ref
#         string_match:
#           exact: project-beta
#   route:
#     cluster: rest-project-beta
#     prefix_rewrite: /
#
# ============================================================
# NOTES:
# - Each new database added to docker/volumes/registry/databases.json requires
#   two new route entries (auth + rest) here.
# - Run scripts/generate-envoy-config.py --cds to update cluster definitions.
# - Run scripts/generate-envoy-config.py --lds to get a fresh route snippet.
# - After updating lds.yaml, restart Envoy: docker compose restart envoy
# - CDS changes (cds.yaml) are picked up automatically via inotify file-watching.
# ============================================================

routes:
  # project-alpha
  - match:
      prefix: /auth/v1/
      headers:
        - name: X-Project-Ref
          string_match:
            exact: project-alpha
    route:
      cluster: auth-project-alpha
      prefix_rewrite: /

  - match:
      prefix: /rest/v1/
      headers:
        - name: X-Project-Ref
          string_match:
            exact: project-alpha
    route:
      cluster: rest-project-alpha
      prefix_rewrite: /

  # project-beta
  - match:
      prefix: /auth/v1/
      headers:
        - name: X-Project-Ref
          string_match:
            exact: project-beta
    route:
      cluster: auth-project-beta
      prefix_rewrite: /

  - match:
      prefix: /rest/v1/
      headers:
        - name: X-Project-Ref
          string_match:
            exact: project-beta
    route:
      cluster: rest-project-beta
      prefix_rewrite: /