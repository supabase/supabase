resources:
  - "@type": type.googleapis.com/envoy.config.listener.v3.Listener
    name: listener_0
    address:
      socket_address:
        address: 0.0.0.0
        port_value: 8000
    filter_chains:
      - filters:
          - name: envoy.filters.network.http_connection_manager
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
              stat_prefix: ingress_http
              access_log:
                - name: envoy.access_loggers.stdout
                  typed_config:
                    "@type": type.googleapis.com/envoy.extensions.access_loggers.stream.v3.StdoutAccessLog
              http_filters:
                - name: envoy.filters.http.jwt_authn
                  typed_config:
                    "@type": type.googleapis.com/envoy.extensions.filters.http.jwt_authn.v3.JwtAuthentication
                    providers:
                      supabase_jwt:
                        issuer: supabase
                        audiences:
                          - authenticated
                        local_jwks:
                          inline_string: '{"keys":[{"kty":"oct","use":"sig","alg":"HS256","k":"c3VwZXItc2VjcmV0LWp3dC10b2tlbi13aXRoLWF0LWxlYXN0LTMyLWNoYXJhY3RlcnMtbG9uZw"}]}'
                        forward: true
                        payload_in_metadata: jwt_payload
                    rules:
                      - match:
                          prefix: /auth/v1/
                      - match:
                          prefix: /rest/v1/
                        requires:
                          provider_name: supabase_jwt
                      - match:
                          prefix: /realtime/v1/
                        requires:
                          provider_name: supabase_jwt
                - name: envoy.filters.http.router
                  typed_config:
                    "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
              route_config:
                name: local_route
                virtual_hosts:
                  - name: local_service
                    domains:
                      - "*"
                    routes:
                      # ============================================================
                      # PER-DATABASE HEADER-BASED ROUTES
                      # These must come BEFORE the default catch-all routes below.
                      # Each project gets auth and rest routes matched by X-Project-Ref.
                      # ============================================================

                      # --- project-alpha routes ---
                      - match:
                          prefix: /auth/v1/
                          headers:
                            - name: X-Project-Ref
                              string_match:
                                exact: project-alpha
                        route:
                          cluster: auth-project-alpha
                          prefix_rewrite: /

                      - match:
                          prefix: /rest/v1/
                          headers:
                            - name: X-Project-Ref
                              string_match:
                                exact: project-alpha
                        route:
                          cluster: rest-project-alpha
                          prefix_rewrite: /

                      # --- project-beta routes ---
                      - match:
                          prefix: /auth/v1/
                          headers:
                            - name: X-Project-Ref
                              string_match:
                                exact: project-beta
                        route:
                          cluster: auth-project-beta
                          prefix_rewrite: /

                      - match:
                          prefix: /rest/v1/
                          headers:
                            - name: X-Project-Ref
                              string_match:
                                exact: project-beta
                        route:
                          cluster: rest-project-beta
                          prefix_rewrite: /

                      # ============================================================
                      # DEFAULT ROUTES (catch-all, no X-Project-Ref header)
                      # ============================================================

                      # Auth routes (GoTrue) — prefix_rewrite strips /auth/v1 so GoTrue sees /verify, /token, etc.
                      - name: auth-v1-open
                        match:
                          prefix: /auth/v1/verify
                        route:
                          cluster: auth
                          prefix_rewrite: /verify

                      - name: auth-v1-open-callback
                        match:
                          prefix: /auth/v1/callback
                        route:
                          cluster: auth
                          prefix_rewrite: /callback

                      - name: auth-v1-open-authorize
                        match:
                          prefix: /auth/v1/authorize
                        route:
                          cluster: auth
                          prefix_rewrite: /authorize

                      - name: auth-v1-protected
                        match:
                          prefix: /auth/v1/
                        route:
                          cluster: auth
                          prefix_rewrite: /

                      # REST routes (PostgREST)
                      - name: rest-v1-protected
                        match:
                          prefix: /rest/v1/
                        route:
                          cluster: rest
                          timeout: 0s

                      # Realtime routes
                      - name: realtime-v1-protected
                        match:
                          prefix: /realtime/v1/
                        route:
                          cluster: realtime
                          upgrade_configs:
                            - upgrade_type: websocket
                          timeout: 0s

                      # Storage routes
                      - name: storage-v1
                        match:
                          prefix: /storage/v1/
                        route:
                          cluster: storage
                          timeout: 0s

                      # Meta routes (pg-meta)
                      - name: meta-v1
                        match:
                          prefix: /pg/
                        route:
                          cluster: meta

                      # Edge Functions routes
                      - name: functions-v1
                        match:
                          prefix: /functions/v1/
                        route:
                          cluster: functions
                          timeout: 0s