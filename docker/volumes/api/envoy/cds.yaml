resources:
  # === Default project clusters (catch-all routes) ===
  - "@type": type.googleapis.com/envoy.config.cluster.v3.Cluster
    name: auth
    type: STRICT_DNS
    connect_timeout: 15s
    dns_lookup_family: V4_ONLY
    lb_policy: ROUND_ROBIN
    load_assignment:
      cluster_name: auth
      endpoints:
        - lb_endpoints:
            - endpoint:
                address:
                  socket_address:
                    address: supabase-auth
                    port_value: 9999

  - "@type": type.googleapis.com/envoy.config.cluster.v3.Cluster
