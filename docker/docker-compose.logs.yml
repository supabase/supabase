# This override adds the following to the self-hosted Supabase configuration:
#   - Logflare: Log management and event analytics platform
#   - ClickHouse: Storage for Unified Logs
#   - Vector: High-performance observability data pipeline for logs
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.logs.yml up -d

services:

  studio:
    depends_on:
      analytics-setup:
        condition: service_completed_successfully
    environment:
      LOGFLARE_PRIVATE_ACCESS_TOKEN: ${LOGFLARE_PRIVATE_ACCESS_TOKEN}
      LOGFLARE_URL: http://analytics:4000
      ENABLED_FEATURES_LOGS_ALL: "true"

  analytics:
    container_name: supabase-analytics
    image: supabase/logflare:1.56.0
    restart: unless-stopped
    #ports:
    #  - 4000:4000
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -sSfL -o /dev/null http://localhost:4000/health"
        ]
      timeout: 5s
      interval: 5s
      retries: 10
      start_period: 30s
    depends_on:
      db:
        # Disable this if you are using an external Postgres database
        condition: service_healthy
    environment:
      LOGFLARE_NODE_HOST: 127.0.0.1
      # Required by the source management API, including with local backends.
      GOOGLE_PROJECT_ID: ${GOOGLE_PROJECT_ID:-supabase-local}

      DB_USERNAME: supabase_admin
      DB_DATABASE: _supabase
      DB_HOSTNAME: ${POSTGRES_HOST}
      DB_PORT: ${POSTGRES_PORT}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_SCHEMA: _analytics

      # Enable single-tenant mode for Logflare
      LOGFLARE_SINGLE_TENANT: "true"
      # Seed Supabase-related metadata
      LOGFLARE_SUPABASE_MODE: "true"

      LOGFLARE_PUBLIC_ACCESS_TOKEN: ${LOGFLARE_PUBLIC_ACCESS_TOKEN}
      LOGFLARE_PRIVATE_ACCESS_TOKEN: ${LOGFLARE_PRIVATE_ACCESS_TOKEN}

      LOGFLARE_FEATURE_FLAG_OVERRIDE: multibackend=true

      # No load balancer to withdraw from: shut down right away on SIGTERM
      LOGFLARE_SHUTDOWN_WITHDRAWAL_TIMEOUT_MS: "0"

      # Comment out the following two variables when switching to
      # the BigQuery backend for logs
      POSTGRES_BACKEND_URL: postgresql://supabase_admin:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/_supabase
      POSTGRES_BACKEND_SCHEMA: _analytics

      # Uncomment to use the BigQuery backend for logs
      #GOOGLE_PROJECT_NUMBER: ${GOOGLE_PROJECT_NUMBER}
    # Uncomment to use the BigQuery backend for logs (requires gcloud.json
    # service account key from Google Cloud Console)
    #volumes:
    #  - ./gcloud.json:/opt/app/rel/logflare/bin/gcloud.json:ro,z

  clickhouse:
    container_name: supabase-clickhouse
    image: clickhouse/clickhouse-server:26.2
    restart: unless-stopped
    environment:
      CLICKHOUSE_DB: logs
      CLICKHOUSE_USER: logflare
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-${POSTGRES_PASSWORD}}
    volumes:
      - clickhouse-data:/var/lib/clickhouse
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8123/ping"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

  analytics-setup:
    image: node:24-alpine
    restart: "no"
    depends_on:
      analytics:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    environment:
      LOGFLARE_URL: http://analytics:4000
      LOGFLARE_PRIVATE_ACCESS_TOKEN: ${LOGFLARE_PRIVATE_ACCESS_TOKEN}
      CLICKHOUSE_DB: logs
      CLICKHOUSE_USER: logflare
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-${POSTGRES_PASSWORD}}
    volumes:
      - ./volumes/logs/setup.mjs:/setup.mjs:ro,z
    command: ["node", "/setup.mjs"]

  vector:
    container_name: supabase-vector
    image: timberio/vector:0.62.0-alpine
    restart: unless-stopped
    volumes:
      - ./volumes/logs/vector.yml:/etc/vector/vector.yml:ro,z
      - ${DOCKER_SOCKET_LOCATION}:/var/run/docker.sock:ro,z
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --no-verbose --tries=1 --spider http://vector:9001/health"
        ]
      timeout: 5s
      interval: 5s
      retries: 3
    depends_on:
      analytics-setup:
        condition: service_completed_successfully
    environment:
      LOGFLARE_PUBLIC_ACCESS_TOKEN: ${LOGFLARE_PUBLIC_ACCESS_TOKEN}
      # Vector 0.57+ doesn't expand ${VAR} in vector.yml by default. The sinks
      # need it for LOGFLARE_PUBLIC_ACCESS_TOKEN, or they send the literal text
      # as the API key. Since 0.62 only string values are substituted.
      VECTOR_DANGEROUSLY_ALLOW_ENV_VAR_INTERPOLATION: "true"
    command:
      [
        "--config",
        "/etc/vector/vector.yml"
      ]
    security_opt:
      - "label=disable"

volumes:
  clickhouse-data:
