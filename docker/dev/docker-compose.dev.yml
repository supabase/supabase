version: "3.8"

services:
  studio:
    build:
      context: ..
      dockerfile: apps/studio/Dockerfile
      target: dev
    ports:
      - 127.0.0.1:${STUDIO_PORT:-3000}:3000/tcp
    develop:
      watch:
        - action: sync
          path: ../apps/studio
          target: /app/apps/studio
          ignore:
            - node_modules/
        - action: rebuild
          path: package.json

  mail:
    container_name: supabase-mail
    image: inbucket/inbucket:3.0.3
    # ports: removed for production security
  auth:
    environment:
      - GOTRUE_SMTP_USER=
      - GOTRUE_SMTP_PASS=
  meta:
    # ports: removed for production security
  db:
    restart: 'no'
    volumes:
      # Always use a fresh database when developing
      - /var/lib/postgresql/data
      # Seed data should be inserted last (alphabetical order)
      - ./dev/data.sql:/docker-entrypoint-initdb.d/seed.sql
  storage:
    volumes:
      - /var/lib/storage
