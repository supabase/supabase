<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kanban · Supabase</title>
    <script>
      // Set data-theme before first paint: the saved choice, else the system
      // preference (which is also followed live while "system" is selected).
      ;(function () {
        var media = window.matchMedia('(prefers-color-scheme: dark)')
        var apply = function () {
          var stored = null
          try {
            stored = localStorage.getItem('theme')
          } catch (_) {}
          var theme = stored === 'light' || stored === 'dark' ? stored : media.matches ? 'dark' : 'light'
          document.documentElement.setAttribute('data-theme', theme)
        }
        apply()
        media.addEventListener('change', apply)
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
