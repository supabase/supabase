# Service baseline for AMI build
# Only checks that critical services exist - not their enabled/running state during build
# Services are configured but many are stopped during AMI build process
service:
  # Core system services (should be running during build)
  cron:
    enabled: false
    running: false
  cloud-config:
    enabled: true
    running: true
  cloud-final:
    enabled: true
    running: true
  cloud-init:
    enabled: true
    running: true
  cloud-init-local:
    enabled: true
    running: true
  systemd-resolved:
    enabled: true
    running: true
  systemd-timesyncd:
    enabled: false
    running: false
  ufw:
    enabled: true
    running: true
  unattended-upgrades:
    enabled: true
    running: true
  sysstat:
    enabled: false
    running: false
  nix-daemon:
    enabled: false
    running: true
  nftables:
    enabled: false
    running: true
  ssh:
    enabled: false
    running: true
  atd:
    enabled: false
    running: false
  getty@tty1:
    enabled: true
    running: true
  grub-common:
    enabled: true
    running: false
  grub-initrd-fallback:
    enabled: true
    running: false
  hibinit-agent:
    enabled: false
    running: false
  ec2-instance-connect-harvest-hostkeys:
    enabled: false
    running: false
  networkd-dispatcher:
    enabled: false
    running: false
  systemd-pstore:
    enabled: true
    running: false
  e2scrub_reap:
    enabled: true
    running: false

  # Supabase services - these are STOPPED during AMI build but should exist
  # We check enabled: false because they're disabled during build
  postgresql:
    enabled: false
    running: false
  pgbouncer:
    enabled: false
    running: false
  postgrest:
    enabled: false
    running: false
  gotrue:
    enabled: false
    running: false
  adminapi:
    enabled: false
    running: false
  envoy:
    enabled: false
    running: false
  vector:
    enabled: false
    running: false
  postgres_exporter:
    enabled: false
    running: false
  pg_egress_collect:
    enabled: false
    running: false
  fail2ban:
    enabled: false
    running: false
  auditd:
    enabled: false
    running: false
  apparmor:
    enabled: true
    running: true

  # Services that should not be running
  kong:
    enabled: false
    running: false
  supabase-admin-agent_salt:
    enabled: false
    running: false
  database_optimizations:
    enabled: false
    running: false
  postgrest-optimizations:
    enabled: false
    running: false
  NetworkManager:
    enabled: false
    running: false
  firewalld:
    enabled: false
    running: false
  iptables:
    enabled: false
    running: false
  display-manager:
    enabled: false
    running: false
