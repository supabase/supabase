  - description: "Will only able to move objects when authenticated"
    policies:
      - read_only_all_objects
      - update_only_all_objects
    asserts:
      - operation: bucket.get
        status: 400
        error: "Bucket not found"

      - operation: bucket.create
        status: 400
        error: "new row violates row-level security policy"

      - operation: upload
        status: 400
        error: "new row violates row-level security policy"

      - operation: upload.upsert
        status: 400
        message: "new row violates row-level security policy"

      - operation: upload
        bucketName: "bucket_to_move_{{runId}}"
        objectName: "object_to_move_{{runId}}.txt"
        policies:
          - insert_only_all_objects
        status: 200

      - operation: object.move
        useExistingBucketName: "bucket_to_move_{{runId}}"
        objectName: "object_to_move_{{runId}}.txt"
        status: 200

      - operation: object.delete
        status: 400

      - operation: bucket.delete
        status: 400
        error: "Bucket not found"

  - description: "Will only able to copy owned objects when authenticated"
    policies:
      - read_only_all_objects
      - insert_only_all_objects
    asserts:
      - operation: bucket.get
        status: 400
        error: "Bucket not found"

      - operation: bucket.create
        status: 400
        error: "new row violates row-level security policy"

      - operation: upload
        bucketName: "bucket_{{runId}}"
        objectName: "object_{{runId}}.txt"
        status: 200

      - operation: upload.upsert
        useExistingBucketName: "bucket_{{runId}}"
        objectName: "object_{{runId}}.txt"
        status: 400
        message: "new row violates row-level security policy"

      - operation: upload
        bucketName: "bucket_to_copy_{{runId}}"
        objectName: "object_to_copy_{{runId}}.txt"
        status: 200

      - operation: object.copy
        useExistingBucketName: "bucket_to_copy_{{runId}}"
        objectName: "object_to_copy_{{runId}}.txt"
        status: 200

      - operation: object.delete
        status: 400

      - operation: bucket.delete
        status: 400
        error: "Bucket not found"

  - description: "Will only upload files with correct user metadata"
    policies:
      - insert_with_metadata_check
      - read_only_all_objects
    asserts:
      - operation: upload
        objectName: "test_file.jpg"
        userMetadata:
          department: "engineering"
        status: 200

      - operation: upload
        status: 400
        error: "new row violates row-level security policy"

      - operation: upload.tus
        objectName: "test_file_tus.jpg"
        userMetadata:
          department: "engineering"
        status: 200

      - operation: upload.tus
        status: 403
        error: "new row violates row-level security policy"

      - operation: upload
        objectName: "source_copy_meta.jpg"
        userMetadata:
          department: "engineering"
        status: 200

      - operation: object.copy
        objectName: "source_copy_meta.jpg"
        destinationObjectName: "copied_source_copy_meta_1.jpg"
        copyMetadata: true
        status: 200

      - operation: object.copy
        objectName: "source_copy_meta.jpg"
        destinationObjectName: "copied_source_copy_meta_2.jpg"
        copyMetadata: false
        userMetadata:
          department: "engineering"
        status: 200

      - operation: object.copy
        objectName: "source_copy_meta.jpg"
        destinationObjectName: "copied_source_copy_meta_3.jpg"
        copyMetadata: false
        userMetadata:
          department: "marketing"
        status: 400
        error: "new row violates row-level security policy"

      - operation: upload.signed
        objectName: "signed_file.jpg"
        userMetadata:
          department: "engineering"
        status: 200

      - operation: upload.signed
        objectName: "signed_file_no_meta.jpg"
        status: 400
        error: "new row violates row-level security policy"

      - operation: upload.s3.multipart
        objectName: "s3_multi_file.jpg"
        userMetadata:
          department: "engineering"
        status: 200

      - operation: upload.s3.multipart
        objectName: "s3_multi_file_no_meta.jpg"
        status: 403

  - description: "Will only upload image files based on mimetype"
    policies:
      - insert_only_images
    asserts:
      - operation: upload
        objectName: "test_image.jpg"
        mimeType: "image/jpeg"
        status: 200

      - operation: upload
        objectName: "test_file.txt"
        mimeType: "text/plain"
        status: 400
        error: "new row violates row-level security policy"

      - operation: upload.tus
        objectName: "test_image_tus.jpg"
        mimeType: "image/jpeg"
        status: 200

      - operation: upload.tus
        objectName: "test_file_tus.txt"
        mimeType: "text/plain"
        status: 403
        error: "new row violates row-level security policy"

  - description: "Will only upload files under size limit based on contentLength"
    policies:
      - insert_max_size_limit
    asserts:
      - operation: upload
        objectName: "small_file.jpg"
        status: 200

      - operation: upload
        objectName: "large_file.jpg"
        contentLength: 200000
        status: 400
        error: "new row violates row-level security policy"

      - operation: upload.tus
        objectName: "small_file_tus.jpg"
        status: 200

      - operation: upload.tus
        objectName: "large_file_tus.jpg"
        contentLength: 200000
        status: 403
        error: "new row violates row-level security policy"

  - description: "Operation helper list-only policies only allow object listing"
    policies:
      - read_only_list_objects
    asserts:
      - operation: upload
        policies:
          - insert_only_all_objects
        status: 200

      - operation: object.list
        status: 200

      - operation: object.get
        status: 400
        error: "Object not found"

      - operation: object.delete
        status: 400
        error: "Access denied"

  - description: "Operation helper any-of policies allow both list and get"
    policies:
      - read_list_or_get_objects
    asserts:
      - operation: upload
        policies:
          - insert_only_all_objects
        status: 200

      - operation: object.list
        status: 200

      - operation: object.get
        status: 200

      - operation: object.delete
        status: 400
        error: "Access denied"
