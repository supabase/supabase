# Testagram Storage local/dev stack.
# Secrets are supplied by the environment; never commit production credentials.
version: "3"
services:
  storage:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    depends_on:
      tenant_db:
        condition: service_healthy
      pg_bouncer:
        condition: service_started
      rustfs_setup:
        condition: service_completed_successfully
    environment:
      SERVER_PORT: 5000
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:?set AUTH_JWT_SECRET}
      AUTH_JWT_ALGORITHM: ${AUTH_JWT_ALGORITHM:-HS256}
      DATABASE_URL: ${DATABASE_URL:-postgres://postgres:postgres@tenant_db:5432/postgres}
      DATABASE_POOL_URL: ${DATABASE_POOL_URL:-postgresql://postgres:postgres@pg_bouncer:6432/postgres}
      DB_INSTALL_ROLES: ${DB_INSTALL_ROLES:-true}
      STORAGE_BACKEND: ${STORAGE_BACKEND:-s3}
      GLOBAL_S3_BUCKET: ${GLOBAL_S3_BUCKET:-supa-storage-bucket}
      GLOBAL_S3_ENDPOINT: ${GLOBAL_S3_ENDPOINT:-http://rustfs:9000}
      GLOBAL_S3_FORCE_PATH_STYLE: ${GLOBAL_S3_FORCE_PATH_STYLE:-true}
      AWS_ACCESS_KEY_ID: ${STORAGE_S3_ACCESS_KEY_ID:?set STORAGE_S3_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${STORAGE_S3_SECRET_ACCESS_KEY:?set STORAGE_S3_SECRET_ACCESS_KEY}
      REGION: ${REGION:-us-east-1}
      S3_PROTOCOL_ENABLED: ${S3_PROTOCOL_ENABLED:-true}
      S3_PROTOCOL_ACCESS_KEY_ID: ${S3_PROTOCOL_ACCESS_KEY_ID:?set S3_PROTOCOL_ACCESS_KEY_ID}
      S3_PROTOCOL_ACCESS_KEY_SECRET: ${S3_PROTOCOL_ACCESS_KEY_SECRET:?set S3_PROTOCOL_ACCESS_KEY_SECRET}
      UPLOAD_FILE_SIZE_LIMIT: ${UPLOAD_FILE_SIZE_LIMIT:-524288000}
      UPLOAD_FILE_SIZE_LIMIT_STANDARD: ${UPLOAD_FILE_SIZE_LIMIT_STANDARD:-52428800}
      UPLOAD_SIGNED_URL_EXPIRATION_TIME: ${UPLOAD_SIGNED_URL_EXPIRATION_TIME:-120}
      TUS_URL_PATH: /upload/resumable
      TUS_URL_EXPIRY_MS: ${TUS_URL_EXPIRY_MS:-3600000}
      IMAGE_TRANSFORMATION_ENABLED: ${IMAGE_TRANSFORMATION_ENABLED:-true}
      IMGPROXY_URL: ${IMGPROXY_URL:-http://imgproxy:8080}
      IMGPROXY_REQUEST_TIMEOUT: ${IMGPROXY_REQUEST_TIMEOUT:-15}
      ICEBERG_BUCKET_DETECTION_MODE: ${ICEBERG_BUCKET_DETECTION_MODE:-FULL_PATH}
      ICEBERG_WAREHOUSE: ${ICEBERG_WAREHOUSE:-.}
      ICEBERG_CATALOG_URL: ${ICEBERG_CATALOG_URL:-http://rest-catalog:8181/v1}
      ICEBERG_CATALOG_AUTH_TYPE: ${ICEBERG_CATALOG_AUTH_TYPE:-token}
      ICEBERG_CATALOG_AUTH_TOKEN: ${ICEBERG_CATALOG_AUTH_TOKEN:?set ICEBERG_CATALOG_AUTH_TOKEN}
      ICEBERG_S3_DELETE_ENABLED: ${ICEBERG_S3_DELETE_ENABLED:-true}

  tenant_db:
    extends:
      service: tenant_db
      file: ./.docker/docker-compose-infra.yml
  pg_bouncer:
    extends:
      service: pg_bouncer
      file: ./.docker/docker-compose-infra.yml
  rustfs:
    extends:
      service: rustfs
      file: ./.docker/docker-compose-infra.yml
  rustfs_setup:
    extends:
      service: rustfs_setup
      file: ./.docker/docker-compose-infra.yml
    depends_on:
      rustfs:
        condition: service_healthy
  imgproxy:
    extends:
      service: imgproxy
      file: ./.docker/docker-compose-infra.yml
  rest-catalog:
    depends_on:
      rustfs_setup:
        condition: service_completed_successfully
    extends:
      service: rest-catalog
      file: ./.docker/docker-compose-infra.yml
