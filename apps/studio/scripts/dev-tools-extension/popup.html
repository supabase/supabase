<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sync Supabase auth to local Studio</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }
      body {
        width: 320px;
        margin: 0;
        padding: 14px;
        font-size: 13px;
        line-height: 1.4;
      }
      h1 {
        font-size: 13px;
        font-weight: 600;
        margin: 0 0 10px;
      }
      label {
        display: block;
        font-size: 11px;
        opacity: 0.7;
        margin: 8px 0 3px;
      }
      input {
        width: 100%;
        box-sizing: border-box;
        padding: 6px 8px;
        border: 1px solid rgba(128, 128, 128, 0.4);
        border-radius: 6px;
        background: transparent;
        color: inherit;
        font: inherit;
      }
      button {
        width: 100%;
        margin-top: 12px;
        padding: 8px;
        border: 0;
        border-radius: 6px;
        background: #3ecf8e;
        color: #06231a;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }
      button:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }
      .row {
        display: flex;
        justify-content: space-between;
        gap: 8px;
        margin: 4px 0;
      }
      .row span:last-child {
        opacity: 0.7;
        text-align: right;
        word-break: break-all;
      }
      .dot {
        display: inline-block;
        width: 8px;
        height: 8px;
        border-radius: 50%;
        margin-right: 2px;
      }
      .dot.on {
        background: #3ecf8e;
        box-shadow: 0 0 6px #3ecf8e;
      }
      .dot.off {
        background: rgba(128, 128, 128, 0.5);
      }
      #status {
        margin-top: 12px;
        padding: 8px;
        border-radius: 6px;
        font-size: 12px;
        white-space: pre-wrap;
        display: none;
      }
      #status.ok {
        display: block;
        background: rgba(62, 207, 142, 0.15);
      }
      #status.err {
        display: block;
        background: rgba(240, 100, 100, 0.18);
      }
    </style>
  </head>
  <body>
    <h1>Sync auth → local Studio</h1>

    <div class="row"><span>Source (hosted)</span><span id="source-tab">—</span></div>
    <div class="row">
      <span><span id="conn-dot" class="dot off"></span> Target (local)</span>
      <span id="target-tab">—</span>
    </div>

    <label for="target-origin">Local Studio origin</label>
    <input id="target-origin" type="text" placeholder="http://localhost:8082" />

    <button id="sync" disabled>Sync token &amp; reload</button>

    <div id="status"></div>

    <script src="popup.js"></script>
  </body>
</html>
