  - id: supabase-completion
    title: supabase completion
    summary: Generate shell completion scripts
    description: Print a shell completion script for `supabase` to stdout. Run the subcommand for your shell and follow its help to load the script.
    tags:
      - other-commands
    links: []
    subcommands:
      - supabase-completion-bash
      - supabase-completion-fish
      - supabase-completion-powershell
      - supabase-completion-zsh
    flags: []
  - id: supabase-completion-bash
    title: supabase completion bash
    summary: Generate the Bash completion script
    description: |-
      Generate the autocompletion script for the bash shell.

      This script depends on the 'bash-completion' package.
      If it is not installed already, you can install it via your OS's package manager.

      To load completions in your current shell session:

          source <(supabase completion bash)

      To load completions for every new session, execute once:

      #### Linux:

          supabase completion bash > /etc/bash_completion.d/supabase

      #### macOS:

          supabase completion bash > $(brew --prefix)/etc/bash_completion.d/supabase

      You will need to start a new shell for this setup to take effect.
    examples:
      - id: example-1
        name: Load completions in the current bash session
        code: source <(supabase completion bash)
    tags: []
    links: []
    usage: supabase completion bash [flags]
    subcommands: []
    flags:
      - id: no-descriptions
        name: --no-descriptions
        description: Omit descriptions from the generated completions.
        default_value: 'false'
  - id: supabase-completion-fish
    title: supabase completion fish
    summary: Generate the fish completion script
    description: |-
      Generate the autocompletion script for the fish shell.

      To load completions in your current shell session:

          supabase completion fish | source

      To load completions for every new session, execute once:

          supabase completion fish > ~/.config/fish/completions/supabase.fish

      You will need to start a new shell for this setup to take effect.
    examples:
      - id: example-1
        name: Load completions in the current fish session
        code: supabase completion fish | source
    tags: []
    links: []
    usage: supabase completion fish [flags]
    subcommands: []
    flags:
      - id: no-descriptions
        name: --no-descriptions
        description: Omit descriptions from the generated completions.
        default_value: 'false'
  - id: supabase-completion-powershell
    title: supabase completion powershell
    summary: Generate the PowerShell completion script
    description: |-
      Generate the autocompletion script for powershell.

      To load completions in your current shell session:

          supabase completion powershell | Out-String | Invoke-Expression

      To load completions for every new session, add the output of the above command
      to your powershell profile.
    examples:
      - id: example-1
        name: Load completions in the current PowerShell session
        code: supabase completion powershell | Out-String | Invoke-Expression
    tags: []
    links: []
    usage: supabase completion powershell [flags]
    subcommands: []
    flags:
      - id: no-descriptions
        name: --no-descriptions
        description: Omit descriptions from the generated completions.
        default_value: 'false'
  - id: supabase-completion-zsh
    title: supabase completion zsh
    summary: Generate the Zsh completion script
    description: |-
      Generate the autocompletion script for the zsh shell.

      If shell completion is not already enabled in your environment you will need
      to enable it.  You can execute the following once:

          echo "autoload -U compinit; compinit" >> ~/.zshrc

      To load completions in your current shell session:

          source <(supabase completion zsh)

      To load completions for every new session, execute once:

      #### Linux:

          supabase completion zsh > "${fpath[1]}/_supabase"

      #### macOS:

          supabase completion zsh > $(brew --prefix)/share/zsh/site-functions/_supabase

      You will need to start a new shell for this setup to take effect.
