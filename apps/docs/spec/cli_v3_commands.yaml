clispec: '002'
prerelease: true
info:
  id: cli
  version: latest
  title: Supabase CLI
  language: sh
  source: https://github.com/supabase/cli
  bugs: https://github.com/supabase/cli/issues
  spec: https://github.com/supabase/spec/cli_v1_commands.yaml
  description: Supabase CLI provides you with tools to develop your application locally, and deploy your application to the Supabase platform.
  tags:
    - id: quick-start
      title: Quick Start
    - id: local-dev
      title: Local Development
    - id: management-api
      title: Management APIs
    - id: other-commands
      title: Additional Commands
flags:
  - id: agent
    name: --agent <[ auto | yes | no ]>
    description: 'Override agent detection: yes, no, or auto (default auto)'
    default_value: auto
    accepted_values:
      - id: auto
        name: auto
        type: '[ auto | yes | no ]'
      - id: 'yes'
        name: 'yes'
        type: '[ auto | yes | no ]'
      - id: 'no'
        name: 'no'
        type: '[ auto | yes | no ]'
  - id: debug
    name: --debug
    description: output debug logs to stderr
    default_value: 'false'
  - id: dns-resolver
    name: --dns-resolver <[ native | https ]>
    description: lookup domain names using the specified resolver
    default_value: native
    accepted_values:
      - id: native
        name: native
        type: '[ native | https ]'
      - id: https
        name: https
        type: '[ native | https ]'
  - id: experimental
    name: --experimental
    description: enable experimental features
    default_value: 'false'
  - id: help
    name: -h, --help
    description: Show help information
    default_value: 'false'
  - id: network-id
    name: --network-id <string>
    description: use the specified docker network instead of a generated one
    default_value: ''
  - id: output
    name: -o, --output <[ env | pretty | json | toml | yaml ]>
    description: output format of status variables
    default_value: pretty
    accepted_values:
      - id: env
        name: env
        type: '[ env | pretty | json | toml | yaml ]'
      - id: pretty
        name: pretty
        type: '[ env | pretty | json | toml | yaml ]'
      - id: json
        name: json
        type: '[ env | pretty | json | toml | yaml ]'
      - id: toml
        name: toml
        type: '[ env | pretty | json | toml | yaml ]'
      - id: yaml
        name: yaml
        type: '[ env | pretty | json | toml | yaml ]'
  - id: output-format
    name: --output-format <[ text | json | stream-json ]>
    description: 'Output format: text (default), json, or stream-json (NDJSON)'
    default_value: text
    accepted_values:
      - id: text
        name: text
        type: '[ text | json | stream-json ]'
      - id: json
        name: json
        type: '[ text | json | stream-json ]'
      - id: stream-json
        name: stream-json
        type: '[ text | json | stream-json ]'
  - id: profile
    name: --profile <string>
    description: use a specific profile for connecting to Supabase API
    default_value: supabase
  - id: workdir
    name: --workdir <string>
    description: path to the directory containing your supabase/ folder; used exactly as given, with no ancestor directory search (defaults to searching upward from the current directory)
    default_value: ''
  - id: 'yes'
    name: --yes
    description: answer yes to all prompts; hosted changes only accept this flag or SUPABASE_YES exported in your shell, never supabase/.env or another .env file
    default_value: 'false'
commands:
  - id: supabase-backups
    title: supabase backups
    summary: Manage Supabase physical backups
    description: Manage Supabase physical backups.
    tags:
      - management-api
    links: []
    subcommands:
      - supabase-backups-list
      - supabase-backups-restore
    flags: []
  - id: supabase-backups-list
    title: supabase backups list
    summary: Lists available physical backups
    description: Lists available physical backups
    examples:
      - id: example-1
        name: List all physical backups
        code: supabase backups list
      - id: example-2
        name: List backups for a specific project
        code: supabase backups list --remote=<ref>
    tags: []
    links: []
    usage: supabase backups list [flags]
    subcommands: []
    flags:
      - id: remote
        name: --remote[=<ref|branch>]
        description: 'Target another project: --remote=<ref|branch>. Defaults to the linked project.'
        default_value: 'false'
  - id: supabase-backups-restore
    title: supabase backups restore
    summary: Restore to a specific timestamp using PITR
    description: Restore to a specific timestamp using PITR
    examples:
      - id: example-1
        name: Restore to the given Unix epoch timestamp
        code: supabase backups restore --timestamp 1707407047
    tags: []
    links: []
    usage: supabase backups restore [flags]
    subcommands: []
    flags:
      - id: remote
        name: --remote[=<ref|branch>]
        description: 'Target another project: --remote=<ref|branch>. Defaults to the linked project.'
        default_value: 'false'
      - id: timestamp
        name: -t, --timestamp <int>
        description: The recovery time target in seconds since epoch.
        default_value: '0'
  - id: supabase-bootstrap
    title: supabase bootstrap
    summary: Create a project from a starter template
    description: |-
      Create a new hosted Supabase project from a starter template and link it to a local directory. Use it to go from nothing to a running project with one command.

      The command prompts for a working directory, downloads the template, creates the project, links it, writes its connection settings to `.env`, and pushes the template's migrations. It logs you in first if needed.

      Creating a project is a hosted change, so the command asks for confirmation before it starts.
    examples:
      - id: example-1
        name: Pick a starter template interactively
        code: supabase bootstrap
      - id: example-2
        name: Bootstrap from a named starter template
        code: supabase bootstrap my-template
    tags:
      - quick-start
    links: []
    usage: supabase bootstrap [template] [flags]
    subcommands: []
    flags:
      - id: password
        name: -p, --password <string>
        description: Password for the new project's Postgres database.
        default_value: ''
