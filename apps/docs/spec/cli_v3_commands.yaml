  - id: supabase-inspect-db-bloat
    title: supabase inspect db bloat
    summary: Show relation bloat
    description: |


      Estimate how much space each table and index wastes on dead tuples. Use it to find relations where autovacuum is not keeping up.

      When data is updated or deleted, Postgres keeps the old row versions as "dead tuples" under [MVCC](https://www.postgresql.org/docs/current/mvcc.html) until [autovacuum](https://supabase.com/docs/guides/platform/database-size#vacuum-operations) cleans them. High bloat can slow queries, cause excessive IOPS, and waste space.

      Investigate tables with a high bloat ratio to see whether vacuuming is too slow or something else is wrong.

      ```
          TYPE  │ SCHEMA NAME │        OBJECT NAME         │ BLOAT │ WASTE
        ────────┼─────────────┼────────────────────────────┼───────┼─────────────
          table │ public      │ very_bloated_table         │  41.0 │ 700 MB
          table │ public      │ my_table                   │   4.0 │ 76 MB
          table │ public      │ happy_table                │   1.0 │ 1472 kB
          index │ public      │ happy_table::my_nice_index │   0.7 │ 880 kB
      ```
    examples:
      - id: example-1
        name: Estimate dead-tuple bloat on the local database
        code: supabase inspect db bloat
      - id: example-2
        name: Estimate bloat on the linked project
        code: supabase inspect db bloat --remote
    tags: []
    links: []
    usage: supabase inspect db bloat [flags]
    subcommands: []
    flags:
      - id: remote
        name: --remote[=<ref|branch|url>]
        description: 'Target a remote database: the linked project, or --remote=<ref|branch|url>.'
        default_value: 'false'
  - id: supabase-inspect-db-blocking
    title: supabase inspect db blocking
    summary: Show blocking queries
    description: |


      List statements that hold locks and the statements they block. Use it together with `inspect db locks` to decide which statements to terminate to resolve lock contention.

      ```
          BLOCKED PID │ BLOCKING STATEMENT           │ BLOCKING DURATION │ BLOCKING PID │ BLOCKED STATEMENT                                                                      │ BLOCKED DURATION
        ──────────────┼──────────────────────────────┼───────────────────┼──────────────┼────────────────────────────────────────────────────────────────────────────────────────┼───────────────────
          253         │ select count(*) from mytable │ 00:00:03.838314   │        13495 │ UPDATE "mytable" SET "updated_at" = '2023─08─03 14:07:04.746688' WHERE "id" = 83719341 │ 00:00:03.821826
      ```
    examples:
      - id: example-1
        name: Show blocked statements on the local database
        code: supabase inspect db blocking
      - id: example-2
        name: Show blocked statements on the linked project
        code: supabase inspect db blocking --remote
    tags: []
    links: []
    usage: supabase inspect db blocking [flags]
    subcommands: []
    flags:
      - id: remote
        name: --remote[=<ref|branch|url>]
        description: 'Target a remote database: the linked project, or --remote=<ref|branch|url>.'
        default_value: 'false'
  - id: supabase-inspect-db-calls
    title: supabase inspect db calls
    summary: Show queries by call count
    description: |


