  - id: supabase-vanity-subdomains-activate
    title: supabase vanity-subdomains activate
    summary: Activate a vanity subdomain
    description: Makes your project respond to requests on the vanity subdomain you choose. After activation, your project's auth services no longer work on the `{project-ref}.{supabase-domain}` hostname.
    examples:
      - id: example-1
        name: Activate a vanity subdomain for a project
        code: supabase vanity-subdomains activate --desired-subdomain my-app --experimental --remote=<project-ref>
    tags: []
    links: []
    usage: supabase vanity-subdomains activate [flags]
    subcommands: []
    flags:
      - id: desired-subdomain
        name: --desired-subdomain <string>
        description: The vanity subdomain to use for the project.
        required: true
        default_value: ''
      - id: remote
