    title: supabase inspect db
    summary: Inspect database
    description: Run diagnostics on locks, query performance, indexes, table sizes, vacuuming, and connections. Subcommands inspect the local database by default; pass --remote for the linked project, or --remote=<ref|branch|url> for another database.
    tags: []
    links: []
    subcommands:
      - supabase-inspect-db-bloat
      - supabase-inspect-db-blocking
