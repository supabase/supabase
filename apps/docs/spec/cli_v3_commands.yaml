  - id: supabase-sso-add
    title: supabase sso add
    summary: Add a new SSO identity provider
    description: Connects a SAML 2.0 identity provider to your project. Provide its metadata with `--metadata-url` or `--metadata-file`.
    examples:
      - id: basic-usage
        name: Add with Metadata URL
        code: |-
          supabase sso add \
            --type saml \
            --metadata-url 'https://...' \
            --domains company.com \
            --remote=abcdefghijklmnopqrst
        response: |-
          Information about the added identity provider. You can use
          company.com as the domain name on the frontend side to initiate a SSO
          request to the identity provider.
      - id: with-xml
        name: Add with Metadata File
        code: |-
          supabase sso add \
            --type saml \
            --metadata-file /path/to/metadata/file.xml \
            --domains company.com \
            --remote=abcdefghijklmnopqrst
        response: |-
          Information about the added identity provider. You can use
          company.com as the domain name on the frontend side to initiate a SSO
          request to the identity provider.
    tags: []
    links: []
    usage: supabase sso add [flags]
    subcommands: []
    flags:
      - id: attribute-mapping-file
        name: --attribute-mapping-file <string>
        description: Path to a JSON file mapping SAML attributes to custom JWT claims.
        default_value: ''
      - id: domains
        name: --domains <strings>
        description: Email domains to associate with the identity provider, comma-separated or repeated.
        default_value: '[]'
      - id: metadata-file
        name: --metadata-file <string>
        description: Path to a SAML 2.0 Metadata XML file describing the identity provider.
        default_value: ''
      - id: metadata-url
        name: --metadata-url <string>
        description: URL of a SAML 2.0 Metadata XML document describing the identity provider.
        default_value: ''
      - id: name-id-format
        name: --name-id-format <string>
        description: SAML name ID format URI used to identify users.
        default_value: ''
        accepted_values:
          - id: urn:oasis:names:tc:SAML:1.1:nameid-format:emailAddress
            name: urn:oasis:names:tc:SAML:1.1:nameid-format:emailAddress
            type: string
          - id: urn:oasis:names:tc:SAML:1.1:nameid-format:unspecified
            name: urn:oasis:names:tc:SAML:1.1:nameid-format:unspecified
            type: string
          - id: urn:oasis:names:tc:SAML:2.0:nameid-format:persistent
            name: urn:oasis:names:tc:SAML:2.0:nameid-format:persistent
            type: string
          - id: urn:oasis:names:tc:SAML:2.0:nameid-format:transient
            name: urn:oasis:names:tc:SAML:2.0:nameid-format:transient
            type: string
      - id: remote
        name: --remote[=<ref|branch>]
        description: 'Target another project: --remote=<ref|branch>. Defaults to the linked project.'
        default_value: 'false'
      - id: skip-url-validation
        name: --skip-url-validation
        description: Skip local validation of the metadata URL, such as in CI where the identity provider is unreachable.
        default_value: 'false'
      - id: type
        name: -t, --type <[ saml ]>
        description: Type of identity provider, based on its protocol.
        required: true
        default_value: ''
        accepted_values:
          - id: saml
            name: saml
            type: '[ saml ]'
