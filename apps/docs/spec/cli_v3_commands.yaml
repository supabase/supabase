  - id: supabase-migration-list
    title: supabase migration list
    summary: List local files and the target database's migration history
    description: |


      Lists the migration files in `supabase/migrations` next to the migration history of the target database.

      By default, it lists the migration history of your local database. Pass `--remote` to list the linked project instead, which requires running `supabase link`. Pass `--remote=<ref|branch|url>` to list another project, a branch of the linked project, or a database URL such as a self-hosted database.

      `--linked`, `--project-ref`, `--db-url` and `--local` still work in v3 but are deprecated and removed in v4; use `--remote`.

      > Note that URL strings must be escaped according to [RFC 3986](https://www.rfc-editor.org/rfc/rfc3986).

      Local migrations are stored in `supabase/migrations` directory while the target database tracks applied migrations in the `supabase_migrations.schema_migrations` table. The second column is headed `Remote` for a project or database URL passed with `--remote`, and `Local DB` for the local database. Only the timestamps are compared to identify any differences.

      In case of discrepancies between the local and remote migration history, you can resolve them using the `migration repair` command.
    examples:
      - id: basic-usage
        name: Basic usage
        code: supabase migration list --remote
        response: |2
                LOCAL      │     REMOTE     │     TIME (UTC)
          ─────────────────┼────────────────┼──────────────────────
                           │ 20230103054303 │ 2023-01-03 05:43:03
                           │ 20230103093141 │ 2023-01-03 09:31:41
            20230222032233 │                │ 2023-02-22 03:22:33
      - id: with-db-url
        name: Connect to self-hosted database
        code: supabase migration list --remote='postgres://postgres[:percent_encoded_password]@db.example.com[:port]/postgres'
        response: |2
                LOCAL      │     REMOTE     │     TIME (UTC)
          ─────────────────┼────────────────┼──────────────────────
            20230103054303 │ 20230103054303 │ 2023-01-03 05:43:03
            20230103093141 │ 20230103093141 │ 2023-01-03 09:31:41
    tags: []
    links: []
    usage: supabase migration list [flags]
    subcommands: []
    flags:
      - id: password
        name: -p, --password <string>
        description: Database password for the project selected with --remote. Not used for the local database or a database URL.
        default_value: ''
      - id: remote
        name: --remote[=<ref|branch|url>]
        description: 'Target a remote database: the linked project, or --remote=<ref|branch|url>.'
        default_value: 'false'
  - id: supabase-migration-new
    title: supabase migration new
    summary: Create an empty migration script
    description: |


      Creates a new migration file locally.

      A `supabase/migrations` directory will be created if it does not already exists in your current `workdir`. All schema migration files must be created in this directory following the pattern `<timestamp>_<name>.sql`.

      Outputs from other commands like `db diff` may be piped to `migration new <name>` via stdin.
    examples:
      - id: basic-usage
        name: Basic usage
        code: supabase migration new schema_test
        response: |
          Created new migration at supabase/migrations/20230306095710_schema_test.sql.
      - id: pipe-stdin
        name: With statements piped from stdin
        code: echo "create schema if not exists test;" | supabase migration new schema_test
        response: |
          Created new migration at supabase/migrations/20230306095710_schema_test.sql.
    tags: []
    links: []
    usage: supabase migration new <migration name> [flags]
    subcommands: []
    flags: []
  - id: supabase-migration-repair
    title: supabase migration repair
    summary: Repair the migration history table
    description: |


      Repairs the migration history table.

      By default, it repairs your local database. Pass `--remote` to repair the linked project, which requires running `supabase link`. Pass `--remote=<ref|branch|url>` to repair another project, a branch of the linked project, or a specific database. Repairing a hosted database asks for confirmation before it changes anything (the default answer is No); pass `--yes` to confirm in scripts and other non-interactive runs.

      `--linked`, `--project-ref`, `--db-url` and `--local` still work in v3 but are deprecated and removed in v4; use `--remote`.

      If your local and remote migration history goes out of sync, you can repair the remote history by marking specific migrations as `--status applied` or `--status reverted`. Marking as `reverted` will delete an existing record from the migration history table while marking as `applied` will insert a new record.

      For example, your migration history may look like the table below, with missing entries in either local or remote.

      ```bash
      $ supabase migration list --remote
      Target: project My Project (abcdefghijklmnopqrst) · production
              LOCAL      │     REMOTE     │     TIME (UTC)
        ─────────────────┼────────────────┼──────────────────────
                         │ 20230103054303 │ 2023-01-03 05:43:03
         20230103054315  │                │ 2023-01-03 05:43:15
      ```

      To reset your migration history to a clean state, first delete your local migration file.

      ```bash
      $ rm supabase/migrations/20230103054315_remote_commit.sql

      $ supabase migration list --remote
      Target: project My Project (abcdefghijklmnopqrst) · production
              LOCAL      │     REMOTE     │     TIME (UTC)
        ─────────────────┼────────────────┼──────────────────────
                         │ 20230103054303 │ 2023-01-03 05:43:03
      ```

      Then mark the remote migration `20230103054303` as reverted.

      ```bash
      $ supabase migration repair 20230103054303 --status reverted --remote
      Target: project My Project (abcdefghijklmnopqrst) · production
       • 20230103054303
      ◇  Mark 1 migration as reverted on project My Project (abcdefghijklmnopqrst) · production?
      │  Yes
      Repaired migration history: [20230103054303] => reverted
      Finished supabase migration repair.

      $ supabase migration list --remote
      Target: project My Project (abcdefghijklmnopqrst) · production
              LOCAL      │     REMOTE     │     TIME (UTC)
        ─────────────────┼────────────────┼──────────────────────
      ```

      Now you can run `db pull` again to dump the remote schema as a local migration file.

      ```bash
      $ supabase db pull --remote
      Target: project My Project (abcdefghijklmnopqrst) · production
      Write 1 migration file to supabase/migrations.
      Record them as applied in the remote migration history.
      ◇  Update the remote migration history table on project My Project (abcdefghijklmnopqrst) · production?
      │  Yes
      Schema written to supabase/migrations/20240414044403_remote_schema.sql
      Finished supabase db pull.

      $ supabase migration list --remote
      Target: project My Project (abcdefghijklmnopqrst) · production
              LOCAL      │     REMOTE     │     TIME (UTC)
        ─────────────────┼────────────────┼──────────────────────
          20240414044403 │ 20240414044403 │ 2024-04-14 04:44:03
      ```
    examples:
      - id: basic-usage
        name: Mark a migration as reverted
        code: supabase migration repair 20230103054303 --status reverted --yes --remote
        response: |
          Target: project My Project (abcdefghijklmnopqrst) · production
          Confirmed by --yes: Mark 1 migration as reverted on project My Project (abcdefghijklmnopqrst) · production
          Repaired migration history: [20230103054303] => reverted
      - id: mark-applied
        name: Mark a migration as applied
        code: supabase migration repair 20230222032233 --status applied --yes --remote
        response: |
          Target: project My Project (abcdefghijklmnopqrst) · production
          Confirmed by --yes: Mark 1 migration as applied on project My Project (abcdefghijklmnopqrst) · production
          Repaired migration history: [20230222032233] => applied
    tags: []
    links: []
    usage: supabase migration repair [version] ... [flags]
    subcommands: []
    flags:
      - id: password
        name: -p, --password <string>
        description: Database password for the project selected with --remote. Not used for the local database or a database URL.
        default_value: ''
      - id: remote
        name: --remote[=<ref|branch|url>]
        description: 'Target a remote database: the linked project, or --remote=<ref|branch|url>.'
        default_value: 'false'
      - id: status
        name: --status <[ applied | reverted ]>
        description: Version status to update.
        required: true
        default_value: ''
        accepted_values:
          - id: applied
            name: applied
            type: '[ applied | reverted ]'
          - id: reverted
            name: reverted
            type: '[ applied | reverted ]'
  - id: supabase-migration-squash
    title: supabase migration squash
    summary: Squash migrations to a single file
    description: |


      Squashes local schema migrations to a single migration file.

      The squashed migration is equivalent to a schema only dump of the local database after applying existing migration files. This is especially useful when you want to remove repeated modifications of the same schema from your migration history.

      However, one limitation is that data manipulation statements, such as insert, update, or delete, are omitted from the squashed migration. You will have to add them back manually in a new migration file. This includes cron jobs, storage buckets, and any encrypted secrets in vault.

      By default, the latest `<timestamp>_<name>.sql` file will be updated to contain the squashed migration. You can override the target version using the `--version <timestamp>` flag.

      If your `supabase/migrations` directory is empty, running `supabase squash` will do nothing.

      Squashing rewrites your local migration files. When the target is a hosted database (`--remote` or `--remote=<ref|branch|url>`), it also resets the remote migration history table to the squashed migration. That asks for confirmation before any file is changed (the default answer is No); pass `--yes` to confirm in scripts and other non-interactive runs. With the default local target it only squashes the files and suggests running `supabase migration repair --status applied --remote` for the remote history.

      `--linked`, `--project-ref`, `--db-url` and `--local` still work in v3 but are deprecated and removed in v4; use `--remote`.
    tags: []
    links: []
    usage: supabase migration squash [flags]
    subcommands: []
    flags:
      - id: password
        name: -p, --password <string>
        description: Database password for the project selected with --remote. Not used for the local database or a database URL.
        default_value: ''
      - id: remote
        name: --remote[=<ref|branch|url>]
        description: 'Target a remote database: the linked project, or --remote=<ref|branch|url>.'
        default_value: 'false'
      - id: version
        name: --version <string>
        description: Squash up to the specified version.
        default_value: ''
