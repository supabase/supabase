  - id: supabase-inspect-db-toast-sizes
    title: supabase inspect db toast-sizes
    summary: Show TOAST table sizes and dead chunk counts
    description: |


      Show TOAST table sizes and dead chunk counts for each ordinary user table that has a TOAST relation. Materialized views and partitioned parents are not listed.

      When a row exceeds about 2 kB, Postgres compresses or moves its largest variable-length values (such as `text`, `jsonb` and `bytea`) into a companion TOAST table. TOAST Size includes the TOAST index, and Total Size also includes the table's own indexes.

      Autovacuum runs on the TOAST table separately from the main heap, so a table that looks healthy in `vacuum-stats` or `bloat` can still have TOAST bloat. A high `TOAST Dead %` means autovacuum is not keeping up, and you may need to run `VACUUM` manually.

      ```
               TABLE          │ TOTAL SIZE │ HEAP SIZE │ TOAST SIZE │ TOAST LIVE CHUNKS │ TOAST DEAD CHUNKS │ TOAST DEAD % │  LAST AUTOVACUUM   │ LAST VACUUM
      ────────────────────────┼────────────┼───────────┼────────────┼───────────────────┼───────────────────┼──────────────┼────────────────────┼─────────────
       public.documents       │ 4350 MB    │ 800 MB    │ 3400 MB    │            250000 │             18000 │          6.7 │ 2024-03-01 04:12   │
       public.media_assets    │ 905 MB     │ 120 MB    │ 770 MB     │             80000 │               200 │          0.2 │ 2024-03-02 01:45   │
       public.messages        │ 365 MB     │ 280 MB    │ 60 MB      │             95000 │                 0 │          0.0 │ 2024-03-02 03:10   │
      ```
    examples:
      - id: example-1
        name: Show TOAST sizes on the local database
        code: supabase inspect db toast-sizes
      - id: example-2
        name: Show TOAST sizes on the linked project
        code: supabase inspect db toast-sizes --remote
    tags: []
    links: []
    usage: supabase inspect db toast-sizes [flags]
    subcommands: []
    flags:
      - id: remote
        name: --remote[=<ref|branch|url>]
        description: 'Target a remote database: the linked project, or --remote=<ref|branch|url>.'
        default_value: 'false'
  - id: supabase-inspect-db-traffic-profile
    title: supabase inspect db traffic-profile
    summary: Show traffic profile
    description: |


      Show how read-heavy or write-heavy each table is, based on block-level I/O. It combines tuple operations from `pg_stat_user_tables` with block I/O from `pg_statio_user_tables`.

      Each table gets one of these categories:

      - **Read-Heavy**: read operations are more than 5x write operations (for example 1:10 or 1:50).
      - **Write-Heavy**: write operations are more than 20% of read operations (for example 1:2, 1:4, 2:1 or 10:1).
      - **Balanced**: mixed workload where writes are between 20% and 500% of reads.
      - **Read-Only**: only read operations detected.
      - **Write-Only**: only write operations detected.

      ```
      SCHEMA │ TABLE        │ BLOCKS READ │ WRITE TUPLES │ BLOCKS WRITE │ ACTIVITY RATIO
      ───────┼──────────────┼─────────────┼──────────────┼──────────────┼────────────────────
      public │ user_events  │     450,234 │     9,004,680│       23,450 │ 20:1 (Write-Heavy)
      public │ users        │      89,203 │        12,451│        1,203 │ 7.2:1 (Read-Heavy)
      public │ sessions     │      15,402 │        14,823│        2,341 │ ≈1:1 (Balanced)
      public │ cache_data   │     123,456 │             0│            0 │ Read-Only
      auth   │ audit_logs   │           0 │        98,234│       12,341 │ Write-Only
      ```

      Only tables with both read and write activity are shown. The ratio threshold that separates "heavy" from balanced is 5:1.
    examples:
      - id: example-1
        name: Show read/write ratios on the local database
        code: supabase inspect db traffic-profile
      - id: example-2
        name: Show read/write ratios on the linked project
        code: supabase inspect db traffic-profile --remote
    tags: []
    links: []
    usage: supabase inspect db traffic-profile [flags]
    subcommands: []
    flags:
      - id: remote
        name: --remote[=<ref|branch|url>]
        description: 'Target a remote database: the linked project, or --remote=<ref|branch|url>.'
        default_value: 'false'
  - id: supabase-inspect-db-vacuum-stats
    title: supabase inspect db vacuum-stats
    summary: Show vacuum stats
    description: |


      Show vacuum activity for each table: when it was last vacuumed and auto vacuumed, its row count and dead row count, and whether autovacuum is expected to run.

      Postgres keeps old row versions as dead tuples under [MVCC](https://www.postgresql.org/docs/current/mvcc.html) until [autovacuum](https://supabase.com/docs/guides/platform/database-size#vacuum-operations) cleans them. If the dead row count is much higher than the row count, or an expected autovacuum has not run for some time, autovacuum may not be keeping up. Tune your vacuum settings or add compute or disk IOPS.

      ```
              SCHEMA        │              TABLE               │ LAST VACUUM │ LAST AUTO VACUUM │      ROW COUNT       │ DEAD ROW COUNT │ EXPECT AUTOVACUUM?
      ──────────────────────┼──────────────────────────────────┼─────────────┼──────────────────┼──────────────────────┼────────────────┼─────────────────────
       auth                 │ users                            │             │ 2023-06-26 12:34 │               18,030 │              0 │ no
       public               │ profiles                         │             │ 2023-06-26 23:45 │               13,420 │             28 │ no
       public               │ logs                             │             │ 2023-06-26 01:23 │            1,313,033 │      3,318,228 │ yes
       storage              │ objects                          │             │                  │             No stats │              0 │ no
       storage              │ buckets                          │             │                  │             No stats │              0 │ no
       supabase_migrations  │ schema_migrations                │             │                  │             No stats │              0 │ no

      ```
    examples:
      - id: example-1
        name: Show vacuum stats on the local database
        code: supabase inspect db vacuum-stats
      - id: example-2
        name: Show vacuum stats on the linked project
        code: supabase inspect db vacuum-stats --remote
    tags: []
    links: []
    usage: supabase inspect db vacuum-stats [flags]
    subcommands: []
    flags:
      - id: remote
        name: --remote[=<ref|branch|url>]
        description: 'Target a remote database: the linked project, or --remote=<ref|branch|url>.'
        default_value: 'false'
  - id: supabase-inspect-db-xid-age
    title: supabase inspect db xid-age
    summary: Show XID age for user tables
    description: |


      List user tables sorted by transaction ID (XID) age, oldest first. Use it to catch tables that are approaching transaction ID wraparound.

      Transaction IDs wrap around at about 2.1 billion transactions. Once a table's XID age passes `autovacuum_freeze_max_age` (200 million by default), autovacuum forces a freeze. If the age keeps growing toward the limit, Postgres stops assigning new transaction IDs to protect the data.

      `transactions_remaining` is the headroom to a 2 billion threshold, kept below the real limit as a safety margin. Treat tables with an XID age above 1.5 billion (`transactions_remaining` below 500 million) as urgent, and run a manual `VACUUM FREEZE` or tune autovacuum.

      The list covers ordinary user tables only. It leaves out materialized views, TOAST tables, and Supabase-managed schemas, so it does not show the database-wide age. For that, run `SELECT age(datfrozenxid) FROM pg_database WHERE datname = current_database()`.

      ```
                TABLE          │  XID AGE  │ TRANSACTIONS REMAINING
      ─────────────────────────┼───────────┼────────────────────────
       public.events           │ 800000000 │           1200000000
       public.users            │ 500000000 │           1500000000
       public.sessions         │ 120000000 │           1880000000
      ```
    examples:
      - id: example-1
        name: Show XID age on the local database
        code: supabase inspect db xid-age
      - id: example-2
        name: Show XID age on the linked project
        code: supabase inspect db xid-age --remote
    tags: []
    links: []
    usage: supabase inspect db xid-age [flags]
    subcommands: []
    flags:
      - id: remote
        name: --remote[=<ref|branch|url>]
        description: 'Target a remote database: the linked project, or --remote=<ref|branch|url>.'
        default_value: 'false'
