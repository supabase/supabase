  - id: supabase-functions
    title: supabase functions
    summary: Manage Supabase Edge functions
    description: |


      Manage Supabase Edge Functions.

      Supabase Edge Functions are server-less functions that run close to your users.

      Edge Functions allow you to execute custom server-side code without deploying or scaling a traditional server. They're ideal for handling webhooks, custom API endpoints, data validation, and serving personalized content.

      Edge Functions are written in TypeScript and run on Deno compatible edge runtime, which is a secure runtime with no package management needed, fast cold starts, and built-in security.

      Commands that change the hosted project — `functions deploy` (including `--prune`) and `functions delete` — print the `Target:` line, then ask for confirmation before changing anything; the default answer is no. `functions deploy` asks one question covering every function it will deploy and every function `--prune` will delete. Piped answers are never read, so scripts, JSON runs and agents must pass `--yes` or set `SUPABASE_YES` in the shell (a `SUPABASE_YES` in `supabase/.env` does not count). `functions list` and `functions download` only read and never ask.
    tags:
      - management-api
    links: []
    subcommands:
      - supabase-functions-delete
      - supabase-functions-deploy
      - supabase-functions-download
      - supabase-functions-list
      - supabase-functions-new
      - supabase-functions-serve
    flags: []
  - id: supabase-functions-delete
    title: supabase functions delete
    summary: Delete a Function from Supabase
    description: Delete a Function from the linked Supabase project. This does NOT remove the Function locally.
    examples:
      - id: example-1
        name: Delete a deployed function from the linked project
        code: supabase functions delete hello-world
      - id: example-2
        name: Delete a deployed function from a specific project
        code: supabase functions delete hello-world --remote=abcdefghijklmnopqrst
    tags: []
    links: []
    usage: supabase functions delete <Function name> [flags]
    subcommands: []
    flags:
      - id: remote
        name: --remote[=<ref|branch>]
        description: 'Target another project: --remote=<ref|branch>. Defaults to the linked project.'
        default_value: 'false'
  - id: supabase-functions-deploy
    title: supabase functions deploy
    summary: Deploy a Function to Supabase
    description: Deploy a Function to the linked Supabase project.
    examples:
      - id: example-1
        name: Deploy a single function to the linked project
        code: supabase functions deploy hello-world
      - id: example-2
        name: Deploy all local functions to a specific project
        code: supabase functions deploy --remote=abcdefghijklmnopqrst
    tags: []
    links: []
    usage: supabase functions deploy [Function name] ... [flags]
    subcommands: []
    flags:
      - id: import-map
