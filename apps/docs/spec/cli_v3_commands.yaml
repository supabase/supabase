        migration_url: /docs/reference/cli/v3/migrating-from-v2#target-flags-default
  - id: supabase-db-push
    title: supabase db push
    summary: Push new migrations to a database
    description: |
      Pushes all local migrations to a database.

      Pushes to the local database by default. Pass `--remote` to push to the linked project, which requires your local project to be linked by running `supabase link`. Pass `--remote=<ref|branch|url>` to push to another project, a branch of the linked project, or a database URL such as a self-hosted database. In a linked checkout, a run without `--remote` prints a hint naming the linked project. The command prints a `Target:` line on stderr naming the database it resolved.

      `--linked`, `--project-ref`, `--db-url` and `--local` still work in v3 but are deprecated and removed in v4; use `--remote`.

      Before changing a hosted database, the command lists what it will do (migrations, custom roles, seed files and vault secrets) and asks once for confirmation, defaulting to No. Pass `--yes` to confirm without a prompt; JSON output, piped input and agent runs need it. A `SUPABASE_YES` set in `supabase/.env` does not confirm, but one set in your shell does.

      The first time this command is run, a migration history table will be created under `supabase_migrations.schema_migrations`. After successfully applying a migration, a new row will be inserted into the migration history table with timestamp as its unique id. Subsequent pushes will skip migrations that have already been applied.

      If you need to mutate the migration history table, such as deleting existing entries or inserting new entries without actually running the migration, use the `migration repair` command.

      Use the `--dry-run` flag to view the list of changes before applying.
    examples:
      - id: basic-usage
        name: Basic usage
        code: supabase db push --remote
        response: |
          Linked project is up to date.
      - id: self-hosted
        name: Self hosted
        code: supabase db push --remote="postgres://user:pass@db.example.com:5432/postgres"
        response: |
          Pushing migration 20230410135622_create_employees_table.sql...
          Finished supabase db push.
      - id: dry-run
        name: Dry run
        code: supabase db push --dry-run --remote
        response: |
          DRY RUN: migrations will *not* be pushed to the database.
          Would push migration 20230410135622_create_employees_table.sql...
          Would push migration 20230425064254_my_table.sql...
          Finished supabase db push.
    tags: []
    links: []
    usage: supabase db push [flags]
    subcommands: []
    flags:
      - id: dry-run
        name: --dry-run
        description: Print the migrations that would be applied, but don't actually apply them.
        default_value: 'false'
      - id: include-all
        name: --include-all
        description: Include all migrations not found in the migration history table.
        default_value: 'false'
      - id: include-roles
        name: --include-roles
        description: Include custom roles from supabase/roles.sql.
        default_value: 'false'
      - id: include-seed
        name: --include-seed
        description: Include seed data from your config.
        default_value: 'false'
      - id: password
        name: -p, --password <string>
        description: Database password for the project selected with --remote. Not used for the local database or a database URL.
        default_value: ''
      - id: remote
        name: --remote[=<ref|branch|url>]
        description: 'Target a remote database: the linked project, or --remote=<ref|branch|url>.'
        default_value: 'false'
      - id: skip-vault
        name: --skip-vault
        description: Skip updating vault secrets from config.toml.
        default_value: 'false'
    breaking_changes:
      - id: target-flags-default
        major: 3
        summary: Bare `db push` / `db pull` now target the local database instead of the linked project; pass `--remote` to reach the linked project.
        direction: changed
        flags:
          - --remote
          - --linked
        migration_url: /docs/reference/cli/v3/migrating-from-v2#target-flags-default
  - id: supabase-db-query
    title: supabase db query
    summary: Execute a SQL query against the database
    description: |


      Execute a SQL query against a database.

      Runs against the local database by default. Pass `--remote` for the linked project, or `--remote=<ref|branch|url>` for another project, a branch of the linked project, or a database URL. The command prints a `Target:` line on stderr naming the database it resolved.

      `--linked`, `--project-ref`, `--db-url` and `--local` still work in v3 but are deprecated and removed in v4; use `--remote`.

      The command cannot tell a read from a write, so a hosted database (the linked project or a remote database URL) asks for one confirmation (default No) before the statement is sent. Piped answers are never read, so a script, a JSON run or an agent must pass `--yes` or set `SUPABASE_YES` in the shell; a `SUPABASE_YES` in `supabase/.env` does not count. The local database never asks.

      Pass `--read-only` to run a statement that must not change anything. It skips the confirmation on a hosted database. Before the statement is sent or any question is asked, every statement must start with `SELECT`, `WITH`, `VALUES`, `TABLE`, `SHOW`, `EXPLAIN` or a parenthesised query (after whitespace and comments). Any other statement (`COMMIT`, `SET`, `CALL`, `DO`, `COPY`, `LOCK` and so on), input that ends inside a comment, quote or dollar quote, and input that contains a `BEGIN ATOMIC` function body is rejected. The words `begin atomic` inside a string, quoted identifier, dollar quote or comment, as in `select 'begin atomic'`, are not. Drop `--read-only` to run one of these.

      The local database or a database URL then runs the statement in a read-only transaction that is always rolled back, with a 5 second `lock_timeout` so the read cannot wait on heavy locks; Postgres rejects writes inside it. A linked project runs it through the Management API's `read_only` mode, and the API enforces it.

      `--read-only` does not stop a read statement from calling a function that has side effects, such as `pg_terminate_backend` or `dblink_exec`; those still run.

      When used by an AI coding agent (auto-detected or via --agent=yes), the default
      output format is JSON with an untrusted data warning envelope. When used by a
      human (--agent=no or no agent detected), the default output format is table
      without the envelope.
    tags: []
    links: []
    usage: supabase db query [sql] [flags]
    subcommands: []
    flags:
      - id: file
        name: -f, --file <string>
        description: Path to a SQL file to execute.
        default_value: ''
      - id: output
        name: -o, --output <[ json | table | csv ]>
        description: 'Output format: table, json, or csv.'
        default_value: json
        accepted_values:
          - id: json
            name: json
            type: '[ json | table | csv ]'
          - id: table
            name: table
            type: '[ json | table | csv ]'
          - id: csv
            name: csv
            type: '[ json | table | csv ]'
      - id: read-only
        name: --read-only
        description: Runs the statement in a read-only transaction; a hosted target needs no confirmation.
        default_value: 'false'
      - id: remote
        name: --remote[=<ref|branch|url>]
        description: 'Target a remote database: the linked project, or --remote=<ref|branch|url>.'
        default_value: 'false'
  - id: supabase-db-reset
    title: supabase db reset
    summary: Resets a database to current migrations
    description: |


      Resets a database to a clean state.

      Requires the local development stack to be started by running `supabase start`.

      Recreates the local Postgres container and applies all local migrations found in `supabase/migrations` directory. If test data is defined in `supabase/seed.sql`, it will be seeded after the migrations are run. Any other data or schema changes made during local development will be discarded.

      Use the `--no-seed` flag to skip seeding entirely. To override `[db.seed].sql_paths` for a single reset, pass one or more `--sql-paths` flags. Each value accepts the same file path or glob pattern syntax as `sql_paths`, relative to the `supabase` directory. Passing `--sql-paths` force-enables seeding for that reset even when `[db.seed].enabled = false`.

      Resets the local database by default. Pass `--remote` to reset the linked project, or `--remote=<ref|branch|url>` to reset another project, a branch of the linked project, or a database URL. The command prints a `Target:` line on stderr naming the database it resolved.

      `--linked`, `--project-ref`, `--db-url` and `--local` still work in v3 but are deprecated and removed in v4; use `--remote`.

      When running db reset with `--remote`, a SQL script is executed to identify and drop all user created entities in the remote database. Since Postgres roles are cluster level entities, any custom roles created through the dashboard or `supabase/roles.sql` will not be deleted by remote reset.

      A remote reset asks for one confirmation (default No) after it has worked out what it will do and before anything is dropped. The question lists dropping every user schema, any vault secrets it will upsert, the migrations or schema files it will apply, and the seed files it will run. Declining stops the command without changing the database. Piped answers are never read, so a script, a JSON run or an agent must pass `--yes` or set `SUPABASE_YES` in the shell; a `SUPABASE_YES` in `supabase/.env` does not count. The local database never asks.

      If you combine `--sql-paths` with `--remote`, the override seed files are applied to the selected remote database after migrations. Use this only when you intend to seed that remote target.
    examples:
      - id: basic-usage
        name: Basic usage
        code: supabase db reset
        response: |
          Resetting database...
          Initializing schema...
          Applying migration 20220810154537_create_employees_table.sql...
          Seeding data supabase/seed.sql...
          Finished supabase db reset on branch main.
    tags: []
    links: []
    usage: supabase db reset [flags]
    subcommands: []
    flags:
      - id: last
        name: --last <int>
        description: Reset up to the last n migration versions.
        default_value: '0'
      - id: no-seed
        name: --no-seed
        description: Skip running the seed script after reset.
        default_value: 'false'
      - id: remote
        name: --remote[=<ref|branch|url>]
        description: 'Target a remote database: the linked project, or --remote=<ref|branch|url>.'
        default_value: 'false'
      - id: sql-paths
        name: --sql-paths <strings>
        description: Override [db.seed].sql_paths for this reset. May be repeated; each value accepts a SQL file path or glob pattern relative to the supabase directory and force-enables seeding.
        default_value: '[]'
      - id: version
        name: --version <string>
        description: Reset up to the specified version.
        default_value: ''
