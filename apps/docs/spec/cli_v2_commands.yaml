clispec: '002'
info:
  id: cli
  version: latest
  title: Supabase CLI
  language: sh
  source: https://github.com/supabase/cli
  bugs: https://github.com/supabase/cli/issues
  spec: https://github.com/supabase/supabase/blob/master/apps/docs/spec/cli_v2_commands.yaml
  description: Supabase CLI provides you with tools to develop your application locally, and deploy your application to the Supabase platform.
  tags:
    - id: quick-start
      title: Quick Start
    - id: local-dev
      title: Local Development
    - id: management-api
      title: Management APIs
    - id: other-commands
      title: Additional Commands
flags:
  - id: agent
    name: --agent <[ auto | yes | no ]>
    description: 'Override agent detection: yes, no, or auto'
    default_value: auto
    accepted_values:
      - id: auto
        name: auto
        type: '[ auto | yes | no ]'
      - id: 'yes'
        name: 'yes'
        type: '[ auto | yes | no ]'
      - id: 'no'
        name: 'no'
        type: '[ auto | yes | no ]'
  - id: debug
    name: --debug
    description: output debug logs to stderr
    default_value: 'false'
  - id: dns-resolver
    name: --dns-resolver <[ native | https ]>
    description: lookup domain names using the specified resolver
    default_value: native
    accepted_values:
      - id: native
        name: native
        type: '[ native | https ]'
      - id: https
        name: https
        type: '[ native | https ]'
  - id: experimental
    name: --experimental
    description: enable experimental features
    default_value: 'false'
  - id: help
    name: -h, --help
    description: Show help information
    default_value: 'false'
  - id: network-id
    name: --network-id <string>
    description: use the specified docker network instead of a generated one
    default_value: ''
  - id: output
    name: -o, --output <[ env | pretty | json | toml | yaml ]>
    description: output format of status variables
    default_value: pretty
    accepted_values:
      - id: env
        name: env
        type: '[ env | pretty | json | toml | yaml ]'
      - id: pretty
        name: pretty
        type: '[ env | pretty | json | toml | yaml ]'
      - id: json
        name: json
        type: '[ env | pretty | json | toml | yaml ]'
      - id: toml
        name: toml
        type: '[ env | pretty | json | toml | yaml ]'
      - id: yaml
        name: yaml
        type: '[ env | pretty | json | toml | yaml ]'
  - id: output-format
    name: --output-format <[ text | json | stream-json ]>
    description: 'Output format: text (default), json, or stream-json (NDJSON)'
    default_value: text
    accepted_values:
      - id: text
        name: text
        type: '[ text | json | stream-json ]'
      - id: json
        name: json
        type: '[ text | json | stream-json ]'
      - id: stream-json
        name: stream-json
        type: '[ text | json | stream-json ]'
  - id: profile
    name: --profile <string>
    description: use a specific profile for connecting to Supabase API
    default_value: supabase
  - id: workdir
    name: --workdir <string>
    description: path to the directory containing your supabase/ folder; used exactly as given, with no ancestor directory search (defaults to searching upward from the current directory)
    default_value: ''
  - id: 'yes'
    name: --yes
    description: answer yes to all prompts; hosted changes only accept this flag or SUPABASE_YES exported in your shell, never supabase/.env or another .env file
    default_value: 'false'
commands:
  - id: supabase-backups
    title: supabase backups
    summary: Manage physical backups
    description: List the physical backups of a project and restore it to a point in time (PITR).
    tags:
      - management-api
    links: []
    subcommands:
      - supabase-backups-list
      - supabase-backups-restore
    flags: []
  - id: supabase-backups-list
    title: supabase backups list
    summary: List available physical backups
    description: |-
      Show the backup status of a project, including the earliest and latest timestamps you can restore to. Use it to pick a timestamp for `supabase backups restore`.

      Projects without PITR list their available backups instead.
    examples:
      - id: example-1
        name: List all physical backups
        code: supabase backups list
      - id: example-2
        name: List backups for a specific project
        code: supabase backups list --remote=<ref>
    tags: []
    links: []
    usage: supabase backups list [flags]
    subcommands: []
    flags:
      - id: remote
        name: --remote[=<ref|branch>]
        description: 'Target another project: --remote=<ref|branch>. Defaults to the linked project.'
        default_value: 'false'
  - id: supabase-backups-restore
    title: supabase backups restore
    summary: Restore a project to a point in time
    description: |-
      Restore the project database to a point in time using PITR. Changes made after that time are lost.

      Asks for confirmation before changing anything; pass `--yes` in scripts and CI.
    examples:
      - id: example-1
        name: Restore to the given Unix epoch timestamp
        code: supabase backups restore --timestamp 1707407047
    tags: []
    links: []
    usage: supabase backups restore [flags]
    subcommands: []
    flags:
      - id: remote
        name: --remote[=<ref|branch>]
        description: 'Target another project: --remote=<ref|branch>. Defaults to the linked project.'
        default_value: 'false'
      - id: timestamp
        name: -t, --timestamp <int>
        description: Recovery target time, as a Unix timestamp in seconds.
        default_value: '0'
  - id: supabase-bootstrap
    title: supabase bootstrap
    summary: Create a project from a starter template
    description: |-
      Create a new hosted Supabase project from a starter template and link it to a local directory. Use it to go from nothing to a running project with one command.

      The command prompts for a working directory, downloads the template, creates the project, links it, writes its connection settings to `.env`, and pushes the template's migrations. It logs you in first if needed.

      Creating a project is a hosted change, so the command asks for confirmation before it starts.
    examples:
      - id: example-1
        name: Pick a starter template interactively
        code: supabase bootstrap
      - id: example-2
        name: Bootstrap from a named starter template
        code: supabase bootstrap my-template
    tags:
      - quick-start
    links: []
    usage: supabase bootstrap [template] [flags]
    subcommands: []
    flags:
      - id: password
        name: -p, --password <string>
        description: Password for the new project's Postgres database.
        default_value: ''
  - id: supabase-branches
    title: supabase branches
    summary: Manage preview branches
    description: Create, inspect, update, pause and delete the preview branches of the linked project. Each preview branch is an isolated environment for testing changes.
    tags:
      - management-api
    links: []
    subcommands:
      - supabase-branches-create
      - supabase-branches-delete
      - supabase-branches-get
      - supabase-branches-list
      - supabase-branches-pause
      - supabase-branches-unpause
      - supabase-branches-update
    flags: []
  - id: supabase-branches-create
    title: supabase branches create
    summary: Create a preview branch
    description: |-
      Create a preview branch of the linked project, optionally tied to a git branch.

      Pass `--with-data` to clone production data into the branch database.
    examples:
      - id: example-1
        name: Create a preview branch
        code: supabase branches create my-branch
      - id: example-2
        name: Create a persistent branch tied to a git branch
        code: supabase branches create my-branch --git-branch feature/login --persistent
    tags: []
    links: []
    usage: supabase branches create [name] [flags]
    subcommands: []
    flags:
      - id: git-branch
        name: --git-branch <string>
        description: Git branch to associate with the new preview branch.
        default_value: ''
      - id: notify-url
        name: --notify-url <string>
        description: URL to notify when the branch is active and healthy.
        default_value: ''
      - id: persistent
        name: --persistent
        description: Create a persistent branch instead of an ephemeral one.
        default_value: 'false'
      - id: region
        name: --region <string>
        description: Region to deploy the branch database in.
        default_value: ''
        accepted_values:
          - id: ap-east-1
            name: ap-east-1
            type: string
          - id: ap-northeast-1
            name: ap-northeast-1
            type: string
          - id: ap-northeast-2
            name: ap-northeast-2
            type: string
          - id: ap-south-1
            name: ap-south-1
            type: string
          - id: ap-southeast-1
            name: ap-southeast-1
            type: string
          - id: ap-southeast-2
            name: ap-southeast-2
            type: string
          - id: ca-central-1
            name: ca-central-1
            type: string
          - id: eu-central-1
            name: eu-central-1
            type: string
          - id: eu-central-2
            name: eu-central-2
            type: string
          - id: eu-north-1
            name: eu-north-1
            type: string
          - id: eu-west-1
            name: eu-west-1
            type: string
          - id: eu-west-2
            name: eu-west-2
            type: string
          - id: eu-west-3
            name: eu-west-3
            type: string
          - id: sa-east-1
            name: sa-east-1
            type: string
          - id: us-east-1
            name: us-east-1
            type: string
          - id: us-east-2
            name: us-east-2
            type: string
          - id: us-west-1
            name: us-west-1
            type: string
          - id: us-west-2
            name: us-west-2
            type: string
      - id: remote
        name: --remote[=<ref>]
        description: 'Target another project: --remote=<ref>. Defaults to the linked project.'
        default_value: 'false'
      - id: size
        name: --size <string>
        description: Instance size of the branch database.
        default_value: ''
        accepted_values:
          - id: large
            name: large
            type: string
          - id: medium
            name: medium
            type: string
          - id: micro
            name: micro
            type: string
          - id: 12xlarge
            name: 12xlarge
            type: string
          - id: 16xlarge
            name: 16xlarge
            type: string
          - id: 24xlarge
            name: 24xlarge
            type: string
          - id: 24xlarge_high_memory
            name: 24xlarge_high_memory
            type: string
          - id: 24xlarge_optimized_cpu
            name: 24xlarge_optimized_cpu
            type: string
          - id: 24xlarge_optimized_memory
            name: 24xlarge_optimized_memory
            type: string
          - id: 2xlarge
            name: 2xlarge
            type: string
          - id: 48xlarge
            name: 48xlarge
            type: string
          - id: 48xlarge_high_memory
            name: 48xlarge_high_memory
            type: string
          - id: 48xlarge_optimized_cpu
            name: 48xlarge_optimized_cpu
            type: string
          - id: 48xlarge_optimized_memory
            name: 48xlarge_optimized_memory
            type: string
          - id: 4xlarge
            name: 4xlarge
            type: string
          - id: 8xlarge
            name: 8xlarge
            type: string
          - id: small
            name: small
            type: string
          - id: xlarge
            name: xlarge
            type: string
      - id: with-data
        name: --with-data
        description: Clone production data into the branch database.
        default_value: 'false'
  - id: supabase-branches-delete
    title: supabase branches delete
    summary: Delete a preview branch
    description: |-
      Remove a preview branch you no longer need from the linked project.

      Asks for confirmation before changing anything; pass `--yes` in scripts and CI.
    examples:
      - id: example-1
        name: Delete a preview branch
        code: supabase branches delete my-branch
      - id: example-2
        name: Delete a preview branch without the confirmation prompt
        code: supabase branches delete my-branch --yes
    tags: []
    links: []
    usage: supabase branches delete [name] [flags]
    subcommands: []
    flags:
      - id: remote
        name: --remote[=<ref>]
        description: 'Target another project: --remote=<ref>. Defaults to the linked project.'
        default_value: 'false'
  - id: supabase-branches-get
    title: supabase branches get
    summary: Show details of a preview branch
    description: |-
      Show the details of a preview branch, including its connection settings.

      For the main branch, the password-dependent fields (POSTGRES_URL, POSTGRES_URL_NON_POOLING) are not populated because production database credentials cannot be retrieved through the API.
    examples:
      - id: example-1
        name: Show the details of a preview branch
        code: supabase branches get my-branch
      - id: example-2
        name: Show the details as JSON
        code: supabase branches get my-branch --output-format json
    tags: []
    links: []
    usage: supabase branches get [name] [flags]
    subcommands: []
    flags:
      - id: remote
        name: --remote[=<ref>]
        description: 'Target another project: --remote=<ref>. Defaults to the linked project.'
        default_value: 'false'
  - id: supabase-branches-list
    title: supabase branches list
    summary: List all preview branches
    description: Show the preview branches of the linked project. Use it to find the name or ID that the other `branches` commands take.
    examples:
      - id: example-1
        name: List all preview branches of the linked project
        code: supabase branches list
      - id: example-2
        name: List preview branches as JSON
        code: supabase branches list --output-format json
    tags: []
    links: []
    usage: supabase branches list [flags]
    subcommands: []
    flags:
      - id: remote
        name: --remote[=<ref>]
        description: 'Target another project: --remote=<ref>. Defaults to the linked project.'
        default_value: 'false'
  - id: supabase-branches-pause
    title: supabase branches pause
    summary: Pause a preview branch
    description: |-
      Pause a preview branch you are not using; resume it later with `supabase branches unpause`.

      Asks for confirmation before changing anything; pass `--yes` in scripts and CI.
    examples:
      - id: example-1
        name: Pause a preview branch
        code: supabase branches pause my-branch
    tags: []
    links: []
    usage: supabase branches pause [name] [flags]
    subcommands: []
    flags:
      - id: remote
        name: --remote[=<ref>]
        description: 'Target another project: --remote=<ref>. Defaults to the linked project.'
        default_value: 'false'
  - id: supabase-branches-unpause
    title: supabase branches unpause
    summary: Unpause a preview branch
    description: |-
      Resume a paused preview branch so you can use it again.

      Asks for confirmation before changing anything; pass `--yes` in scripts and CI.
    examples:
      - id: example-1
        name: Resume a paused preview branch
        code: supabase branches unpause my-branch
    tags: []
    links: []
    usage: supabase branches unpause [name] [flags]
    subcommands: []
    flags:
      - id: remote
        name: --remote[=<ref>]
        description: 'Target another project: --remote=<ref>. Defaults to the linked project.'
        default_value: 'false'
  - id: supabase-branches-update
    title: supabase branches update
    summary: Update a preview branch
    description: |-
      Rename a preview branch, change its git branch or notify URL, or switch it between ephemeral and persistent.

      Asks for confirmation before changing anything; pass `--yes` in scripts and CI.
    examples:
      - id: example-1
        name: Rename a preview branch
        code: supabase branches update my-branch --name renamed-branch
      - id: example-2
        name: Switch a branch between ephemeral and persistent
        code: supabase branches update my-branch --persistent
    tags: []
    links: []
    usage: supabase branches update [name] [flags]
    subcommands: []
    flags:
      - id: git-branch
        name: --git-branch <string>
        description: New git branch to associate with the preview branch.
        default_value: ''
      - id: name
        name: --name <string>
        description: New name for the preview branch.
        default_value: ''
      - id: notify-url
        name: --notify-url <string>
        description: URL to notify when the branch is active and healthy.
        default_value: ''
      - id: persistent
        name: --persistent
        description: Switch the branch between ephemeral and persistent.
        default_value: 'false'
      - id: remote
        name: --remote[=<ref>]
        description: 'Target another project: --remote=<ref>. Defaults to the linked project.'
        default_value: 'false'
      - id: status
        name: --status <string>
        description: Override the current branch status.
        default_value: ''
        accepted_values:
          - id: RUNNING_MIGRATIONS
            name: RUNNING_MIGRATIONS
            type: string
          - id: MIGRATIONS_PASSED
            name: MIGRATIONS_PASSED
            type: string
          - id: MIGRATIONS_FAILED
            name: MIGRATIONS_FAILED
            type: string
          - id: FUNCTIONS_DEPLOYED
            name: FUNCTIONS_DEPLOYED
            type: string
          - id: FUNCTIONS_FAILED
            name: FUNCTIONS_FAILED
            type: string
  - id: supabase-completion
    title: supabase completion
    summary: Generate shell completion scripts
    description: Print a shell completion script for `supabase` to stdout. Run the subcommand for your shell and follow its help to load the script.
    tags:
      - other-commands
    links: []
    subcommands:
      - supabase-completion-bash
      - supabase-completion-fish
      - supabase-completion-powershell
      - supabase-completion-zsh
    flags: []
  - id: supabase-completion-bash
    title: supabase completion bash
    summary: Generate the Bash completion script
    description: |-
      Generate the autocompletion script for the bash shell.

      This script depends on the 'bash-completion' package.
      If it is not installed already, you can install it via your OS's package manager.

      To load completions in your current shell session:

          source <(supabase completion bash)

      To load completions for every new session, execute once:

      #### Linux:

          supabase completion bash > /etc/bash_completion.d/supabase

      #### macOS:

          supabase completion bash > $(brew --prefix)/etc/bash_completion.d/supabase

      You will need to start a new shell for this setup to take effect.
    examples:
      - id: example-1
        name: Load completions in the current bash session
        code: source <(supabase completion bash)
    tags: []
    links: []
    usage: supabase completion bash [flags]
    subcommands: []
    flags:
      - id: no-descriptions
        name: --no-descriptions
        description: Omit descriptions from the generated completions.
        default_value: 'false'
  - id: supabase-completion-fish
    title: supabase completion fish
    summary: Generate the fish completion script
    description: |-
      Generate the autocompletion script for the fish shell.

      To load completions in your current shell session:

          supabase completion fish | source

      To load completions for every new session, execute once:

          supabase completion fish > ~/.config/fish/completions/supabase.fish

      You will need to start a new shell for this setup to take effect.
    examples:
      - id: example-1
        name: Load completions in the current fish session
        code: supabase completion fish | source
    tags: []
    links: []
    usage: supabase completion fish [flags]
    subcommands: []
    flags:
      - id: no-descriptions
        name: --no-descriptions
        description: Omit descriptions from the generated completions.
        default_value: 'false'
  - id: supabase-completion-powershell
    title: supabase completion powershell
    summary: Generate the PowerShell completion script
    description: |-
      Generate the autocompletion script for powershell.

      To load completions in your current shell session:

          supabase completion powershell | Out-String | Invoke-Expression

      To load completions for every new session, add the output of the above command
      to your powershell profile.
    examples:
      - id: example-1
        name: Load completions in the current PowerShell session
        code: supabase completion powershell | Out-String | Invoke-Expression
    tags: []
    links: []
    usage: supabase completion powershell [flags]
    subcommands: []
    flags:
      - id: no-descriptions
        name: --no-descriptions
        description: Omit descriptions from the generated completions.
        default_value: 'false'
  - id: supabase-completion-zsh
    title: supabase completion zsh
    summary: Generate the Zsh completion script
    description: |-
      Generate the autocompletion script for the zsh shell.

      If shell completion is not already enabled in your environment you will need
      to enable it.  You can execute the following once:

          echo "autoload -U compinit; compinit" >> ~/.zshrc

      To load completions in your current shell session:

          source <(supabase completion zsh)

      To load completions for every new session, execute once:

      #### Linux:

          supabase completion zsh > "${fpath[1]}/_supabase"

      #### macOS:

          supabase completion zsh > $(brew --prefix)/share/zsh/site-functions/_supabase

      You will need to start a new shell for this setup to take effect.
    examples:
      - id: example-1
        name: Load completions in the current zsh session
        code: source <(supabase completion zsh)
    tags: []
    links: []
    usage: supabase completion zsh [flags]
    subcommands: []
    flags:
      - id: no-descriptions
        name: --no-descriptions
        description: Omit descriptions from the generated completions.
        default_value: 'false'
  - id: supabase-config
    title: supabase config
    summary: Manage project configuration
    description: Compare, pull and push the settings in `supabase/config.toml` against a project or branch, to manage project configuration as code.
    tags:
      - management-api
    links: []
    subcommands:
      - supabase-config-convert
      - supabase-config-diff
      - supabase-config-pull
      - supabase-config-push
      - supabase-config-validate
    flags: []
  - id: supabase-config-convert
    title: supabase config convert
    summary: Convert config.toml to config.jsonc
    description: |


      Converts `supabase/config.toml` to `supabase/config.jsonc` and moves the TOML file to `supabase/config.toml.bak`. Comments are carried over as `//` comments and the document gets a `$schema` entry, so editors validate it against the hosted config schema.

      The conversion reads the file as written: values keep their meaning, `env(NAME)` references are copied as text, and nothing is resolved from your environment. Numbers are written in JSON form, so `0x1F` becomes `31` and `1_000` becomes `1000`. The converted document is parsed again and compared with the original before anything is written; if the two differ, the file is not valid UTF-8, or it holds a value JSON cannot represent (a TOML date, `inf` or `nan`), the command refuses and leaves `config.toml` untouched.

      Comments keep their place by these rules: a comment directly above a key or table leads it; a comment block directly below a key or table, followed by a blank line or another table, trails it; a comment block with blank lines on both sides leads the next entry, or the commented-out example that follows it; a comment on the same line as a key or table header stays on that line. Comments inside a multi-line array of plain values stay beside their elements. Comments inside nested arrays or inline tables cannot be placed, so this command does not keep them in place: they move to the line above their key and the command lists each one.

      Commented-out TOML examples become commented-out JSONC members, so removing the `//` from one member gives valid JSONC. A commented `# key = value` stays in the object it follows as `// "key": value,`. A commented table (`# [auth.hook.custom_access_token]` and the keys under it) is written as a commented object inside the nearest enclosing table that exists, merged with other examples under the same missing parent, and moves with the comment lines directly above it; it sits before the first later-defined entry of that table, or at the end of the table when none follows. Comments that do not parse as a single TOML key or table header stay as plain `//` comments.

      Two kinds of commented example are copied as plain comments or need care when uncommented. Examples inside an array of tables (`[[name]]`, commented or not) stay as plain `//` comments. When a table lists alternative values for the same key (`# key = "a"` then `# key = "b"`), both become commented members, so uncomment only one of them.

      `--dry-run` prints the converted document to stdout and writes nothing. If the project has `.vscode/settings.json`, the command also adds the schema domain to `json.schemaDownload.trustedDomains` there, keeping its comments; the file is never created.

      Everyone on the project needs Supabase CLI 3.1.0 or later: older CLIs ignore `config.jsonc` and run with defaults. The command ends with a summary of the files it created, moved and updated, any relocated comments, this compatibility note and the undo command; with `--dry-run` the same summary, as a preview, goes to stderr.

      If only `supabase/config.json` or `supabase/config.jsonc` exists, the command reports that there is nothing to convert and exits 0. It fails when `config.toml` and a JSON config both exist, because the JSON file takes precedence; delete it first to convert `config.toml` again. The legacy global `-o`/`--output` flag is not supported; use `--output-format json|stream-json` for a machine-readable result.

      ## Undo

      Move the backup back and remove the JSONC file:

      ```sh
      mv -- supabase/config.toml.bak supabase/config.toml && rm -- supabase/config.jsonc
      ```

      If a backup from an earlier conversion already exists, the command uses the next free name (`config.toml.2.bak`, and so on). The printed undo command names that backup, with paths relative to the directory you ran the command from; on Windows it is the PowerShell equivalent.

      ## After converting

      - Delete `supabase/config.toml.bak` once you no longer need the undo, so it is not committed. It stays outside `supabase/.temp` because `supabase unlink` and `supabase projects delete` remove that directory.
      - Commit the conversion on its own. The history of the old file stays available with `git log -- supabase/config.toml`.
      - Search the repository, CI workflows and Dockerfiles for `config.toml` and update any references.
      - Bump pinned Supabase CLI versions (for example `supabase/setup-cli`) to 3.1.0 or later.

      ```sh
      supabase config convert --dry-run
      supabase config convert
      ```
    examples:
      - id: example-1
        name: Preview the converted config.jsonc without writing it
        code: supabase config convert --dry-run
      - id: example-2
        name: Convert supabase/config.toml to supabase/config.jsonc
        code: supabase config convert
    tags: []
    links: []
    usage: supabase config convert [flags]
    subcommands: []
    flags:
      - id: dry-run
        name: --dry-run
        description: Print the converted config.jsonc to stdout without writing any file.
        default_value: 'false'
  - id: supabase-config-diff
    title: supabase config diff
    summary: Diff local config against a project
    description: |


      Compare your local `supabase/config.toml` with the effective configuration of a remote project or branch, to see what `config push` would change. Read-only: it never modifies the local file or any remote configuration.

      Pass `--remote=<ref|branch>` to compare against a specific project, or the name (or UUID) of a branch of the currently linked project. Values that are exactly 20 lowercase letters are always treated as project refs. Without `--remote`, the linked project is the target.

      `--project-ref` still works in v3 but is deprecated and removed in v4; use `--remote`. When the target ref matches the `project_id` of a `[remotes.*]` block, that block's merged config is the local side of the comparison.

      Only platform-managed properties are compared. Local-stack-only sections, such as `[studio]`, `[analytics]`, `[functions]`, `[edge_runtime]`, port numbers, image version pins and `[db.migrations]`, have no hosted counterpart and are never reported, whether or not your file declares them.

      Each difference is classified as one of:

      - `update`: the file declares a value that differs remotely.
      - `remote-only`: the remote differs while the file is silent. The shown local value is the schema default that a `config push` would write.
      - `local-only`: the file declares a value that the remote did not report.

      `(unset)` means the local side has no value at all. `(not returned)` means the response did not carry the property.

      Secret values are never compared, because the platform only reports digests. They are listed in a masked-credentials note, as are declared properties that `config push` cannot communicate and any block the response omitted entirely.

      Local values are shown as the configuration your file would produce once pushed, not its literal spelling. For example, a duration written as `"1m"` renders as `"1m0s"`, and byte sizes are shown in the units you wrote.

      With `--exit-code`, the command exits `2` when any difference is found and keeps exit `1` for errors, so scripts can tell drift from failure.

      Machine-readable output is available through `--output-format json|stream-json`. The payload is versioned and contains `schema_version`, `config_schema`, `target`, `scope`, `changes[]`, `masked[]`, `unmanaged[]` and `counts`, with per-change `path`s as segment arrays.

      `target` identifies the compared project: `kind` (`linked`), `project_ref`, `project_name`, and `environment` (`production`, `branch` or `unverified`) when known. It also carries `parent_project_ref` for a branch, `branch` when one was named, and `local_scope` (`base` or `remotes.<name>`).

      The legacy global `-o`/`--output` flag is not supported by this command; use `--output-format json|stream-json` instead.
    examples:
      - id: example-1
        name: Diff against the linked project
        code: supabase config diff
      - id: example-2
        name: Diff against the 'staging' branch, exiting 2 on drift
        code: supabase config diff --exit-code --remote=staging
    tags: []
    links: []
    usage: supabase config diff [flags]
    subcommands: []
    flags:
      - id: exit-code
        name: --exit-code
        description: Exit with status 2 when any difference is found (errors keep exiting 1).
        default_value: 'false'
      - id: remote
        name: --remote[=<ref|branch>]
        description: 'Target another project: --remote=<ref|branch>. Defaults to the linked project.'
        default_value: 'false'
  - id: supabase-config-pull
    title: supabase config pull
    summary: Pull remote config into the project config file
    description: |


      Write the effective configuration of a remote project or branch into your local `supabase/config.toml` or `config.json`. It is the write side of `supabase config diff`.

      Every write is a surgical, format-preserving edit. Comments, key ordering and quoting elsewhere in the file are left untouched, and only the values that change are rewritten.

      Pass `--remote=<ref|branch>` to pull from a specific project, or the name (or UUID) of a branch of the currently linked project. Values that are exactly 20 lowercase letters are always treated as project refs. Without `--remote`, the linked project is the target.

      `--project-ref` still works in v3 but is deprecated and removed in v4; use `--remote`.

      ## Where values are written

      Where a pulled value lands depends on whether the target is already tracked by a `[remotes.*]` block, not on how you named it. If any block's `project_id` already matches the resolved ref, that block is reused, whatever its own label, and every value lands there.

      Otherwise, if the target was named as a branch, a new `[remotes.<branch-name>]` block is created. A branch resolved by UUID falls back to the project ref itself as its label. Creating a new block always writes its `project_id`, even when every other value already matches the local defaults, so that the block can be reused on a later pull.

      Only when neither applies do values land at the config root. That happens when `--remote=<ref>` names a project directly, or for the linked project (a bare `--remote` or no flag) with no branch involved.

      `--remote-label` overrides the block that would otherwise be reused or created. Naming a block that already tracks a different project, or naming nothing while a different block already tracks this exact ref, is an error rather than a silent overwrite.

      A `[remotes.*]` block whose `project_id` is an `env(...)` reference that merely resolves to the target ref is never reused or rewritten. That is a hard error naming the variable, since a value written there would never take effect on the next load.

      ## Effect on the local stack

      Writing to the config root can also affect `supabase start`. A handful of root-scoped settings, such as `auth.site_url`, `db.settings.*`, `db.major_version` (which changes what `supabase start` boots) and `db.pooler.*`, also govern the local stack. Pulling a hosted value into them is a real change to local dev behavior, not just a record of the hosted setting.

      `config pull` warns about this rather than refusing. Writing the same value into a `[remotes.*]` block is unaffected, so `--remote-label` is the escape hatch: it diverts a root-bound pull into a `[remotes.<label>]` block and leaves local dev untouched.

      ## Values that are not written

      Several kinds of values are never written, and are reported instead of silently skipped:

      - A value whose local declaration resolves from an `env(VAR)` reference. It is reported by variable name; replace the reference yourself, or pass `--remote-label` to target a different block.
      - A value the remote itself spells as an `env(VAR)` reference (`remote_env_reference`). The loader would resolve it against the local environment on the next load, so writing it verbatim would let the remote value read whatever this machine's environment holds at that name.
      - Secret values, which the platform never returns in plaintext. They are listed in a masked-credentials note.
      - A value the file declares that the remote does not report (`local-only`). It is never removed.
      - A handful of already-declared properties that `config push` cannot communicate back at all, listed in an unmanaged note.

      Local-stack-only sections, such as `[studio]`, `[analytics]`, `[functions]`, `[edge_runtime]`, port numbers and image version pins, have no hosted counterpart and are never touched.

      One family of properties is written even though `config push` cannot send it back, for example `auth.oauth_server` and disabled `storage.analytics` or `storage.vector`. Pulling still records the hosted value, with a warning that it cannot be pushed back.

      ## Keeping the file loadable

      `config pull` never writes a `config.toml` or `config.json` that it cannot load back on the next command. Pulling a value that gates other declared fields, such as turning a disabled provider's `enabled` on, also pulls its now-required sibling values in the same write, so the file never comes out half-configured.

      When a sibling cannot be supplied, because the remote does not report it or a required value would still be missing, the whole toggle is skipped. It is reported as `requires values pull cannot write` in text output and `would_invalidate` in the machine payload. A note names the missing fields and, when a field is an unresolved `env(VAR)` reference, the environment variable to set before rerunning.

      ## Confirmation and previews

      `--dry-run` prints exactly what `config diff` would show, then stops: no git check, no prompt and no write.

      `--output-format json|stream-json` never prompts. It returns the confirmation's default value without reading anything, so use `--dry-run` for a preview in those formats. A non-interactive run in the default text format (no TTY on stdin) still prints the confirmation to stderr and reads a single line from piped stdin. An explicit `y`/`yes`/`n`/`no` is honored, an empty line falls back to the default, and any other answer declines.

      `--yes` (or `SUPABASE_YES`) answers the confirmation prompt without asking. It does not bypass the uncommitted-changes guard: `--yes` together with uncommitted or untracked changes aborts instead of silently overwriting them, since no human is left to read the warning.

      `--force` writes even when `supabase/config.toml` has uncommitted or untracked changes in git. Without it, an interactive run's prompt defaults to "no" instead of "yes", and every other case (non-interactive text, machine format, or `--yes` on any TTY) aborts outright.

      A second `config pull` against an already-tracked, unchanged remote writes nothing, and never checks for uncommitted local changes in that case. A target that is not tracked yet still creates its `[remotes.*]` block on the first pull, even when every value matches the local defaults. It is the second pull against that block that writes nothing.

      ## Example

      Given `supabase/config.toml`:

      ```toml
      project_id = "abcdefghijklmnopqrst"

      [api]
      enabled = true
      max_rows = 1000
      ```

      `supabase config pull --remote=staging`, where `staging` is a branch of the linked project and no existing `[remotes.*]` block already tracks it, creates a new block at the end of the file — `max_rows` lands under its own `[remotes.staging.api]` sub-table, the same way `[api]` itself is a sub-table of the document root, not a key directly under `[remotes.staging]`:

      ```toml
      project_id = "abcdefghijklmnopqrst"

      [api]
      enabled = true
      max_rows = 1000

      [remotes.staging]
      project_id = "cccccccccccccccccccc"

      [remotes.staging.api]
      max_rows = 250
      ```

      Running the same command again finds no differences and writes nothing.

      Machine-readable output is available through `--output-format json|stream-json`. The payload is versioned and contains `schema_version`, `config_schema`, `config_path`, `format`, `target`, `destination`, `dry_run`, `wrote`, `scope`, `changes[]`, `warnings[]`, `masked[]`, `unmanaged[]` and `counts`.

      `target` identifies the pulled project the same way `config diff` does: `kind`, `project_ref`, `project_name`, `environment`, `parent_project_ref`, `branch` and `local_scope`. Per-change `path`s are segment arrays, and each change carries `written` and, when unwritten, a `skipped_reason` (`env_reference | local_only | remote_env_reference | unwritable | would_invalidate | declined | dry_run`).

      A `would_invalidate` warning additionally carries `missing_fields` (`[{path, env_variable?}]`) naming what blocked the family. The payload spells the root scope `"base"` (`target.local_scope`), while text output calls the same thing `config root`.

      The legacy global `-o`/`--output` flag is not supported by this command; use `--output-format json|stream-json` instead.
    examples:
      - id: example-1
        name: Pull from the linked project into the config root
        code: supabase config pull
      - id: example-2
        name: Pull from the 'staging' branch into remotes.staging
        code: supabase config pull --remote=staging
      - id: example-3
        name: Preview the changes without writing the config file
        code: supabase config pull --dry-run
    tags: []
    links: []
    usage: supabase config pull [flags]
    subcommands: []
    flags:
      - id: dry-run
        name: --dry-run
        description: Show what would be written without touching the config file.
        default_value: 'false'
      - id: force
        name: --force
        description: Write even when the project config file has uncommitted changes in git.
        default_value: 'false'
      - id: remote
        name: --remote[=<ref|branch>]
        description: 'Target another project: --remote=<ref|branch>. Defaults to the linked project.'
        default_value: 'false'
      - id: remote-label
        name: --remote-label <string>
        description: Name of the `[remotes.*]` block to write into, overriding the block that would otherwise be reused or created.
        default_value: ''
  - id: supabase-config-push
    title: supabase config push
    summary: Push local config to a project
    description: |


      Update the linked project, or one of its branches, with the properties your local `supabase/config.toml` declares. This lets you manage project configuration as code. Properties the file does not declare are left unchanged.

      Pass `--remote=<ref|branch>` to push to a specific project, or the name (or UUID) of a branch of the currently linked project. Values that are exactly 20 lowercase letters are always treated as project refs. Without `--remote`, the linked project is the target.

      `--project-ref` still works in v3 but is deprecated and removed in v4; use `--remote`.

      Before anything is pushed, the command prints the `Target:` line for the resolved project or branch (name, ref, and for a branch its parent project). It then shows the exact diff for every resource that will change. If a change enables a paid add-on, its price is printed before the question.

      The command asks once, with one question covering every changed resource and a default answer of no. It sends nothing until you confirm. A push with nothing to change never asks, and declining fails the command and writes nothing.

      Piped answers are never read, so a script, a JSON run (`-o json`, `--output-format json`) or an agent must pass `--yes` or set `SUPABASE_YES` in the shell. A `SUPABASE_YES` in `supabase/.env` does not count. With `--yes` the command echoes `Confirmed by --yes: …` to stderr and pushes.

      In `json` output the result carries a `target` object with the resolved identity (`kind`, `project_ref`, `project_name`, `environment`, and `parent_project_ref` for a branch) next to the push summary.
    examples:
      - id: example-1
        name: Push local config to the linked project
        code: supabase config push
      - id: example-2
        name: Push local config to a specific project
        code: supabase config push --remote=abcdefghijklmnopqrst
      - id: example-3
        name: Push local config to the 'staging' branch
        code: supabase config push --remote=staging
    tags: []
    links: []
    usage: supabase config push [flags]
    subcommands: []
    flags:
      - id: remote
        name: --remote[=<ref|branch>]
        description: 'Target another project: --remote=<ref|branch>. Defaults to the linked project.'
        default_value: 'false'
  - id: supabase-config-validate
    title: supabase config validate
    summary: Validate the project config file
    description: |


      Checks the project config file (`supabase/config.toml`, `config.json` or `config.jsonc`) and reports every problem in one pass, each with its key path and `file:line:column`. It never modifies a project file and never contacts the Supabase API.

      ## What is checked

      1. The file parses (TOML or JSONC).
      2. The schema version is one this CLI reads.
      3. Only one config file applies: `config.json` and `config.jsonc` together is an error, and `config.toml` next to a JSON file is reported as shadowed (the JSON file is the one used).
      4. With `--resolve-env` only, the `.env*` files load.
      5. Removed keys, unknown keys (with a `did you mean` suggestion when one is close), values of the wrong type, enum or range, and missing required keys.
      6. The config rules `supabase start` applies before it touches Docker, such as a missing provider secret or an unreadable `content_path` file. This does not cover Docker, ports or image pulls.
      7. Every `[remotes.<name>]` block, merged over the base config. Its problems carry the remote name, and a problem the base already has is reported once.

      Stages 1 to 3 and, with `--resolve-env`, stage 4 stop the run when they fail, because later checks cannot be computed; the report says where it stopped (`complete: false`, `stopped_at` in JSON). Everything from stage 5 on is reported together. `complete` is also `false` when a whole table had to be treated as unknown.

      ## Secrets

      The report shows key paths and `file:line:column`, never source text or values, in text and JSON alike (see [ADR 0034](https://github.com/supabase/cli/blob/develop/docs/adr/0034-config-diagnostics-print-no-source-text.md)). Environment variables are read only with `--resolve-env`, and `SUPABASE_*` key overrides are never read: the command validates the file as committed.

      ## `env()` references

      By default the command never reads the shell or any `.env*` file. A value written as `env(NAME)` is unknown: it is never an error by itself, and a check that reads it is not run. The report says how many values come from `env()` and how many checks were not run, and JSON lists them in `deferred` (`check`, `remote`, `waits_on`) with the count in `unknown_values`.

      With `--resolve-env` the command reads the shell and the `.env*` files (`supabase/` then the project root, selected by `SUPABASE_ENV`) and checks each value like a literal. A set value is validated and never printed. A variable that is unset (`env_unset`) or empty (`env_empty`, including a shell variable set to `""`, which hides a `.env` value) is reported with every place it is used, for example `NAME is not set. It is used at 12:3, 40:7`. It is an error when a check could not run without it or when it feeds a key that only accepts a number, boolean or one of a fixed set of values, and a warning otherwise. Warnings never change the exit code. An unreadable or unparseable `.env*` file stops the run at `env_file`.

      ## Two config files

      `config.json` and `config.jsonc` together is an error. `config.toml` next to a JSON file reports `shadowed_file`.

      ## Example

      ```text
        ✗ db.major_version  unsupported Postgres version
          supabase/config.toml:9:17
          help: use one of 14, 15, 17

      ✗ 1 error in supabase/config.toml
      ```

      ```json
      {
        "schema_version": 1,
        "valid": false,
        "complete": true,
        "file": "supabase/config.toml",
        "format": "toml",
        "remotes": [],
        "unknown_values": 0,
        "deferred": [],
        "errors": [
          {
            "code": "invalid_value",
            "severity": "error",
            "key": "db.major_version",
            "path": "db.major_version",
            "reason": "unsupported Postgres version",
            "help": "use one of 14, 15, 17",
            "line": 9,
            "column": 17,
            "end_line": 9,
            "end_column": 19
          }
        ],
        "warnings": [],
        "message": "supabase/config.toml has 1 problem"
      }
      ```

      Problem codes: `syntax`, `file_conflict`, `schema_version`, `removed_key`, `unknown_key`, `invalid_type`, `invalid_enum`, `invalid_value`, `missing_required`, `remote_project_id`, `env_file`, `env_unset`, `env_empty`, `deprecated_key`, `shadowed_file`, `unrecognized_schema`. Failures before a report exists (no config file, bad `--workdir`) use the generic `{"_tag":"Error",...}` envelope.

      The exit code is `0` when valid and `1` when there are errors. `-o/--output` is not supported; use `--output-format`.

      ## CI and pre-commit

      ```yaml
      - run: supabase config validate
      ```

      ```yaml
      repos:
        - repo: local
          hooks:
            - id: supabase-config-validate
              name: supabase config validate
              entry: supabase config validate
              language: system
              files: ^supabase/config\.(toml|jsonc?)$
              pass_filenames: false
      ```

      ```sh
      supabase config validate
      supabase config validate --workdir path/to/project
      supabase config validate --output-format json
      supabase config validate --resolve-env
      ```
    examples:
      - id: example-1
        name: Validate supabase/config.toml, config.json or config.jsonc
        code: supabase config validate
      - id: example-2
        name: Validate the config of another project directory
        code: supabase config validate --workdir path/to/project
      - id: example-3
        name: Print the report as JSON for scripts and agents
        code: supabase config validate --output-format json
      - id: example-4
        name: Also check the values that env() references take from the shell and .env files
        code: supabase config validate --resolve-env
    tags: []
    links: []
    usage: supabase config validate [flags]
    subcommands: []
    flags:
      - id: resolve-env
        name: --resolve-env
        description: Read the shell and .env files, and check the values env() references supply. Without it, env() values are left unchecked.
        default_value: 'false'
