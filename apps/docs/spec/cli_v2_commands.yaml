  - id: supabase-link
    title: supabase link
    summary: Link to a hosted Supabase project
    description: |
      Connects the current directory to a hosted Supabase project so commands such as `db push --remote` and `db pull --remote` target it. Pass the project ref, or the name of one of its branches, as the argument: `supabase link <ref>`. The `--project-ref` flag still works.

      Linking records the project ref under `supabase/.temp/`, so later commands target that project without `--project-ref`. It never connects to the database, so it needs no database password.

      Passing a bare `--remote` to commands such as `db dump`, `db push`, and `db pull` targets the linked project, so link it first.
    examples:
      - id: basic-usage
        name: Basic usage
        code: supabase link abcdefghijklmnopqrst
        response: |
          Finished supabase link.
      - id: link-branch
        name: Link a branch by name
        code: supabase link my-branch
        response: |
          Finished supabase link.
      - id: using-alternate-dns
        name: Link using DNS-over-HTTPS resolver
        code: supabase link abcdefghijklmnopqrst --dns-resolver https
        response: |
          Finished supabase link.
    tags:
      - local-dev
    links: []
    usage: supabase link [ref-or-branch] [flags]
    subcommands: []
    flags:
      - id: project-ref
        name: --project-ref <string>
        description: Project ref, or the name of one of its branches; deprecated in favor of the argument.
        default_value: ''
      - id: skip-pooler
        name: --skip-pooler
        description: Use a direct connection instead of the connection pooler.
        default_value: 'false'
  - id: supabase-login
    title: supabase login
    summary: Log in to your Supabase account
    description: |


      Signs the CLI in to your Supabase account, so commands that use the Management API can manage your projects, functions, secrets, and more. By default it opens the browser to complete the login; pass a [personal access token](https://supabase.com/dashboard/account/tokens) with `--token` to skip that.

      The token is stored in native credentials storage (the operating system keyring). If that is unavailable, it is written to a plain text file at `<SUPABASE_HOME or ~/.supabase>/access-token`.

      > In CI or other environments where you do not want to log in, set the `SUPABASE_ACCESS_TOKEN` environment variable instead.

      > The Management API client retries retryable failures up to 5 times by default. Set `SUPABASE_API_MAX_RETRIES` to change that. It counts retries after the first attempt, so `0` sends each request once.
    examples:
      - id: basic-usage
        name: Basic usage
        code: supabase login
        response: |
          You can generate an access token from https://supabase.com/dashboard/account/tokens
          Enter your access token: sbp_****************************************
          Finished supabase login.
    tags:
      - local-dev
    links: []
    usage: supabase login [flags]
    subcommands: []
    flags:
      - id: name
        name: --name <string>
        description: Name to store the token under in your settings.
        default_value: built-in token name generator
      - id: no-browser
        name: --no-browser
        description: Print the login URL without opening a browser.
        default_value: 'false'
      - id: token
        name: --token <string>
        description: Access token to store instead of using the browser login flow.
        default_value: ''
