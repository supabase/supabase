        description: 'Target a remote database: the linked project, or --remote=<ref|branch|url>.'
        default_value: 'false'
  - id: supabase-migration-list
    title: supabase migration list
    summary: List local and applied migrations
    description: |


      Compare the migration files in `supabase/migrations` with the migration history of a database. Use it to see which migrations are missing on either side.

      It lists the local database by default. Pass `--remote` to list the linked project instead, which requires running `supabase link`. Pass `--remote=<ref|branch|url>` to list another project, a branch of the linked project, or a database URL such as a self-hosted database.

      `--linked`, `--project-ref`, `--db-url` and `--local` still work in v3 but are deprecated and removed in v4; use `--remote`.

      > Note that URL strings must be escaped according to [RFC 3986](https://www.rfc-editor.org/rfc/rfc3986).

      The target database tracks applied migrations in the `supabase_migrations.schema_migrations` table. The second column is headed `Remote` for a project or database URL passed with `--remote`, and `Local DB` for the local database. Only the timestamps are compared to identify differences.

      If the local and remote migration history differ, you can resolve them with the `migration repair` command.
    examples:
      - id: basic-usage
        name: Basic usage
        code: supabase migration list --remote
        response: |2
                LOCAL      │     REMOTE     │     TIME (UTC)
          ─────────────────┼────────────────┼──────────────────────
                           │ 20230103054303 │ 2023-01-03 05:43:03
                           │ 20230103093141 │ 2023-01-03 09:31:41
            20230222032233 │                │ 2023-02-22 03:22:33
      - id: with-db-url
        name: Connect to self-hosted database
        code: supabase migration list --remote='postgres://postgres[:percent_encoded_password]@db.example.com[:port]/postgres'
        response: |2
                LOCAL      │     REMOTE     │     TIME (UTC)
          ─────────────────┼────────────────┼──────────────────────
            20230103054303 │ 20230103054303 │ 2023-01-03 05:43:03
            20230103093141 │ 20230103093141 │ 2023-01-03 09:31:41
    tags: []
    links: []
    usage: supabase migration list [flags]
    subcommands: []
    flags:
      - id: password
        name: -p, --password <string>
        description: Database password for the project selected with --remote; ignored for the local database and database URLs.
        default_value: ''
      - id: remote
        name: --remote[=<ref|branch|url>]
        description: 'Target a remote database: the linked project, or --remote=<ref|branch|url>.'
        default_value: 'false'
  - id: supabase-migration-new
    title: supabase migration new
    summary: Create an empty migration file
    description: |


      Create an empty migration file for you to fill in. Output from other commands, such as `db diff`, can be piped to `migration new <name>` through stdin.

      The command creates the `supabase/migrations` directory in your current `workdir` if it does not exist. Every migration file in this directory is named `<timestamp>_<name>.sql`.
    examples:
      - id: basic-usage
        name: Basic usage
        code: supabase migration new schema_test
        response: |
          Created new migration at supabase/migrations/20230306095710_schema_test.sql.
      - id: pipe-stdin
        name: With statements piped from stdin
        code: echo "create schema if not exists test;" | supabase migration new schema_test
        response: |
          Created new migration at supabase/migrations/20230306095710_schema_test.sql.
    tags: []
    links: []
    usage: supabase migration new <migration name> [flags]
    subcommands: []
    flags: []
  - id: supabase-migration-repair
    title: supabase migration repair
    summary: Repair the migration history
    description: |


      Mark migrations as applied or reverted in the migration history table, without running them. Use it when the local files and the history of a database are out of sync.

      It repairs the local database by default. Pass `--remote` to repair the linked project, which requires running `supabase link`. Pass `--remote=<ref|branch|url>` to repair another project, a branch of the linked project, or a specific database.

      Repairing a hosted database asks for confirmation before it changes anything (the default answer is No). Pass `--yes` to confirm in scripts and other non-interactive runs.

      `--linked`, `--project-ref`, `--db-url` and `--local` still work in v3 but are deprecated and removed in v4; use `--remote`.

      Marking a migration as `reverted` deletes its record from the migration history table, and marking it as `applied` inserts a new record.

      ## Example

      Your migration history may look like the table below, with entries missing on either the local or the remote side.

      ```bash
      $ supabase migration list --remote
      Target: project My Project (abcdefghijklmnopqrst) · production
              LOCAL      │     REMOTE     │     TIME (UTC)
        ─────────────────┼────────────────┼──────────────────────
                         │ 20230103054303 │ 2023-01-03 05:43:03
         20230103054315  │                │ 2023-01-03 05:43:15
      ```

      To reset your migration history to a clean state, first delete your local migration file.

      ```bash
      $ rm supabase/migrations/20230103054315_remote_commit.sql

      $ supabase migration list --remote
      Target: project My Project (abcdefghijklmnopqrst) · production
              LOCAL      │     REMOTE     │     TIME (UTC)
        ─────────────────┼────────────────┼──────────────────────
                         │ 20230103054303 │ 2023-01-03 05:43:03
      ```

      Then mark the remote migration `20230103054303` as reverted.

      ```bash
      $ supabase migration repair 20230103054303 --status reverted --remote
      Target: project My Project (abcdefghijklmnopqrst) · production
       • 20230103054303
      ◇  Mark 1 migration as reverted on project My Project (abcdefghijklmnopqrst) · production?
      │  Yes
      Repaired migration history: [20230103054303] => reverted
      Finished supabase migration repair.

      $ supabase migration list --remote
      Target: project My Project (abcdefghijklmnopqrst) · production
              LOCAL      │     REMOTE     │     TIME (UTC)
        ─────────────────┼────────────────┼──────────────────────
      ```

      Now you can run `db pull` again to dump the remote schema as a local migration file.

      ```bash
      $ supabase db pull --remote
      Target: project My Project (abcdefghijklmnopqrst) · production
      Write 1 migration file to supabase/migrations.
      Record them as applied in the remote migration history.
      ◇  Update the remote migration history table on project My Project (abcdefghijklmnopqrst) · production?
      │  Yes
      Schema written to supabase/migrations/20240414044403_remote_schema.sql
      Finished supabase db pull.

      $ supabase migration list --remote
      Target: project My Project (abcdefghijklmnopqrst) · production
              LOCAL      │     REMOTE     │     TIME (UTC)
        ─────────────────┼────────────────┼──────────────────────
          20240414044403 │ 20240414044403 │ 2024-04-14 04:44:03
      ```
    examples:
      - id: basic-usage
        name: Mark a migration as reverted
        code: supabase migration repair 20230103054303 --status reverted --yes --remote
        response: |
          Target: project My Project (abcdefghijklmnopqrst) · production
          Confirmed by --yes: Mark 1 migration as reverted on project My Project (abcdefghijklmnopqrst) · production
          Repaired migration history: [20230103054303] => reverted
      - id: mark-applied
        name: Mark a migration as applied
        code: supabase migration repair 20230222032233 --status applied --yes --remote
        response: |
          Target: project My Project (abcdefghijklmnopqrst) · production
          Confirmed by --yes: Mark 1 migration as applied on project My Project (abcdefghijklmnopqrst) · production
          Repaired migration history: [20230222032233] => applied
    tags: []
    links: []
    usage: supabase migration repair [version] ... [flags]
    subcommands: []
    flags:
      - id: password
        name: -p, --password <string>
        description: Database password for the project selected with --remote; ignored for the local database and database URLs.
        default_value: ''
      - id: remote
        name: --remote[=<ref|branch|url>]
        description: 'Target a remote database: the linked project, or --remote=<ref|branch|url>.'
        default_value: 'false'
      - id: status
        name: --status <[ applied | reverted ]>
        description: Status to record for the given migration versions.
        required: true
        default_value: ''
        accepted_values:
          - id: applied
            name: applied
            type: '[ applied | reverted ]'
          - id: reverted
            name: reverted
            type: '[ applied | reverted ]'
  - id: supabase-migration-squash
    title: supabase migration squash
    summary: Squash migrations into a single file
    description: |


      Combine your local migrations into a single file. Use it to remove repeated changes to the same schema from your migration history.

      The squashed migration is equivalent to a schema-only dump of the local database after applying your existing migration files. By default, the latest `<timestamp>_<name>.sql` file is updated to contain it. Choose another target with `--version <timestamp>`.

      Data statements such as insert, update, or delete are omitted from the squashed migration, so you must add them back in a new migration file. This includes cron jobs, storage buckets, and any encrypted secrets in vault. If your `supabase/migrations` directory is empty, the command does nothing.

      Squashing rewrites your local migration files. When the target is a hosted database (`--remote` or `--remote=<ref|branch|url>`), it also resets the remote migration history table to the squashed migration, and asks for confirmation before changing any file (the default answer is No). Pass `--yes` to confirm in scripts and other non-interactive runs.

      With the default local target, the command only squashes the files and suggests running `supabase migration repair --status applied --remote` for the remote history.

      `--linked`, `--project-ref`, `--db-url` and `--local` still work in v3 but are deprecated and removed in v4; use `--remote`.
    examples:
      - id: example-1
        name: Squash all local migrations into the latest file
        code: supabase migration squash
      - id: example-2
        name: Squash migrations up to a given version
        code: supabase migration squash --version 20240101000000
    tags: []
    links: []
    usage: supabase migration squash [flags]
    subcommands: []
    flags:
      - id: password
        name: -p, --password <string>
        description: Database password for the project selected with --remote; ignored for the local database and database URLs.
        default_value: ''
      - id: remote
        name: --remote[=<ref|branch|url>]
        description: 'Target a remote database: the linked project, or --remote=<ref|branch|url>.'
        default_value: 'false'
      - id: version
        name: --version <string>
        description: Squash up to the specified migration version.
        default_value: ''
  - id: supabase-migration-up
    title: supabase migration up
    summary: Apply pending migrations to a database
    description: Apply local migrations that are not yet in the migration history of a database. Unlike db push, it only runs migrations and does not push roles, seeds, or vault secrets.
    examples:
      - id: example-1
        name: Apply pending migrations to the local database
        code: supabase migration up
      - id: example-2
        name: Apply all missing migrations to the linked project
        code: supabase migration up --remote --include-all
