  - id: supabase-db-dump
    title: supabase db dump
    summary: Dump data or schemas from a database
    description: |


      Export the schema of a database as a SQL script, or its data or custom roles with `--data-only` and `--role-only`. Use it to back up a database or to copy it to another project.

      It dumps the local database by default. Pass `--remote` to dump the linked project, which requires your local project to be linked by running `supabase link`. Pass `--remote=<ref|branch|url>` to dump another project, a branch of the linked project, or a database URL such as a self-hosted database.

      The command prints a `Target:` line on stderr naming the database it resolved, and never asks for confirmation.

      `--linked`, `--project-ref`, `--db-url` and `--local` still work in v3 but are deprecated and removed in v4; use `--remote`.

      The command runs `pg_dump` in a container and excludes Supabase-managed schemas, including `auth`, `storage`, and those created by extensions. The default dump contains neither data nor custom roles.

      ### Note on privilege migration

      When you restore to a new project, tables inherit ALL privileges from the default privileges in the target database. To keep specific privileges from your dump, revoke the defaults before restoring:

      ```sql
      -- Run BEFORE restoring your schema
      ALTER DEFAULT PRIVILEGES IN SCHEMA public REVOKE ALL ON TABLES FROM anon, authenticated;
      ```
    examples:
      - id: basic-usage
        name: Basic usage
        code: supabase db dump -f supabase/schema.sql
        response: |
          Target: local stack (127.0.0.1:54322)
          Dumping schemas from local database...
          Dumped schema to supabase/schema.sql.
      - id: linked-project
        name: Dump the linked project
        code: supabase db dump -f supabase/schema.sql --remote
        response: |
          Target: project My Project (abcdefghijklmnopqrst) · production
          Dumping schemas from remote database...
          Dumped schema to supabase/schema.sql.
      - id: role-only
        name: Role only
        code: supabase db dump -f supabase/roles.sql --role-only --remote
        response: |
          Target: project My Project (abcdefghijklmnopqrst) · production
          Dumping roles from remote database...
          Dumped schema to supabase/roles.sql.
      - id: data-only
        name: Data only
        code: supabase db dump -f supabase/seed.sql --data-only --remote
        response: |
          Target: project My Project (abcdefghijklmnopqrst) · production
          Dumping data from remote database...
          Dumped schema to supabase/seed.sql.
    tags: []
    links: []
    usage: supabase db dump [flags]
    subcommands: []
    flags:
      - id: data-only
        name: --data-only
        description: Dump only data records.
        default_value: 'false'
      - id: dry-run
        name: --dry-run
        description: Print the pg_dump script that would run, without running it.
        default_value: 'false'
      - id: exclude
        name: -x, --exclude <strings>
        description: Comma-separated list of schema.table names to exclude from a data-only dump.
        default_value: '[]'
      - id: file
        name: -f, --file <string>
        description: File path to save the dumped contents to.
        default_value: ''
      - id: keep-comments
        name: --keep-comments
        description: Keep commented lines from the pg_dump output.
        default_value: 'false'
      - id: password
        name: -p, --password <string>
        description: Database password for the project selected with --remote; ignored for the local database and database URLs.
        default_value: ''
      - id: remote
        name: --remote[=<ref|branch|url>]
        description: 'Target a remote database: the linked project, or --remote=<ref|branch|url>.'
        default_value: 'false'
      - id: role-only
        name: --role-only
        description: Dump only cluster roles.
        default_value: 'false'
      - id: schema
        name: -s, --schema <strings>
        description: Comma-separated list of schemas to include.
        default_value: '[]'
      - id: use-copy
        name: --use-copy
        description: Use COPY statements instead of INSERT statements.
        default_value: 'false'
  - id: supabase-db-lint
    title: supabase db lint
    summary: Check a database for schema errors
    description: |


      Find errors in your database functions by running the `plpgsql_check` extension against all schemas. Use it to catch mistakes before you push a migration.

      It lints the local database by default, which requires the local development stack to be running. Pass `--remote` to lint the linked project, or `--remote=<ref|branch|url>` to lint another project, a branch of the linked project, or a database URL such as a self-hosted database. The command prints a `Target:` line on stderr naming the database it resolved, and never asks for confirmation.

      `--linked`, `--project-ref`, `--db-url` and `--local` still work in v3 but are deprecated and removed in v4; use `--remote`.

      The default lint level is `warning`. Raise it to `error` with `--level`, and lint only some schemas with `--schema`.

      Use `--fail-on` to control when the command exits with a non-zero status, which is useful in CI/CD pipelines. The possible values are:

      - `none` (default): Always exit with a zero status code, regardless of lint results.
      - `warning`: Exit with a non-zero status code if any warnings or errors are found.
      - `error`: Exit with a non-zero status code only if errors are found.
    examples:
      - id: basic-usage
        name: Basic usage
        code: supabase db lint
        response: |
          Linting schema: public

          No schema errors found
      - id: schema-warnings
        name: Warnings for a specific schema
        code: supabase db lint --level warning --schema storage
        response: |
          Linting schema: storage
          [
            {
              "function": "storage.search",
              "issues": [
                {
                  "level": "warning",
                  "message": "unused variable \"_bucketid\"",
                  "sqlState": "00000"
                }
              ]
            }
          ]
    tags: []
    links: []
    usage: supabase db lint [flags]
    subcommands: []
    flags:
      - id: fail-on
        name: --fail-on <[ none | warning | error ]>
        description: Lint level at which the command exits with a non-zero status.
        default_value: none
        accepted_values:
          - id: none
            name: none
            type: '[ none | warning | error ]'
          - id: warning
            name: warning
            type: '[ none | warning | error ]'
          - id: error
            name: error
            type: '[ none | warning | error ]'
      - id: level
        name: --level <[ warning | error ]>
        description: Minimum lint level to report.
        default_value: warning
        accepted_values:
          - id: warning
            name: warning
            type: '[ warning | error ]'
          - id: error
            name: error
            type: '[ warning | error ]'
      - id: remote
        name: --remote[=<ref|branch|url>]
        description: 'Target a remote database: the linked project, or --remote=<ref|branch|url>.'
        default_value: 'false'
      - id: schema
        name: -s, --schema <strings>
        description: Comma-separated list of schemas to include.
        default_value: '[]'
  - id: supabase-db-pull
    title: supabase db pull
    summary: Pull schema from a database
    description: |
      Pull schema changes from a database into a new migration file in `supabase/migrations`. Use it to capture changes made outside your migrations, such as in the dashboard.

      It pulls from the local database by default. Pass `--remote` to pull from the linked project, which requires your local project to be linked by running `supabase link`. Pass `--remote=<ref|branch|url>` to pull from another project, a branch of the linked project, or a database URL such as a self-hosted database.

      In a linked checkout, a run without `--remote` prints a hint naming the linked project. The command prints a `Target:` line on stderr naming the database it resolved.

      `--linked`, `--project-ref`, `--db-url` and `--local` still work in v3 but are deprecated and removed in v4; use `--remote`.

      > Note this command requires Docker Desktop (or a running Docker daemon), as it starts a local Postgres container to diff the schema you pull.

      After the migration file is written, a new row is inserted into the migration history table to reflect the current state of the database. A hosted database asks for one confirmation first (default No), after the diff and before any file is written; declining stops the command without writing anything. Non-interactive, JSON and agent runs need `--yes` (or `SUPABASE_YES` in the shell environment, not in `supabase/.env`).

      A pull from the local database and `--declarative` ask nothing.

      If no entries exist in the migration history table, pg-delta (the default diff engine) produces the full migration from the shadow diff alone; with `--diff-engine migra`, the initial pull instead uses `pg_dump` to capture all contents of the schemas you have created. Otherwise, this command will only diff schema changes against the target database, similar to running `db diff --remote`.

      Pass `--declarative` to switch to the declarative pg-delta export workflow instead of writing a migration file. The tree lives in `supabase/schemas` by default. Change the location with `experimental.pgdelta.declarative_schema_path`.

      On a project that falls back to the legacy migra engine, don't use `--declarative`. The export also points `[db.migrations].schema_paths` at the tree it writes. The next local `db diff` applies those files in lexicographic order without resolving dependencies between them, so it fails when a file sorts before an object it depends on.

      If you've already run it, re-enable pg-delta, or undo both changes:

      1. Delete the files the export wrote to the declarative directory (`supabase/schemas/` by default). Files that were already there are left in place.
      2. Restore `[db.migrations].schema_paths` in `config.toml` to its previous value, or remove it if the export added it.

      pg-delta plans are execution-aware: when a plan crosses a transaction boundary — for example `ALTER TYPE ... ADD VALUE` followed by a statement that uses the new enum value, which cannot run in the same transaction — `db pull` writes one ordered migration file per plan unit instead of a single file (for example `<ts>_remote_schema_1.sql` and `<ts+1s>_remote_schema_2.sql`), each recorded in the migration history. Units whose statements cannot run inside a transaction start with a `-- pg-delta: transaction=false` directive that the CLI apply paths honor. The common case (a single unit) still produces exactly one `<ts>_remote_schema.sql` file.

      By default the emitted SQL is formatted with the same settings the declarative export uses (uppercase keywords, wrapped at a max width of 180, indented and column-aligned). Configure overrides with `[experimental.pgdelta] format_options` in `config.toml`, or set `format_options = "null"` to opt out and emit raw, unformatted statements.

      pg-delta is the default diff engine: the migration-file `db pull` workflow uses pg-delta for the shadow diff step unless configured otherwise; it does not switch to declarative output. With pg-delta, `[db.migrations] schema_paths` does not affect this workflow (migra still reads it, for local targets only); use `supabase db schema declarative sync` for declarative schema files. To fall back to the legacy migra engine, set `enabled = false` under `[experimental.pgdelta]` in `config.toml`, or pass `--diff-engine migra` for a single run.

      When pulling with `--remote=<url>`, prefer a direct connection (`db.<project-ref>.supabase.co:5432`) over the connection pooler so pg-delta can introspect the full catalog reliably.

      Under the pg-delta engine, a plain `db pull` captures your own customizations in Supabase-managed schemas: triggers on managed tables whose function lives outside the managed schemas (for example a trigger on `auth.users` calling a function in `public`), RLS policies on any `auth` table, and RLS policies on `storage.objects`, `storage.buckets`, and `realtime.messages`. Other objects you create inside managed schemas, such as your own functions or indexes, are not diffed. On later pulls, `--schema` restricts the diff to the listed schemas, so a customization in `auth` is only captured when `auth` is listed or `--schema` is omitted; the initial pull ignores `--schema`.

      Under the legacy migra engine, the initial pull's `pg_dump` skips the managed schemas, and the migra diff pass that follows appends your trigger and RLS policy changes there to the same migration file. If an older CLI reports that `auth` and `storage` were excluded, capture existing customizations there with `--schema auth,storage`.

      ## Debugging empty pg-delta pulls

      If `db pull` reports `No schema changes found` but you expect schema output, set `PGDELTA_DEBUG=1` before running the command. Unlike `--debug`, this keeps SSL enabled for hosted Supabase connections.

      ```sh
      PGDELTA_DEBUG=1 supabase db pull --remote="$DATABASE_URL"
      ```

      When pg-delta returns zero statements, the CLI writes a debug bundle under `supabase/.temp/pgdelta/v2/debug/<timestamp>-diff/` containing the source/desired catalog snapshots, the plan, and coverage diagnostics. Catalog files are not written during normal `db pull` runs.

      For TLS tracing without disabling SSL, use `SUPABASE_SSL_DEBUG=true` alongside `PGDELTA_DEBUG=1`.
    examples:
      - id: basic-usage
        name: Basic usage
        code: supabase db pull --remote
        response: |
          Target: project My Project (abcdefghijklmnopqrst) · production
          ◇  Update the remote migration history table on project My Project (abcdefghijklmnopqrst) · production?
          │  Yes
          Schema written to supabase/migrations/20240414044403_remote_schema.sql
          Repaired migration history: [20240414044403] => applied
          Finished supabase db pull.
      - id: local-studio
        name: Local studio
        code: supabase db pull
        response: |
          Target: local stack (127.0.0.1:54322)
          Creating shadow database...
          Seeding globals from roles.sql...
          Applying migration 20240414044403_remote_schema.sql...
          Diffing schemas...
          No schema changes found
          The remote database is already in sync with your local migrations — nothing to pull.
      - id: custom-schemas
        name: Custom schemas
        code: supabase db pull --schema public,extensions --remote
        response: |
          Target: project My Project (abcdefghijklmnopqrst) · production
          Creating shadow database...
          Seeding globals from roles.sql...
          Applying migration 20240414044403_remote_schema.sql...
          Diffing schemas: public,extensions
          No schema changes found
          The remote database is already in sync with your local migrations — nothing to pull.
    tags: []
    links: []
    usage: supabase db pull [migration name] [flags]
    subcommands: []
    flags:
      - id: declarative
        name: --declarative
        description: Replace the declarative schema files with the schema of the selected database instead of creating a migration.
        default_value: 'false'
      - id: diff-engine
        name: --diff-engine <[ migra | pg-delta ]>
        description: Diff engine to use when creating a migration.
        default_value: pg-delta
        accepted_values:
          - id: migra
            name: migra
            type: '[ migra | pg-delta ]'
          - id: pg-delta
            name: pg-delta
            type: '[ migra | pg-delta ]'
      - id: password
        name: -p, --password <string>
        description: Database password for the project selected with --remote; ignored for the local database and database URLs.
        default_value: ''
      - id: remote
        name: --remote[=<ref|branch|url>]
        description: 'Target a remote database: the linked project, or --remote=<ref|branch|url>.'
        default_value: 'false'
      - id: schema
        name: -s, --schema <strings>
        description: Comma-separated list of schemas to include.
        default_value: '[]'
      - id: strict-coverage
        name: --strict-coverage
        description: Fail when pg-delta finds schema objects it cannot manage, instead of leaving them unmanaged.
        default_value: 'false'
    breaking_changes:
      - id: target-flags-default
        major: 3
        summary: Bare `db push` / `db pull` now target the local database instead of the linked project; pass `--remote` to reach the linked project.
        direction: upcoming
        flags:
          - --remote
          - --linked
        migration_url: /docs/reference/cli/v3/migrating-from-v2#target-flags-default
  - id: supabase-db-push
    title: supabase db push
    summary: Push new migrations to a database
    description: |
      Apply the local migrations that a database has not run yet. Use it to deploy schema changes to a linked project or another database.

      It pushes to the local database by default. Pass `--remote` to push to the linked project, which requires your local project to be linked by running `supabase link`. Pass `--remote=<ref|branch|url>` to push to another project, a branch of the linked project, or a database URL such as a self-hosted database.

      In a linked checkout, a run without `--remote` prints a hint naming the linked project. The command prints a `Target:` line on stderr naming the database it resolved.

      `--linked`, `--project-ref`, `--db-url` and `--local` still work in v3 but are deprecated and removed in v4; use `--remote`.

      Before changing a hosted database, the command lists what it will do (migrations, custom roles, seed files and vault secrets) and asks once for confirmation, defaulting to No. Pass `--yes` to confirm without a prompt; JSON output, piped input and agent runs need it. A `SUPABASE_YES` set in `supabase/.env` does not confirm, but one set in your shell does.

      The first run creates a migration history table at `supabase_migrations.schema_migrations`. After each migration is applied, a row with its timestamp as the unique id is added to the table, so later pushes skip migrations that were already applied.

      To change the migration history table without running migrations, such as deleting entries or inserting new ones, use the `migration repair` command. Use `--dry-run` to see the list of changes before applying them.
    examples:
      - id: basic-usage
        name: Basic usage
        code: supabase db push --remote
        response: |
          Remote database is up to date.
      - id: self-hosted
        name: Self hosted
        code: supabase db push --remote="postgres://user:pass@db.example.com:5432/postgres"
        response: |
          Pushing migration 20230410135622_create_employees_table.sql...
          Finished supabase db push.
      - id: dry-run
        name: Dry run
        code: supabase db push --dry-run --remote
        response: |
          DRY RUN: migrations will *not* be pushed to the database.
          Would push migration 20230410135622_create_employees_table.sql...
          Would push migration 20230425064254_my_table.sql...
          Finished supabase db push.
    tags: []
    links: []
    usage: supabase db push [flags]
    subcommands: []
    flags:
      - id: dry-run
        name: --dry-run
        description: Print the migrations that would be applied, without applying them.
        default_value: 'false'
      - id: include-all
        name: --include-all
        description: Include all migrations not found in the migration history table.
        default_value: 'false'
      - id: include-roles
        name: --include-roles
        description: Include custom roles from supabase/roles.sql.
        default_value: 'false'
      - id: include-seed
        name: --include-seed
        description: Include seed data from your config.
        default_value: 'false'
      - id: password
        name: -p, --password <string>
        description: Database password for the project selected with --remote; ignored for the local database and database URLs.
        default_value: ''
      - id: remote
        name: --remote[=<ref|branch|url>]
        description: 'Target a remote database: the linked project, or --remote=<ref|branch|url>.'
        default_value: 'false'
      - id: skip-vault
        name: --skip-vault
        description: Skip updating vault secrets from the project config file.
        default_value: 'false'
    breaking_changes:
      - id: target-flags-default
        major: 3
        summary: Bare `db push` / `db pull` now target the local database instead of the linked project; pass `--remote` to reach the linked project.
        direction: upcoming
        flags:
          - --remote
          - --linked
        migration_url: /docs/reference/cli/v3/migrating-from-v2#target-flags-default
  - id: supabase-db-query
    title: supabase db query
    summary: Run a SQL query against a database
    description: |


      Run a SQL statement against a database and print the result. Pass the statement as an argument or read it from a file with `--file`.

      It runs against the local database by default. Pass `--remote` for the linked project, or `--remote=<ref|branch|url>` for another project, a branch of the linked project, or a database URL. The command prints a `Target:` line on stderr naming the database it resolved.

      `--linked`, `--project-ref`, `--db-url` and `--local` still work in v3 but are deprecated and removed in v4; use `--remote`.

      The command cannot tell a read from a write, so a hosted database (the linked project or a remote database URL) asks for one confirmation (default No) before the statement is sent. Piped answers are never read, so a script, a JSON run or an agent must pass `--yes` or set `SUPABASE_YES` in the shell. A `SUPABASE_YES` in `supabase/.env` does not count.

      The local database never asks.

      ## Read-only mode

      Pass `--read-only` to run a statement that must not change anything. It skips the confirmation on a hosted database.

      Before the statement is sent or any question is asked, every statement must start with `SELECT`, `WITH`, `VALUES`, `TABLE`, `SHOW`, `EXPLAIN` or a parenthesised query, after whitespace and comments. Any other statement (`COMMIT`, `SET`, `CALL`, `DO`, `COPY`, `LOCK` and so on) is rejected, as is input that ends inside a comment, quote or dollar quote, and input that contains a `BEGIN ATOMIC` function body. The words `begin atomic` inside a string, quoted identifier, dollar quote or comment, as in `select 'begin atomic'`, are allowed.

      Drop `--read-only` to run one of the rejected statements.

      The local database or a database URL runs the statement in a read-only transaction that is always rolled back, with a 5 second `lock_timeout` so the read cannot wait on heavy locks. Postgres rejects writes inside it. A linked project runs it through the Management API's `read_only` mode, and the API enforces it.

      `--read-only` does not stop a read statement from calling a function that has side effects, such as `pg_terminate_backend` or `dblink_exec`. Those still run.

      ## Output format

      When an AI coding agent runs the command (auto-detected or via `--agent=yes`), the default output format is JSON with an untrusted data warning envelope. When a human runs it (`--agent=no` or no agent detected), the default output format is a table without the envelope.
    examples:
      - id: example-1
        name: Run a query against the local database
        code: supabase db query "select count(*) from auth.users"
      - id: example-2
        name: Run a read-only query against the linked project
        code: supabase db query --remote --read-only "select now()"
      - id: example-3
        name: Run the statements in a SQL file
        code: supabase db query --file ./report.sql
    tags: []
    links: []
    usage: supabase db query [sql] [flags]
    subcommands: []
    flags:
      - id: file
        name: -f, --file <string>
        description: Path to a SQL file to execute.
        default_value: ''
      - id: output
        name: -o, --output <[ json | table | csv ]>
        description: 'Output format: table, json, or csv.'
        default_value: json
        accepted_values:
          - id: json
            name: json
            type: '[ json | table | csv ]'
          - id: table
            name: table
            type: '[ json | table | csv ]'
          - id: csv
            name: csv
            type: '[ json | table | csv ]'
      - id: read-only
        name: --read-only
        description: Run the statement in a read-only transaction; a hosted target needs no confirmation.
        default_value: 'false'
      - id: remote
        name: --remote[=<ref|branch|url>]
        description: 'Target a remote database: the linked project, or --remote=<ref|branch|url>.'
        default_value: 'false'
  - id: supabase-db-reset
    title: supabase db reset
    summary: Reset a database to the current migrations
    description: |


      Recreate a database from your local migrations and seed it, discarding any other data or schema changes. Use it to get a clean database during development.

      It resets the local database by default, which requires the local development stack to be started by running `supabase start`. The command recreates the local Postgres container and applies all migrations in `supabase/migrations`. If test data is defined in `supabase/seed.sql`, it is seeded afterwards.

      Pass `--remote` to reset the linked project, or `--remote=<ref|branch|url>` to reset another project, a branch of the linked project, or a database URL. The command prints a `Target:` line on stderr naming the database it resolved.

      `--linked`, `--project-ref`, `--db-url` and `--local` still work in v3 but are deprecated and removed in v4; use `--remote`.

      ## Seeding

      Use `--no-seed` to skip seeding entirely. To override `[db.seed].sql_paths` for a single reset, pass one or more `--sql-paths` flags, which accept the same file paths and glob patterns as `sql_paths`, relative to the `supabase` directory. Passing `--sql-paths` enables seeding for that reset even when `[db.seed].enabled = false`.

      If you combine `--sql-paths` with `--remote`, the override seed files are applied to the selected remote database after migrations. Use this only when you intend to seed that remote target.

      ## Resetting a remote database

      A remote reset runs a SQL script that drops all user-created entities in the database. Postgres roles are cluster-level entities, so custom roles created through the dashboard or `supabase/roles.sql` are not deleted.

      The command asks for one confirmation (default No) after it has worked out what it will do and before anything is dropped. The question lists dropping every user schema, any vault secrets it will upsert, the migrations or schema files it will apply, and the seed files it will run. Declining stops the command without changing the database.

      Piped answers are never read, so a script, a JSON run or an agent must pass `--yes` or set `SUPABASE_YES` in the shell. A `SUPABASE_YES` in `supabase/.env` does not count. The local database never asks.
    examples:
      - id: basic-usage
        name: Basic usage
        code: supabase db reset
        response: |
          Resetting database...
          Initializing schema...
          Applying migration 20220810154537_create_employees_table.sql...
          Seeding data supabase/seed.sql...
          Finished supabase db reset on branch main.
    tags: []
    links: []
    usage: supabase db reset [flags]
    subcommands: []
    flags:
      - id: last
        name: --last <int>
        description: Reset up to the last n migration versions.
        default_value: '0'
      - id: no-seed
        name: --no-seed
        description: Skip running the seed script after reset.
        default_value: 'false'
      - id: remote
        name: --remote[=<ref|branch|url>]
        description: 'Target a remote database: the linked project, or --remote=<ref|branch|url>.'
        default_value: 'false'
      - id: sql-paths
        name: --sql-paths <strings>
        description: Override [db.seed].sql_paths for this reset with SQL file paths or glob patterns relative to the supabase directory, which also enables seeding.
        default_value: '[]'
      - id: version
        name: --version <string>
        description: Reset up to the specified migration version.
        default_value: ''
  - id: supabase-db-schema
    title: supabase db schema
    summary: Manage database schema
    description: Work with your database schema as declarative SQL files instead of hand-written migrations.
    tags: []
    links: []
    subcommands:
      - supabase-db-schema-declarative
    flags: []
  - id: supabase-db-schema-declarative
    title: supabase db schema declarative
    summary: Manage declarative database schemas
    description: Keep your schema as a tree of SQL files and generate migrations from the difference to your applied migrations.
    tags: []
    links: []
    subcommands:
      - supabase-db-schema-declarative-generate
      - supabase-db-schema-declarative-sync
    flags: []
  - id: supabase-db-schema-declarative-generate
    title: supabase db schema declarative generate
    summary: Generate declarative schema from a database
    description: |


      Export the schema of a live database as SQL files in the declarative schema directory. This is the entry point for bootstrapping declarative mode.

      The database is the local one unless you pass `--remote` for the linked project, or `--remote=<ref|branch|url>` for another project, a branch of the linked project, or a database URL. The command never asks which database to use. With the local database, `--reset` recreates it from your migrations first.

      When the destination already holds files, the command asks before overwriting them. Pass `--overwrite` or `--yes` to skip the question.

      `--linked`, `--project-ref`, `--db-url` and `--local` still work in v3 but are deprecated and removed in v4; use `--remote`.

      ## Output layout

      The bundled pg-delta engine writes one directory per schema at the root of the declarative directory, such as `supabase/schemas/public/tables/users.sql` and `supabase/schemas/public/schema.sql`. Cluster-level objects that belong to no schema go under a reserved `_cluster/` directory, such as `supabase/schemas/_cluster/roles.sql`.

      When platform default grants (`anon`, `authenticated`, `service_role`) need an overlay `REVOKE ALL`, the export writes `adp_wipes.sql` after `schema.sql` in that schema, or `_cluster/adp_wipes.sql` for cluster-wide overlays. This keeps privileges that were revoked in the source when you load the files onto a fresh project.

      A schema named `_cluster` or `_custom`, in any casing, has its leading underscore percent-encoded (`%5Fcluster/`) so it never claims a directory the export owns. Put hand-written SQL that pg-delta does not model in `_custom/`, which the export never writes to or prunes.

      ## Formatting

      Emitted SQL uses the same default format as `db pull`: uppercase keywords, indent 2, width 180, and column alignment. Override it with `[experimental.pgdelta] format_options`, or set `format_options = "null"` for raw statements.

      This command is enabled by default. When `[experimental.pgdelta] enabled = false` is set in config, pass `--experimental` to run it.
    examples:
      - id: example-1
        name: Export the local database as declarative schema files
        code: supabase db schema declarative generate
      - id: example-2
        name: Replace the declarative files with the schema of the linked project
        code: supabase db schema declarative generate --remote --overwrite
    tags: []
    links: []
    usage: supabase db schema declarative generate [flags]
    subcommands: []
    flags:
      - id: output-dir
        name: --output-dir <string>
        description: Write the generated declarative schema to this directory instead of the configured declarative schema path.
        default_value: ''
      - id: overwrite
        name: --overwrite
        description: Overwrite existing declarative schema files without asking.
        default_value: 'false'
      - id: password
        name: -p, --password <string>
        description: Database password for the project selected with --remote; ignored for the local database and database URLs.
        default_value: ''
      - id: remote
        name: --remote[=<ref|branch|url>]
        description: 'Target a remote database: the linked project, or --remote=<ref|branch|url>.'
        default_value: 'false'
      - id: reset
        name: --reset
        description: Reset the local database from your migrations before generating, which discards local data.
        default_value: 'false'
      - id: schema
        name: -s, --schema <strings>
        description: Comma-separated list of schemas to include.
        default_value: '[]'
      - id: experimental
        name: --experimental
        description: enable experimental features
        default_value: 'false'
      - id: no-cache
        name: --no-cache
        description: Disable the catalog cache and force a fresh shadow database setup.
        default_value: 'false'
      - id: strict-coverage
        name: --strict-coverage
        description: Fail when pg-delta finds schema objects it cannot manage, instead of leaving them unmanaged.
        default_value: 'false'
  - id: supabase-db-schema-declarative-sync
    title: supabase db schema declarative sync
    summary: Generate a migration from declarative schema
    description: |


      Turn the changes you made in your declarative schema files into a new migration. It diffs the files against the current migration state.

      When no declarative schema exists yet, the command offers to run `generate` first, exporting from the local database. To start from a linked project or a database URL, run `generate --remote` or `generate --remote=<url>` yourself first.

      After computing the diff, you can optionally name the migration and apply it to the local database. This command is enabled by default. When `[experimental.pgdelta] enabled = false` is set in config, pass `--experimental` to run it.
    examples:
      - id: with-pg-delta
        name: Sync declarative schema with pg-delta
        code: |
          # After editing declarative schema files, generate a migration:
          supabase db schema declarative sync --experimental
        response: |
          Creating shadow database...
          Applying declarative schemas via pg-delta...
          Applied 239 statements in 1 round(s).
          Enter a name for this migration (press Enter to keep 'declarative_sync'): add_updated_at
          Created new migration at supabase/migrations/20260317194051_add_updated_at.sql
          Apply this migration to local database? [Y/n]
          Target: local stack (127.0.0.1:54322)
          Applying migration 20260317194051_add_updated_at.sql...
          Migration applied successfully.
      - id: generate-first
        name: Generate declarative schema from migrations
        code: |
          supabase db schema declarative sync --experimental
        response: |
          No declarative schema found. Generate a new one ? [Y/n]
          Reset local database to match migrations first? (local data will be lost) [y/N] y
          Resetting database...
          ...
          Declarative schema written to supabase/schemas
          Finished supabase db schema declarative generate.
    tags: []
    links: []
    usage: supabase db schema declarative sync [flags]
    subcommands: []
    flags:
      - id: apply
        name: --apply
        description: Apply the new migration to the local database without asking.
        default_value: 'false'
      - id: file
        name: -f, --file <string>
        description: Name for the new migration file, used when --name is not set.
        default_value: declarative_sync
      - id: name
        name: --name <string>
        description: Name for the new migration file.
        default_value: ''
      - id: no-apply
        name: --no-apply
        description: Write the migration file without asking and without applying it to the local database.
        default_value: 'false'
      - id: schema
        name: -s, --schema <strings>
        description: Comma-separated list of schemas to include.
        default_value: '[]'
      - id: experimental
        name: --experimental
        description: enable experimental features
        default_value: 'false'
      - id: no-cache
        name: --no-cache
        description: Disable the catalog cache and force a fresh shadow database setup.
        default_value: 'false'
      - id: strict-coverage
        name: --strict-coverage
        description: Fail when pg-delta finds schema objects it cannot manage, instead of leaving them unmanaged.
        default_value: 'false'
