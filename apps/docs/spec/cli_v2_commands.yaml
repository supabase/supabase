  - id: supabase-inspect-db-bloat
    title: supabase inspect db bloat
    summary: Show relation bloat
    description: |


      Estimate how much space each table and index wastes on dead tuples. Use it to find relations where autovacuum is not keeping up.

      When data is updated or deleted, Postgres keeps the old row versions as "dead tuples" under [MVCC](https://www.postgresql.org/docs/current/mvcc.html) until [autovacuum](https://supabase.com/docs/guides/platform/database-size#vacuum-operations) cleans them. High bloat can slow queries, cause excessive IOPS, and waste space.

      Investigate tables with a high bloat ratio to see whether vacuuming is too slow or something else is wrong.

      ```
          TYPE  │ SCHEMA NAME │        OBJECT NAME         │ BLOAT │ WASTE
        ────────┼─────────────┼────────────────────────────┼───────┼─────────────
          table │ public      │ very_bloated_table         │  41.0 │ 700 MB
          table │ public      │ my_table                   │   4.0 │ 76 MB
          table │ public      │ happy_table                │   1.0 │ 1472 kB
          index │ public      │ happy_table::my_nice_index │   0.7 │ 880 kB
      ```
    examples:
      - id: example-1
        name: Estimate dead-tuple bloat on the local database
        code: supabase inspect db bloat
      - id: example-2
        name: Estimate bloat on the linked project
        code: supabase inspect db bloat --remote
    tags: []
    links: []
    usage: supabase inspect db bloat [flags]
    subcommands: []
    flags:
      - id: remote
        name: --remote[=<ref|branch|url>]
        description: 'Target a remote database: the linked project, or --remote=<ref|branch|url>.'
        default_value: 'false'
  - id: supabase-inspect-db-blocking
    title: supabase inspect db blocking
    summary: Show blocking queries
    description: |


      List statements that hold locks and the statements they block. Use it together with `inspect db locks` to decide which statements to terminate to resolve lock contention.

      ```
          BLOCKED PID │ BLOCKING STATEMENT           │ BLOCKING DURATION │ BLOCKING PID │ BLOCKED STATEMENT                                                                      │ BLOCKED DURATION
        ──────────────┼──────────────────────────────┼───────────────────┼──────────────┼────────────────────────────────────────────────────────────────────────────────────────┼───────────────────
          253         │ select count(*) from mytable │ 00:00:03.838314   │        13495 │ UPDATE "mytable" SET "updated_at" = '2023─08─03 14:07:04.746688' WHERE "id" = 83719341 │ 00:00:03.821826
      ```
    examples:
      - id: example-1
        name: Show blocked statements on the local database
        code: supabase inspect db blocking
      - id: example-2
        name: Show blocked statements on the linked project
        code: supabase inspect db blocking --remote
    tags: []
    links: []
    usage: supabase inspect db blocking [flags]
    subcommands: []
    flags:
      - id: remote
        name: --remote[=<ref|branch|url>]
        description: 'Target a remote database: the linked project, or --remote=<ref|branch|url>.'
        default_value: 'false'
  - id: supabase-inspect-db-calls
    title: supabase inspect db calls
    summary: Show queries by call count
    description: |


      List statements from `pg_stat_statements` ordered by how many times they were called. Use it to find the queries that run most often and are good candidates for optimization.

      It works like `supabase inspect db outliers`, but sorts by call count instead of total execution time.

      ```

                              QUERY                      │ TOTAL EXECUTION TIME │ PROPORTION OF TOTAL EXEC TIME │ NUMBER CALLS │  SYNC IO TIME
        ─────────────────────────────────────────────────┼──────────────────────┼───────────────────────────────┼──────────────┼──────────────────
          SELECT * FROM users WHERE id = $1              │ 14:50:11.828939      │ 89.8%                         │  183,389,757 │ 00:00:00.002018
          SELECT * FROM user_events                      │ 01:20:23.466633      │ 1.4%                          │       78,325 │ 00:00:00
          INSERT INTO users (email, name) VALUES ($1, $2)│ 00:40:11.616882      │ 0.8%                          │       54,003 │ 00:00:00.000322

      ```
    examples:
      - id: example-1
        name: List the most frequently called queries on the local database
        code: supabase inspect db calls
      - id: example-2
        name: List the most frequently called queries on the linked project
        code: supabase inspect db calls --remote
    tags: []
    links: []
    usage: supabase inspect db calls [flags]
    subcommands: []
    flags:
      - id: remote
        name: --remote[=<ref|branch|url>]
        description: 'Target a remote database: the linked project, or --remote=<ref|branch|url>.'
        default_value: 'false'
  - id: supabase-inspect-db-collation-drift
    title: supabase inspect db collation-drift
    summary: Show indexes affected by collation version drift
    description: |-
      Show indexes affected by collation version drift, with the fix workflow.

      Postgres stores btree indexes on text columns in sorted order, using rules from
      the system collation library (glibc or ICU). When that library is upgraded the
      rules can change, and indexes built under the old rules are no longer correctly
      ordered. Postgres reports no error: queries may quietly return missing rows,
      sort incorrectly, or let duplicates past a unique constraint.

      The output lists the affected indexes and the exact statements to verify
      (amcheck), rebuild (REINDEX CONCURRENTLY), and record the new version — in the
      order they must be run. This command itself is read-only.
    examples:
      - id: example-1
        name: List drifted indexes on the local database
        code: supabase inspect db collation-drift
      - id: example-2
        name: List drifted indexes on the linked project
        code: supabase inspect db collation-drift --remote
    tags: []
    links: []
    usage: supabase inspect db collation-drift [flags]
    subcommands: []
    flags:
      - id: remote
        name: --remote[=<ref|branch|url>]
        description: 'Target a remote database: the linked project, or --remote=<ref|branch|url>.'
        default_value: 'false'
  - id: supabase-inspect-db-db-stats
    title: supabase inspect db db-stats
    summary: Show database stats
    description: Report cache hit rates, database, table, index and TOAST sizes, WAL size, and the time since statistics were reset. Start here for a quick health check of a database.
    examples:
      - id: example-1
        name: Show database stats for the local database
        code: supabase inspect db db-stats
      - id: example-2
        name: Show database stats for the linked project
        code: supabase inspect db db-stats --remote
    tags: []
    links: []
    usage: supabase inspect db db-stats [flags]
    subcommands: []
    flags:
      - id: remote
        name: --remote[=<ref|branch|url>]
        description: 'Target a remote database: the linked project, or --remote=<ref|branch|url>.'
        default_value: 'false'
  - id: supabase-inspect-db-index-stats
    title: supabase inspect db index-stats
    summary: Show index stats
    description: Report each index with its table, columns, size, the share of scans that used it, and whether it is unused. Use it to find large or unused indexes.
    examples:
      - id: example-1
        name: Show index stats for the local database
        code: supabase inspect db index-stats
      - id: example-2
        name: Show index stats for the linked project
        code: supabase inspect db index-stats --remote
    tags: []
    links: []
    usage: supabase inspect db index-stats [flags]
    subcommands: []
    flags:
