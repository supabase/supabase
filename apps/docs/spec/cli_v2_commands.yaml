        name: --remote[=<ref|branch|url>]
        description: 'Target a remote database: the linked project, or --remote=<ref|branch|url>.'
        default_value: 'false'
  - id: supabase-inspect-db-locks
    title: supabase inspect db locks
    summary: Show exclusive locks
    description: |


      List queries that hold an exclusive lock on a relation. Exclusive locks block other operations on that relation and can cause "hung" queries that wait for a lock.

      To stop a query that hangs or blocks others, connect to the database and run `SELECT pg_cancel_backend(PID);`. If it keeps running, force it to stop with `SELECT pg_terminate_backend(PID);`.

      ```
           PID   │ RELNAME │ TRANSACTION ID │ GRANTED │                  QUERY                  │   AGE
        ─────────┼─────────┼────────────────┼─────────┼─────────────────────────────────────────┼───────────
          328112 │ null    │              0 │ t       │ SELECT * FROM logs;                     │ 00:04:20
      ```
    examples:
      - id: example-1
        name: Show exclusive locks on the local database
        code: supabase inspect db locks
      - id: example-2
        name: Show exclusive locks on the linked project
        code: supabase inspect db locks --remote
    tags: []
    links: []
    usage: supabase inspect db locks [flags]
    subcommands: []
    flags:
      - id: remote
        name: --remote[=<ref|branch|url>]
        description: 'Target a remote database: the linked project, or --remote=<ref|branch|url>.'
        default_value: 'false'
  - id: supabase-inspect-db-long-running-queries
    title: supabase inspect db long-running-queries
    summary: Show long-running queries
    description: |


      List queries that have been running for longer than 5 minutes, longest first. Very long-running queries can prevent DDL statements from completing or stop vacuum from updating `relfrozenxid`.

      ```
        PID  │     DURATION    │                                         QUERY
      ───────┼─────────────────┼───────────────────────────────────────────────────────────────────────────────────────
       19578 | 02:29:11.200129 | EXPLAIN SELECT  "students".* FROM "students"  WHERE "students"."id" = 1450645 LIMIT 1
       19465 | 02:26:05.542653 | EXPLAIN SELECT  "students".* FROM "students"  WHERE "students"."id" = 1889881 LIMIT 1
       19632 | 02:24:46.962818 | EXPLAIN SELECT  "students".* FROM "students"  WHERE "students"."id" = 1581884 LIMIT 1
      ```
    examples:
      - id: example-1
        name: Show long-running queries on the local database
        code: supabase inspect db long-running-queries
      - id: example-2
        name: Show long-running queries on the linked project
        code: supabase inspect db long-running-queries --remote
    tags: []
    links: []
    usage: supabase inspect db long-running-queries [flags]
    subcommands: []
    flags:
      - id: remote
        name: --remote[=<ref|branch|url>]
        description: 'Target a remote database: the linked project, or --remote=<ref|branch|url>.'
        default_value: 'false'
  - id: supabase-inspect-db-outliers
    title: supabase inspect db outliers
    summary: Show query outliers by time
    description: |


      List statements from `pg_stat_statements` ordered by total execution time. For each one it shows the statement, its total execution time, its share of all execution time, how often it was called, and the time spent on synchronous I/O (reading and writing the file system).

      An efficient query has a reasonable ratio of calls to total execution time and spends as little time on I/O as possible. Investigate queries with a high total execution time but a low call count, and queries that spend a large share of their time on synchronous I/O.

      ```

                       QUERY                   │ EXECUTION TIME   │ PROPORTION OF EXEC TIME │ NUMBER CALLS │ SYNC IO TIME
      ─────────────────────────────────────────┼──────────────────┼─────────────────────────┼──────────────┼───────────────
       SELECT * FROM archivable_usage_events.. │ 154:39:26.431466 │ 72.2%                   │ 34,211,877   │ 00:00:00
       COPY public.archivable_usage_events (.. │ 50:38:33.198418  │ 23.6%                   │ 13           │ 13:34:21.00108
       COPY public.usage_events (id, reporte.. │ 02:32:16.335233  │ 1.2%                    │ 13           │ 00:34:19.784318
       INSERT INTO usage_events (id, retaine.. │ 01:42:59.436532  │ 0.8%                    │ 12,328,187   │ 00:00:00
       SELECT * FROM usage_events WHERE (alp.. │ 01:18:10.754354  │ 0.6%                    │ 102,114,301  │ 00:00:00
      ```
    examples:
      - id: example-1
        name: List the slowest queries by total execution time on the local database
        code: supabase inspect db outliers
      - id: example-2
        name: List the slowest queries by total execution time on the linked project
        code: supabase inspect db outliers --remote
    tags: []
    links: []
    usage: supabase inspect db outliers [flags]
    subcommands: []
    flags:
      - id: remote
        name: --remote[=<ref|branch|url>]
        description: 'Target a remote database: the linked project, or --remote=<ref|branch|url>.'
        default_value: 'false'
  - id: supabase-inspect-db-replication-slots
    title: supabase inspect db replication-slots
    summary: Show replication slots
    description: |


      Show the [logical replication slots](https://www.postgresql.org/docs/current/logical-replication.html) on the database. For each slot it shows whether it is active, the state of the WAL sender process (`startup`, `catchup`, `streaming`, `backup` or `stopping`), the client address, and the replication lag in GB.

      Use it to check that replication lag stays low. Lag can come from network latency, slow disk I/O, long-running transactions, or a subscriber that cannot consume WAL fast enough.

      ```
                             NAME                    │ ACTIVE │ STATE   │ REPLICATION CLIENT ADDRESS │ REPLICATION LAG GB
        ─────────────────────────────────────────────┼────────┼─────────┼────────────────────────────┼─────────────────────
          supabase_realtime_replication_slot         │ t      │ N/A     │ N/A                        │                  0
          datastream                                 │ t      │ catchup │ 24.201.24.106              │                 45
      ```
    examples:
      - id: example-1
        name: Show replication slots on the local database
        code: supabase inspect db replication-slots
      - id: example-2
        name: Show replication slots on the linked project
        code: supabase inspect db replication-slots --remote
    tags: []
    links: []
    usage: supabase inspect db replication-slots [flags]
    subcommands: []
    flags:
      - id: remote
        name: --remote[=<ref|branch|url>]
        description: 'Target a remote database: the linked project, or --remote=<ref|branch|url>.'
        default_value: 'false'
  - id: supabase-inspect-db-role-stats
    title: supabase inspect db role-stats
    summary: Show role stats
    description: Report each role with its active connections, connection limit, and custom configuration. Use it to see which role uses the most connections.
