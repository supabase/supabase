      - id: metadata
        name: --metadata
        description: Print only the SAML 2.0 Metadata XML.
        default_value: 'false'
      - id: remote
        name: --remote[=<ref|branch>]
        description: 'Target another project: --remote=<ref|branch>. Defaults to the linked project.'
        default_value: 'false'
  - id: supabase-sso-update
    title: supabase sso update
    summary: Update information about an SSO identity provider
    description: Changes the email domains, metadata, attribute mapping or name ID format of a connected identity provider.
    examples:
      - id: basic-usage
        name: Replace domains
        code: |-
          supabase sso update 6df4d73f-bf21-405f-a084-b11adf19fea5 \
            --domains new-company.com,new-company.net \
            --remote=abcdefghijklmnopqrst
        response: Information about the updated provider.
      - id: add-domains
        name: Add an additional domain
        code: |-
          supabase sso update 6df4d73f-bf21-405f-a084-b11adf19fea5 \
            --add-domains company.net \
            --remote=abcdefghijklmnopqrst
        response: Information about the updated provider.
      - id: remove-domains
        name: Remove a domain
        code: |-
          supabase sso update 6df4d73f-bf21-405f-a084-b11adf19fea5 \
            --remove-domains company.org \
            --remote=abcdefghijklmnopqrst
        response: Information about the updated provider.
    tags: []
    links: []
    usage: supabase sso update <provider-id> [flags]
