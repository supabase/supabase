  - id: invoke
    title: invoke()
    description: |
      Invoke a Supabase Edge Function. `invoke` buffers the whole response. It returns a `FunctionResponse` with the status, headers, and body, or decodes the body into a `Decodable` type.
    notes: |
      - The client sends the signed-in user's access token in the `Authorization` header, or the API key when there is no session. An `Authorization` header that you pass in `FunctionInvokeOptions.headers` wins.
      - Pass the body as a `FunctionBody`. Each factory sets the `Content-Type`: `.json(_:)` sends `application/json`, `.text(_:)` sends `text/plain; charset=utf-8`, and `.data(_:contentType:)` sends `application/octet-stream` unless you pass another type. A `Content-Type` in `FunctionInvokeOptions.headers` overrides it.
      - `.json(_:)` encodes and `invoke` decodes with the SDK's coders, which write and read `Date` as ISO 8601. Pass `decoder:` to `invoke`, or `encoder:` to `.json(_:encoder:)`, to change that.
      - When a region is specified, both the `x-region` header and `forceFunctionRegion` query parameter are set to ensure proper function routing.
      - By default, function invocations use a 150-second idle timeout. You can override this per call with `FunctionInvokeOptions(timeout:)`. This only controls the client's request timeout — it cannot extend function execution beyond the platform's [150-second gateway idle timeout](/docs/guides/functions/limits), after which a 504 Gateway Timeout is returned regardless of the value passed.
    examples:
      - id: invocation-with-decodable
        name: Invocation with `Decodable` response
        isSpotlight: true
        code: |
          ```swift
          struct Response: Decodable {
            // Expected response definition
          }

          let response: Response = try await supabase.functions.invoke(
            "hello",
            body: .json(["foo": "bar"])
          )

          // Or name the type with `as:`
          let same = try await supabase.functions.invoke(
            "hello",
            body: .json(["foo": "bar"]),
            as: Response.self
          )
          ```
      - id: invocation-with-custom-response
        name: Invocation with custom response
        description: |
          Without a `Decodable` type, `invoke` returns a `FunctionResponse`. Read the status, headers, and raw body from it.
        isSpotlight: true
        code: |
          ```swift
          let response = try await supabase.functions.invoke(
            "hello",
            body: .json(["foo": "bar"])
          )

          print(response.status.code) // Int
          print(response.text ?? "") // The body as a UTF-8 string
          print(response.body) // Data
          ```
      - id: error-handling
        name: Error handling
        description: |
          `invoke` throws a `FunctionsError`. Check its `kind`:
            - `.server` when the function returns a non-2xx status. The status and body are in `response`.
            - `.relay` when the Supabase Relay has an error processing your function.
            - `.transport` when the request fails on the network. The original `URLError` is in `underlyingError`.
            - `.decoding` when the response body does not decode as the type you asked for.

          `Kind` is an open set, so keep a `default:` branch. A cancelled call throws `CancellationError`.
        isSpotlight: true
        code: |
          ```swift
          do {
            let response = try await supabase.functions.invoke(
              "hello",
              body: .json(["foo": "bar"])
            )
          } catch let error as FunctionsError {
            switch error.kind {
            case .server:
              let code = error.response?.status.code ?? 0
              let body = String(decoding: error.response?.body ?? Data(), as: UTF8.self)
              print("Function returned code \(code) with response \(body)")
            case .relay:
              print("Relay error")
            default:
              print("Other error: \(error.localizedDescription)")
            }
          }
          ```
      - id: passing-custom-headers
        name: Passing custom headers
        description: |
          You can pass custom headers to your function. Note: supabase-swift automatically passes the `Authorization` header with the signed-in user's JWT.
        isSpotlight: true
        code: |
          ```swift
          let response = try await supabase.functions.invoke(
            "hello",
            options: FunctionInvokeOptions(
              headers: [
                HTTPField.Name("my-custom-header")!: "my-custom-header-value"
              ]
            )
          )
          ```
