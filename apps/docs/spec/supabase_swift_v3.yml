  - id: range-gt
    title: rangeGt()
    description: |
      Match only rows where every element in `column` is greater than any element in `range`.
    examples:
      - id: with-select
        name: With `select()`
        code: |
          ```swift
          try await supabase
            .from("reservations")
            .select()
            .rangeGt("during", range: "[2000-01-02 08:30, 2000-01-02 09:30)")
            .execute()
          ```

