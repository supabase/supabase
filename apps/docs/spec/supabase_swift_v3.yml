  - id: text-search
    title: textSearch()
    description: |
      Match only rows where `column` matches the query string in `query`.
    notes: |
      - `config` sets the text search configuration, such as `"english"`.
      - `type` picks how `query` is parsed: `.plain`, `.phrase`, or `.websearch`. Leave it out to use `to_tsquery`.
