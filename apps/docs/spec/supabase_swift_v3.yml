  - id: max-affected
    title: maxAffected()
    description: |
      Set the maximum number of rows that can be affected by the query.

      Only available in PostgREST v13+ and only works with PATCH, DELETE methods and RPC calls.
    notes: |
      - This method sets `handling=strict` and `max-affected=<value>` headers for row limit enforcement.
      - Only use with UPDATE (PATCH), DELETE operations, or RPC calls that modify data.
      - If the query would affect more rows than specified, PostgREST will return an error.
      - This is useful for preventing accidental bulk updates or deletes.
    examples:
      - id: with-update
        name: With `update()`
        code: |
          ```swift
          try await supabase
            .from("users")
            .update(["status": "active"])
            .eq("id", value: 1)
            .maxAffected(1)
            .execute()
          ```
        description: |
          Ensure that only one row is updated. If the query would update more than one row, an error is returned.
        isSpotlight: true
      - id: with-delete
        name: With `delete()`
        code: |
          ```swift
          try await supabase
            .from("users")
            .delete()
            .in("id", values: [1, 2, 3])
            .maxAffected(3)
            .execute()
          ```
        description: |
          Ensure that only three rows are deleted. If the query would delete more than three rows, an error is returned.
      - id: with-rpc
        name: With `rpc()`
        code: |
          ```swift
          try await supabase
            .rpc("delete_inactive_users")
            .maxAffected(10)
            .execute()
          ```
        description: |
          Ensure that the RPC call affects at most 10 rows. Useful for limiting the impact of functions.

          PostgREST counts the rows that the function returns, not the rows that it writes. For this check to protect your data, the function must return one row for each row it changes:

          ```sql
          create function delete_inactive_users() returns setof users as $$
            delete from users
            where last_seen_at < now() - interval '1 year'
            returning *;
          $$ language sql;
          ```

  - id: dry-run
    title: dryRun()
    description: |
      Executes the mutation but rolls back the transaction instead of committing it, so its changes in the transaction are not persisted.
    notes: |
      - The mutation runs and its result (including the changes made by triggers) is returned in the response, but the transaction is rolled back afterward.
      - The rollback does not undo effects outside the transaction. For example, values taken from a sequence stay used, so an identity column skips them.
      - Useful for testing mutations without touching real data.
      - Requires PostgREST's `db-tx-end` setting to allow client-controlled transaction rollback.
    examples:
      - id: with-update
        name: With `update()`
        isSpotlight: true
        code: |
          ```swift
          try await supabase
            .from("todos")
            .update(["done": true])
            .eq("id", value: 1)
            .select()
            .dryRun()
            .execute()
          // Row is not actually updated in the database.
          ```

  - id: single
    title: single()
    description: |
      By default PostgREST returns all JSON results in an array, even when there is only one item. Use `single()` to return the object without the array.

      The query must match exactly one row. Otherwise the call throws a `PostgrestError` with code `PGRST116`.
    examples:
      - id: with-select
        name: With `select()`
        code: |
          ```swift
          try await supabase
            .from("instruments")
            .select("name")
            .limit(1)
            .single()
            .execute()
          ```
        data:
          sql: |
            ```sql
            create table
              instruments (id int8 primary key, name text);

            insert into
              instruments (id, name)
            values
              (1, 'violin'),
              (2, 'viola'),
              (3, 'cello');
            ```
        response: |
          ```json
          {
            "data": {
              "name": "violin"
            },
            "status": 200,
            "statusText": "OK"
          }
          ```
        hideCodeBlock: true
        isSpotlight: true

  - id: maybe-single
    title: maybeSingle()
    description: |
      Return at most one row. When no row matches, `value` is `nil`. Decode into an optional type to get the `nil`.
    notes: |
      - When more than one row matches, the call throws a `PostgrestError` with code `PGRST116` and status 406, the same error that `single()` throws.
      - `maybeSingle()` requests the usual JSON array and counts the rows in the client. On a write, such as `update(...).select().maybeSingle()`, every matched row is written before the count is checked. Use `single()` if PostgREST must roll back the write when more than one row matches.
    examples:
      - id: with-select
        name: With `select()`
        isSpotlight: true
        code: |
          ```swift
          let todo: Todo? = try await supabase
            .from("todos")
            .select()
            .eq("id", value: 42)
            .maybeSingle()
            .execute()
            .value
          ```

  - id: csv
    title: csv()
    examples:
