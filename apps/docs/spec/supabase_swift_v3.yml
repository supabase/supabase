    title: 'customProviders.list()'
    description: |
      List the custom providers.
    notes: |
      - Requires `secret` key.
      - Pass `type:` to list only the providers of one type.
    examples:
      - id: list-custom-providers
        name: List all custom providers
        isSpotlight: true
        code: |
          ```swift
          let providers = try await admin.customProviders.list()
          ```
      - id: list-oidc-custom-providers
        name: List the OIDC providers
        code: |
          ```swift
          let providers = try await admin.customProviders.list(type: .oidc)
          ```

  - id: admin-update-custom-provider
    title: 'customProviders.update(identifier:_:)'
    description: |
      Update a custom provider.
    notes: |
      - Requires `secret` key.
      - The server changes only the fields you set in `UpdateCustomProvider`.
      - When the issuer or discovery URL of an OIDC provider changes, the server fetches the discovery document again.
    examples:
      - id: update-custom-provider
        name: Update a custom provider
        isSpotlight: true
        code: |
          ```swift
          let provider = try await admin.customProviders.update(
            identifier: "custom:acme",
