openref: 0.1

info:
  id: reference/supabase-swift
  title: Supabase Swift Client
  description: |

    Supabase Swift v3 (alpha).

  specUrl: https://github.com/supabase/supabase/edit/master/apps/docs/spec/supabase_swift_v3.yml
  slugPrefix: '/'
  libraries:
    - id: 'Swift'
      version: '3.0.0-alpha.2'

functions:
  - id: initializing
    title: 'Initializing'
    description: |
      Create a `SupabaseClient` with your `Project URL` and your publishable key. You can find them in your project's `Project Settings` → `API Keys`.
      The Supabase client is your entrypoint to the rest of the Supabase functionality and is the easiest way to interact with everything we offer within the Supabase ecosystem.

      The initializer throws a `SupabaseClientError` when the URL has no scheme or no host, so call it with `try`. Create the client once and share it: it holds the session and the Realtime connection.
    notes: |
      - Use only a publishable key in an app. A secret key gives full access to your project, so keep it on a server.
      - Pass settings in a `SupabaseClient.Configuration`. It has one group for each module (`database`, `auth`, `functions`, `realtime`, `storage`) and a `global` group for all of them.
      - Debug builds log warnings and errors to stderr by default. Release builds stay silent.
    examples:
      - id: initialize-client
        name: Initialize Client
        code: |
          ```swift
          import Supabase

          let supabase = try SupabaseClient(
            supabaseURL: URL(string: "https://xyzcompany.supabase.co")!,
            supabaseKey: "your-publishable-key"
          )
          ```
      - id: initialize-client-custom-options
        name: Initialize Client with custom options
        code: |
          ```swift
          import Supabase

          let supabase = try SupabaseClient(
            supabaseURL: URL(string: "https://xyzcompany.supabase.co")!,
            supabaseKey: "your-publishable-key",
            configuration: SupabaseClient.Configuration(
              database: .init(
                schema: "public"
              ),
              auth: .init(
                storage: MyCustomAuthStorage() // conforms to AuthStorage
              ),
              global: .init(
                headers: [HTTPField.Name("x-my-custom-header")!: "my-app-name"],
                http: .init(transport: URLSessionTransport(session: URLSession.myCustomSession))
              )
            )
          )
          ```
        description: |
          Every field of `SupabaseClient.Configuration` is a `var`, so you can also build the value step by step:

          ```swift
          var configuration = SupabaseClient.Configuration()
          configuration.database.schema = "public"
          configuration.global.headers[HTTPField.Name("x-my-custom-header")!] = "my-app-name"

          let supabase = try SupabaseClient(
            supabaseURL: URL(string: "https://xyzcompany.supabase.co")!,
            supabaseKey: "your-publishable-key",
            configuration: configuration
          )
          ```
      - id: initialize-client-with-retries
        name: Initialize Client with automatic retries
        description: |
          PostgREST `GET` and `HEAD` requests automatically retry on a transient network failure, a 503, or a 520, up to three times, with jittered backoff. The client honors a `Retry-After` header. Retries are enabled by default and can be disabled per client.
        code: |
          ```swift
          import Supabase

          let supabase = try SupabaseClient(
            supabaseURL: URL(string: "https://xyzcompany.supabase.co")!,
            supabaseKey: "your-publishable-key",
            configuration: SupabaseClient.Configuration(
              database: .init(
                // Disable automatic retries for this client
                retryEnabled: false
              )
            )
          )
          ```
      - id: initialize-client-with-logging
        name: Initialize Client with Logging
        description: |
          The client logs through [swift-log](https://github.com/apple/swift-log). Add the `swift-log` package to your project and `import Logging` where you build the logger. One logger covers every module. Each entry carries a `system` metadata key (`auth`, `postgrest`, `storage`, `functions`, or `realtime`) that a `LogHandler` can filter on.

          To silence the debug-build default, pass `Logger(label: "com.example.app") { _ in SwiftLogNoOpLogHandler() }`.
        code: |
          ```swift
          import Logging
          import Supabase

          var logger = Logger(label: "com.example.app")
          logger.logLevel = .debug

          let supabase = try SupabaseClient(
            supabaseURL: URL(string: "https://xyzcompany.supabase.co")!,
            supabaseKey: "your-publishable-key",
            configuration: SupabaseClient.Configuration(
              global: .init(
                logger: logger
              )
            )
          )
          ```
      - id: initialize-client-with-custom-transport
        name: Initialize Client with a custom transport and middleware
        description: |
          Every module sends requests through one `ClientTransport`, behind an ordered list of `ClientMiddleware`. Set both in `global.http`. `URLSessionTransport(session:)` wraps your own `URLSession`. Middlewares run in array order on the way out and in reverse order on the way back. In a module that retries (Auth, PostgREST, Storage), they run once per attempt.

          The SDK sets the request timeout itself: 60 seconds, or 150 seconds for Edge Functions. `URLSessionConfiguration.timeoutIntervalForRequest` has no effect. Set `HTTPClientConfiguration(timeout:)` instead.
        code: |
          ```swift
          import Supabase

          struct AppVersionMiddleware: ClientMiddleware {
            func intercept(
              _ request: HTTPRequest,
              body: HTTPBody?,
              next: nonisolated(nonsending) @Sendable (HTTPRequest, HTTPBody?) async throws
                -> (HTTPResponse, HTTPBody?)
            ) async throws -> (HTTPResponse, HTTPBody?) {
              var request = request
              request.headerFields[HTTPField.Name("X-App-Version")!] = "2.1.0"
              return try await next(request, body)
            }
          }

          let supabase = try SupabaseClient(
            supabaseURL: URL(string: "https://xyzcompany.supabase.co")!,
            supabaseKey: "your-publishable-key",
            configuration: SupabaseClient.Configuration(
              global: .init(
                http: .init(
                  transport: URLSessionTransport(session: URLSession.myCustomSession),
                  middlewares: [AppVersionMiddleware()],
                  timeout: .seconds(30)
                )
              )
            )
          )
          ```
      - id: api-schemas
        name: With custom schemas
        code: |
          ```swift
          import Supabase

          let supabase = try SupabaseClient(
            supabaseURL: URL(string: "https://xyzcompany.supabase.co")!,
            supabaseKey: "your-publishable-key",
            configuration: SupabaseClient.Configuration(
              database: .init(
                // Provide a custom schema. Defaults to "public".
                schema: "other_schema"
              )
            )
          )
          ```
        description: |
          By default the API server points to the `public` schema. You can enable other database schemas within the Dashboard.
          Go to [Settings > API > Exposed schemas](/dashboard/project/_/settings/api) and add the schema which you want to expose to the API.

          Note: `database.schema` sets the default schema for the client. Use `supabase.schema(_:)` to query another exposed schema for one request.
      - id: initialize-client-with-opentelemetry
        name: Initialize Client with OpenTelemetry tracing
        description: |
          Supabase Swift supports W3C `traceparent` header propagation via an opt-in SwiftPM package trait.
          When enabled, the active OpenTelemetry span's trace context is automatically injected into every outgoing request across PostgREST, Storage, Auth, Functions, and Realtime — no additional runtime configuration needed.

          Enable the `OpenTelemetry` trait in your `Package.swift` dependency declaration:
        code: |
          ```swift
          // Package.swift
          .package(
            url: "https://github.com/supabase/supabase-swift.git",
            from: "3.0.0-alpha.2",
            traits: ["OpenTelemetry"]
          )
          ```
        notes: |
          - The trait is **off by default** — no OTel dependency is linked unless you opt in.
          - When no span is active, the header is not added; it is always safe to call unconditionally.
  - id: auth-api
    title: 'Overview'
    notes: |
      The auth methods can be accessed via the `supabase.auth` namespace.

      `AuthClient` is a `Sendable` class, not an actor. It reads the stored session asynchronously after the client is created. Until then, `status` is `.loading` and `currentSession` is `nil`. Call `await supabase.auth.initialization()` before you read `currentSession` at launch.

      ### Handling deep links

      Flows that leave the app, such as magic links, email confirmations, password resets, and OAuth links that you open yourself, return with a URL. Pass that URL to `handleRedirect(_:)`. It returns `nil` for a URL that is not an auth redirect. A URL is an auth redirect only when it opens the configured `redirectTo` or the `redirectTo` of a pending flow, so set `redirectTo` on the client configuration.

      `signInWithOAuth`, `signInWithSSO`, and `linkIdentity` show the provider page and finish the flow themselves. You do not need to handle their URLs.

      #### UIKit app lifecycle

      ```swift
      func application(
        _ app: UIApplication,
        open url: URL,
        options: [UIApplication.OpenURLOptionsKey: Any]
      ) -> Bool {
        Task {
          try await supabase.handleRedirect(url)
        }
        return true
      }
      ```

      #### UIKit app lifecycle with scenes

      In your `SceneDelegate.swift`:

      ```swift
      func scene(_ scene: UIScene, openURLContexts URLContexts: Set<UIOpenURLContext>) {
        guard let url = URLContexts.first?.url else { return }
        Task {
          try await supabase.handleRedirect(url)
        }
      }
      ```

      #### SwiftUI app lifecycle

      On the root view of your scene:

      ```swift
      SomeView()
        .onOpenURL { url in
          Task {
            try await supabase.handleRedirect(url)
          }
        }
      ```

      When the app also opens other deep links, check the URL first with `await supabase.auth.isAuthRedirect(url)`.

    examples:
      - id: create-auth-client
        name: Create auth client
        isSpotlight: true
        code: |
          ```swift
          let supabase = try SupabaseClient(
            supabaseURL: URL(string: "https://xyzcompany.supabase.co")!,
            supabaseKey: "your-publishable-key",
            configuration: .init(
              auth: .init(redirectTo: URL(string: "my-app-scheme://callback")!)
            )
          )
          let auth = supabase.auth
          ```
      - id: create-auth-client-with-custom-storage
        name: Create auth client with custom storage
        isSpotlight: true
        description: |
          A custom storage conforms to `AuthStorage`, whose `load(key:)`, `save(_:key:)`, and `remove(key:)` methods are `async`. `load(key:)` returns `nil` when no value is stored. When you omit `storage`, the client uses the Keychain on Apple platforms and memory on other platforms.
        code: |
          ```swift
          // An in-memory store. Replace the dictionary with your own storage.
          actor MyCustomStorage: AuthStorage {
            private var values: [String: Data] = [:]

            func load(key: String) async throws -> Data? { values[key] }
            func save(_ data: Data, key: String) async throws { values[key] = data }
            func remove(key: String) async throws { values[key] = nil }
          }

          let supabase = try SupabaseClient(
            supabaseURL: URL(string: "https://xyzcompany.supabase.co")!,
            supabaseKey: "your-publishable-key",
            configuration: .init(
              auth: .init(storage: MyCustomStorage())
            )
          )
          let auth = supabase.auth
          ```
  - id: sign-up
    title: 'signUp()'
    notes: |
      - By default, the user needs to verify their email address before logging in. To turn this off, disable **Confirm email** in [your project](/dashboard/project/_/auth/providers).
      - **Confirm email** determines if users need to confirm their email address after signing up.
        - If **Confirm email** is enabled, the method returns `.confirmationRequired(user)`.
        - If **Confirm email** is disabled, the method returns `.signedIn(session)`, stores the session, and emits `.signedIn`.
      - The result also has `user` and `session` properties. `session` is `nil` when the user must confirm first.
      - When the user confirms their email address, they are redirected to the [`SITE_URL`](/docs/guides/auth/redirect-urls) by default. You can modify your `SITE_URL` or add additional redirect URLs in [your project](/dashboard/project/_/auth/url-configuration).
      - If `signUp()` is called for an existing confirmed user:
        - When both **Confirm email** and **Confirm phone** (even when phone provider is disabled) are enabled in [your project](/dashboard/project/_/auth/providers), the method returns `.confirmationRequired` with an obfuscated/fake user object that has an empty `identities` list.
        - When either **Confirm email** or **Confirm phone** (even when phone provider is disabled) is disabled, the error message, `User already registered` is returned.
      - To fetch the currently signed-in user, use `user()`.
    overwriteParams:
      - name: email
        isOptional: true
        type: String
        description: One of `email` or `phone` must be provided.
      - name: phone
        isOptional: true
        type: String
        description: One of `email` or `phone` must be provided.
      - name: password
        type: String
      - name: options
        isOptional: true
        type: SignUpOptions
        description: >
          The user metadata (`userMetadata`, a `JSONObject`), the redirect URL embedded in the
          email link (`redirectTo`, email sign-up only), the messaging channel (`channel`, phone
          sign-up only), and the captcha token (`captchaToken`).
    examples:
      - id: sign-up
        name: Sign up with email and password
        isSpotlight: true
        code: |
          ```swift
          let result = try await supabase.auth.signUp(
            email: "example@email.com",
            password: "example-password"
          )

          switch result {
          case .signedIn(let session):
            print("Signed in as \(session.user.id)")
          case .confirmationRequired(let user):
            print("Check your inbox, \(user.email ?? "")")
          }
          ```
      - id: sign-up-phone
        name: Sign up with a phone number and password (SMS)
        isSpotlight: true
        code: |
          ```swift
          let result = try await supabase.auth.signUp(
            phone: "123456789",
            password: "example-password",
            options: SignUpOptions(channel: .sms)
          )
          ```
      - id: sign-up-phone-whatsapp
        name: Sign up with a phone number and password (whatsapp)
        isSpotlight: true
        description: |
          The user will be sent a WhatsApp message which contains a OTP. By default, a given user can only request a OTP once every 60 seconds. Note that a user will need to have a valid WhatsApp account that is linked to Twilio in order to use this feature.
        code: |
          ```swift
          let result = try await supabase.auth.signUp(
            phone: "123456789",
            password: "example-password",
            options: SignUpOptions(channel: .whatsapp)
          )
          ```
      - id: sign-up-with-additional-user-metadata
        name: Sign up with additional user metadata
        isSpotlight: false
        description: |
          The metadata is a `JSONObject`, which is `[String: JSONValue]`. The SDK sends its keys as you wrote them. It does not convert them to snake_case.
        code: |
          ```swift
          let result = try await supabase.auth.signUp(
            email: "example@email.com",
            password: "example-password",
            options: SignUpOptions(
              userMetadata: [
                "first_name": .string("John"),
                "age": .number(24)
              ]
            )
          )
          ```
      - id: sign-up-with-redirect
        name: Sign up with a redirect URL
        description: |
          - You can provide a default redirect URL when initializing the client.
          - See [redirect URLs and wildcards](/docs/guides/auth/redirect-urls#use-wildcards-in-redirect-urls) to add additional redirect URLs to your project.
          - Pass the URL that opens your app to `handleRedirect(_:)` to finish the sign-up.
        code: |
          ```swift
          let result = try await supabase.auth.signUp(
            email: "example@email.com",
            password: "example-password",
            options: SignUpOptions(
              redirectTo: URL(string: "https://example.com/welcome")!
            )
          )
          ```
  - id: on-auth-state-change
    title: 'events()'
    notes: |
      - Returns an `AsyncStream<AuthChange>` of important events occurring on the user's session. Each call returns a new stream.
      - The stream is registered when the call returns, so it misses no change. It finishes when your task is canceled or the client is released.
      - Each `AuthChange` has `event`, `session`, `status` (an `AuthStatus`), and `signOutReason`.
      - Events are delivered asynchronously. To read the state right after a call, use `supabase.auth.status` or `supabase.auth.currentSession`.
      - Emitted events:
        - `initialSession`
          - Emitted right after the client reads the initial session from storage.
          - The session can be expired. With `autoRefresh: .automatic`, the client tries one refresh of an expired session first, for at most `initialRefreshTimeout` (5 seconds by default). Check `session.isExpired()` in your handler.
        - `signedIn`
          - Emitted each time a user session is confirmed or re-established, including on user sign in.
          - Avoid making assumptions as to when this event is fired, this may occur even when the user is already signed in. Instead, check the user object attached to the event to see if a new user has signed in and update your application's UI.
        - `signedOut`
          - Emitted when the user signs out. This can be after:
            - A call to `supabase.auth.signOut()`.
            - After the user's session has expired for any reason:
              - User has signed out on another device.
              - The session has reached its timebox limit or inactivity timeout.
              - User has signed in on another device with single session per user enabled.
              - Check the [User Sessions](/docs/guides/auth/sessions) docs for more information.
          - `signOutReason` tells `.userInitiated` apart from `.sessionExpired`, `.sessionRevoked`, and `.sessionMissing`.
          - Use this to clean up any local storage your application has associated with the user.
        - `tokenRefreshed`
          - Emitted each time a new access and refresh token are fetched for the signed-in user.
          - With auto refresh, the client refreshes the session before the access token expires. The token in the event can still be expired when your handler runs, for example after the app resumes. When you need a session for a new request, call `try await supabase.auth.session()`.
          - The frequency of this event is related to the JWT expiry limit configured on your project.
        - `userUpdated`
          - Emitted each time `updateUser(_:redirectTo:)` or `linkIdentity` finishes successfully, after `unlinkIdentity(_:)` when the client can fetch the updated user, and when the signed-in user verifies an email or phone change. Listen to it to update your application's UI based on new profile information.
        - `passwordRecovery`
          - Emitted instead of the `signedIn` event when the user opens a password recovery link, or verifies a code with `verifyOTP` and type `.recovery`.
          - Use it to show a UI to the user where they can [reset their password](/docs/guides/auth/passwords#resetting-a-users-password-forgot-password).
        - `mfaChallengeVerified`
          - Emitted when the user verifies an MFA challenge.
    examples:
      - id: listen-to-auth-changes
        name: Listen to auth changes
        isSpotlight: true
        code: |
          ```swift
          for await change in supabase.auth.events() {
            print(change.event, change.session?.user.id as Any)
          }
          ```
        description: |
          - The loop runs until its task is canceled. To stop listening, cancel the task that runs the loop.
      - id: list-to-a-specific-event
        name: Listen to a specific event
        code: |
          ```swift
          for await change in supabase.auth.events() where change.event == .signedIn {
            // handle signIn event.
          }
          ```
      - id: listen-to-auth-changes-in-a-task
        name: Listen in a task and stop listening
        code: |
          ```swift
          let task = Task {
            for await change in supabase.auth.events() {
              if change.event == .signedOut {
                showSignIn()
              }
            }
          }

          // Later, stop listening.
          task.cancel()
          ```
  - id: auth-js-gotrueclient-initialize
    title: 'initialization()'
    notes: |
      - Returns once the client has read the stored session, so `status` is no longer `.loading`.
      - The client reads storage asynchronously after it is created. Until then, `currentSession` is `nil`. Call this method before you read `currentSession` or `currentUser` at launch.
      - When the client refreshes an expired stored session first, this method waits for that refresh too, for at most `initialRefreshTimeout`.
      - While storage cannot be read, for example after a launch into the background before the first unlock, this method waits until it can. It returns early when the calling task is canceled.
    examples:
      - id: wait-for-initial-session
        name: Wait for the initial session
        isSpotlight: true
        code: |
          ```swift
          await supabase.auth.initialization()

          if let session = supabase.auth.currentSession {
            print("Signed in as \(session.user.id)")
          }
          ```
  - id: sign-in-anonymously
    title: 'signInAnonymously()'
    notes: |
      - Returns the session of a new anonymous user.
      - It is recommended to set up captcha for anonymous sign-ins to prevent abuse. You can pass in the captcha token in the `captchaToken` param.
    examples:
      - id: sign-in-anonymously
        name: Create an anonymous user
        isSpotlight: true
        code: |
          ```swift
          let session = try await supabase.auth.signInAnonymously(captchaToken: captchaToken)
          ```
      - id: sign-in-anonymously-with-user-metadata
        name: Create an anonymous user with custom user metadata
        isSpotlight: false
        code: |
          ```swift
          let session = try await supabase.auth.signInAnonymously(
            userMetadata: ["theme": "dark"],
            captchaToken: captchaToken
          )
          ```
  - id: sign-in-with-password
    title: 'signIn()'
    notes: |
      - Requires either an email and password or a phone number and password.
      - Returns the new session, stores it, and emits `.signedIn`.
    overwriteParams:
      - name: email
        isOptional: true
        type: String
        description: One of `email` or `phone` must be provided.
      - name: phone
        isOptional: true
        type: String
        description: One of `email` or `phone` must be provided.
      - name: password
        type: String
      - name: captchaToken
        isOptional: true
        type: String
    examples:
      - id: sign-in-with-email-and-password
        name: Sign in with email and password
        isSpotlight: true
        code: |
          ```swift
          try await supabase.auth.signIn(
            email: "example@email.com",
            password: "example-password"
          )
          ```
      - id: sign-in-with-phone-and-password
        name: Sign in with phone and password
        isSpotlight: false
        code: |
          ```swift
          try await supabase.auth.signIn(
            phone: "+13334445555",
            password: "same-password"
          )
          ```
  - id: sign-in-with-otp
    title: 'signInWithOTP()'
    overwriteParams:
      - name: email
        isOptional: true
        type: String
        description: One of `email` or `phone` must be provided.
      - name: phone
        isOptional: true
        type: String
        description: One of `email` or `phone` must be provided.
      - name: options
        isOptional: true
        type: EmailOTPOptions | PhoneOTPOptions
        description: >
          `EmailOTPOptions` for an email: `shouldCreateUser`, `userMetadata`, `redirectTo` (the
          redirect URL embedded in the email link), and `captchaToken`.
          `PhoneOTPOptions` for a phone: `shouldCreateUser`, `userMetadata`, `channel` (`.sms` or
          `.whatsapp`), and `captchaToken`.
          When `shouldCreateUser` or `channel` is `nil`, the server applies its default: it
          creates the user, and it sends the code by SMS.
    notes: |
      - Requires either an email or phone number.
      - This method is used for passwordless sign-ins where a OTP is sent to the user's email or phone number.
      - If the user doesn't exist, `signInWithOTP()` will signup the user instead. To restrict this behavior, set `shouldCreateUser` to `false` in the options.
      - If you're using an email, you can configure whether you want the user to receive a magiclink or a OTP.
      - If you're using phone, you can configure whether you want the user to receive a OTP.
      - Pass a code to `verifyOTP()`. Pass the URL that a magic link opens to `handleRedirect(_:)`.
      - For a phone, the method returns the `MessageID?` that the SMS provider gave the message.
      - The magic link's destination URL is determined by the [`SITE_URL`](/docs/guides/auth/redirect-urls).
      - See [redirect URLs and wildcards](/docs/guides/auth/redirect-urls#use-wildcards-in-redirect-urls) to add additional redirect URLs to your project.
      - Magic links and OTPs share the same implementation. To send users a one-time code instead of a magic link, [modify the magic link email template](/dashboard/project/_/auth/templates) to include `{{ .Token }}` instead of `{{ .ConfirmationURL }}`.
      - See our [Twilio Phone Auth Guide](/docs/guides/auth/phone-login?showSmsProvider=Twilio) for details about configuring WhatsApp sign in.
    examples:
      - id: sign-in-with-email
        name: Sign in with email
        isSpotlight: true
        description: The user will be sent an email which contains either a magiclink or a OTP or both. By default, a given user can only request a OTP once every 60 seconds.
        code: |
          ```swift
          try await supabase.auth.signInWithOTP(
            email: "example@email.com",
            options: EmailOTPOptions(
              redirectTo: URL(string: "my-app-scheme://callback")!
            )
          )
          ```
      - id: sign-in-with-sms-otp
        name: Sign in with SMS OTP
        isSpotlight: false
        description: The user will be sent a SMS which contains a OTP. By default, a given user can only request a OTP once every 60 seconds.
        code: |
          ```swift
          try await supabase.auth.signInWithOTP(phone: "+13334445555")
          ```
      - id: sign-in-with-whatsapp-otp
        name: Sign in with WhatsApp OTP
        isSpotlight: false
        description: The user will be sent a WhatsApp message which contains a OTP. By default, a given user can only request a OTP once every 60 seconds. Note that a user will need to have a valid WhatsApp account that is linked to Twilio in order to use this feature.
        code: |
          ```swift
          try await supabase.auth.signInWithOTP(
            phone: "+13334445555",
            options: PhoneOTPOptions(channel: .whatsapp)
          )
          ```
  - id: sign-in-with-oauth
    title: 'signInWithOAuth()'
    overwriteParams:
      - name: provider
        type: Provider
        description: >
          The third-party provider. The first argument, without a label.
      - name: options
        type: OAuthOptions
        isOptional: true
        description: >
          `scopes` (an array of scopes to request), `redirectTo` (a URL to send the user to after
          they are confirmed), and `queryItems` (additional query items).
      - name: presenter
        type: WebAuthPresenter
        isOptional: true
        description: >
          Shows the provider page and returns the callback URL. The default on Apple platforms is
          `ASWebAuthenticationSessionPresenter`. On other platforms you must pass one.
    notes: |
      - This method is used for signing in using a third-party provider.
      - Supabase supports many different [third-party providers](https://supabase.com/docs/guides/auth#providers).
      - The client starts a PKCE flow, shows the provider page, exchanges the code from the callback URL, stores the session, and emits `.signedIn`.
      - The method needs a redirect URL: pass `redirectTo` in the options or set it on the client configuration. The URL must be in your project's redirect URLs.
      - A user who cancels gets a `CancellationError`.
    examples:
      - id: sign-in-using-ASWebAuthenticationSession
        name: Sign in with OAuth using ASWebAuthenticationSession
        isSpotlight: true
        description: |
          - The default presenter is `ASWebAuthenticationSessionPresenter`. Pass your own instance to set `prefersEphemeralWebBrowserSession`.
        code: |
          ```swift
          let session = try await supabase.auth.signInWithOAuth(
            .github,
            options: OAuthOptions(redirectTo: URL(string: "my-app-scheme://callback")!),
            presenter: ASWebAuthenticationSessionPresenter(prefersEphemeralWebBrowserSession: true)
          )
          ```

      - id: sign-in-using-generic-flow
        name: Sign in with OAuth and customize flow
        isSpotlight: true
        description: |
          - Use a `ClosurePresenter` to open the page another way. The closure gets the URL and the callback scheme, and returns the callback URL.
        code: |
          ```swift
          let session = try await supabase.auth.signInWithOAuth(
            .github,
            presenter: ClosurePresenter { url, callbackScheme in
              // use url to start OAuth flow
              // and return the callback URL that contains the auth code.
              // ...
              return resultURL
            }
          )
          ```

      - id: sign-in-using-manual-implementation
        name: Sign in using a third-party provider
        isSpotlight: true
        description: |
          - `oauthSignInURL()` starts a flow and returns an `OAuthFlow` with the `url` to open and the flow `id`.
          - The `redirectTo` URL needs to be setup correctly in your project under Authentication -> URL Configuration -> Redirect URLs.
          - Pass the callback URL to `handleRedirect(_:)`, or pass the code and `flow.id` to `exchangeCodeForSession(_:flowID:)`.
        code: |
          ```swift
          let flow = try await supabase.auth.oauthSignInURL(
            .github,
            options: OAuthOptions(redirectTo: URL(string: "my-app-scheme://callback")!)
          )

          // Open flow.url with your preferred method.
          // When the app opens with the callback URL:
          try await supabase.auth.handleRedirect(callbackURL)
          ```

      - id: sign-in-with-scopes
        name: Sign in with scopes
        isSpotlight: false
        description: |
          If you need additional data from an OAuth provider, you can include a list of scopes in your request to get back an OAuth provider token.
          You may also need to specify the scopes in the provider's OAuth app settings, depending on the provider. The list of scopes will be documented by the third-party provider you are using and specifying scopes will enable you to use the OAuth provider token to call additional APIs supported by the third-party provider to get more information.
        code: |
          ```swift
          let session = try await supabase.auth.signInWithOAuth(
            .github,
            options: OAuthOptions(scopes: ["repo", "gist", "notifications"])
          )
          ```
  - id: sign-in-with-id-token
    title: 'signInWithIDToken()'
    notes: |
      - Signs in with an ID token that a third-party identity provider issued, such as Sign in with Apple or Google Sign-In. The server checks the token and creates the user if needed.
      - Generate a `Nonce` for each attempt. Send `nonce.hashed` to the provider and pass `nonce.raw` to the server.
    examples:
      - id: sign-in-with-id-token
        name: 'Sign In using ID Token'
        description: Use this method to implement native Sign In With Apple.
        code: |
          ```swift
          let nonce = Nonce.generate()
          // Pass nonce.hashed to the provider, for example as request.nonce
          // in SignInWithAppleButton.

          let session = try await supabase.auth.signInWithIDToken(
            IDTokenCredentials(
              provider: .apple,
              idToken: "your-id-token",
              nonce: nonce.raw
            )
          )
          ```
  - id: sign-in-with-sso
    title: 'signInWithSSO()'
    overwriteParams:
      - name: target
        type: SSOTarget
        description: >
          `.domain(String)`, the domain name of the organization to use SSO with, or
          `.providerID(UUID)`, the UUID of the SSO provider.
      - name: options
        isOptional: true
        type: SSOOptions
        description: >
          `redirectTo`, the URL to redirect the user to after they have signed in, which must be
          a configured redirect URL for your Supabase instance, and `captchaToken`.
      - name: presenter
        isOptional: true
        type: WebAuthPresenter
        description: >
          Shows the identity provider page. The default on Apple platforms is
          `ASWebAuthenticationSessionPresenter`. On other platforms you must pass one.
    notes: |
      - Before you can call this method you need to [establish a connection](/docs/guides/auth/enterprise-sso/auth-sso-saml#managing-saml-20-connections) to an identity provider. Use the [CLI commands](/docs/reference/cli/supabase-sso) to do this.
      - The client shows the identity provider page, exchanges the code, stores the session, and emits `.signedIn`.
      - If you've associated an email domain to the identity provider, you can use `.domain` to start a sign-in flow.
      - In case you need to use a different way to start the authentication flow with an identity provider, you can use `.providerID`. For example:
          - Mapping specific user email addresses with an identity provider.
          - Using different hints to identity the identity provider to be used by the user, like a company-specific page, IP address or other tracking information.
      - To show the page yourself, use `ssoSignInURL(_:options:)`. It returns an `OAuthFlow` with the URL to open.
    examples:
      - id: sign-in-with-domain
        name: Sign in with email domain
        isSpotlight: true
        code: |
          ```swift
          // You can extract the user's email domain and use it to trigger the
          // authentication flow with the correct identity provider.

          let session = try await supabase.auth.signInWithSSO(
            .domain("company.com"),
            options: SSOOptions(redirectTo: URL(string: "my-app-scheme://callback")!)
          )
          ```
      - id: sign-in-with-provider-uuid
        name: Sign in with provider UUID
        isSpotlight: true
        code: |
          ```swift
          // Useful when you need to map a user's sign in request according
          // to different rules that can't use email domains.

          let session = try await supabase.auth.signInWithSSO(
            .providerID(UUID(uuidString: "21648a9d-8d5a-4555-a9d1-d6375dc14e92")!)
          )
          ```
  - id: sign-in-with-web3
    title: 'signInWithWeb3()'
    description: |
      Signs in a user via a signed Sign in with Ethereum (EIP-4361) or Sign in with Solana message.
    notes: |
      - Supports Ethereum (Sign-In with Ethereum) and Solana (Sign-In with Solana), both of which derive from the [EIP-4361](https://eips.ethereum.org/EIPS/eip-4361) standard.
      - Your app is responsible for building the message and obtaining the signature from the user's wallet (e.g. via a WalletConnect session or native wallet SDK) before calling this method.
      - For `Web3Chain.ethereum` the signature is a `0x`-prefixed hex encoded string. For `Web3Chain.solana` it is a base64 encoded string.
      - Pass a captcha token with `Web3Credentials(captchaToken:)`.
    examples:
      - id: sign-in-with-ethereum
        name: Sign in with an Ethereum wallet
        isSpotlight: true
        description: |
          Sign the EIP-4361 message with the user's Ethereum wallet, then pass the message and its hex encoded signature.
        code: |
          ```swift
          let session = try await supabase.auth.signInWithWeb3(
            Web3Credentials(
              chain: .ethereum,
              message: siweMessage,
              signature: signatureHex
            )
          )
          ```
      - id: sign-in-with-solana
        name: Sign in with a Solana wallet
        description: |
          Sign the message with the user's Solana wallet, then pass the message and its base64 encoded signature.
        code: |
          ```swift
          let session = try await supabase.auth.signInWithWeb3(
            Web3Credentials(
              chain: .solana,
              message: siwsMessage,
              signature: signatureBase64
            )
          )
          ```
  - id: sign-in-with-passkey
    title: 'passkeys.signIn()'
    notes: |
      Signs the user in with a passkey (WebAuthn). Available on Apple platforms except watchOS.

      - Drives the full WebAuthn ceremony end to end: fetches assertion options from the server, presents the native passkey UI via `AuthenticationServices`, and verifies the assertion.
      - Does not require an existing session. On success the session is persisted and a `signedIn` auth change event is emitted.
      - `anchor` is the window to show the sheet from. `nil` uses the app's key window. An app extension has no key window, so pass one there.
      - A user who dismisses the sheet gets a `CancellationError`.
      - For lower-level control, use `passkeys.authenticationOptions()` + `passkeys.verifyAuthentication(challengeID:credential:)` instead.
      - The app's Associated Domains entitlement must list `webcredentials:<rpID>`.
      - Passkey support is **experimental**. Opt in with `@_spi(Experimental) import Supabase`. The API may change in future releases.
      - Passkeys must be enabled for your project in the Dashboard under Authentication → Passkeys.
    examples:
      - id: sign-in-with-passkey
        name: Sign in with a passkey
        isSpotlight: true
        code: |
          ```swift
          // Must opt in: @_spi(Experimental) import Supabase
          let session = try await supabase.auth.passkeys.signIn()
          let user = session.user
          ```
  - id: register-passkey
    title: 'passkeys.register()'
    notes: |
      Registers a new passkey (WebAuthn credential) for the signed-in user. Available on Apple platforms except watchOS.

      - Drives the full WebAuthn ceremony end to end: fetches creation options from the server, presents the native passkey registration UI, and stores the credential.
      - Requires an authenticated, non-anonymous user.
      - Returns the stored passkey as a `PasskeyListItem`. The server names the passkey after the authenticator. Change the name with `passkeys.rename(id:friendlyName:)`.
      - `anchor` is the window to show the sheet from. `nil` uses the app's key window.
      - For lower-level control, use `passkeys.registrationOptions()` + `passkeys.verifyRegistration(challengeID:credential:)` instead.
      - Passkey support is **experimental**. Opt in with `@_spi(Experimental) import Supabase`.
    examples:
      - id: register-passkey
        name: Register a passkey for the current user
        isSpotlight: true
        code: |
          ```swift
          // Must opt in: @_spi(Experimental) import Supabase
          let passkey = try await supabase.auth.passkeys.register()
          print("Registered passkey \(passkey.id)")
          ```
  - id: sign-out
    title: 'signOut()'
    notes: |
      - The default scope is `.local`. It signs out this device only. The user's sessions on other devices stay.
      - `.local` removes the session, clears pending PKCE flows, and emits `.signedOut` before the request, so the device is signed out whatever the server answers.
      - `.global` ends every session of the user. The client removes the local session only after the server ended them. When the request fails, the session stays and the method throws.
      - `.others` ends every other session of the user and keeps this one. It throws an error of kind `.sessionMissing` when no session is stored.
      - With no stored session, `.local` and `.global` still emit `.signedOut`.
    examples:
      - id: sign-out
        name: Sign out (this device)
        isSpotlight: true
        code: |
          ```swift
          try await supabase.auth.signOut()
          ```
      - id: sign-out-all-sessions
        name: Sign out (all sessions)
        code: |
          ```swift
          try await supabase.auth.signOut(scope: .global)
          ```
      - id: sign-out-other-sessions
        name: Sign out (other sessions)
        code: |
          ```swift
          try await supabase.auth.signOut(scope: .others)
          ```
  - id: reset-password-for-email
    title: 'resetPassword()'
    notes: |
      - Sends a password reset email. The email holds a link, or a code when the template uses `{{ .Token }}`.
      - Pass the URL that the link opens to `handleRedirect(_:)`. It returns `.signedIn(_, verification: .recovery)`.
      - Or pass the code to `verifyOTP(email:token:type:)` with type `.recovery`.
      - Both sign the user in and emit `.passwordRecovery`. Then set the new password with `updateUser(_:redirectTo:)`.
      - The call succeeds for an unknown email too, so it does not show which addresses have an account.
    overwriteParams:
      - name: email
        type: String
      - name: options
        isOptional: true
        type: ResetPasswordOptions
        description: >
          `redirectTo`, the URL that the reset link opens, and `captchaToken`.
    examples:
      - id: reset-password
        name: Reset password
        isSpotlight: true
        code: |
          ```swift
          try await supabase.auth.resetPassword(
            email: "example@email.com",
            options: ResetPasswordOptions(
              redirectTo: URL(string: "my-app-scheme://callback")!
            )
          )
          ```
      - id: reset-password-handle-redirect
        name: Show the update password screen
        description: |
          React to the redirect result, or to the `.passwordRecovery` event, to show a screen where the user sets a new password.
        code: |
          ```swift
          .onOpenURL { url in
            Task {
              if case .signedIn(_, verification: .recovery)? = try await supabase.handleRedirect(url) {
                isPasswordRecovery = true
              }
            }
          }

          // Then, when the user submits the new password:
          try await supabase.auth.updateUser(UpdateUser(password: newPassword))
          ```
  - id: verify-otp
    title: 'verifyOTP()'
    overwriteParams:
      - name: email
        isOptional: true
        type: String
        description: One of `phone`, `email`, or `tokenHash` must be provided.
      - name: phone
        isOptional: true
        type: String
        description: One of `phone`, `email`, or `tokenHash` must be provided.
      - name: tokenHash
        isOptional: true
        type: String
        description: >
          The token hash from the user's email link.
          One of `phone`, `email`, or `tokenHash` must be provided.
      - name: type
        type: EmailOTPType | PhoneOTPType
      - name: token
        isOptional: true
        type: String
        description: The OTP sent to the user. Required if using `phone` or `email`.
    notes: |
      - The `verifyOTP` method takes in different verification types. If a phone number is used, the type can either be `.sms` or `.phoneChange`. If an email address or a token hash is used, the type can be one of the following: `.signup`, `.magiclink`, `.recovery`, `.invite`, `.emailChange`, or `.email`.
      - The verification type used should be determined based on the corresponding auth method called before `verifyOTP` to sign up / sign-in a user.
      - `verifyOTP(phone:token:type:)` returns the `Session`. `verifyOTP(email:token:type:)` and `verifyOTP(tokenHash:type:)` return a `VerifyOTPResult`: `.signedIn(session)`, or `.emailChangePending(message:)` for the first confirmation of a secure email change.
      - The event follows the type: `.passwordRecovery` for `.recovery`, `.userUpdated` for an email or phone change of the signed-in user, and `.signedIn` otherwise.
      - The call signs in the account that owns the code and replaces the current session. When a user is signed in already, ask them to confirm first.
    examples:
      - id: verify-sms-one-time-password(otp)
        name: Verify Sms One-Time Password (OTP)
        isSpotlight: true
        code: |
          ```swift
          let session = try await supabase.auth.verifyOTP(
            phone: "+13334445555",
            token: "123456",
            type: .sms
          )
          ```
      - id: verify-signup-one-time-password(otp)
        name: Verify Signup One-Time Password (OTP)
        isSpotlight: false
        code: |
          ```swift
          let result = try await supabase.auth.verifyOTP(
            email: "example@example-email.com",
            token: "123456",
            type: .signup
          )
          ```
      - id: verify-email-auth(tokenhash)
        name: Verify Email Auth (Token Hash)
        isSpotlight: false
        code: |
          ```swift
          switch try await supabase.auth.verifyOTP(tokenHash: tokenHash, type: .emailChange) {
          case .signedIn(let session):
            print(session.user.email ?? "")
          case .emailChangePending(let message):
            print(message)
          }
          ```
  - id: get-session
    title: 'session()'
    description: |
      - Returns the session, refreshing it first when its access token expires in less than 30 seconds.
      - Throws an `AuthError` of kind `.sessionMissing` when no session is stored, and of kind `.sessionInvalidated` when the server rejects the refresh of an expired session.
      - With `autoRefresh: .disabled`, it throws an error of kind `.refreshDisabled` when the session is expired.
    examples:
      - id: get-the-session-data
        name: Get the session data
        isSpotlight: true
        code: |
          ```swift
          let session = try await supabase.auth.session()
          ```
      - id: get-current-session-no-validation
        name: Get the current session without validation
        isSpotlight: true
        description: |
          Reading `currentSession` does no I/O, so the session may be expired. It is `nil` until the client has read storage. Call `await supabase.auth.initialization()` first at launch.
        code: |
          ```swift
          let session = supabase.auth.currentSession
          ```
  - id: get-user
    title: 'user()'
    description: |
      - This method validates the user's access token JWT on the server and returns the authenticated user. It does not check what the user can do. Your RLS policies and endpoints do that.
      - Fetches the user object from the database instead of local session.
      - Should be used only when you require the most current user data. For faster results, `currentUser` is recommended.
      - `user()` sends the access token of the current session and refreshes it first when it has expired. `user(jwt:)` sends the token you pass as is.
    examples:
      - id: get-the-logged-in-user-with-the-current-existing-session
        name: Get the logged in user with the current existing session
        isSpotlight: true
        code: |
          ```swift
          let user = try await supabase.auth.user()
          ```
      - id: get-the-logged-in-user-with-a-custom-access-token-jwt
        name: Get the logged in user with a custom access token jwt
        isSpotlight: false
        code: |
          ```swift
          let user = try await supabase.auth.user(jwt: "custom-jwt")
          ```
      - id: get-current-user
        name: Get current user
        isSpotlight: true
        description: The user returned by this property may be outdated.
        code: |
          ```swift
          let user = supabase.auth.currentUser
          ```
  - id: update-user
    title: 'updateUser()'
    notes: |
      - In order to use the `updateUser()` method, the user needs to be signed in first.
      - Returns the updated `User`, merges it into the current session, and emits `.userUpdated`.
      - By default, email updates sends a confirmation link to both the user's current and new email.
      To only send a confirmation link to the user's new email, disable **Secure email change** in your project's [email auth provider settings](https://supabase.com/dashboard/project/_/auth/providers).
      - An email change starts a PKCE flow. Pass the URL that the confirmation link opens to `handleRedirect(_:)`.
      - The SDK sends the keys of `userMetadata` as you wrote them. It does not convert them to snake_case.
    examples:
      - id: update-the-email-for-an-authenticated-user
        name: Update the email for an authenticated user
        description: Sends a "Confirm Email Change" email to the new email address.
        isSpotlight: false
        code: |
          ```swift
          try await supabase.auth.updateUser(
            UpdateUser(email: "new@email.com"),
            redirectTo: URL(string: "my-app-scheme://callback")!
          )
          ```
        response: |
          ```json
          {
            "id": "11111111-1111-1111-1111-111111111111",
            "aud": "authenticated",
            "role": "authenticated",
            "email": "example@email.com",
            "email_confirmed_at": "2024-01-01T00:00:00Z",
            "phone": "",
            "confirmed_at": "2024-01-01T00:00:00Z",
            "new_email": "new@email.com",
            "email_change_sent_at": "2024-01-01T00:00:00Z",
            "last_sign_in_at": "2024-01-01T00:00:00Z",
            "app_metadata": {
              "provider": "email",
              "providers": [
                "email"
              ]
            },
            "user_metadata": {
              "email": "example@email.com",
              "email_verified": false,
              "phone_verified": false,
              "sub": "11111111-1111-1111-1111-111111111111"
            },
            "identities": [
              {
                "identity_id": "22222222-2222-2222-2222-222222222222",
                "id": "11111111-1111-1111-1111-111111111111",
                "user_id": "11111111-1111-1111-1111-111111111111",
                "identity_data": {
                  "email": "example@email.com",
                  "email_verified": false,
                  "phone_verified": false,
                  "sub": "11111111-1111-1111-1111-111111111111"
                },
                "provider": "email",
                "last_sign_in_at": "2024-01-01T00:00:00Z",
                "created_at": "2024-01-01T00:00:00Z",
                "updated_at": "2024-01-01T00:00:00Z",
                "email": "example@email.com"
              }
            ],
            "created_at": "2024-01-01T00:00:00Z",
            "updated_at": "2024-01-01T00:00:00Z",
            "is_anonymous": false
          }
          ```
      - id: update-the-phone-for-an-authenticated-user
        name: Update the phone number for an authenticated user
        description: Sends a one-time password (OTP) to the new phone number.
        isSpotlight: false
        code: |
          ```swift
          try await supabase.auth.updateUser(
            UpdateUser(phone: "123456789")
          )
          ```
      - id: update-the-password-for-an-authenticated-user
        name: Update the password for an authenticated user
        isSpotlight: false
        code: |
          ```swift
          try await supabase.auth.updateUser(UpdateUser(password: "newPassw0rd?"))
          ```
      - id: update-the-users-metadata
        name: Update the user's metadata
        isSpotlight: true
        code: |
          ```swift
          try await supabase.auth.updateUser(
            UpdateUser(
              userMetadata: [
                "hello": .string("world")
              ]
            )
          )
          ```
      - id: update-password-with-reauthentication
        name: Update the user's password with a nonce
        description: |
          If **Secure password change** is enabled in your [project's email provider settings](/dashboard/project/_/auth/providers), updating the user's password would require a nonce if the user **hasn't recently signed in**. The nonce is sent to the user's email or phone number. A user is deemed recently signed in if the session was created in the last 24 hours.
        isSpotlight: true
        code: |
          ```swift
          try await supabase.auth.updateUser(
            UpdateUser(
              password: "new password",
              nonce: "123456"
            )
          )
          ```
  - id: get-user-identities
    title: 'identities()'
    notes: |
      - The user needs to be signed in to call `identities()`.
      - The method fetches the user from the server and returns its identities.
      - `UserIdentity.id` is the Supabase identity UUID (`identity_id` in JSON). The user's ID at the provider is `providerUserID`.
    examples:
      - id: get-user-identities
        name: Returns a list of identities linked to the user
        isSpotlight: true
        code: |
          ```swift
          let identities = try await supabase.auth.identities()
          ```
  - id: link-identity
    title: 'linkIdentity()'
    notes: |
      - The **Enable Manual Linking** option must be enabled from your [project's authentication settings](/dashboard/project/_/auth/providers).
      - The user needs to be signed in to call `linkIdentity()`.
      - If the candidate identity is already linked to the existing user or another user, `linkIdentity()` will fail.
      - The client shows the provider page with a presenter, exchanges the code, stores the new session, and emits `.userUpdated`. It returns the new `Session`.
      - To show the page yourself, use `linkIdentityURL(_:options:)`. It returns an `OAuthFlow` with the URL to open.
    examples:
      - id: link-identity
        name: Link an identity to a user
        isSpotlight: true
        code: |
          ```swift
          let session = try await supabase.auth.linkIdentity(
            .google,
            options: OAuthOptions(redirectTo: URL(string: "my-app-scheme://callback")!)
          )
          ```
        description: |
          On Apple platforms, the default presenter is `ASWebAuthenticationSessionPresenter`. On other platforms, pass a presenter.
      - id: link-identity-custom-urlopener
        name: Link an identity to a user with custom URL opening logic
        isSpotlight: true
        code: |
          ```swift
          let session = try await supabase.auth.linkIdentity(
            .google,
            presenter: ClosurePresenter { url, callbackScheme in
              // custom URL opening logic
              // return the callback URL
              return resultURL
            }
          )
          ```
  - id: link-identity-with-id-token
    title: 'linkIdentity(idToken:)'
    notes: |
      - The **Enable Manual Linking** option must be enabled from your [project's authentication settings](/dashboard/project/_/auth/providers).
      - The user needs to be signed in to call `linkIdentity(idToken:)`.
      - If the candidate identity is already linked to the existing user or another user, `linkIdentity(idToken:)` will fail.
      - This method allows you to link an OIDC identity using an ID token obtained from a provider like Apple, Google, etc.
      - The client stores the returned session and emits `.userUpdated`.
    examples:
      - id: link-identity-with-id-token
        name: Link an OIDC identity using an ID token
        isSpotlight: true
        code: |
          ```swift
          try await supabase.auth.linkIdentity(
            idToken: IDTokenCredentials(
              provider: .apple,
              idToken: idToken
            )
          )
          ```
        description: |
          Link an OpenID Connect identity to the current user using an ID token. This is useful when you've obtained an ID token from a provider's SDK (like Sign in with Apple) and want to link it to the current user's account.
      - id: link-identity-with-id-token-and-nonce
        name: Link an OIDC identity with nonce
        code: |
          ```swift
          let nonce = Nonce.generate()
          // Pass nonce.hashed to the provider.

          try await supabase.auth.linkIdentity(
            idToken: IDTokenCredentials(
              provider: .apple,
              idToken: idToken,
              nonce: nonce.raw
            )
          )
          ```
        description: |
          For providers that support nonce verification (like Apple), you can include the nonce used during authentication.
  - id: unlink-identity
    title: 'unlinkIdentity()'
    notes: |
      - The **Enable Manual Linking** option must be enabled from your [project's authentication settings](/dashboard/project/_/auth/providers).
      - The user needs to be signed in to call `unlinkIdentity()`.
      - The user must have at least 2 identities in order to unlink an identity.
      - The identity to be unlinked must belong to the user.
      - After the unlink, the client fetches the user from the server, stores it in `currentUser`, and emits `.userUpdated`.
      - If that fetch fails, the unlink still succeeds, but `currentUser` keeps the old identities and no `.userUpdated` is emitted. Call `user()` to read the identities again. Do not retry the unlink.
    examples:
      - id: unlink-identity
        name: Unlink an identity
        isSpotlight: true
        code: |
          ```swift
          // retrieve all identities linked to a user
          let identities = try await supabase.auth.identities()

          // find the google identity
          if let googleIdentity = identities.first(where: { $0.provider == .google }) {
            // unlink the google identity
            try await supabase.auth.unlinkIdentity(googleIdentity)
          }
          ```
  - id: send-password-reauthentication
    title: 'reauthenticate()'
    notes: |
      - This method is used together with `updateUser(_:redirectTo:)` when a user's password needs to be updated.
      - If you require your user to reauthenticate before updating their password, you need to enable the **Secure password change** option in your [project's email provider settings](/dashboard/project/_/auth/providers).
      - A user is only require to reauthenticate before updating their password if **Secure password change** is enabled and the user **hasn't recently signed in**. A user is deemed recently signed in if the session was created in the last 24 hours.
      - This method will send a nonce to the user's email. If the user doesn't have a confirmed email address, the method will send the nonce to the user's confirmed phone number instead.
      - Pass the nonce as `UpdateUser(nonce:)`.
    examples:
      - id: send-reauthentication-nonce
        name: Send reauthentication nonce
        description: Sends a reauthentication nonce to the user's email or phone number.
        isSpotlight: true
        code: |
          ```swift
          try await supabase.auth.reauthenticate()
          ```
  - id: resend-email-or-phone-otps
    title: 'resend()'
    notes: |
      - Resends a signup confirmation, email change, or phone change email to the user.
      - Passwordless sign-ins can be resent by calling the `signInWithOTP()` method again.
      - Password recovery emails can be resent by calling the `resetPassword(email:options:)` method again.
      - This method only resends an email or phone OTP to the user if there an initial signup, email change, or phone change request was made.
      - You can specify a redirect URL when you resend an email link with `ResendEmailOptions(redirectTo:)`.
      - The phone variant returns the `MessageID?` that the SMS provider gave the message.
    examples:
      - id: resend-email-signup-confirmation
        name: Resend an email signup confirmation
        description: Resends the email signup confirmation to the user
        isSpotlight: true
        code: |
          ```swift
          try await supabase.auth.resend(
            email: "email@example.com",
            type: .signup,
            options: ResendEmailOptions(
              redirectTo: URL(string: "my-app-scheme://callback")!
            )
          )
          ```
      - id: resend-phone-signup-confirmation
        name: Resend a phone signup confirmation
        description: Resends the phone signup confirmation email to the user
        code: |
          ```swift
          try await supabase.auth.resend(
            phone: "1234567890",
            type: .sms
          )
          ```
      - id: resend-email-change-email
        name: Resend email change email
        description: Resends the email change email to the user
        code: |
          ```swift
          try await supabase.auth.resend(
            email: "email@example.com",
            type: .emailChange
          )
          ```
      - id: resend-phone-change
        name: Resend phone change OTP
        description: Resends the phone change OTP to the user
        code: |
          ```swift
          try await supabase.auth.resend(
            phone: "1234567890",
            type: .phoneChange
          )
          ```
  - id: set-session
    title: 'importSession()'
    notes: |
      - `importSession()` signs in with a session your app got outside this client, such as tokens that a tvOS app receives from a sign-in on another device.
      - The client reads the expiry from the access token. When the token has expired, it uses the refresh token to get a new session. Otherwise it fetches the user with the access token.
      - The client stores the session and emits `.signedIn` once. When a request fails, the stored session stays as it was.
      - The refresh token can only be used once to obtain a new session.
      - [Refresh token rotation](/docs/guides/local-development/cli/config#auth.enable_refresh_token_rotation) is enabled by default on all projects to guard against replay attacks.
      - You can configure the [`REFRESH_TOKEN_REUSE_INTERVAL`](/docs/guides/local-development/cli/config#auth.refresh_token_reuse_interval) which provides a short window in which the same refresh token can be used multiple times in the event of concurrency or offline issues.
    examples:
      - id: refresh-the-session
        name: Import a session
        description: Signs in with the access and refresh tokens and returns the stored session, or throws an error if the tokens are invalid.
        isSpotlight: true
        code: |
          ```swift
          let session = try await supabase.auth.importSession(
            accessToken: "access_token",
            refreshToken: "refresh_token"
          )
          ```
  - id: refresh-session
    title: 'refreshSession()'
    notes: |
      - This method will refresh the stored session whether the current one is expired or not.
      - When a concurrent refresh or sign-in already replaced the session with a valid one, it returns that session without a request.
      - The client runs one refresh at a time. When a refresh fails, a new refresh with the same token in the next 60 seconds throws the same error without a request.
      - A rejected refresh does not sign out while the access token is still valid. Wait for the `.signedOut` event instead of treating the error as a sign-out.
      - To sign in with a refresh token from elsewhere, use `importSession(accessToken:refreshToken:)`.
    examples:
      - id: refresh-session-using-the-current-session
        name: Refresh session using the current session
        isSpotlight: true
        code: |
          ```swift
          let session = try await supabase.auth.refreshSession()
          ```
      - id: refresh-session-if-needed
        name: Refresh the session only when needed
        isSpotlight: false
        description: |
          `refreshSessionIfNeeded()` refreshes when less than half of the session's lifetime is left, and returns `nil` when no user is signed in. Call it from a `BGAppRefreshTask` handler.
        code: |
          ```swift
          let session = try await supabase.auth.refreshSessionIfNeeded()
          ```

  - id: get-claims
    title: 'claims()'
    notes: |
      - Verifies a JWT and extracts its claims. Returns `VerifiedClaims`, with typed properties such as `subject`, `email`, `role`, `sessionID`, and `expiresAt`.
      - `claims()` verifies the access token of the current session, and refreshes an expired session first. `claims(jwt:)` verifies the token you pass.
      - A token signed with an asymmetric key (such as ES256 or RS256) that names its key in the `kid` header is verified on the device against the project's JSON Web Key Set.
      - The Auth server verifies every other token through `user(jwt:)`: a token signed with a symmetric key (HS256), a token without a `kid`, and a token whose key the client cannot find.
      - Each client caches the JSON Web Key Set for 10 minutes. A token whose key is not in the cache triggers a new fetch, so rotated keys resolve at once.
      - A token without an `exp` or `sub` claim fails verification. The anon key and the service role key have no `sub`, so `claims(jwt:)` rejects them.
    overwriteParams:
      - name: jwt
        isOptional: true
        type: String
        description: >
          The JWT to verify. Use `claims(options:)` to verify the access token from the current session.
      - name: options
        isOptional: true
        type: ClaimsOptions
        description: >
          Options for JWT verification. Can specify `allowsExpired` to skip expiration check and `jwks` to provide custom JSON Web Key Set.
    examples:
      - id: get-claims-current-session
        name: Verify and get claims from current session
        isSpotlight: true
        code: |
          ```swift
          let claims = try await supabase.auth.claims()
          print("User ID: \(claims.subject)")
          print("Email: \(claims.email ?? "N/A")")
          print("Role: \(claims.role ?? "N/A")")
          ```
      - id: get-claims-custom-jwt
        name: Verify and get claims from a specific JWT
        isSpotlight: false
        code: |
          ```swift
          let customToken = "eyJhbGci..."
          let claims = try await supabase.auth.claims(jwt: customToken)
          ```
      - id: get-claims-allow-expired
        name: Get claims from an expired JWT
        description: Useful for testing or extracting information from expired tokens.
        isSpotlight: false
        code: |
          ```swift
          let claims = try await supabase.auth.claims(
            options: ClaimsOptions(allowsExpired: true)
          )
          ```
      - id: get-claims-custom-jwks
        name: Verify JWT with custom JWKS
        description: Provide a custom JSON Web Key Set for verification.
        isSpotlight: false
        code: |
          ```swift
          let customJWKS = JWKS(keys: myKeys)
          let claims = try await supabase.auth.claims(
            options: ClaimsOptions(jwks: customJWKS)
          )
          ```

  - id: start-auto-refresh
    title: 'startAutoRefresh()'
    description: |
      Resumes the automatic session refresh process after `stopAutoRefresh()`.
    notes: |
      - With `autoRefresh: .automatic`, the default, auto refresh starts when the client is created, on every platform. Call this method only after `stopAutoRefresh()`.
      - Under `.manual` and `.disabled`, this method does nothing.
      - The client refreshes the session 90 seconds before the access token expires, and retries a failed refresh with a capped exponential backoff.
      - On iOS, iPadOS, tvOS, visionOS, Mac Catalyst, and watchOS, auto refresh pauses while the app is in the background and resumes when it returns to the foreground.
      - Calls to this method and to `stopAutoRefresh()` take effect in order. Each returns once its call took effect.
    examples:
      - id: start-auto-refresh
        name: Start automatic session refresh
        isSpotlight: true
        code: |
          ```swift
          await supabase.auth.startAutoRefresh()
          ```

  - id: stop-auto-refresh
    title: 'stopAutoRefresh()'
    description: |
      Stops the automatic session refresh process until the next `startAutoRefresh()`.
    notes: |
      - A return to the foreground does not resume auto refresh after this call.
      - To turn off auto refresh from the start, set `autoRefresh: .manual` or `.disabled` in the client configuration. Use `.disabled` in an app extension that shares the session with its app.
    examples:
      - id: stop-auto-refresh
        name: Stop automatic session refresh
        isSpotlight: true
        code: |
          ```swift
          await supabase.auth.stopAutoRefresh()
          ```

  - id: exchange-code-for-session
    title: 'exchangeCodeForSession()'
    notes: |
      - The client always uses PKCE for the flows it starts, so their redirect URLs carry a code.
      - Prefer `handleRedirect(_:)`, which reads the code from the URL and handles the same URL only once. Use this method when you read the code yourself.
      - It needs a pending flow for the code. With no stored flow, it throws an error of kind `.oauthFlowFailed` without a request.
      - Pass the `id` of the `OAuthFlow` from `oauthSignInURL`, `linkIdentityURL`, or `ssoSignInURL` as `flowID`. Without it, as for the code in an email link, the client tries the pending flows newest first.
    examples:
      - id: exchange-auth-code
        name: Exchange Auth Code
        isSpotlight: true
        code: |
          ```swift
          let session = try await supabase.auth.exchangeCodeForSession(
            "34e770dd-9ff9-416c-87fa-43b31d7ef225",
            flowID: flow.id
          )
          ```
  - id: auth-mfa-api
    title: 'Overview'
    notes: |
      This section contains methods for Multi-Factor Authentication (MFA). They live in the `supabase.auth.mfa` namespace.

      TOTP (time-based one-time password) and phone are the stable second factors. WebAuthn (passkey) as a second factor is **experimental**. Opt in with `@_spi(Experimental) import Supabase`. The first-factor passkey API lives in `supabase.auth.passkeys`. See the [Auth Passkey](/docs/reference/swift/v3/auth-passkey-api) section.

      A user can enroll more than one factor, with an upper limit of 10. A second TOTP factor is a good backup. The server can also issue single-use recovery codes. See [`mfa.recoveryCodes.generate()`](/docs/reference/swift/v3/auth-mfa-generaterecoverycodes).

      Factor and challenge IDs are `UUID` values. `"\(factor.id)"` prints in uppercase, so compare `UUID` values, not strings. `FactorType` and `AuthenticatorAssuranceLevel` are structs. Use `.rawValue` to get the string.
  - id: mfa-enroll
    title: 'mfa.enrollTOTP()'
    notes: |
      - Each factor type has its own method: `enrollTOTP(issuer:friendlyName:)` and `enrollPhone(_:friendlyName:)`. Each returns the data for that factor type.
      - The new factor is `unverified`. Use its `id` to create a challenge.
      - To create a challenge, see [`mfa.challenge()`](/docs/reference/swift/v3/auth-mfa-challenge).
      - To verify a challenge, see [`mfa.verify()`](/docs/reference/swift/v3/auth-mfa-verify).
      - To create and verify a challenge in a single step, see [`mfa.challengeAndVerify()`](/docs/reference/swift/v3/auth-mfa-challengeandverify).
      - For WebAuthn, `mfa.enrollWebAuthn(friendlyName:anchor:)` runs the full ceremony and returns the upgraded session (**experimental**). It is not available on watchOS.

    examples:
      - id: enroll-totp-factor
        name: Enroll a time-based, one-time password (TOTP) factor
        isSpotlight: true
        code: |
          ```swift
          let enrollment = try await supabase.auth.mfa.enrollTOTP(
            issuer: "optional issuer",
            friendlyName: "optional friendly name"
          )

          // Use the id to create a challenge.
          // The challenge can be verified by entering the code generated from the authenticator app.
          // The code will be generated upon scanning the qrCode or entering the secret into the authenticator app.
          let id = enrollment.id
          let qrCode = enrollment.qrCode
          let secret = enrollment.secret
          let uri = enrollment.uri
          ```
      - id: enroll-phone-factor
        name: Enroll a phone factor
        code: |
          ```swift
          let enrollment = try await supabase.auth.mfa.enrollPhone(
            "+15555550100",
            friendlyName: "Work phone"
          )

          // Send a code to the phone, then verify it with mfa.verify().
          let challenge = try await supabase.auth.mfa.challenge(factorID: enrollment.id)
          ```
      - id: enroll-webauthn-factor
        name: Enroll a WebAuthn (passkey) factor (experimental)
        code: |
          ```swift
          // @_spi(Experimental) import Supabase
          // enrollWebAuthn runs the full ceremony: enroll, challenge, show the passkey sheet, verify.
          // A nil anchor uses the app's key window.
          let session = try await supabase.auth.mfa.enrollWebAuthn(
            friendlyName: "My passkey"
          )
          ```
  - id: mfa-challenge
    title: 'mfa.challenge()'
    notes: |
      - An [enrolled factor](/docs/reference/swift/v3/auth-mfa-enroll) is required before creating a challenge.
      - For a phone factor, this call sends the code. Pass `channel: .whatsapp` to send it through WhatsApp. The server default is SMS.
      - To verify a challenge, see [`mfa.verify()`](/docs/reference/swift/v3/auth-mfa-verify).
      - `expiresAt` is a `Date`.
    examples:
      - id: create-mfa-challenge
        name: Create a challenge for a factor
        isSpotlight: true
        code: |
          ```swift
          let challenge = try await supabase.auth.mfa.challenge(
            factorID: UUID(uuidString: "34e770dd-9ff9-416c-87fa-43b31d7ef225")!
          )
          let challengeID = challenge.id
          let expiresAt = challenge.expiresAt
          ```
      - id: create-mfa-challenge-whatsapp
        name: Send the code for a phone factor through WhatsApp
        code: |
          ```swift
          let challenge = try await supabase.auth.mfa.challenge(
            factorID: factor.id,
            channel: .whatsapp
          )
          ```
  - id: mfa-verify
    title: 'mfa.verify()'
    notes: |
      - To verify a challenge, please [create a challenge](/docs/reference/swift/v3/auth-mfa-challenge) first.
      - On success, the client stores the upgraded `aal2` session, signs out the user's other sessions, and emits `.mfaChallengeVerified`. Verifying an `unverified` factor also marks it `verified`.
      - For WebAuthn factors, `mfa.verifyWebAuthn(factorID:anchor:)` runs the challenge, the passkey sheet, and the verification in one call (**experimental**). It only works with a verified factor. It is not available on watchOS.
    examples:
      - id: verify-challenge
        name: Verify a challenge for a factor
        isSpotlight: true
        code: |
          ```swift
          let session = try await supabase.auth.mfa.verify(
            factorID: UUID(uuidString: "34e770dd-9ff9-416c-87fa-43b31d7ef225")!,
            challengeID: UUID(uuidString: "4034ae6f-a8ce-4fb5-8ee5-69a5863a7c15")!,
            code: "123456"
          )
          ```
      - id: verify-webauthn-factor
        name: Verify a WebAuthn factor (experimental)
        code: |
          ```swift
          // @_spi(Experimental) import Supabase
          // verifyWebAuthn runs the full ceremony: challenge, show the passkey sheet, verify.
          // If the user dismisses the sheet, it throws CancellationError.
          let session = try await supabase.auth.mfa.verifyWebAuthn(
            factorID: factor.id
          )
          ```
  - id: mfa-challenge-and-verify
    title: 'mfa.challengeAndVerify()'
    notes: |
      - An [enrolled factor](/docs/reference/swift/v3/auth-mfa-enroll) is required before invoking `challengeAndVerify()`.
      - Executes [`mfa.challenge()`](/docs/reference/swift/v3/auth-mfa-challenge) and [`mfa.verify()`](/docs/reference/swift/v3/auth-mfa-verify) in a single step.
      - Use it for TOTP factors, where the user already has the code. For a phone factor, call `challenge(factorID:channel:)` first so the server sends the code.
    examples:
      - id: challenge-and-verify
        name: Create and verify a challenge for a factor
        isSpotlight: true
        code: |
          ```swift
          let session = try await supabase.auth.mfa.challengeAndVerify(
            factorID: UUID(uuidString: "34e770dd-9ff9-416c-87fa-43b31d7ef225")!,
            code: "123456"
          )
          ```
  - id: mfa-unenroll
    title: 'mfa.unenroll()'
    notes: |
      - The session must be at `aal2` to remove a `verified` factor.
      - To remove the recovery codes factor, use [`mfa.recoveryCodes.unenroll()`](/docs/reference/swift/v3/auth-mfa-unenrollrecoverycodes).
    examples:
      - id: unenroll-a-factor
        name: Unenroll a factor
        isSpotlight: true
        code: |
          ```swift
          let response = try await supabase.auth.mfa.unenroll(
            factorID: UUID(uuidString: "34e770dd-9ff9-416c-87fa-43b31d7ef225")!
          )
          print(response.id) // ID of the unenrolled factor
          ```
  - id: mfa-get-authenticator-assurance-level
    title: 'mfa.assuranceLevel()'
    notes: |
      - Authenticator Assurance Level (AAL) is the measure of the strength of an authentication mechanism.
      - In Supabase, having an AAL of `aal1` refers to having the 1st factor of authentication such as an email and password or OAuth sign-in while `aal2` refers to the 2nd factor of authentication such as a time-based, one-time-password (TOTP).
      - If the user has a verified factor, the `nextLevel` field will return `aal2`, else, it will return the current level.
      - The method fetches the user from the server, so `nextLevel` includes factors enrolled on other devices.
      - With no session, it throws an `AuthError` of kind `.sessionMissing`.
    examples:
      - id: get-aal
        name: Get the AAL details of a session
        isSpotlight: true
        code: |
          ```swift
          let aal = try await supabase.auth.mfa.assuranceLevel()
          let currentLevel = aal.currentLevel
          let nextLevel = aal.nextLevel
          let currentAuthenticationMethods = aal.currentAuthenticationMethods
          ```
      - id: prompt-for-mfa
        name: Ask for a second factor when one is needed
        code: |
          ```swift
          do {
            let aal = try await supabase.auth.mfa.assuranceLevel()
            if aal.nextLevel != aal.currentLevel {
              // Show the MFA prompt.
            }
          } catch let error as AuthError where error.kind == .sessionMissing {
            // Show the sign-in screen.
          }
          ```
  - id: auth-js-gotruemfaapi-listfactors
    title: 'mfa.factors()'
    notes: |
      - The method fetches the user from the server on each call, so it includes factors enrolled on other devices.
      - It splits the factors by status in `verified` and `unverified`. `all` returns both. Filter on `factorType` for one type.
      - `verified` includes the recovery codes factor, which cannot be challenged.
    examples:
      - id: list-factors
        name: List all factors for a user
        isSpotlight: true
        code: |
          ```swift
          let factors = try await supabase.auth.mfa.factors()
          let verified = factors.verified
          let unverified = factors.unverified
          ```
      - id: list-verified-totp-factors
        name: List the verified TOTP factors
        code: |
          ```swift
          let totpFactors = try await supabase.auth.mfa.factors().verified
            .filter { $0.factorType == .totp }
          ```
  - id: mfa-get-recovery-codes-status
    title: 'mfa.recoveryCodes.status()'
    notes: |
      - Returns how many codes the current set holds and how many are unused. It never returns the codes.
      - Works at any assurance level. When `remaining` reaches zero, ask the user to regenerate the codes.
      - Throws an error with code `mfa_factor_not_found` when the user has no recovery codes.
      - Recovery codes are an experimental Supabase Auth feature. Enable them on the Auth server first.
    examples:
      - id: get-recovery-codes-status
        name: Get the status of the recovery codes
        isSpotlight: true
        code: |
          ```swift
          let status = try await supabase.auth.mfa.recoveryCodes.status()
          print("\(status.remaining) of \(status.total) codes left")
          ```
  - id: mfa-generate-recovery-codes
    title: 'mfa.recoveryCodes.generate()'
    notes: |
      - The session must be at `aal2`, and the user must already have another verified factor.
      - The codes are returned only once. Show them to the user and ask them to store the codes safely.
      - A user has one set of recovery codes. To replace it, use [`mfa.recoveryCodes.regenerate()`](/docs/reference/swift/v3/auth-mfa-regeneraterecoverycodes).
      - Recovery codes are an experimental Supabase Auth feature. Enable them on the Auth server first.
    examples:
      - id: generate-recovery-codes
        name: Generate recovery codes
        isSpotlight: true
        code: |
          ```swift
          let generated = try await supabase.auth.mfa.recoveryCodes.generate(
            friendlyName: "Backup codes"
          )
          // Show generated.codes to the user once.
          let codes = generated.codes
          ```
  - id: mfa-regenerate-recovery-codes
    title: 'mfa.recoveryCodes.regenerate()'
    notes: |
      - Replaces the user's recovery codes with a new set. The old codes stop working at once.
      - The session must be at `aal2`.
      - Throws an error with code `mfa_factor_not_found` when the user has no recovery codes. Use `generate(friendlyName:)` instead.
    examples:
      - id: regenerate-recovery-codes
        name: Regenerate recovery codes
        isSpotlight: true
        code: |
          ```swift
          let regenerated = try await supabase.auth.mfa.recoveryCodes.regenerate()
          let codes = regenerated.codes
          ```
  - id: mfa-verify-recovery-code
    title: 'mfa.recoveryCodes.verify()'
    notes: |
      - Verifies one recovery code and upgrades the session to `aal2`. Each code works only once.
      - On success, the client stores the upgraded session, signs out the user's other `aal1` sessions, and emits `.mfaChallengeVerified`.
      - The server ignores letter case, whitespace, and `-` separators.
    examples:
      - id: verify-recovery-code
        name: Verify a recovery code
        isSpotlight: true
        code: |
          ```swift
          let session = try await supabase.auth.mfa.recoveryCodes.verify(
            code: "K4M9-X7QP-2AB8-HT3Z"
          )
          ```
  - id: mfa-unenroll-recovery-codes
    title: 'mfa.recoveryCodes.unenroll()'
    notes: |
      - Removes the recovery codes factor and every code in it.
      - The session must be at `aal2`.
    examples:
      - id: unenroll-recovery-codes
        name: Remove the recovery codes
        isSpotlight: true
        code: |
          ```swift
          let response = try await supabase.auth.mfa.recoveryCodes.unenroll()
          print(response.id) // ID of the removed factor
          ```
  - id: passkey-api
    title: 'Overview'
    notes: |
      Lower-level passkey methods for custom authenticator flows and platforms where `AuthenticationServices` is unavailable (watchOS). They live in the `supabase.auth.passkeys` namespace.

      These methods handle the network side of the WebAuthn ceremony only. You drive the platform authenticator between fetching options and submitting the credential. For an end-to-end flow, prefer `passkeys.signIn(anchor:)` and `passkeys.register(anchor:)`.

      Passkey support is **experimental**. Opt in with `@_spi(Experimental) import Supabase`. The API may change in any release.
  - id: passkey-list
    title: 'passkeys.list()'
    notes: |
      Returns the list of passkeys registered to the signed-in user.
    examples:
      - id: list-passkeys
        name: List the current user's passkeys
        isSpotlight: true
        code: |
          ```swift
          // @_spi(Experimental) import Supabase
          let passkeys: [PasskeyListItem] = try await supabase.auth.passkeys.list()
          ```
  - id: passkey-update
    title: 'passkeys.rename(id:friendlyName:)'
    notes: |
      Updates the friendly name of a passkey. Limited to 120 characters.
    params:
      - name: id
        isOptional: false
        type: UUID
        description: ID of the passkey to rename.
      - name: friendlyName
        isOptional: false
        type: String
        description: New human readable name. Limited to 120 characters.
    examples:
      - id: rename-passkey
        name: Rename a passkey
        isSpotlight: true
        code: |
          ```swift
          // @_spi(Experimental) import Supabase
          let passkey = try await supabase.auth.passkeys.rename(
            id: UUID(uuidString: "34e770dd-9ff9-416c-87fa-43b31d7ef225")!,
            friendlyName: "Work laptop"
          )
          ```
  - id: passkey-delete
    title: 'passkeys.delete(id:)'
    notes: |
      Removes a passkey from the signed-in user's account.
    params:
      - name: id
        isOptional: false
        type: UUID
        description: ID of the passkey to delete.
    examples:
      - id: delete-passkey
        name: Delete a passkey
        isSpotlight: true
        code: |
          ```swift
          // @_spi(Experimental) import Supabase
          try await supabase.auth.passkeys.delete(
            id: UUID(uuidString: "34e770dd-9ff9-416c-87fa-43b31d7ef225")!
          )
          ```
  - id: passkey-start-registration
    title: 'passkeys.registrationOptions()'
    notes: |
      Fetches credential creation options to register a new passkey for the signed-in user.

      - Pass the returned `options` (W3C `PublicKeyCredentialCreationOptions`) to the platform authenticator.
      - After running the authenticator, submit the result with `passkeys.verifyRegistration(challengeID:credential:)`.
      - `challengeID` is a `UUID` and `expiresAt` is a `Date`.
    examples:
      - id: start-passkey-registration
        name: Get passkey registration options
        isSpotlight: true
        code: |
          ```swift
          // @_spi(Experimental) import Supabase
          let options: PasskeyRegistrationOptions = try await supabase.auth.passkeys.registrationOptions()
          // Hand options.options to the platform authenticator.
          ```
  - id: passkey-verify-registration
    title: 'passkeys.verifyRegistration(challengeID:credential:)'
    notes: |
      Stores a newly created passkey for the signed-in user. The server names the passkey after the authenticator. Change the name with `passkeys.rename(id:friendlyName:)`.
    params:
      - name: challengeID
        isOptional: false
        type: UUID
        description: The `challengeID` returned by `passkeys.registrationOptions()`.
      - name: credential
        isOptional: false
        type: JSONValue
        description: The W3C `PublicKeyCredential` JSON produced by the authenticator.
    examples:
      - id: verify-passkey-registration
        name: Verify a passkey registration
        isSpotlight: true
        code: |
          ```swift
          // @_spi(Experimental) import Supabase
          let passkey: PasskeyListItem = try await supabase.auth.passkeys.verifyRegistration(
            challengeID: options.challengeID,
            credential: credential
          )
          ```
  - id: passkey-start-authentication
    title: 'passkeys.authenticationOptions()'
    notes: |
      Fetches assertion options to authenticate with a passkey.

      - Does not require an existing session.
      - Pass the returned `options` (W3C `PublicKeyCredentialRequestOptions`) to the platform authenticator.
      - After running the authenticator, submit the result with `passkeys.verifyAuthentication(challengeID:credential:)`.
    examples:
      - id: start-passkey-authentication
        name: Get passkey authentication options
        isSpotlight: true
        code: |
          ```swift
          // @_spi(Experimental) import Supabase
          let options: PasskeyAuthenticationOptions = try await supabase.auth.passkeys.authenticationOptions()
          // Hand options.options to the platform authenticator.
          ```
  - id: passkey-verify-authentication
    title: 'passkeys.verifyAuthentication(challengeID:credential:)'
    notes: |
      Verifies a passkey assertion and establishes a session at `aal1`. On success the session is stored and a `.signedIn` auth event is emitted. It returns the `Session`.
    params:
      - name: challengeID
        isOptional: false
        type: UUID
        description: The `challengeID` returned by `passkeys.authenticationOptions()`.
      - name: credential
        isOptional: false
        type: JSONValue
        description: The W3C `PublicKeyCredential` JSON produced by the authenticator.
    examples:
      - id: verify-passkey-authentication
        name: Verify a passkey sign in
        isSpotlight: true
        code: |
          ```swift
          // @_spi(Experimental) import Supabase
          let session: Session = try await supabase.auth.passkeys.verifyAuthentication(
            challengeID: options.challengeID,
            credential: credential
          )
          let user = session.user
          ```
  - id: admin-api
    title: 'Overview'
    notes: |
      - Admin methods live on `AuthAdminClient`, a separate client. `supabase.auth.admin` does not exist in v3.
      - `AuthAdminClient` requires a `secret` key. It sends the key on every request and never reads or writes a user session.
      - These methods are considered admin methods and should be called on a trusted server. Never expose your `secret` key in a browser or mobile app.
      - Unlike the other clients, the `AuthAdminClient` initializer does not throw.
    examples:
      - id: create-auth-admin-client
        name: Create server-side auth client
        isSpotlight: true
        code: |
          ```swift
          import Supabase

          let admin = AuthAdminClient(
            configuration: .init(
              url: supabaseURL.appendingPathComponent("auth/v1"),
              secretKey: secretKey
            )
          )
          ```
  - id: delete-user
    title: 'deleteUser()'
    notes: |
      - The `deleteUser()` method requires the user's ID, which maps to the `auth.users.id` column.
      - Pass `softDelete: true` to disable the account and keep its data. With no `softDelete`, the server removes the user.
    examples:
      - id: removes-a-user
        name: Removes a user
        isSpotlight: true
        code: |
          ```swift
          try await admin.deleteUser(
            id: UUID(uuidString: "715ed5db-f090-4b8c-a067-640ecee36aa0")!
          )
          ```
      - id: soft-deletes-a-user
        name: Soft-delete a user
        code: |
          ```swift
          try await admin.deleteUser(
            id: UUID(uuidString: "715ed5db-f090-4b8c-a067-640ecee36aa0")!,
            softDelete: true
          )
          ```

  - id: get-user-by-id
    title: 'user(id:)'
    description: |
      Get user by ID.
    notes: |
      - The `user(id:)` method requires a user's ID.
    examples:
      - id: get-user-by-id
        name: Get user by ID
        isSpotlight: true
        code: |
          ```swift
          let user = try await admin.user(
            id: UUID(uuidString: "715ed5db-f090-4b8c-a067-640ecee36aa0")!
          )
          ```

  - id: list-users
    title: 'listUsers()'
    description: |
      List all users in the system.
    notes: |
      - `listUsers(page:pageSize:)` returns one `UserPage`. Pages start at `1`.
      - To walk every page, iterate `users(pageSize:)`. It fetches each page as you go.
    examples:
      - id: list-users
        name: List users
        isSpotlight: true
        code: |
          ```swift
          let page = try await admin.listUsers()
          let users = page.users
          ```
      - id: list-users-with-pagination
        name: List users with pagination
        code: |
          ```swift
          let page = try await admin.listUsers(
            page: 2,
            pageSize: 10
          )
          let users = page.users
          let total = page.total
          ```
      - id: list-all-users
        name: Iterate over every user
        code: |
          ```swift
          for try await user in admin.users(pageSize: 100) {
            print(user.id)
          }
          ```

  - id: create-user
    title: 'createUser()'
    description: |
      Create a new user.
    notes: |
      - The server sends no confirmation email. Set `confirmsEmail` or `confirmsPhone` to `true` to mark the address as confirmed.
      - To email the user an invite instead, use `inviteUser(email:userMetadata:redirectTo:)`.
    examples:
      - id: create-user
        name: Create user
        isSpotlight: true
        code: |
          ```swift
          let user = try await admin.createUser(
            AdminCreateUser(
              email: "user@email.com",
              password: "password",
              confirmsEmail: true
            )
          )
          ```

  - id: update-user-by-id
    title: 'updateUser(id:_:)'
    description: |
      Update user by ID.
    notes: |
      - The server changes only the fields you set in `AdminUpdateUser`.
      - `banDuration` is a `Duration`. Pass `.zero` to lift a ban.
    examples:
      - id: update-user-by-id
        name: Update user by ID
        isSpotlight: true
        code: |
          ```swift
          let user = try await admin.updateUser(
            id: UUID(uuidString: "715ed5db-f090-4b8c-a067-640ecee36aa0")!,
            AdminUpdateUser(
              email: "newemail@email.com"
            )
          )
          ```
      - id: ban-user
        name: Ban a user for 24 hours
        code: |
          ```swift
          let user = try await admin.updateUser(
            id: UUID(uuidString: "715ed5db-f090-4b8c-a067-640ecee36aa0")!,
            AdminUpdateUser(banDuration: .seconds(86_400))
          )
          ```

  - id: invite-user-by-email
    title: 'inviteUser()'
    description: |
      Send an invite link to the user's email address.
    notes: |
      - `userMetadata` is stored in the user's `user_metadata`.
      - The admin client has no default redirect. Without `redirectTo`, the server uses the site URL.
    examples:
      - id: invite-user-by-email
        name: Invite user by email
        isSpotlight: true
        code: |
          ```swift
          let user = try await admin.inviteUser(
            email: "user@email.com",
            userMetadata: ["role": "admin"],
            redirectTo: URL(string: "https://example.com/welcome")
          )
          ```

  - id: generate-link
    title: 'generateLink()'
    description: |
      Generates an email link for a specific action without sending it. This is useful for custom admin functionality where you want to build the email or OTP flow yourself.
    notes: |
      - `GenerateLink` exposes a static factory for each link type: `.signUp(email:password:userMetadata:redirectTo:)`, `.invite(email:userMetadata:redirectTo:)`, `.magicLink(email:userMetadata:redirectTo:)`, `.recovery(email:redirectTo:)`, `.emailChangeCurrent(email:newEmail:redirectTo:)`, and `.emailChangeNew(email:newEmail:redirectTo:)`.
      - `generateLink()` creates the user for `.signUp` and `.invite` if one doesn't already exist.
      - The admin client has no default redirect. Without `redirectTo`, the server uses the site URL.
    examples:
      - id: generate-a-signup-link
        name: Generate a signup link
        isSpotlight: true
        code: |
          ```swift
          let response = try await admin.generateLink(
            .signUp(
              email: "email@example.com",
              password: "secret"
            )
          )

          let actionLink = response.properties.actionLink
          let emailOTP = response.properties.emailOTP
          ```
      - id: generate-a-recovery-link
        name: Generate a recovery link
        code: |
          ```swift
          let response = try await admin.generateLink(
            .recovery(
              email: "email@example.com",
              redirectTo: URL(string: "https://example.com/reset-password")
            )
          )
          ```

  - id: auth-js-gotrueadminapi-signout
    title: 'signOut()'
    description: |
      Signs out a specific user by revoking their session(s), using that user's access token (JWT).
    notes: |
      - Unlike `supabase.auth.signOut()`, this method takes the target user's access token (JWT), not a user ID.
      - By default, `signOut()` uses the `.global` scope, which revokes every session for the user. Pass `.local` to revoke only the session tied to the given JWT, or `.others` to keep that session and revoke all the rest.
    examples:
      - id: sign-out-a-user
        name: Sign out a user
        isSpotlight: true
        code: |
          ```swift
          try await admin.signOut(jwt: jwt)
          ```
      - id: sign-out-a-user-with-scope
        name: Sign out a user with a scope
        code: |
          ```swift
          try await admin.signOut(jwt: jwt, scope: .others)
          ```

  - id: mfa-list-factors-admin
