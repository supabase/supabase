  - id: eq
    title: eq()
    description: |
      Match only rows where `column` is equal to `value`.
    examples:
      - id: with-select
        name: With `select()`
        code: |
          ```swift
          try await supabase
            .from("cities")
            .select("name, country_id")
            .eq("name", value: "The shire")
            .execute()
          ```
        response: |
          ```json
          {
            "data": [
              {
                "name": "The shire",
                "country_id": 554
              }
            ],
            "status": 200,
            "statusText": "OK"
          }
          ```

  - id: neq
    title: neq()
    description: |
      Match only rows where `column` is not equal to `value`.
    examples:
      - id: with-select
        name: With `select()`
        code: |
          ```swift
          try await supabase
            .from("cities")
            .select("name, country_id")
            .neq("name", value: "Paris")
            .execute()
          ```

  - id: gt
    title: gt()
    description: |
      Match only rows where `column` is greater than `value`.
    examples:
      - id: with-select
        name: With `select()`
        code: |
          ```swift
          try await supabase
            .from("cities")
            .select("name, country_id")
            .gt("country_id", value: 250)
            .execute()
          ```

  - id: gte
    title: gte()
    description: |
      Match only rows where `column` is greater than or equal to `value`.
    examples:
      - id: with-select
        name: With `select()`
        code: |
          ```swift
          try await supabase
            .from("cities")
            .select("name, country_id")
            .gte("country_id", value: 250)
            .execute()
          ```

  - id: lt
    title: lt()
    description: |
      Match only rows where `column` is less than `value`.
    examples:
      - id: with-select
        name: With `select()`
        code: |
          ```swift
          try await supabase
            .from("cities")
            .select("name, country_id")
            .lt("country_id", value: 250)
            .execute()
          ```

  - id: lte
    title: lte()
    description: |
      Match only rows where `column` is less than or equal to `value`.
    examples:
      - id: with-select
        name: With `select()`
        code: |
          ```swift
          try await supabase
            .from("cities")
            .select("name, country_id")
            .lte("country_id", value: 250)
            .execute()
          ```

  - id: like
    title: like()
    description: |
      Match only rows where `column` matches `pattern` case-sensitively.
    examples:
      - id: with-select
        name: With `select()`
        code: |
          ```swift
          try await supabase
            .from("cities")
            .select("name, country_id")
            .like("name", pattern: "%la%")
            .execute()
          ```

  - id: ilike
    title: ilike()
    description: |
      Match only rows where `column` matches `pattern` case-insensitively.
    examples:
      - id: with-select
        name: With `select()`
        code: |
          ```swift
          try await supabase
            .from("cities")
            .select("name, country_id")
            .ilike("name", pattern: "%la%")
            .execute()
          ```

  - id: is
    title: is()
    description: |
      Match only rows where `column` IS `value`. `value` is `nil`, `true`, or `false`.

      Use `is()` to match `NULL`. `eq()` doesn't take `nil`.
    examples:
      - id: with-select
        name: With `select()`
        code: |
          ```swift
          try await supabase
            .from("cities")
            .select("name, country_id")
            .is("name", value: nil)
