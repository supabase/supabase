  - id: invoke-stream
    title: stream()
    description: |
      Invoke a Supabase Edge Function and read the response body as it arrives. Use it for `text/event-stream` responses and large downloads.
    notes: |
      - `stream` returns a `FunctionStreamResponse` as soon as the response head arrives. Its `body` is an `HTTPBody`, an `AsyncSequence` of `ArraySlice<UInt8>` chunks. Iterate it once.
      - A relay failure or a non-2xx status throws a `FunctionsError` from `stream` itself, before you read the body.
      - Chunk boundaries follow the network, not the payload. A server-sent event can arrive split across two chunks, so buffer the bytes and frame the events yourself.
      - Cancelling the task that reads the body closes the connection and throws `CancellationError` from the loop.
      - `stream` takes the same `body` and `options` as `invoke`.
    examples:
      - id: invocation-with-streamed-response
        name: Invocation with streamed response
        isSpotlight: true
        code: |
          ```swift
          let response = try await supabase.functions.stream(
            "hello",
            body: .json(["foo": "bar"])
          )

          // Write each chunk to a file, so memory use stays small.
          let fileURL = FileManager.default.temporaryDirectory
            .appendingPathComponent("hello-response")
          FileManager.default.createFile(atPath: fileURL.path, contents: nil)
          let file = try FileHandle(forWritingTo: fileURL)
          defer { try? file.close() }

          for try await chunk in response.body {
            try file.write(contentsOf: chunk)
          }
          ```

  - id: subscribe
    title: subscribe()
    notes: |
      - By default, Broadcast and Presence are enabled for all projects.
      - By default, listening to database changes is disabled for new projects due to database performance and security concerns. You can turn it on by managing Realtime's [replication](/docs/guides/api#realtime-api-overview).
      - You can receive the "previous" data for updates and deletes by setting the table's `REPLICA IDENTITY` to `FULL` (e.g., `ALTER TABLE your_table REPLICA IDENTITY FULL;`).
      - Row level security is not applied to delete statements. When RLS is enabled and replica identity is set to full, only the primary key is sent to clients.
      - Every listener is an `AsyncStream`. Get the channel with `await supabase.channel(_:)`, open the streams, call `try await channel.subscribe()`, then iterate. To stop listening, cancel the task that iterates the stream.
      - Open presence streams **before** calling `subscribe()`: they turn presence on for the join. A presence stream opened after the join, while presence is off, reports an issue and ends at once. A Postgres changes stream opened after the join makes the channel leave and join again with the new binding.
      - `subscribe()` has no attempt limit. It retries until the join succeeds, fails for good, or its task is cancelled. It throws a `RealtimeError` when a retry cannot help, for example when an RLS policy refuses the join.
      - `broadcast` and `track` throw a `RealtimeError` of kind `.notSubscribed` when the channel is not subscribed.
    examples:
      - id: listen-to-broadcast
        name: Listen to broadcast messages
        isSpotlight: true
        code: |
          ```swift
          // This client sends the message too, so it must receive its own messages.
          let channel = await supabase.channel("room1") {
            $0.broadcast.receivesOwnMessages = true
          }

          let broadcastStream = await channel.broadcasts(event: "cursor-pos")

          try await channel.subscribe()

          Task {
            for await message in broadcastStream {
              print("Cursor position received", message.payload)
            }
          }

          try await channel.broadcast(
            event: "cursor-pos",
            payload: [
              "x": Double.random(in: 0...1),
              "y": Double.random(in: 0...1)
            ]
          )
          ```

      - id: listen-to-broadcast-typed
        name: Listen to broadcast messages with a typed payload
        isSpotlight: true
        code: |
          ```swift
          struct CursorPosition: Codable {
            let x: Double
            let y: Double
          }

          // This client sends the message too, so it must receive its own messages.
          let channel = await supabase.channel("room1") {
            $0.broadcast.receivesOwnMessages = true
          }

          let broadcastStream = await channel.broadcasts(event: "cursor-pos")

          try await channel.subscribe()

          let task = Task {
            for await message in broadcastStream {
              let position = try message.decode(as: CursorPosition.self)
              print("Cursor position received", position)
            }
          }

          try await channel.broadcast(
            event: "cursor-pos",
            payload: CursorPosition(x: 0.5, y: 0.5)
          )

          // Stop listening some time later
          task.cancel()
          ```

      - id: broadcast-with-replay
        name: Configure broadcast with replay
        description: |
          Replay allows you to receive messages that were broadcast since a specific date. It works on private channels only. `isReplayed` on each message tells you whether the server replayed it.
        isSpotlight: false
        code: |
          ```swift
          let channel = await supabase.channel("my-channel") {
            $0.isPrivate = true
            $0.broadcast.acknowledgesMessages = true
            $0.broadcast.receivesOwnMessages = true
            $0.broadcast.replay = .init(
              since: Date(timeIntervalSinceNow: -3600),
              limit: 100
            )
          }

          let messages = await channel.broadcasts(event: "*")

          try await channel.subscribe()

          for await message in messages where message.isReplayed {
            print("Replayed message: \(message.id?.uuidString ?? "")")
          }
          ```

      - id: listen-to-presence-updates
        name: Listen to presence updates
        description: |
          `presenceChanges()` yields the entries that joined and left in each sync, by presence key. To show who is online, `presenceStates()` yields the whole state after every change.
        code: |
          ```swift
          struct UserStatus: Codable {
            let username: String
          }

          let channel = await supabase.channel("channelId")

          let presenceChanges = await channel.presenceChanges()

          try await channel.subscribe()

          Task {
            for await change in presenceChanges {
              let joins = try change.joins.values.flatMap { $0 }.map { try $0.decode(as: UserStatus.self) }
              let leaves = try change.leaves.values.flatMap { $0 }.map { try $0.decode(as: UserStatus.self) }
            }
          }

          // Send your own state
          try await channel.track(UserStatus(username: "John"))
          ```

      - id: listen-to-presence-state
        name: Listen to the presence state
        code: |
          ```swift
          struct UserStatus: Codable {
            let username: String
          }

          let channel = await supabase.channel("channelId") {
            $0.presence.key = userID.uuidString
          }

          let presenceStates = await channel.presenceStates()

          try await channel.subscribe()

          // Send your own state
          try await channel.track(UserStatus(username: "John"))

          for await state in presenceStates {
            let online: [String: [UserStatus]] = try state.decode()
            print("Online users:", online)
          }
          ```

      - id: listen-to-all-database-changes
        name: Listen to all database changes
        code: |
          ```swift
          let channel = await supabase.channel("channelId")

          let changeStream = await channel.postgresChanges(schema: "public")

          try await channel.subscribe()

          for await change in changeStream {
            switch change.kind {
            case .delete: print("Deleted: \(change.oldRecord?.values ?? [:])")
            case .insert: print("Inserted: \(change.record?.values ?? [:])")
            case .update: print("Updated: \(change.oldRecord?.values ?? [:]) with \(change.record?.values ?? [:])")
            default: break
            }
          }
          ```
      - id: listen-to-a-specific-table
        name: Listen to a specific table
        code: |
          ```swift
          let channel = await supabase.channel("channelId")

          let changeStream = await channel.postgresChanges(
            schema: "public",
            table: "users"
          )

          try await channel.subscribe()

          for await change in changeStream {
            switch change.kind {
            case .delete: print("Deleted: \(change.oldRecord?.values ?? [:])")
            case .insert: print("Inserted: \(change.record?.values ?? [:])")
            case .update: print("Updated: \(change.oldRecord?.values ?? [:]) with \(change.record?.values ?? [:])")
            default: break
            }
          }
          ```
      - id: listen-to-a-specific-table-typed
        name: Listen to a specific table with a typed row
        description: |
          `postgresChanges(of:)` binds each change to a row type. Call `row()` to decode the record. A row that does not decode throws from `row()` and does not end the stream. `oldRecord` stays untyped, because without `REPLICA IDENTITY FULL` it holds only the primary key.
        code: |
          ```swift
          struct User: Decodable {
            let id: Int
            let username: String
          }

          let channel = await supabase.channel("channelId")

          let changeStream = await channel.postgresChanges(
            of: User.self,
            schema: "public",
            table: "users"
          )

          try await channel.subscribe()

          for await change in changeStream {
            switch change.kind {
            case .insert, .update:
              do {
                let user = try change.row()
                print("Upserted: \(user)")
              } catch {
                print("Could not decode the row: \(error)")
              }
            case .delete: print("Deleted id: \(change.oldRecord?["id"]?.intValue ?? 0)")
            default: break
            }
          }
          ```
      - id: listen-to-inserts
        name: Listen to inserts
        code: |
          ```swift
          let channel = await supabase.channel("channelId")

          let insertions = await channel.postgresChanges(
            event: .insert,
            schema: "public",
            table: "users"
          )

          try await channel.subscribe()

          for await insert in insertions {
            print("Inserted: \(insert.record?.values ?? [:])")
          }
          ```
      - id: listen-to-updates
        name: Listen to updates
        description: |
          By default, Supabase will send only the updated record. If you want to receive the previous values as well you can
          enable full replication for the table you are listening to:

          ```sql
          alter table "your_table" replica identity full;
          ```
        code: |
          ```swift
          let channel = await supabase.channel("channelId")

          let updates = await channel.postgresChanges(
            event: .update,
            schema: "public",
            table: "users"
          )

          try await channel.subscribe()

          for await update in updates {
            print("Updated: \(update.oldRecord?.values ?? [:]) with \(update.record?.values ?? [:])")
          }
          ```
      - id: listen-to-deletes
        name: Listen to deletes
        description: |
          By default, Supabase does not send deleted records. If you want to receive the deleted record you can
          enable full replication for the table you are listening to:

          ```sql
          alter table "your_table" replica identity full;
          ```
        code: |
          ```swift
          let channel = await supabase.channel("channelId")

          let deletions = await channel.postgresChanges(
            event: .delete,
            schema: "public",
            table: "users"
          )

          try await channel.subscribe()

          for await deletion in deletions {
            print("Deleted: \(deletion.oldRecord?.values ?? [:])")
          }
          ```
      - id: listening-to-row-level-changes
        name: Listen to row level changes
        description: |
          You can only filter delete events when the table's replica identity is `full`. Run `alter table users replica identity full;` first.
        code: |
          ```swift
          let channel = await supabase.channel("channelId")

          let deletions = await channel.postgresChanges(
            event: .delete,
            schema: "public",
            table: "users",
            filter: .eq("id", value: 1)
          )

          try await channel.subscribe()

          for await deletion in deletions {
            print("Deleted: \(deletion.oldRecord?.values ?? [:])")
          }
          ```
      - id: stop-listening
        name: Stop listening
        description: |
          Cancel the task that iterates a stream to stop listening. The channel stays joined until you call `unsubscribe()` or remove it.
        code: |
          ```swift
          let channel = await supabase.channel("channelId")

          let insertions = await channel.postgresChanges(
            event: .insert,
            schema: "public",
            table: "users"
          )

          try await channel.subscribe()

          let task = Task {
            for await insert in insertions {
              print("Inserted: \(insert.record?.values ?? [:])")
            }
          }

          // Some time later
          task.cancel()
          await supabase.removeChannel(channel)
          ```

  - id: remove-channel
    description: |
      Unsubscribes and removes Realtime channel from Realtime client.
    title: 'removeChannel()'
    notes: |
      - Removing a channel is a great way to maintain the performance of your project's Realtime service as well as your database if you're listening to Postgres changes.
      - Supabase will automatically handle cleanup 30 seconds after a client is disconnected, but unused channels may cause degradation as more clients are simultaneously subscribed.
      - `removeChannel(_:)` ends every stream opened on the channel. The channel is then spent: its actions throw a `RealtimeError` of kind `.channelRemoved`. Get a new channel from `supabase.channel(_:)`.
      - `channel.unsubscribe()` only leaves the topic. The channel and its streams stay, and `subscribe()` joins again.
      - After you remove the last channel, the client disconnects from the Realtime websocket after `disconnectOnEmptyChannelsAfter` (50 seconds by default). Set it to `.zero` in `SupabaseClient.Configuration.Realtime` to disconnect at once.
    examples:
      - id: removes-a-channel
        name: Remove a channel
        isSpotlight: true
        code: |
          ```swift
          let channel = await supabase.channel("channelId")

          //...
          await supabase.removeChannel(channel)
          ```
      - id: unsubscribe-channel
        name: Unsubscribe from a channel
        isSpotlight: true
        code: |
          ```swift
          let channel = await supabase.channel("channelId")

          //...
          await channel.unsubscribe()
          ```
  - id: remove-all-channels
    title: removeAllChannels()
    $ref: '@supabase/supabase-js.index.SupabaseClient.removeAllChannels'
    notes: |
      Unsubscribes and removes all Realtime channels from Realtime client.
      - Removing channels is a great way to maintain the performance of your project's Realtime service as well as your database if you're listening to Postgres changes. Supabase will automatically handle cleanup 30 seconds after a client is disconnected, but unused channels may cause degradation as more clients are simultaneously subscribed.
      - `removeAllChannels()` ends every stream on every channel, then disconnects from the Realtime websocket at once. It ignores `disconnectOnEmptyChannelsAfter`.
    examples:
      - id: remove-all-channels
        name: Remove all channels
        isSpotlight: true
        code: |
          ```swift
          await supabase.removeAllChannels()
          ```
  - id: get-channels
    title: channels
    $ref: '@supabase/supabase-js.index.SupabaseClient.getChannels'
    notes: |
      Returns all Realtime channels that the client created and has not removed. The read is `async`, and the order is not specified.
    examples:
      - id: get-all-channels
        name: Get all channels
        isSpotlight: true
        code: |
          ```swift
          let channels = await supabase.channels
          ```
  - id: file-buckets
    title: 'Overview'
    notes: |
      This section contains methods for working with File Buckets.

      `supabase.storage` is a `StorageClient`. Call `from(_:)` to get a `StorageBucket` for file operations. Every failed request throws `StorageError`.
  # - id: analytics-buckets
  #   title: 'Overview'
  #   notes: |
  #     This section contains methods for working with Analytics Buckets.
  # - id: vector-buckets
  #   title: 'Overview'
  #   notes: |
  #     This section contains methods for working with Vector Buckets.

  - id: list-buckets
    title: listBuckets()
    notes: |
      - RLS policy permissions required:
        - `buckets` table permissions: `select`
        - `objects` table permissions: none
      - Refer to the [Storage guide](/docs/guides/storage/security/access-control) on how access control works
    examples:
      - id: list-buckets
        name: List buckets
        isSpotlight: true
        code: |
          ```swift
          let buckets = try await supabase.storage
            .listBuckets()
          ```
      - id: list-buckets-with-options
        name: List buckets with options
        code: |
          ```swift
          let buckets = try await supabase.storage
            .listBuckets(
              options: BucketListOptions(
                limit: 10,
                sortBy: .createdAt,
                order: .descending
              )
            )
          ```

  - id: get-bucket
    title: bucket()
    notes: |
      - RLS policy permissions required:
        - `buckets` table permissions: `select`
        - `objects` table permissions: none
      - Refer to the [Storage guide](/docs/guides/storage/security/access-control) on how access control works
    examples:
      - id: get-bucket
        name: Get bucket
        isSpotlight: true
        code: |
          ```swift
          let bucket = try await supabase.storage
            .bucket("avatars")
          ```

  - id: create-bucket
    title: createBucket()
    notes: |
      - RLS policy permissions required:
        - `buckets` table permissions: `insert`
        - `objects` table permissions: none
      - Refer to the [Storage guide](/docs/guides/storage/security/access-control) on how access control works
      - Returns the name of the new bucket. You can ignore the result.
      - A field you leave as `nil` takes the server default: a private bucket with no size or MIME type limit.
    examples:
      - id: create-bucket
        name: Create bucket
        isSpotlight: true
        code: |
          ```swift
          try await supabase.storage
            .createBucket(
              "avatars",
              options: CreateBucketOptions(
                isPublic: false,
                fileSizeLimit: .megabytes(1),
                allowedMimeTypes: ["image/png"]
              )
            )
          ```

  - id: empty-bucket
    title: emptyBucket()
    notes: |
      - RLS policy permissions required:
        - `buckets` table permissions: `select`
        - `objects` table permissions: `select` and `delete`
      - Refer to the [Storage guide](/docs/guides/storage/security/access-control) on how access control works
    examples:
      - id: empty-bucket
        name: Empty bucket
        isSpotlight: true
        code: |
          ```swift
          try await supabase.storage
            .emptyBucket("avatars")
          ```
  - id: update-bucket
    title: updateBucket()
    notes: |
      - RLS policy permissions required:
        - `buckets` table permissions: `select` and `update`
        - `objects` table permissions: none
      - Refer to the [Storage guide](/docs/guides/storage/security/access-control) on how access control works
      - Only the fields you set are sent. The other settings keep their current value. Storage rejects an update that sets no field.
    examples:
      - id: update-bucket
        name: Update bucket
        isSpotlight: true
        code: |
          ```swift
          try await supabase.storage
            .updateBucket(
              "avatars",
              options: UpdateBucketOptions(
                isPublic: false,
                fileSizeLimit: .megabytes(1),
                allowedMimeTypes: ["image/png"]
              )
            )
          ```

  - id: delete-bucket
    title: deleteBucket()
    notes: |
      - RLS policy permissions required:
        - `buckets` table permissions: `select` and `delete`
        - `objects` table permissions: none
      - Refer to the [Storage guide](/docs/guides/storage/security/access-control) on how access control works
    examples:
      - id: delete-bucket
        name: Delete bucket
        isSpotlight: true
        code: |
          ```swift
          try await supabase.storage
            .deleteBucket("avatars")
          ```

  - id: from-upload
    title: from.upload()
    notes: |
      - RLS policy permissions required:
        - `buckets` table permissions: none
        - `objects` table permissions: only `insert` when you are uploading new files and `select`, `insert` and `update` when you are upserting files
      - Refer to the [Storage guide](/docs/guides/storage/security/access-control) on how access control works
      - Pass `data:` for bytes in memory or `fileURL:` for a file on disk. The `fileURL:` overload streams the file and infers the content type from the file extension.
      - The request body is the raw file, not `multipart/form-data`. `metadata` goes in the `x-metadata` header.
      - If you do not set `upsert`, Storage does not replace an existing file.
    examples:
      - id: upload-file
        name: Upload file
        isSpotlight: true
        code: |
          ```swift
          let fileName = "avatar1.png"

          let object = try await supabase.storage
            .from("avatars")
            .upload(
              path: "public/\(fileName)",
              data: fileData,
              options: UploadOptions(
                contentType: "image/png",
                cacheControl: .maxAge(.seconds(3600)),
                upsert: false
              )
            )
          ```
      - id: upload-file-from-url
        name: Upload file from disk
        code: |
          ```swift
          let fileURL = URL(fileURLWithPath: "/path/to/avatar1.png")

          try await supabase.storage
            .from("avatars")
            .upload(path: "public/avatar1.png", fileURL: fileURL)
          ```

  - id: from-update
    title: from.update()
    notes: |
      - RLS policy permissions required:
        - `buckets` table permissions: none
        - `objects` table permissions: `update` and `select`
      - Refer to the [Storage guide](/docs/guides/storage/security/access-control) on how access control works
      - `update` always replaces the file and ignores `upsert`. The file must already exist.
    examples:
      - id: update-file
        name: Update file
        isSpotlight: true
        code: |
          ```swift
          let fileName = "avatar1.png"

          try await supabase.storage
            .from("avatars")
            .update(
              path: "public/\(fileName)",
              data: fileData,
              options: UploadOptions(
                contentType: "image/png",
                cacheControl: .maxAge(.seconds(3600))
              )
            )
          ```

  - id: from-move
    title: from.move()
    notes: |
      - RLS policy permissions required:
        - `buckets` table permissions: none
        - `objects` table permissions: `update` and `select`
      - Refer to the [Storage guide](/docs/guides/storage/security/access-control) on how access control works
      - Pass `toBucket:` to move the file into a different bucket.
    examples:
      - id: move-file
        name: Move file
        isSpotlight: true
        code: |
          ```swift
          try await supabase
            .storage
            .from("avatars")
            .move(from: "public/avatar1.png", to: "private/avatar2.png")
          ```
      - id: move-file-to-another-bucket
        name: Move file to another bucket
        code: |
          ```swift
          try await supabase
            .storage
            .from("avatars")
            .move(from: "public/avatar1.png", to: "avatar1.png", toBucket: "archive")
          ```

  - id: from-copy
    title: from.copy()
    notes: |
      - RLS policy permissions required:
        - `buckets` table permissions: none
        - `objects` table permissions: `insert` and `select`
      - Refer to the [Storage guide](/docs/guides/storage/security/access-control) on how access control works
      - Returns an `UploadedObject`. Its `fullPath` holds the key of the copy. Pass `toBucket:` to copy the file into a different bucket.
    examples:
      - id: copy-file
        name: Copy file
        isSpotlight: true
        code: |
          ```swift
          let copy = try await supabase
            .storage
            .from("avatars")
            .copy(from: "public/avatar1.png", to: "private/avatar2.png")

          print(copy.fullPath) // "avatars/private/avatar2.png"
          ```

  - id: from-create-signed-url
    title: from.createSignedURL()
    notes: |
      - RLS policy permissions required:
        - `buckets` table permissions: none
        - `objects` table permissions: `select`
      - Refer to the [Storage guide](/docs/guides/storage/security/access-control) on how access control works
      - `expiresIn` is a `Duration`. Storage rejects a value less than one second.
    examples:
      - id: create-signed-url
        name: Create Signed URL
        isSpotlight: true
        code: |
          ```swift
          let signedURL = try await supabase.storage
            .from("avatars")
            .createSignedURL(path: "folder/avatar1.png", expiresIn: .seconds(60))
          ```
      - id: create-signed-url-with-transformations
        name: Create a signed URL for an asset with transformations
        isSpotlight: true
        code: |
          ```swift
          let signedURL = try await supabase.storage
            .from("avatars")
            .createSignedURL(
              path: "folder/avatar1.png",
              expiresIn: .seconds(60),
              options: SignedURLOptions(
                transform: ImageTransform(
                  width: 100,
                  height: 100
                )
              )
            )
          ```
      - id: create-signed-url-with-download
        name: Create a signed URL which triggers the download of the asset
        isSpotlight: true
        code: |
          ```swift
          let signedURL = try await supabase.storage
            .from("avatars")
            .createSignedURL(
              path: "folder/avatar1.png",
              expiresIn: .seconds(60),
              options: SignedURLOptions(download: .withOriginalName)
            )
          ```
        note: |
          Use `.withOriginalName` to download with the original file name, or `.named("custom.png")` to specify a custom file name.

  - id: from-create-signed-urls
    title: from.createSignedURLs()
    notes: |
      - RLS policy permissions required:
        - `buckets` table permissions: none
        - `objects` table permissions: `select`
      - Refer to the [Storage guide](/docs/guides/storage/security/access-control) on how access control works
      - Returns one `SignedURLResult` per path, in order. A path that does not exist gives a `.failure` result and does not throw.
    examples:
      - id: create-signed-urls
        name: Create Signed URLs
        isSpotlight: true
        code: |
          ```swift
          let results = try await supabase
            .storage
            .from("avatars")
            .createSignedURLs(
              paths: ["folder/avatar1.png", "folder/avatar2.png"],
              expiresIn: .seconds(60)
            )

          for result in results {
            switch result {
            case .success(let path, let signedURL):
              print(path, signedURL)
            case .failure(let path, let error):
              print(path, "failed:", error)
            }
          }
          ```

  - id: from-create-signed-upload-url
    title: from.createSignedUploadURL()
    description: |
      Create a signed upload URL that can be used to upload files to a bucket.
    notes: |
      - RLS policy permissions required:
        - `buckets` table permissions: none
        - `objects` table permissions: `insert`
      - Refer to the [Storage guide](/docs/guides/storage/security/access-control) on how access control works
      - Signed upload URLs are valid for 2 hours. Pass the returned `token` to `uploadToSignedURL()`.
    examples:
      - id: create-signed-upload-url
        name: Create signed upload URL
        isSpotlight: true
        code: |
          ```swift
          let signedUpload = try await supabase.storage
            .from("avatars")
            .createSignedUploadURL(path: "folder/avatar1.png")
          ```
      - id: create-signed-upload-url-with-options
        name: Create signed upload URL that can replace a file
        code: |
          ```swift
          let signedUpload = try await supabase.storage
            .from("avatars")
            .createSignedUploadURL(
              path: "folder/avatar1.png",
              upsert: true
            )
          ```

  - id: from-upload-to-signed-url
    title: from.uploadToSignedURL()
    description: |
      Upload a file to a bucket using a signed URL.
    notes: |
      - Use this method to upload files using a signed upload URL created with `createSignedUploadURL()`.
      - The token decides whether an existing file is replaced. `upsert` in `UploadOptions` is ignored.
    examples:
      - id: upload-to-signed-url
        name: Upload to signed URL
        isSpotlight: true
        code: |
          ```swift
          let fileData = Data("Hello World".utf8)

          try await supabase.storage
            .from("avatars")
            .uploadToSignedURL(
              path: "folder/avatar1.png",
              token: "your-signed-token",
              data: fileData,
              options: UploadOptions(
                contentType: "text/plain"
              )
            )
          ```
      - id: upload-file-to-signed-url
        name: Upload file from URL to signed URL
        code: |
          ```swift
          let fileURL = URL(fileURLWithPath: "/path/to/file.txt")

          try await supabase.storage
            .from("avatars")
            .uploadToSignedURL(
              path: "folder/avatar1.png",
              token: "your-signed-token",
              fileURL: fileURL,
              options: UploadOptions(
                contentType: "text/plain"
              )
            )
          ```

  - id: from-get-public-url
    title: from.publicURL()
    notes: |
      - The bucket needs to be set to public, either via [updateBucket()](/docs/reference/swift/v3/storage-updatebucket) or by going to Storage on [supabase.com/dashboard](https://supabase.com/dashboard), clicking the overflow menu on a bucket and choosing "Make public"
      - RLS policy permissions required:
        - `buckets` table permissions: none
        - `objects` table permissions: none
      - Refer to the [Storage guide](/docs/guides/storage/security/access-control) on how access control works
      - `publicURL` does not throw and does not send a request.
    examples:
      - id: returns-the-url-for-an-asset-in-a-public-bucket
        name: Returns the URL for an asset in a public bucket
        isSpotlight: true
        code: |
          ```swift
          let publicURL = supabase.storage
            .from("public-bucket")
            .publicURL(path: "folder/avatar1.png")
          ```
      - id: transform-asset-in-public-bucket
        name: Returns the URL for an asset in a public bucket with transformations
        isSpotlight: true
        code: |
          ```swift
          let publicURL = supabase.storage
            .from("public-bucket")
            .publicURL(
              path: "folder/avatar1.png",
              options: PublicURLOptions(
                transform: ImageTransform(
                  width: 100,
                  height: 100
                )
              )
            )
          ```
      - id: download-asset-in-public-bucket
        name: Returns the URL which triggers the download of an asset in a public bucket
        isSpotlight: true
        code: |
          ```swift
          let publicURL = supabase.storage
            .from("public-bucket")
            .publicURL(
              path: "folder/avatar1.png",
              options: PublicURLOptions(download: .withOriginalName)
            )
          ```
        note: |
          Use `.withOriginalName` to download with the original file name, or `.named("custom.png")` to specify a custom file name.

  - id: from-download
    title: from.download()
    notes: |
      - RLS policy permissions required:
        - `buckets` table permissions: none
        - `objects` table permissions: `select`
      - Refer to the [Storage guide](/docs/guides/storage/security/access-control) on how access control works
      - Returns a `DownloadResponse` as soon as the response headers arrive. Read the body once, with `data()` or `write(to:)`.
    examples:
      - id: download-file
        name: Download file
        isSpotlight: true
        code: |
          ```swift
          let data = try await supabase.storage
            .from("avatars")
            .download(path: "folder/avatar1.png")
            .data()
          ```
      - id: download-file-with-transformations
        name: Download file with transformations
        isSpotlight: true
        code: |
          ```swift
          let data = try await supabase.storage
            .from("avatars")
            .download(
              path: "folder/avatar1.png",
              options: DownloadOptions(
                transform: ImageTransform(
                  width: 100,
                  height: 100,
                  quality: 80
                )
              )
            )
            .data()
          ```
      - id: download-file-to-disk
        name: Download file to disk
        code: |
          ```swift
          try await supabase.storage
            .from("avatars")
            .download(path: "folder/avatar1.png")
            .write(to: fileURL)
          ```

  - id: from-remove
    title: from.remove()
    notes: |
      - RLS policy permissions required:
        - `buckets` table permissions: none
        - `objects` table permissions: `delete` and `select`
      - Refer to the [Storage guide](/docs/guides/storage/security/access-control) on how access control works
      - Returns the removed files as `[StorageObject]`. You can ignore the result.
    examples:
      - id: delete-file
        name: Delete file
        isSpotlight: true
        code: |
          ```swift
          try await supabase.storage
            .from("avatars")
            .remove(paths: ["folder/avatar1.png"])
          ```

  - id: from-list
    title: from.list()
    notes: |
      - RLS policy permissions required:
        - `buckets` table permissions: none
        - `objects` table permissions: `select`
      - Refer to the [Storage guide](/docs/guides/storage/security/access-control) on how access control works
      - Options you do not set are not sent. Storage then returns 100 entries from offset 0, sorted by name in ascending order.
    examples:
      - id: list-files-in-a-bucket
        name: List files in a bucket
        isSpotlight: true
        code: |
          ```swift
          let files = try await supabase.storage
            .from("avatars")
            .list(
              path: "folder",
              options: ListOptions(
                limit: 100,
                offset: 0,
                sortBy: .name,
                order: .ascending
              )
            )
          ```
      - id: search-files-in-a-bucket
        name: Search files in a bucket
        code: |
          ```swift
          let files = try await supabase.storage
            .from("avatars")
            .list(
              path: "folder",
              options: ListOptions(
                limit: 100,
                offset: 0,
                sortBy: .name,
                order: .ascending,
                search: "jon"
              )
            )
          ```
