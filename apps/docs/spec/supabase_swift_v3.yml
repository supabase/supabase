  - id: admin-create-custom-provider
    title: 'customProviders.create()'
    description: |
      Create a custom OAuth 2.0 or OIDC provider.
    notes: |
      - Requires `secret` key.
      - Build the settings with `CreateCustomProvider.oauth2(...)` or `CreateCustomProvider.oidc(...)`, then set the optional fields.
      - The identifier must start with `custom:`.
      - For an OIDC provider, the server fetches the discovery document first. The call fails with a `validation_failed` error when the document is unreachable or invalid.
    examples:
      - id: create-oidc-provider
        name: Create an OIDC provider
        isSpotlight: true
        code: |
          ```swift
          let provider = try await admin.customProviders.create(
            .oidc(
              identifier: "custom:acme",
              name: "Acme",
              clientID: "client-id",
              clientSecret: "client-secret",
              issuer: "https://auth.acme.com"
            )
          )
          ```
      - id: create-oauth2-provider
        name: Create an OAuth 2.0 provider
        code: |
          ```swift
          let provider = try await admin.customProviders.create(
            .oauth2(
              identifier: "custom:acme",
              name: "Acme",
              clientID: "client-id",
              clientSecret: "client-secret",
              authorizationURL: URL(string: "https://acme.com/oauth/authorize")!,
              tokenURL: URL(string: "https://acme.com/oauth/token")!,
              userinfoURL: URL(string: "https://acme.com/oauth/userinfo")!
            )
          )
          ```

  - id: admin-get-custom-provider
    title: 'customProviders.provider(identifier:)'
    description: |
      Get a custom provider.
    notes: |
      - Requires `secret` key.
    examples:
      - id: get-custom-provider
        name: Get a custom provider
        isSpotlight: true
        code: |
          ```swift
          let provider = try await admin.customProviders.provider(identifier: "custom:acme")
          ```

