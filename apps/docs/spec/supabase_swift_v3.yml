  - id: oauth-admin-api
    title: 'Overview'
    notes: |
      Admin methods to manage OAuth clients. They live in the `admin.oauth` namespace and require a `secret` key.

      They are only relevant when the OAuth 2.1 server is enabled in Supabase Auth. Call them only on a server. Never ship your `secret` key in an app.

  - id: admin-oauth-list-clients
    title: 'oauth.listClients()'
    description: |
      List all OAuth clients.
    notes: |
      - Requires `secret` key.
      - This method is part of the OAuth 2.1 server administration API.
      - Only works when the OAuth 2.1 server is enabled in your Supabase Auth configuration.
      - Returns `[OAuthClient]`, newest first. The server does not page this list.
    examples:
      - id: list-oauth-clients
        name: List all OAuth clients
        isSpotlight: true
        code: |
          ```swift
          let clients = try await admin.oauth.listClients()
          ```

  - id: admin-oauth-create-client
    title: 'oauth.createClient()'
    description: |
      Create a new OAuth client.
    notes: |
      - Requires `secret` key.
      - This method is part of the OAuth 2.1 server administration API.
      - Only works when the OAuth 2.1 server is enabled in your Supabase Auth configuration.
      - The response holds `clientSecret`. The server returns it only on create and on regenerate.
    overwriteParams:
      - name: client
        type: CreateOAuthClient
        description: >
          The new client, including its name and redirect URIs.
    examples:
      - id: create-oauth-client
        name: Create a new OAuth client
        isSpotlight: true
        code: |
          ```swift
          let client = try await admin.oauth.createClient(
            CreateOAuthClient(
              clientName: "My OAuth App",
              redirectURIs: [URL(string: "https://example.com/callback")!]
            )
          )
          let clientID = client.clientID
          let clientSecret = client.clientSecret
          ```

  - id: admin-oauth-get-client
    title: 'oauth.client(id:)'
    description: |
      Get details of a specific OAuth client.
    notes: |
      - Requires `secret` key.
      - This method is part of the OAuth 2.1 server administration API.
    overwriteParams:
      - name: id
        type: UUID
        description: >
          The ID of the OAuth client to retrieve.
    examples:
      - id: get-oauth-client
        name: Get OAuth client by ID
        isSpotlight: true
        code: |
          ```swift
          let client = try await admin.oauth.client(
            id: UUID(uuidString: "12345678-1234-1234-1234-123456789012")!
          )
          ```

  - id: admin-oauth-update-client
    title: 'oauth.updateClient(id:_:)'
    description: |
      Update an OAuth client.
    notes: |
      - Requires `secret` key.
      - This method is part of the OAuth 2.1 server administration API.
      - The server changes only the fields you set in `UpdateOAuthClient`. `redirectURIs` and `grantTypes` replace the current lists.
    overwriteParams:
      - name: id
        type: UUID
        description: >
          The ID of the OAuth client to update.
      - name: changes
        type: UpdateOAuthClient
        description: >
          The fields to change.
    examples:
      - id: update-oauth-client
        name: Update an OAuth client
        isSpotlight: true
        code: |
          ```swift
          let client = try await admin.oauth.updateClient(
            id: UUID(uuidString: "12345678-1234-1234-1234-123456789012")!,
            UpdateOAuthClient(
              clientName: "My Renamed App",
              redirectURIs: [URL(string: "https://example.com/new-callback")!]
            )
          )
          ```

  - id: admin-oauth-delete-client
    title: 'oauth.deleteClient(id:)'
    description: |
      Delete an OAuth client.
    notes: |
      - Requires `secret` key.
      - This method is part of the OAuth 2.1 server administration API.
      - This action cannot be undone.
    overwriteParams:
      - name: id
        type: UUID
        description: >
          The ID of the OAuth client to delete.
    examples:
      - id: delete-oauth-client
        name: Delete an OAuth client
        isSpotlight: true
        code: |
          ```swift
          try await admin.oauth.deleteClient(
            id: UUID(uuidString: "12345678-1234-1234-1234-123456789012")!
          )
          ```

  - id: admin-oauth-regenerate-client-secret
    title: 'oauth.regenerateClientSecret(id:)'
    description: |
      Regenerate the secret for an OAuth client.
    notes: |
      - Requires `secret` key.
      - This method is part of the OAuth 2.1 server administration API.
      - The old secret will be immediately invalidated.
      - Make sure to update your application with the new secret.
    overwriteParams:
      - name: id
        type: UUID
        description: >
          The ID of the OAuth client whose secret should be regenerated.
    examples:
      - id: regenerate-oauth-client-secret
        name: Regenerate OAuth client secret
        isSpotlight: true
        code: |
          ```swift
          let client = try await admin.oauth.regenerateClientSecret(
            id: UUID(uuidString: "12345678-1234-1234-1234-123456789012")!
          )
          // Store the new secret in your secret manager. Do not log it.
          if let secret = client.clientSecret {
            try await secretManager.store(secret, name: "oauth-client-secret")
          }
          print("Rotated the OAuth client secret")
          ```
  - id: select
    title: 'Fetch data: select()'
    notes: |
      - By default, Supabase projects will return a maximum of 1,000 rows. This setting can be changed in Project API Settings. It's recommended that you keep it low to limit the payload size of accidental or malicious requests. You can use `range()` queries to paginate through your data.
      - `select()` can be combined with [Modifiers](/docs/reference/swift/v3/using-modifiers)
      - `select()` can be combined with [Filters](/docs/reference/swift/v3/using-filters)
      - If using the Supabase hosted platform `apikey` is technically a reserved keyword, since the API gateway will pluck it out for authentication. [It should be avoided as a column name](https://github.com/supabase/supabase/issues/5465).
      - Read the decoded rows from the `value` property of the response. Declare a `Decodable` type and annotate the variable, so the client knows what to decode.
      - Failed queries throw a `PostgrestError`. Its `code` holds the PostgreSQL or PostgREST error code, such as `PGRST116`.
      - v3 also has an experimental typed query API: the `@Table` macro and `from(Todo.self)`. It needs `@_spi(Experimental) import Supabase` and can change in a minor release. The examples on this page use the string-based API.
    examples:
      - id: getting-your-data
        name: Getting your data
        isSpotlight: true
        code: |
          ```swift
          struct Instrument: Decodable {
            let id: Int
            let name: String
          }

          let instruments: [Instrument] = try await supabase
            .from("instruments")
            .select()
            .execute()
            .value
          ```
        data:
          sql: |
            ```sql
            create table
              instruments (id int8 primary key, name text);

            insert into
              instruments (id, name)
            values
              (1, 'violin'),
              (2, 'viola'),
              (3, 'cello');
            ```
        response: |
          ```json
          {
            "data": [
              {
                "id": 1,
                "name": "violin"
              },
              {
                "id": 2,
                "name": "viola"
              },
              {
                "id": 3,
                "name": "cello"
              }
            ],
            "status": 200,
            "statusText": "OK"
          }
          ```
      - id: selecting-specific-columns
        name: Selecting specific columns
        code: |
          ```swift
          struct Instrument: Decodable {
            let name: String
          }

          let instruments: [Instrument] = try await supabase
            .from("instruments")
            .select("name")
            .execute()
            .value
          ```
        data:
          sql: |
            ```sql
            create table
              instruments (id int8 primary key, name text);

            insert into
              instruments (id, name)
            values
              (1, 'violin'),
              (2, 'viola'),
              (3, 'cello');
            ```
        response: |
          ```json
          {
            "data": [
              {
                "name": "violin"
              },
              {
                "name": "viola"
              },
              {
                "name": "cello"
              }
