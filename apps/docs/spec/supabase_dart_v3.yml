  - id: is
    title: isNull()
    description: |
      Matches only rows where a nullable column is `null`. `eq()` cannot match
      `null`. Negate it with `not()` to match rows where the column is not
      `null`.

      Boolean columns also have `isTrue()` and `isFalse()`. Unlike
      `eq(true)`, `isFalse()` and `isTrue()` never match a `null` value.
    examples:
      - id: checking-nullness
        name: Checking for `null`
        isSpotlight: true
        code: |
          ```dart
          final data = await supabase
              .table(Countries.table)
              .select()
              .where(Countries.name.isNull());
          ```
        data:
          sql: |
            ```sql
            create table
              countries (id int8 primary key, name text);

            insert into
              countries (id, name)
            values
              (1, 'null'),
              (2, null);
            ```
        response: |
          ```json
          [
            {
              "id": 2,
              "name": null
            }
          ]
          ```
      - id: with-from
        name: With `from()`
        description: |
          On `from()`, `isFilter()` takes `null`, `true` or `false`. It's named
          `isFilter()` because `is` is a keyword in Dart.
        code: |
          ```dart
          final data = await supabase.from('countries').select().isFilter('name', null);
          ```

