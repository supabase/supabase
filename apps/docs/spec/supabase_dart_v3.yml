  - id: admin-sso-list-providers
    title: 'admin.sso.listProviders()'
    notes: |
      Lists the SAML 2.0 single sign-on identity providers registered on the project.
      - The listed providers leave out `saml.metadataXml`. Use [`admin.sso.getProvider()`](/docs/reference/dart/auth-admin-getprovider) to read it.
      - When both `resourceId` and `resourceIdPrefix` are given, the server filters by `resourceId` alone.
    params:
      - name: resourceId
        isOptional: true
        type: String
        description: Only return the provider with this resource ID.
      - name: resourceIdPrefix
        isOptional: true
        type: String
        description: Only return providers whose resource ID starts with this prefix.
    examples:
      - id: admin-sso-list-providers
        name: List SSO providers
        isSpotlight: true
        code: |
          ```dart
          final providers = await supabase.auth.admin.sso.listProviders();
          for (final provider in providers) {
            print('${provider.id}: ${provider.domains}');
          }
          ```
  - id: admin-sso-create-provider
    title: 'admin.sso.createProvider()'
    notes: |
      Registers a new SAML 2.0 identity provider. Users whose email domain is in `domains` can then sign in with [`signInWithSSO()`](/docs/reference/dart/auth-signinwithsso).
    params:
      - name: options
        isOptional: false
        type: CreateSSOProviderOptions
        description: The provider configuration.
        subContent:
          - name: metadata
            isOptional: false
            type: SAMLMetadata
            description: Where the SAML metadata comes from. `SAMLMetadata.url()` makes the server fetch it from an HTTPS URL, `SAMLMetadata.xml()` passes the XML document inline.
          - name: domains
            isOptional: true
            type: List<String>
            description: Email domains whose users sign in through this provider.
          - name: attributeMapping
            isOptional: true
            type: SAMLAttributeMapping
            description: Maps SAML assertion attributes to user metadata keys.
          - name: nameIdFormat
            isOptional: true
            type: SAMLNameIdFormat
            description: The `NameID` format to request from the identity provider.
          - name: resourceId
            isOptional: true
            type: String
            description: An ID of your choice to look the provider up by.
          - name: disabled
            isOptional: true
            type: bool
            description: Whether sign-in through the provider is turned off.
    examples:
      - id: admin-sso-create-provider
        name: Register a provider from a metadata URL
        isSpotlight: true
        code: |
          ```dart
          final provider = await supabase.auth.admin.sso.createProvider(
            CreateSSOProviderOptions(
              metadata: SAMLMetadata.url(
                Uri.parse('https://idp.example.com/saml/metadata'),
              ),
              domains: ['example.com'],
              attributeMapping: const SAMLAttributeMapping({
                'email': SAMLAttribute(name: 'mail'),
              }),
            ),
          );
          ```
  - id: admin-sso-get-provider
    title: 'admin.sso.getProvider()'
    notes: |
      Gets a registered SAML 2.0 identity provider, including its metadata XML.
    params:
      - name: id
        isOptional: false
        type: String
        description: ID of the provider.
    examples:
      - id: admin-sso-get-provider
        name: Get an SSO provider
        isSpotlight: true
        code: |
          ```dart
          final provider = await supabase.auth.admin.sso.getProvider(
            '22222222-2222-2222-2222-222222222222',
          );
          final metadataXml = provider.saml?.metadataXml;
          ```
  - id: admin-sso-update-provider
    title: 'admin.sso.updateProvider()'
    notes: |
      Updates a registered SAML 2.0 identity provider.
      - A `null` field keeps the stored value, except `nameIdFormat`, which is cleared when it is `null`. Pass the provider's current `saml.nameIdFormat` to keep it.
      - New `metadata` must carry the provider's current entity ID.
    params:
      - name: id
        isOptional: false
        type: String
        description: ID of the provider.
      - name: options
        isOptional: false
        type: UpdateSSOProviderOptions
        description: The changes to apply. `nameIdFormat` is required, the other fields are `metadata`, `domains`, `attributeMapping`, `resourceId` and `disabled`. An empty `domains` list removes every domain.
    examples:
      - id: admin-sso-update-provider
        name: Replace the domains of a provider
        isSpotlight: true
        code: |
          ```dart
          final provider = await supabase.auth.admin.sso.getProvider(
            '22222222-2222-2222-2222-222222222222',
          );
          await supabase.auth.admin.sso.updateProvider(
            provider.id,
            UpdateSSOProviderOptions(
              nameIdFormat: provider.saml?.nameIdFormat,
              domains: ['example.com', 'example.org'],
            ),
          );
          ```
  - id: admin-sso-delete-provider
    title: 'admin.sso.deleteProvider()'
    notes: |
      Removes a registered SAML 2.0 identity provider together with its domains.
    params:
      - name: id
        isOptional: false
        type: String
        description: ID of the provider.
    examples:
      - id: admin-sso-delete-provider
        name: Delete an SSO provider
        isSpotlight: true
        code: |
          ```dart
          await supabase.auth.admin.sso.deleteProvider(
            '22222222-2222-2222-2222-222222222222',
          );
          ```
