  - id: admin-custom-providers-api
    title: 'Custom OIDC/OAuth Provider Admin API'
    category: Auth
    subcategory: Custom Provider Admin
    notes: |
      - Methods under the `supabase.auth.admin.customProviders` namespace manage custom OIDC/OAuth providers programmatically. Requires a `secret` key.
      - These are admin methods and should be called on a trusted server. Never expose your `secret` key in the Flutter app.
      - Custom providers are referenced with a `custom:` prefix when signing in (for example `custom:mycompany`), and are distinct from the OAuth 2.1 server clients managed through `supabase.auth.admin.oauth`.
  - id: admin-custom-providers-list
    title: 'admin.customProviders.listProviders()'
    notes: |
      Lists all custom providers, optionally filtered by provider type.
    params:
      - name: type
        isOptional: true
        type: CustomProviderType
        description: When set, only providers of this type are returned. Either `CustomProviderType.oauth2` or `CustomProviderType.oidc`.
    examples:
      - id: list-custom-providers
        name: List custom providers
        isSpotlight: true
        code: |
          ```dart
          final providers = await supabase.auth.admin.customProviders.listProviders(
            type: CustomProviderType.oidc,
          );
          ```
  - id: admin-custom-providers-create
    title: 'admin.customProviders.createProvider()'
    notes: |
      Creates a new custom OIDC/OAuth provider. For OIDC providers, the server fetches and validates the discovery document at creation time and throws an `AuthApiException` whose `errorCode` is `validation_failed` if it is unreachable or invalid.
    params:
      - name: options
        isOptional: false
        type: CreateCustomProviderOptions
        description: The provider configuration. `providerType`, `identifier`, `name`, `clientId` and `clientSecret` are required. Optional fields include `scopes`, `customClaimsAllowlist`, `attributeMapping`, `authorizationParameters`, `pkceEnabled` and `enabled`. OIDC providers take an `issuer` or `discoveryUrl`, OAuth 2.0 providers take an `authorizationUrl`, `tokenUrl`, `userInfoUrl` and `jwksUri`.
    examples:
      - id: create-custom-provider
        name: Create a custom provider
        isSpotlight: true
        code: |
          ```dart
          final provider = await supabase.auth.admin.customProviders.createProvider(
            CreateCustomProviderOptions(
              providerType: CustomProviderType.oidc,
              identifier: 'custom:mycompany',
              name: 'My Company',
              clientId: 'client-id',
              clientSecret: 'client-secret',
              issuer: 'https://auth.mycompany.com',
              customClaimsAllowlist: ['groups', 'org_id'],
            ),
          );
          ```
  - id: admin-custom-providers-get
    title: 'admin.customProviders.getProvider()'
    notes: |
      Gets details of a specific custom provider by its identifier.
    params:
      - name: identifier
        isOptional: false
        type: String
        description: The provider identifier, for example `custom:mycompany`.
    examples:
      - id: get-custom-provider
        name: Get a custom provider
        isSpotlight: true
        code: |
          ```dart
          final provider = await supabase.auth.admin.customProviders.getProvider(
            'custom:mycompany',
          );
          ```
  - id: admin-custom-providers-update
    title: 'admin.customProviders.updateProvider()'
    notes: |
      Updates an existing custom provider. Only the fields that are given are changed. When `issuer` or `discoveryUrl` changes on an OIDC provider, the server re-fetches and validates the discovery document before persisting.
    params:
      - name: identifier
        isOptional: false
        type: String
        description: The provider identifier, for example `custom:mycompany`.
      - name: options
        isOptional: false
        type: UpdateCustomProviderOptions
        description: The fields to update on the provider.
    examples:
      - id: update-custom-provider
        name: Update a custom provider
        isSpotlight: true
        code: |
          ```dart
          final provider = await supabase.auth.admin.customProviders.updateProvider(
            'custom:mycompany',
            UpdateCustomProviderOptions(
              customClaimsAllowlist: ['groups', 'org_id', 'mail'],
            ),
          );
          ```
  - id: admin-custom-providers-delete
    title: 'admin.customProviders.deleteProvider()'
    notes: |
      Deletes a custom provider by its identifier.
    params:
      - name: identifier
        isOptional: false
        type: String
        description: The provider identifier, for example `custom:mycompany`.
    examples:
      - id: delete-custom-provider
        name: Delete a custom provider
        isSpotlight: true
        code: |
          ```dart
          await supabase.auth.admin.customProviders.deleteProvider('custom:mycompany');
          ```
  - id: functions-api
    title: 'Edge Functions'
    category: Edge Functions
  - id: invoke
    title: 'invoke()'
    description: |
      Invokes a Supabase Edge Function. See the [guide](/docs/guides/functions) for details on writing Functions.
    notes: |
      - When a user is signed in, their access token is sent as the `Authorization` header. Otherwise the project key is sent.
      - Returns a `FunctionsResponse` with the decoded `data`, the `statusCode` and the response `headers`.
      - `data` depends on the `Content-Type` of the response: decoded JSON for `application/json` and any `+json` type, a `Uint8List` for `application/octet-stream`, a `ByteStream` for `text/event-stream`, and a `String` for anything else.
      - A failure throws a `FunctionsException`, which is sealed: `FunctionsFetchException` when no response arrived, `FunctionsRelayException` when the Supabase relay reported an error, and `FunctionsApiException` when the function answered with a status code outside the 2xx range.
    params:
      - name: functionName
        isOptional: false
        type: String
        description: The name of the function to invoke.
      - name: headers
        isOptional: true
        type: Map<String, String>
        description: Custom headers to send with the request. They take precedence over the client's headers.
      - name: body
        isOptional: true
        type: Object
        description: The body of the request. A `String`, a `Uint8List`, or any value that can be encoded as JSON. When `files` is given, the fields of the multipart request as a `Map<String, String>`.
      - name: files
        isOptional: true
        type: Iterable<MultipartFile>
        description: Files to send as a multipart request.
      - name: queryParameters
        isOptional: true
        type: Map<String, Object?>
        description: Query parameters to add to the URL. An `Iterable` value is sent as one parameter per element and a `null` value is left out.
      - name: method
        isOptional: true
        type: HttpMethod
        description: HTTP method of the request. Defaults to `HttpMethod.post`.
      - name: region
        isOptional: true
        type: FunctionsRegion
        description: The region to invoke the function in, for example `FunctionsRegion.euWest1`. Use `FunctionsRegion.custom()` for a region without a constant. Defaults to the region of the client, and `FunctionsRegion.any` lets Supabase pick.
      - name: abortSignal
        isOptional: true
        type: Future<void>
        description: Cancels the in-flight request when the `Future` completes. It must not complete with an error. On abort, a `RequestAbortedException` is thrown.
      - name: requestTimeout
        isOptional: true
        type: Duration
        description: How long the request may go without progress before it is cancelled with a `FunctionsFetchException`. Overrides the timeout of the client.
    examples:
      - id: basic-invocation
        name: Basic invocation
        isSpotlight: true
        code: |
          ```dart
          final response = await supabase.functions.invoke(
            'hello',
            body: {'name': 'Functions'},
          );
          final data = response.data;
          ```
      - id: error-handling
        name: Error handling
        description: |
          `FunctionsException` is sealed, so a `switch` over it covers every failure. `FunctionsRelayException` extends `FunctionsApiException`, so it comes first.
        isSpotlight: true
        code: |
          ```dart
          try {
            await supabase.functions.invoke('hello');
          } on FunctionsException catch (error) {
            final message = switch (error) {
              FunctionsFetchException() => 'The request never reached the function',
              FunctionsRelayException() => 'The relay reported an error',
              FunctionsApiException(:final statusCode) =>
                'The function returned $statusCode: ${error.details}',
            };
            print(message);
          }
          ```
      - id: passing-custom-headers
        name: Passing custom headers
        description: |
          Any `headers` are passed through to the function.
        code: |
          ```dart
          final response = await supabase.functions.invoke(
            'hello',
            headers: {'x-request-source': 'checkout'},
          );
          ```
      - id: invoking-in-a-region
        name: Invoking a function in a region
        code: |
          ```dart
          final response = await supabase.functions.invoke(
            'hello',
            region: FunctionsRegion.euWest1,
          );
          ```
      - id: http-method-and-query-parameters
        name: Using another HTTP method
        code: |
          ```dart
          final response = await supabase.functions.invoke(
            'books',
            method: HttpMethod.get,
            queryParameters: {'author': 'Frank Herbert', 'limit': 10},
          );
          ```
      - id: uploading-files
        name: Uploading files
        description: |
          With `files`, the request is sent as `multipart/form-data` and `body` holds the other form fields.
        code: |
          ```dart
          final response = await supabase.functions.invoke(
            'resize-image',
            body: {'width': '200'},
            files: [
              MultipartFile.fromString('image', 'image data', filename: 'avatar.png'),
            ],
          );
          ```
      - id: server-sent-events
        name: Listening to server-sent events
        description: |
          A function that responds with `text/event-stream` returns a `ByteStream` in `data`.
        code: |
          ```dart
          final response = await supabase.functions.invoke('sse-function');
          final stream = response.data as ByteStream;
          stream.toStringStream().listen(print);
          ```
      - id: aborting-a-request
        name: Aborting a request
        description: |
          Pass an `abortSignal` to cancel the in-flight request. When the `Future` completes, the request is aborted and a `RequestAbortedException` is thrown. A `Future.delayed` puts a deadline on the whole request, while `requestTimeout` only cancels a request that stops making progress.
        code: |
          ```dart
          try {
            final response = await supabase.functions.invoke(
              'hello',
              abortSignal: Future.delayed(const Duration(seconds: 30)),
            );
            final data = response.data;
          } on RequestAbortedException catch (error) {
            print('Request was aborted: $error');
          }
          ```
  - id: database-api
    title: 'Database'
    category: Database
  - id: table
    title: 'Typed tables: table()'
    description: |
      Start a typed query on a table or view.

      `table()` takes a table definition generated from your database schema. Rows come back as
      generated row types instead of `Map<String, dynamic>`, filters and orderings are checked
      against the column types at compile time, and writes only accept the generated insert and
      update types. Learn how to [generate the types](/docs/guides/api/rest/generating-types).
    notes: |
      - Generate the definitions with the [Supabase CLI](/docs/guides/local-development/cli/getting-started) 2.122.0 or newer, and run the command again after every migration:
        ```sh
        dart pub add dev:supabase_typegen
        supabase gen types --lang dart --local > lib/supabase_schema.g.dart
        ```
        `--linked` and `--project-id` generate from a hosted project instead.
      - For every table the file holds a row type (`CountriesRow`), an insert type (`CountriesInsert`), an update type (`CountriesUpdate`), and a class (`Countries`) with the table definition and one constant per column and relation.
      - A table outside the `public` schema carries its schema as a prefix, so `myschema.mytable` becomes `MyschemaMytable`.
      - `from()` still works for untyped access with maps, for example for a table the generated file does not cover. Both can be used on one client.
    params:
      - name: table
        isOptional: false
        type: PostgrestTable<Row, Insert, Update>
        description: The generated table definition, such as `Countries.table`.
    examples:
      - id: query-a-typed-table
        name: Query a typed table
        isSpotlight: true
        code: |
          ```dart
          final List<CountriesRow> countries = await supabase
              .table(Countries.table)
              .select();
          final String? name = countries.first.name;
          ```
        data:
          sql: |
            ```sql
            create table
              countries (id int8 primary key, name text);

            insert into
              countries (id, name)
            values
              (1, 'Mordor'),
              (2, 'Gondor');
            ```
        response: |
          ```json
          [
            {
              "id": 1,
              "name": "Mordor"
            },
            {
              "id": 2,
              "name": "Gondor"
            }
          ]
          ```
  - id: select
    description: |
      Perform a SELECT query on the table or view, reading every column.
    title: 'Fetch data: select()'
    notes: |
      - By default, Supabase projects return a maximum of 1,000 rows. This setting can be changed in Project API Settings. It's recommended that you keep it low to limit the payload size of accidental or malicious requests. You can use `range()` queries to paginate through your data.
      - `select()` can be combined with [Filters](/docs/reference/dart/using-filters)
      - `select()` can be combined with [Modifiers](/docs/reference/dart/using-modifiers)
      - On a typed table, `select()` takes no columns. Use [`selectOnly()`](/docs/reference/dart/selectonly) to read some columns or related rows.
      - `apikey` is a reserved keyword if you're using the [Supabase Platform](/docs/guides/platform) and [should be avoided as a column name](https://github.com/supabase/supabase/issues/5465).
    params:
      - name: columns
        isOptional: true
        type: String
        description: Only on `from()`. The columns to retrieve, separated by commas. Columns can be renamed when returned with `customName:columnName`.
    examples:
      - id: getting-your-data
        name: Getting your data
        isSpotlight: true
        code: |
          ```dart
          final List<InstrumentsRow> instruments = await supabase
              .table(Instruments.table)
              .select();
          ```
        data:
          sql: |
            ```sql
            create table
              instruments (id int8 primary key, name text);

            insert into
              instruments (id, name)
            values
              (1, 'violin'),
              (2, 'viola'),
              (3, 'cello');
            ```
        response: |
          ```json
          [
            {
              "id": 1,
              "name": "violin"
            },
            {
              "id": 2,
              "name": "viola"
            },
            {
              "id": 3,
              "name": "cello"
            }
          ]
          ```
      - id: filtering-ordering-and-limiting
        name: Filtering, ordering and limiting
        description: |
          Filters are methods on the column constants, passed to `where()`.
        code: |
          ```dart
          final List<InstrumentsRow> instruments = await supabase
              .table(Instruments.table)
              .select()
              .where(Instruments.name.eq('violin'))
              .order(Instruments.name.desc())
              .limit(10);
          ```
        data:
          sql: |
            ```sql
            create table
              instruments (id int8 primary key, name text);

            insert into
              instruments (id, name)
            values
              (1, 'violin'),
              (2, 'viola'),
              (3, 'cello');
            ```
        response: |
          ```json
          [
            {
              "id": 1,
              "name": "violin"
            }
          ]
          ```
        hideCodeBlock: true
      - id: querying-with-count-option
        name: Querying with count option
        description: |
          `count()` after `select()` resolves to a `PostgrestResponse` with the rows and the number
          of rows. On its own, `count()` resolves to the number only. Allowed values for the count
          option are [CountOption.exact](https://postgrest.org/en/stable/api.html#exact-count),
          [CountOption.planned](https://postgrest.org/en/stable/api.html#planned-count) and
          [CountOption.estimated](https://postgrest.org/en/stable/api.html#estimated-count).
        code: |
          ```dart
          final PostgrestResponse<List<InstrumentsRow>> response = await supabase
              .table(Instruments.table)
              .select()
              .count(CountOption.exact);
          final List<InstrumentsRow> instruments = response.data;
          final int count = response.count;

          final int total = await supabase.table(Instruments.table).count();
          ```
        data:
          sql: |
            ```sql
            create table
              instruments (id int8 primary key, name text);

            insert into
              instruments (id, name)
            values
              (1, 'violin'),
              (2, 'viola'),
              (3, 'cello');
            ```
        response: |
          ```json
          PostgrestResponse(
            data: [
              {
                "id": 1,
                "name": "violin"
              },
              {
                "id": 2,
                "name": "viola"
              },
              {
                "id": 3,
                "name": "cello"
              }
            ],
            count: 3
          )
          ```
        hideCodeBlock: true
      - id: getting-your-data-without-generated-types
        name: Getting your data without generated types
        description: |
          `from()` takes the table name and returns rows as maps. `select()` then takes the
          columns as a string, in the
          [PostgREST syntax](https://postgrest.org/en/stable/references/api/resource_embedding.html),
          which can also embed related tables.
        code: |
          ```dart
          final List<Map<String, dynamic>> data = await supabase
              .from('instruments')
              .select('id, name');
          ```
        data:
          sql: |
            ```sql
            create table
              instruments (id int8 primary key, name text);

            insert into
              instruments (id, name)
            values
              (1, 'violin'),
              (2, 'viola'),
              (3, 'cello');
            ```
        response: |
          ```json
          [
            {
              "id": 1,
              "name": "violin"
            },
            {
              "id": 2,
              "name": "viola"
            },
            {
              "id": 3,
              "name": "cello"
            }
          ]
          ```
        hideCodeBlock: true
      - id: switching-schemas-per-query
        name: Switching schemas per query
        code: |
          ```dart
          final List<MyschemaMytableRow> data = await supabase
              .table(MyschemaMytable.table)
              .select();
          ```
        data:
          sql: |
            ```sql
            create schema myschema;

            create table myschema.mytable (
              id uuid primary key default gen_random_uuid(),
              data text
            );

            insert into myschema.mytable (data) values ('mydata');
            ```
        response: |
          ```json
          [
            {
              "id": "4162e008-27b0-4c0f-82dc-ccaeee9a624d",
              "data": "mydata"
            }
          ]
          ```
        description: |
          A generated table definition carries its schema, so a typed query needs no extra step.
          With `from()`, switch the schema of one query with
          `supabase.schema('myschema').from('mytable')`. Make sure you've set up your
          [database privileges and API settings](/docs/guides/api/using-custom-schemas), and pass
          the schema to `supabase gen types` with `--schema`.
        hideCodeBlock: true
  - id: select-only
    description: |
      Perform a SELECT query on the table or view, reading only the given columns and related
      rows.
    title: 'Fetch some columns: selectOnly()'
    notes: |
      - The rows come back as `PostgrestPartialRow`s. Read each value with `read()` and the same constant you selected, so it has the type of its column. Reading something that was not selected throws a `StateError`.
      - Every foreign key between two generated tables becomes a relation constant on both sides, named after the table on the other side. A to-one relation reads back as a nullable partial row, a to-many relation as a list of them.
      - Select a relation with one column, `Instruments.orchestralSections(OrchestralSections.name)`, or with several, `Instruments.orchestralSections.select([...])`.
      - Filter, sort and limit the related rows with [`embedded()`](/docs/reference/dart/embedded), or drop the rows without a match with [`requiring()`](/docs/reference/dart/requiring).
      - After a write, `selectOnly()` returns some columns of the written rows.
    params:
      - name: columns
        isOptional: false
        type: List<PostgrestSelectable<Row>>
        description: The columns, relations, JSON paths and aggregates to read. Needs at least one entry. Each entry has to belong to the queried table.
    examples:
      - id: selecting-specific-columns
        name: Selecting specific columns
        isSpotlight: true
        code: |
          ```dart
          final instruments = await supabase.table(Instruments.table).selectOnly([
            Instruments.name,
          ]);
          final String? name = instruments.first.read(Instruments.name);
          ```
        data:
          sql: |
            ```sql
            create table
              instruments (id int8 primary key, name text);

            insert into
              instruments (id, name)
            values
              (1, 'violin'),
              (2, 'viola'),
              (3, 'cello');
            ```
        response: |
          ```json
          [
            {
              "name": "violin"
            },
            {
              "name": "viola"
            },
            {
              "name": "cello"
            }
          ]
          ```
      - id: query-referenced-tables
        name: Query referenced tables
        description: |
          If your database has relationships, you can query related tables too.
        code: |
          ```dart
          final sections = await supabase.table(OrchestralSections.table).selectOnly([
            OrchestralSections.name,
            OrchestralSections.instruments(Instruments.name),
          ]);
          for (final section in sections) {
            final instruments = section.read(OrchestralSections.instruments);
            print(instruments.map((instrument) => instrument.read(Instruments.name)));
          }
          ```
        data:
          sql: |
            ```sql
            create table
              orchestral_sections (id int8 primary key, name text);
            create table
              instruments (
                id int8 primary key,
                section_id int8 references orchestral_sections,
                name text
              );

            insert into
              orchestral_sections (id, name)
            values
              (1, 'strings'),
              (2, 'woodwinds');
            insert into
              instruments (id, section_id, name)
            values
              (1, 2, 'flute'),
              (2, 1, 'violin');
            ```
        response: |
          ```json
          [
            {
              "name": "strings",
              "instruments": [
                {
                  "name": "violin"
                }
              ]
            },
            {
              "name": "woodwinds",
              "instruments": [
                {
                  "name": "flute"
                }
              ]
            }
          ]
          ```
      - id: query-a-to-one-relation
        name: Query a to-one relation
        description: |
          A relation that points at a single row reads back as a nullable partial row.
        code: |
          ```dart
          final instruments = await supabase.table(Instruments.table).selectOnly([
            Instruments.name,
            Instruments.orchestralSections.select([
              OrchestralSections.id,
              OrchestralSections.name,
            ]),
          ]);
          final String? section = instruments.first
              .read(Instruments.orchestralSections)
              ?.read(OrchestralSections.name);
          ```
        data:
          sql: |
            ```sql
            create table
              orchestral_sections (id int8 primary key, name text);
            create table
              instruments (
                id int8 primary key,
                section_id int8 references orchestral_sections,
                name text
              );

            insert into
              orchestral_sections (id, name)
            values
              (1, 'strings'),
              (2, 'woodwinds');
            insert into
              instruments (id, section_id, name)
            values
              (1, 2, 'flute'),
              (2, 1, 'violin');
            ```
        response: |
          ```json
          [
            {
              "name": "flute",
              "orchestral_sections": {
                "id": 2,
                "name": "woodwinds"
              }
            },
            {
              "name": "violin",
              "orchestral_sections": {
                "id": 1,
                "name": "strings"
              }
            }
          ]
          ```
        hideCodeBlock: true
      - id: query-the-same-referenced-table-multiple-times
        name: Query the same referenced table multiple times
        description: |
          When two foreign keys point at the same table, the generator names each relation after
          its column and adds the constraint hint and an alias, so each embed comes back under its
          own key. This example queries a `messages` table that is joined to a `users` table via
          `sender_id` and `receiver_id`.
        code: |
          ```dart
          final messages = await supabase.table(Messages.table).selectOnly([
            Messages.content,
            Messages.usersBySenderId(Users.name),
            Messages.usersByReceiverId(Users.name),
          ]);
          final String? sender = messages.first
              .read(Messages.usersBySenderId)
              ?.read(Users.name);
          ```
        data:
          sql: |
            ```sql
            create table
              users (id int8 primary key, name text);

            create table
              messages (
                id int8 generated by default as identity primary key,
                sender_id int8 not null references users,
                receiver_id int8 not null references users,
                content text
              );

            insert into
              users (id, name)
            values
              (1, 'Kiran'),
              (2, 'Evan');

            insert into
              messages (sender_id, receiver_id, content)
            values
              (1, 2, '👋');
            ```
        response: |
          ```json
          [
            {
              "content": "👋",
              "users_by_sender_id": {
                "name": "Kiran"
              },
              "users_by_receiver_id": {
                "name": "Evan"
              }
            }
          ]
          ```
        hideCodeBlock: true
      - id: every-column-and-a-relation
        name: Every column and a relation
        description: |
          `allColumns` selects every column of the table next to a relation. `toRow()` converts
          such a partial row into the row type.
        code: |
          ```dart
          final instruments = await supabase.table(Instruments.table).selectOnly([
            Instruments.table.allColumns,
            Instruments.orchestralSections(OrchestralSections.name),
          ]);
          final InstrumentsRow instrument = instruments.first.toRow(
            Instruments.table,
          );
          ```
        hideCodeBlock: true
      - id: querying-json-data
        name: Querying JSON data
        description: |
          If you have data inside of a JSONB column, you can select and filter on a path in it.
          `jsonText()` reads a key as text and `jsonObject()` goes deeper. Postgres offers a
          [number of operators](https://www.postgresql.org/docs/current/functions-json.html)
          for querying JSON data.
        code: |
          ```dart
          final city = Users.address.jsonText('city');
          final users = await supabase.table(Users.table).selectOnly([
            Users.id,
            Users.name,
            city,
          ]);
          final String? firstCity = users.first.read(city);
          ```
        data:
          sql: |
            ```sql
            create table
              users (
                id int8 primary key,
                name text,
                address jsonb
              );

            insert into
              users (id, name, address)
            values
              (1, 'Frodo', '{"city":"Hobbiton"}');
            ```
        hideCodeBlock: true
  - id: embedded
    description: |
      Filter, sort and limit the related rows of an embedded relation, leaving the parent rows as
      they are.
    title: 'Scope related rows: embedded()'
    notes: |
      - The relation has to be in the `selectOnly()` list.
      - The callback receives a scope typed against the related table. It offers `where()`, `order()`, `limit()`, `range()` and a nested `embedded()` or `requiring()`.
      - A filter in the scope narrows the related rows only. A parent row without a match still comes back, with an empty list or `null`. Use [`requiring()`](/docs/reference/dart/requiring) to drop such parent rows.
    params:
      - name: relation
        isOptional: false
        type: PostgrestRelation<Row, Target>
        description: The relation whose rows the scope applies to, such as `OrchestralSections.instruments`.
      - name: scope
        isOptional: false
        type: PostgrestEmbeddedScope<Target> Function(PostgrestEmbeddedScope<Target> scope)
        description: Builds the filters, sort keys and row window of the related rows.
    examples:
      - id: filtering-through-referenced-tables
        name: Filtering through referenced tables
        isSpotlight: true
        code: |
          ```dart
          final sections = await supabase
              .table(OrchestralSections.table)
              .selectOnly([
                OrchestralSections.name,
                OrchestralSections.instruments(Instruments.name),
              ])
              .embedded(
                OrchestralSections.instruments,
                (instruments) => instruments.where(Instruments.name.eq('flute')),
              );
          ```
        data:
          sql: |
            ```sql
            create table
              orchestral_sections (id int8 primary key, name text);
            create table
              instruments (
                id int8 primary key,
                section_id int8 references orchestral_sections,
                name text
              );

            insert into
              orchestral_sections (id, name)
            values
              (1, 'strings'),
              (2, 'woodwinds');
            insert into
              instruments (id, section_id, name)
            values
              (1, 2, 'flute'),
              (2, 1, 'violin');
            ```
        response: |
          ```json
          [
            {
              "name": "strings",
              "instruments": []
            },
            {
              "name": "woodwinds",
              "instruments": [
                {
                  "name": "flute"
                }
              ]
            }
          ]
          ```
      - id: ordering-and-limiting-referenced-rows
        name: Ordering and limiting referenced rows
        code: |
          ```dart
          final sections = await supabase
              .table(OrchestralSections.table)
              .selectOnly([
                OrchestralSections.name,
                OrchestralSections.instruments(Instruments.name),
              ])
              .embedded(
                OrchestralSections.instruments,
                (instruments) => instruments.order(Instruments.name).limit(2),
              );
          ```
        data:
          sql: |
            ```sql
            create table
              orchestral_sections (id int8 primary key, name text);
            create table
              instruments (
                id int8 primary key,
                section_id int8 references orchestral_sections,
                name text
              );

            insert into
              orchestral_sections (id, name)
            values
              (1, 'strings');
            insert into
              instruments (id, section_id, name)
            values
              (1, 1, 'violin'),
              (2, 1, 'viola'),
              (3, 1, 'cello');
            ```
        response: |
          ```json
          [
            {
              "name": "strings",
              "instruments": [
                {
                  "name": "cello"
                },
                {
                  "name": "viola"
                }
              ]
            }
          ]
          ```
        hideCodeBlock: true
  - id: requiring
    description: |
      Scope the related rows of an embedded relation like `embedded()`, and drop the parent rows
      that have no matching related row. This is an inner join.
    title: 'Inner join related rows: requiring()'
    notes: |
      - The relation has to be in the `selectOnly()` list.
      - Without a scope, only the parent rows with at least one related row come back.
      - To keep only the parent rows without a related row, filter with `isNull()` on the relation instead.
    params:
      - name: relation
        isOptional: false
        type: PostgrestRelation<Row, Target>
        description: The relation that needs a matching row, such as `Instruments.orchestralSections`.
      - name: scope
        isOptional: true
        type: PostgrestEmbeddedScope<Target> Function(PostgrestEmbeddedScope<Target> scope)
        description: Builds the filters, sort keys and row window of the related rows.
    examples:
      - id: querying-referenced-table-with-inner-join
        name: Querying referenced table with inner join
        isSpotlight: true
        code: |
          ```dart
          final instruments = await supabase
              .table(Instruments.table)
              .selectOnly([
                Instruments.name,
                Instruments.orchestralSections(OrchestralSections.name),
              ])
              .requiring(
                Instruments.orchestralSections,
                (sections) => sections.where(OrchestralSections.name.eq('strings')),
              );
          ```
        data:
          sql: |
            ```sql
            create table
              orchestral_sections (id int8 primary key, name text);
            create table
              instruments (
                id int8 primary key,
                section_id int8 references orchestral_sections,
                name text
              );

            insert into
              orchestral_sections (id, name)
            values
              (1, 'strings'),
              (2, 'woodwinds');
            insert into
              instruments (id, section_id, name)
            values
              (1, 2, 'flute'),
              (2, 1, 'violin');
            ```
        response: |
          ```json
          [
            {
              "name": "violin",
              "orchestral_sections": {
                "name": "strings"
              }
            }
          ]
          ```
      - id: rows-without-a-related-row
        name: Rows without a related row
        description: |
          `isNull()` on a relation keeps only the parent rows that have no related row.
        code: |
          ```dart
          final emptySections = await supabase
              .table(OrchestralSections.table)
              .selectOnly([
                OrchestralSections.name,
                OrchestralSections.instruments(Instruments.id),
              ])
              .where(OrchestralSections.instruments.isNull());
          ```
        data:
          sql: |
            ```sql
            create table
              orchestral_sections (id int8 primary key, name text);
            create table
              instruments (
                id int8 primary key,
                section_id int8 references orchestral_sections,
                name text
              );

            insert into
              orchestral_sections (id, name)
            values
              (1, 'strings'),
              (2, 'percussion');
            insert into
              instruments (id, section_id, name)
            values
              (1, 1, 'violin');
            ```
        response: |
          ```json
          [
            {
              "name": "percussion",
              "instruments": []
            }
          ]
          ```
        hideCodeBlock: true
  - id: insert
    description: |
      Perform an INSERT of a single row into the table or view.
    title: 'Create data: insert()'
    notes: |
      - A required column is a required parameter of the generated insert type. A column the database always generates is not a parameter at all.
      - Passing `null` leaves the column out, so its database default applies. Write SQL `NULL` with the generated `set…ToNull()` methods.
      - The insert resolves to `void`. Chain `select()` to get the inserted row back.
      - Use [`insertAll()`](/docs/reference/dart/insertall) to insert several rows in one request.
    params:
      - name: row
        isOptional: false
        type: Insert
        description: The row to insert, such as `CountriesInsert(...)`. On `from()`, a `Map<String, dynamic>` or a list of them.
      - name: defaultToNull
        isOptional: true
        type: bool
        description: Make missing fields default to `null`. Otherwise, use the default value for the column. Defaults to `true`, which only matters when inserting several rows with `from()`.
    examples:
      - id: create-a-record
        name: Create a record
        isSpotlight: true
        code: |
          ```dart
          await supabase
              .table(Countries.table)
              .insert(CountriesInsert(id: 1, name: 'Mordor'));
          ```
        data:
          sql: |
            ```sql
            create table
              countries (id int8 primary key, name text);
            ```
        hideCodeBlock: true
      - id: fetch-inserted-data
        name: Fetch inserted record
        code: |
          ```dart
          final CountriesRow country = await supabase
              .table(Countries.table)
              .insert(CountriesInsert(id: 1, name: 'Mordor'))
              .select()
              .single();
          ```
        data:
          sql: |
            ```sql
            create table
              countries (id int8 primary key, name text);
            ```
        response: |
          ```json
          {
            "id": 1,
            "name": "Mordor"
          }
          ```
      - id: create-a-record-without-generated-types
        name: Create a record without generated types
        code: |
          ```dart
          await supabase.from('countries').insert({'id': 1, 'name': 'Mordor'});
          ```
        data:
          sql: |
            ```sql
            create table
              countries (id int8 primary key, name text);
            ```
        hideCodeBlock: true
  - id: insert-all
    description: |
      Perform an INSERT of several rows into the table or view in one request.
    title: 'Create many rows: insertAll()'
    notes: |
      - An empty list sends no request.
      - A column left out of only some of the rows gets its database default. Pass `defaultToNull: true` to write `NULL` for it instead.
      - The insert resolves to `void`. Chain `select()` to get the inserted rows back.
    params:
      - name: rows
        isOptional: false
        type: List<Insert>
        description: The rows to insert.
      - name: defaultToNull
        isOptional: true
        type: bool
        description: Write `NULL` for a column that other rows set but a row leaves out, instead of its database default. Defaults to `false`.
    examples:
      - id: bulk-create
        name: Bulk create
        isSpotlight: true
        code: |
          ```dart
          await supabase.table(Countries.table).insertAll([
            CountriesInsert(id: 1, name: 'Mordor'),
            CountriesInsert(id: 2, name: 'Gondor'),
          ]);
          ```
        data:
          sql: |
            ```sql
            create table
              countries (id int8 primary key, name text);
            ```
        hideCodeBlock: true
      - id: fetch-inserted-records
        name: Fetch inserted records
        code: |
          ```dart
          final List<CountriesRow> countries = await supabase
              .table(Countries.table)
              .insertAll([
                CountriesInsert(id: 1, name: 'Mordor'),
                CountriesInsert(id: 2, name: 'Gondor'),
              ])
              .select();
          ```
        data:
          sql: |
            ```sql
            create table
              countries (id int8 primary key, name text);
            ```
        response: |
          ```json
          [
            {
              "id": 1,
              "name": "Mordor"
            },
            {
              "id": 2,
              "name": "Gondor"
            }
          ]
          ```
  - id: update
    description: |
      Perform an UPDATE on the table or view.
    title: 'Modify data: update()'
    notes: |
      - A typed `update()` sends nothing until `where()` picks the rows to update, or `all()` picks every row. The analyzer warns about an `update()` without either.
      - Passing `null` to the generated update type leaves the column unchanged. Write SQL `NULL` with the generated `set…ToNull()` methods.
      - The update resolves to `void`. Chain `select()` to get the updated rows back.
    params:
      - name: values
        isOptional: false
        type: Update
        description: The values to update with, such as `InstrumentsUpdate(...)`. On `from()`, a `Map<String, dynamic>`.
    examples:
      - id: updating-your-data
        name: Update your data
        isSpotlight: true
        code: |
          ```dart
          await supabase
              .table(Instruments.table)
              .update(InstrumentsUpdate(name: 'piano'))
              .where(Instruments.id.eq(1));
          ```
        data:
          sql: |
            ```sql
            create table
              instruments (id int8 primary key, name text);

            insert into
              instruments (id, name)
            values
              (1, 'harpsichord');
            ```
      - id: update-a-record-and-return-it
        name: Update a record and return it
        code: |
          ```dart
          final InstrumentsRow instrument = await supabase
              .table(Instruments.table)
              .update(InstrumentsUpdate(name: 'piano'))
              .where(Instruments.id.eq(1))
              .select()
              .single();
          ```
        data:
          sql: |
            ```sql
            create table
              instruments (id int8 primary key, name text);

            insert into
              instruments (id, name)
            values
              (1, 'harpsichord');
            ```
        response: |
          ```json
          {
            "id": 1,
            "name": "piano"
          }
          ```
        hideCodeBlock: true
      - id: set-a-column-to-null
        name: Set a column to null
        code: |
          ```dart
          await supabase
              .table(Instruments.table)
              .update(InstrumentsUpdate().setNameToNull())
              .where(Instruments.id.eq(1));
          ```
        data:
          sql: |
            ```sql
            create table
              instruments (id int8 primary key, name text);

            insert into
              instruments (id, name)
            values
              (1, 'harpsichord');
            ```
        hideCodeBlock: true
      - id: update-every-row
        name: Update every row
        code: |
          ```dart
          await supabase
              .table(Instruments.table)
              .update(InstrumentsUpdate(name: 'piano'))
              .all();
          ```
        data:
          sql: |
            ```sql
            create table
              instruments (id int8 primary key, name text);

            insert into
              instruments (id, name)
            values
              (1, 'harpsichord'),
              (2, 'organ');
            ```
        hideCodeBlock: true
      - id: updating-json-data
        name: Update JSON data
        code: |
          ```dart
          await supabase
              .table(Users.table)
              .update(
                UsersUpdate(
                  address: {'street': 'Melrose Place', 'postcode': 90210},
                ),
              )
              .where(Users.address.jsonText('postcode').eq('90210'));
          ```
        data:
          sql: |
            ```sql
            create table
              users (
                id int8 primary key,
                name text,
                address jsonb
              );

            insert into
              users (id, name, address)
            values
              (1, 'Michael', '{ "postcode": 90210 }');
            ```
        description: |
          Postgres offers some
          [operators](/docs/guides/database/json#query-the-jsonb-data) for
          working with JSON data. Currently, it is only possible to update the entire JSON document.
        hideCodeBlock: true
      - id: update-without-generated-types
        name: Update without generated types
        code: |
          ```dart
          await supabase.from('instruments').update({'name': 'piano'}).eq('id', 1);
          ```
        data:
          sql: |
            ```sql
            create table
              instruments (id int8 primary key, name text);

            insert into
              instruments (id, name)
            values
              (1, 'harpsichord');
            ```
        hideCodeBlock: true
  - id: upsert
    description: |
      Perform an UPSERT of a single row on the table or view. Depending on the columns passed to `onConflict`, `upsert()` performs the equivalent of `insert()` if a row with the corresponding `onConflict` columns doesn't exist, or if it does exist, performs an alternative action depending on `ignoreDuplicates`.
    title: 'Upsert data: upsert()'
    notes: |
      - Primary keys must be included in the row to upsert on them.
      - The upsert resolves to `void`. Chain `select()` to get the upserted row back.
      - Use [`upsertAll()`](/docs/reference/dart/upsertall) to upsert several rows in one request.
    params:
      - name: row
        isOptional: false
        type: Insert
        description: The row to upsert, such as `InstrumentsInsert(...)`. On `from()`, a `Map<String, dynamic>` or a list of them.
      - name: onConflict
        isOptional: true
        type: List<PostgrestStoredColumn<Row, Object>>
        description: The UNIQUE columns that determine whether two rows are duplicates, such as `[Users.handle]`. Two rows are duplicates if all the `onConflict` columns are equal. Defaults to the primary key. On `from()`, a comma separated `String`.
      - name: ignoreDuplicates
        isOptional: true
        type: bool
        description: If `true`, duplicate rows are ignored. If `false`, duplicate rows are merged with existing rows.
      - name: defaultToNull
        isOptional: true
        type: bool
        description: Make missing fields default to `null`. Otherwise, use the default value for the column. This only applies when inserting new rows, not when merging with existing rows where `ignoreDuplicates` is set to `false`. This also only applies when upserting several rows.
    examples:
      - id: upsert-your-data
        name: Upsert your data
        isSpotlight: true
        code: |
          ```dart
          final InstrumentsRow instrument = await supabase
              .table(Instruments.table)
              .upsert(InstrumentsInsert(id: 1, name: 'piano'))
              .select()
              .single();
          ```
        data:
          sql: |
            ```sql
            create table
              instruments (id int8 primary key, name text);

            insert into
              instruments (id, name)
            values
              (1, 'harpsichord');
            ```
        response: |
          ```json
          {
            "id": 1,
            "name": "piano"
          }
          ```
      - id: upserting-into-tables-with-constraints
        name: Upserting into tables with constraints
        code: |
          ```dart
          await supabase
              .table(Users.table)
              .upsert(
                UsersInsert(handle: 'saoirse', displayName: 'Saoirse'),
                onConflict: [Users.handle],
              );
          ```
        data:
          sql: |
            ```sql
            create table
              users (
                id int8 generated by default as identity primary key,
                handle text not null unique,
                display_name text
              );

            insert into
              users (id, handle, display_name)
            values
              (1, 'saoirse', null);
            ```
        description: |
          Without `onConflict`, `upsert()` uses the primary key to determine conflicts. The row
          above has no `id`, so it would be inserted as a new row and fail, since there is already
          a row with the handle `saoirse`. `onConflict` tells `upsert()` to use another column with
          a unique constraint instead.
        hideCodeBlock: true
      - id: upsert-without-generated-types
        name: Upsert without generated types
        code: |
          ```dart
          await supabase.from('users').upsert({
            'handle': 'saoirse',
            'display_name': 'Saoirse',
          }, onConflict: 'handle');
          ```
        data:
          sql: |
            ```sql
            create table
              users (
                id int8 generated by default as identity primary key,
                handle text not null unique,
                display_name text
              );
            ```
        hideCodeBlock: true
  - id: upsert-all
    description: |
      Perform an UPSERT of several rows on the table or view in one request.
    title: 'Upsert many rows: upsertAll()'
    notes: |
      - An empty list sends no request.
      - A column left out of only some of the rows gets its database default, also when the row merges into an existing one. Pass `defaultToNull: true` to write `NULL` for it instead.
      - The upsert resolves to `void`. Chain `select()` to get the upserted rows back.
    params:
      - name: rows
        isOptional: false
        type: List<Insert>
        description: The rows to upsert.
      - name: onConflict
        isOptional: true
        type: List<PostgrestStoredColumn<Row, Object>>
        description: The UNIQUE columns that determine whether two rows are duplicates. Defaults to the primary key.
      - name: ignoreDuplicates
        isOptional: true
        type: bool
        description: If `true`, duplicate rows are ignored. If `false`, duplicate rows are merged with existing rows.
      - name: defaultToNull
        isOptional: true
        type: bool
        description: Write `NULL` for a column that other rows set but a row leaves out, instead of its database default. Defaults to `false`.
    examples:
      - id: bulk-upsert-your-data
        name: Bulk upsert your data
        isSpotlight: true
        code: |
          ```dart
          await supabase.table(Instruments.table).upsertAll([
            InstrumentsInsert(id: 1, name: 'piano'),
            InstrumentsInsert(id: 2, name: 'harp'),
          ]);
          ```
        data:
          sql: |
            ```sql
            create table
              instruments (id int8 primary key, name text);

            insert into
              instruments (id, name)
            values
              (1, 'harpsichord');
            ```
        hideCodeBlock: true
      - id: bulk-upsert-with-constraints
        name: Bulk upsert with constraints
        code: |
          ```dart
          final List<UsersRow> users = await supabase
              .table(Users.table)
              .upsertAll(
                [
                  UsersInsert(handle: 'saoirse', displayName: 'Saoirse'),
                  UsersInsert(handle: 'kiran', displayName: 'Kiran'),
                ],
                onConflict: [Users.handle],
              )
              .select();
          ```
        data:
          sql: |
            ```sql
            create table
              users (
                id int8 generated by default as identity primary key,
                handle text not null unique,
                display_name text
              );

            insert into
              users (id, handle, display_name)
            values
              (1, 'saoirse', null);
            ```
        response: |
          ```json
          [
            {
              "id": 1,
              "handle": "saoirse",
              "display_name": "Saoirse"
            },
            {
              "id": 2,
              "handle": "kiran",
              "display_name": "Kiran"
            }
          ]
          ```
        hideCodeBlock: true
  - id: delete
    description: |
      Perform a DELETE on the table or view.
    title: 'Delete data: delete()'
    notes: |
      - A typed `delete()` sends nothing until `where()` picks the rows to delete, or `all()` picks every row. The analyzer warns about a `delete()` without either.
      - If you use `delete()` with filters and you have RLS enabled, only rows visible through `SELECT` policies are deleted. Note that by default no rows are visible, so you need at least one `SELECT`/`ALL` policy that makes the rows visible.
      - The delete resolves to `void`. Chain `select()` to get the deleted rows back.
      - A view that cannot be updated has no typed `delete()`.
    examples:
      - id: delete-records
        name: Delete records
        isSpotlight: true
        code: |
          ```dart
          await supabase.table(Countries.table).delete().where(Countries.id.eq(1));
          ```
        data:
          sql: |
            ```sql
            create table
              countries (id int8 primary key, name text);

            insert into
              countries (id, name)
            values
              (1, 'Mordor');
            ```
      - id: delete-multiple-records
        name: Delete multiple records
        code: |
          ```dart
          await supabase
              .table(Countries.table)
              .delete()
              .where(Countries.id.inFilter([1, 2, 3]));
          ```
        data:
          sql: |
            ```sql
            create table
              countries (id int8 primary key, name text);

            insert into
              countries (id, name)
            values
              (1, 'Mordor'), (2, 'Gondor'), (3, 'Rohan');
            ```
      - id: fetch-delete-records
        name: Fetch deleted records
        code: |
          ```dart
          final List<CountriesRow> deleted = await supabase
              .table(Countries.table)
              .delete()
              .where(Countries.id.eq(1))
              .select();
          ```
        data:
          sql: |
            ```sql
            create table
              countries (id int8 primary key, name text);

            insert into
              countries (id, name)
            values
              (1, 'Mordor');
            ```
        response: |
          ```json
          [
            {
              "id": 1,
              "name": "Mordor"
            }
          ]
          ```
      - id: delete-every-row
        name: Delete every row
        code: |
          ```dart
          await supabase.table(Countries.table).delete().all();
          ```
        data:
          sql: |
            ```sql
            create table
              countries (id int8 primary key, name text);

            insert into
              countries (id, name)
            values
              (1, 'Mordor'), (2, 'Gondor');
            ```
        hideCodeBlock: true
      - id: delete-without-generated-types
        name: Delete without generated types
        code: |
          ```dart
          await supabase.from('countries').delete().eq('id', 1);
          ```
        data:
          sql: |
            ```sql
            create table
              countries (id int8 primary key, name text);

            insert into
              countries (id, name)
            values
              (1, 'Mordor');
            ```
        hideCodeBlock: true
  - id: rpc
    title: 'Database Functions: rpc()'
    description: |
      Perform a function call.

      You can call Postgres functions as Remote Procedure Calls, logic in your database that you can execute from anywhere.
      Functions are useful when the logic rarely changes, like for password resets and updates.
    notes: |
      - Type generation adds a method on `supabase.rpc` for every function, named after it in camel case. It takes the arguments as typed parameters and resolves to a typed result.
      - A function that returns rows of a table can be combined with [Filters](/docs/reference/dart/using-filters) and [Modifiers](/docs/reference/dart/using-modifiers), using the column constants of that table.
      - `supabase.rpc('function_name', params: {...})` calls a function without generated types, for example one the generated file has no method for. The generated file explains in a comment why a function has none.
    params:
      - name: fn
        isOptional: false
        type: String
        description: Only on the untyped call. The function name to call.
      - name: params
        isOptional: true
        type: Object
        description: Only on the untyped call. The arguments to pass to the function, as a map of named arguments or the value of a sole unnamed `json` or `jsonb` parameter.
      - name: get
        isOptional: true
        type: bool
        description: Only on the untyped call. Calls the function with a `GET` request in read-only access mode.
    examples:
      - id: call-a-postgres-function-without-arguments
        name: Call a Postgres function without arguments
        code: |
          ```dart
          final String? greeting = await supabase.rpc.helloWorld();
          ```
        data:
          sql: |
            ```sql
            create function hello_world() returns text as $$
              select 'Hello world';
            $$ language sql;
            ```
        response: |
          ```json
          "Hello world"
          ```
        hideCodeBlock: true
        isSpotlight: true
      - id: call-a-postgres-function-with-arguments
        name: Call a Postgres function with arguments
        code: |
          ```dart
          final String? echo = await supabase.rpc.echo(say: '👋');
          ```
        data:
          sql: |
            ```sql
            create function echo(say text) returns text as $$
              select say;
            $$ language sql;
            ```
        response: |
          ```json
          "👋"
          ```
        hideCodeBlock: true
      - id: bulk-processing
        name: Bulk processing
        code: |
          ```dart
          final List<int?> numbers = await supabase.rpc.addOneEach(arr: [1, 2, 3]);
          ```
        data:
          sql: |
            ```sql
            create function add_one_each(arr int[]) returns int[] as $$
              select array_agg(n + 1) from unnest(arr) as n;
            $$ language sql;
            ```
        response: |
          ```json
          [2, 3, 4]
          ```
        description: |
          You can process large payloads by passing in an array as an argument.
        hideCodeBlock: true
      - id: call-a-postgres-function-with-filters
        name: Call a Postgres function with filters
        code: |
          ```dart
          final CountriesRow country = await supabase.rpc
              .listStoredCountries()
              .where(Countries.id.eq(1))
              .single();
          ```
        data:
          sql: |
            ```sql
            create table
              countries (id int8 primary key, name text);

            insert into
              countries (id, name)
            values
              (1, 'Mordor'),
              (2, 'Gondor');

            create function list_stored_countries() returns setof countries as $$
              select * from countries;
            $$ language sql;
            ```
        response: |
          ```json
          {
            "id": 1,
            "name": "Mordor"
          }
          ```
        description: |
          Postgres functions that return rows of a table can also be combined with [Filters](/docs/reference/dart/using-filters) and [Modifiers](/docs/reference/dart/using-modifiers).
        hideCodeBlock: true
      - id: call-a-postgres-function-without-generated-types
        name: Call a Postgres function without generated types
        code: |
          ```dart
          final data = await supabase.rpc('echo', params: {'say': '👋'});
          ```
        data:
          sql: |
            ```sql
            create function echo(say text) returns text as $$
              select say;
            $$ language sql;
            ```
        response: |
          ```json
          "👋"
          ```
        hideCodeBlock: true
  - id: realtime-api
    title: 'Realtime'
    category: Realtime
  - id: subscribe
    description: |
      Creates a channel, listens to its events and joins it.
    title: 'channel().subscribe()'
    notes: |
      - Every listener is a `Stream`. Create the streams of a channel, then call `subscribe()` to join it.
      - Database changes have to be requested before `subscribe()`. A change listener added after it throws a `StateError`. The stream itself can be listened to at any time.
      - `supabase.channel(name)` returns the channel already open under that name and ignores the options passed with it. Remove the channel before reusing its name with other options.
      - `subscribe()` takes an optional timeout for the join. Listen to `onStatusChange` to know when the channel is joined or has failed.
      - All channel streams complete when the channel closes.
      - Realtime is disabled by default for new tables. You can turn it on by [managing replication](/docs/guides/realtime/postgres-changes#replication-setup).
      - If you want to receive the "previous" data for updates and deletes, you will need to set `REPLICA IDENTITY` to `FULL`, like this: `ALTER TABLE your_table REPLICA IDENTITY FULL;`
    params:
      - name: timeout
        isOptional: true
        type: Duration
        description: How long to wait for the server to accept the join. Defaults to the timeout of the Realtime client.
    examples:
      - id: listen-to-database-changes
        name: Listen to database changes
        isSpotlight: true
        description: |
          `onTableChanges()` emits the inserts, updates and deletes of a table as typed changes. It uses the table definitions [generated from your database schema](/docs/guides/api/rest/generating-types).
        code: |
          ```dart
          final channel = supabase.channel('countries');
          channel.onTableChanges(Countries.table).listen((change) {
            switch (change) {
              case TypedPostgresInsert(:final newRow):
                print('Inserted ${newRow.name}');
              case TypedPostgresUpdate(:final newRow):
                print('Updated ${newRow.name}');
              case TypedPostgresDelete(:final oldRow):
                print('Deleted ${oldRow.read(Countries.id)}');
            }
          });
          channel.subscribe();
          ```
      - id: listen-to-inserts
        name: Listen to inserts
        code: |
          ```dart
          final channel = supabase.channel('countries');
          channel
              .onTableChanges(Countries.table, event: PostgresChangeEvent.insert)
              .listen((change) {
                if (change case TypedPostgresInsert(:final newRow)) {
                  print('Inserted ${newRow.name}');
                }
              });
          channel.subscribe();
          ```
      - id: listen-to-updates
        name: Listen to updates
        description: |
          By default, the old row of an update only contains the primary key. If you want to receive the previous values as well you can
          enable full replication for the table you are listening to:

          ```sql
          alter table "your_table" replica identity full;
          ```
        code: |
          ```dart
          final channel = supabase.channel('countries');
          channel
              .onTableChanges(Countries.table, event: PostgresChangeEvent.update)
              .listen((change) {
                if (change case TypedPostgresUpdate(:final newRow)) {
                  print('Updated ${newRow.name}');
                }
              });
          channel.subscribe();
          ```
      - id: listen-to-deletes
        name: Listen to deletes
        description: |
          By default, the old row of a delete only contains the primary key. If you want to receive the deleted row you can
          enable full replication for the table you are listening to:

          ```sql
          alter table "your_table" replica identity full;
          ```
        code: |
          ```dart
          final channel = supabase.channel('countries');
          channel
              .onTableChanges(Countries.table, event: PostgresChangeEvent.delete)
              .listen((change) {
                if (change case TypedPostgresDelete(:final oldRow)) {
                  print('Deleted ${oldRow.read(Countries.id)}');
                }
              });
          channel.subscribe();
          ```
      - id: listening-to-row-level-changes
        name: Listen to row level changes
        description: |
          Pass column filters to `filters` to only receive changes to matching rows. Several filters are combined with `AND`. Each filter is a single `eq`, `neq`, `lt`, `lte`, `gt`, `gte`, `inFilter`, `like`, `ilike`, `matchRegex`, `imatchRegex`, `isNull`, `isTrue`, `isFalse` or `isDistinct`, optionally negated with `not()`.
        code: |
          ```dart
          final channel = supabase.channel('country-200');
          channel
              .onTableChanges(Countries.table, filters: [Countries.id.eq(200)])
              .listen((change) => print('Change received: $change'));
          channel.subscribe();
          ```
      - id: listen-to-some-columns
        name: Listen to some columns
        description: |
          `onTableChangesOnly()` asks the server for the listed columns and the primary key only. The rows are read through those columns.
        code: |
          ```dart
          final channel = supabase.channel('countries');
          channel
              .onTableChangesOnly(Countries.table, columns: [Countries.name])
              .listen((change) {
                if (change case TypedPostgresInsert(:final newRow)) {
                  print('Inserted ${newRow.read(Countries.name)}');
                }
              });
          channel.subscribe();
          ```
      - id: listen-with-on-postgres-changes
        name: Listen without generated types
        description: |
          `onPostgresChanges()` takes the schema and table by name and emits a `PostgresChangePayload` with the rows as maps. Filter with `PostgresChangeFilter`, which supports `eq`, `neq`, `lt`, `lte`, `gt`, `gte`, `inFilter`, `like`, `ilike`, `isFilter`, `match`, `imatch` and `isDistinct`. Set `negate: true` to negate it, pass several to `filters` to combine them with `AND`, and use `select` to receive a subset of the columns.
        code: |
          ```dart
          final channel = supabase.channel('countries');
          channel
              .onPostgresChanges(
                event: PostgresChangeEvent.all,
                schema: 'public',
                table: 'countries',
                filter: PostgresChangeFilter(
                  type: PostgresChangeFilterType.ilike,
                  column: 'name',
                  value: '%land%',
                  negate: true,
                ),
                select: ['id', 'name'],
              )
              .listen((payload) {
                print('${payload.eventType}: ${payload.newRecord}');
              });
          channel.subscribe();
          ```
      - id: listen-to-multiple-events
        name: Listen to multiple events
        description: Create several streams on the same channel before subscribing to it.
        code: |
          ```dart
          final channel = supabase.channel('countries');
          channel
              .onTableChanges(Countries.table, event: PostgresChangeEvent.insert)
              .listen((change) => print('Insert received: $change'));
          channel
              .onTableChanges(Countries.table, event: PostgresChangeEvent.delete)
              .listen((change) => print('Delete received: $change'));
          channel.subscribe();
          ```
      - id: listen-to-broadcast
        name: Listen to broadcast messages
        description: |
          Each message is a map with the `type`, the `event` and the sent data under `payload`.
        code: |
          ```dart
          final channel = supabase.channel('room1');
          channel.onBroadcast(event: 'cursor-pos').listen((message) {
            print('Cursor position received: ${message['payload']}');
          });
          channel.subscribe();
          ```
      - id: listen-to-presence-events
        name: Listen to presence events
        code: |
          ```dart
          final channel = supabase.channel('room1');
          channel.onPresenceSync.listen((_) {
            print('Synced presence state: ${channel.presenceState()}');
          });
          channel.onPresenceJoin.listen((payload) {
            print('Newly joined presences: ${payload.newPresences}');
          });
          channel.onPresenceLeave.listen((payload) {
            print('Newly left presences: ${payload.leftPresences}');
          });
          channel.onStatusChange.listen((change) async {
            if (change.status == RealtimeSubscribeStatus.subscribed) {
              await channel.track({
                'online_at': DateTime.now().toIso8601String(),
              });
            }
          });
          channel.subscribe();
          ```
      - id: listen-to-status-changes
        name: Listen to status changes
        description: |
          `onStatusChange` emits a `RealtimeSubscribeStatusChange`. A failed join is a `channelError` status that carries the error, not an error of the stream.
        code: |
          ```dart
          final channel = supabase.channel('room1');
          channel.onStatusChange.listen((change) {
            switch (change.status) {
              case RealtimeSubscribeStatus.subscribed:
                print('Joined the channel');
              case RealtimeSubscribeStatus.channelError:
                print('Channel failed: ${change.error}');
              case RealtimeSubscribeStatus.timedOut:
                print('The join timed out');
              case RealtimeSubscribeStatus.closed:
                print('Channel closed');
            }
          });
          channel.subscribe(const Duration(seconds: 10));
          ```
      - id: use-a-private-channel
        name: Use a private channel
        description: |
          Pass a `RealtimeChannelConfig` to configure the channel. `private: true` guards it with [Realtime Authorization](/docs/guides/realtime/authorization) policies, and `self: true` delivers your own broadcasts back to you.
        code: |
          ```dart
          final channel = supabase.channel(
            'room1',
            options: const RealtimeChannelConfig(private: true, self: true),
          );
          channel.subscribe();
          ```

  - id: send-broadcast-message
    description: |
      Sends a broadcast message to every client subscribed to the channel.
    title: 'channel.sendBroadcastMessage()'
    notes: |
      - The channel has to be subscribed first, otherwise this throws. Use `httpSend()` to broadcast without subscribing.
      - `payload` is either a map, sent as JSON, or binary data such as a `Uint8List`, sent as a binary frame. Any other value throws an `ArgumentError`.
      - Receivers get the data under the `payload` key of the message emitted by `onBroadcast()`.
      - Resolves to a `ChannelResponse`. Without `ack: true` in the `RealtimeChannelConfig` of the channel, it resolves once the message is written to the socket.
    params:
      - name: event
        isOptional: false
        type: String
        description: The name of the broadcast event.
      - name: payload
        isOptional: false
        type: Object
        description: The data to send, a `Map<String, dynamic>` or binary data.
    examples:
      - id: send-broadcast-message
        name: Send a broadcast message
        isSpotlight: true
        code: |
          ```dart
          final channel = supabase.channel('room1');
          channel.subscribe();

          await channel.sendBroadcastMessage(
            event: 'cursor-pos',
            payload: {'x': 30, 'y': 50},
          );
          ```

  - id: http-send
    description: |
      Sends a broadcast message through the REST API, without subscribing to the channel.
    title: 'channel.httpSend()'
    notes: |
      - Requires a Realtime server running v2.97.0 or newer.
      - Throws a `RealtimeApiException` when the server rejects the message and a `RealtimeTransportException` when the request gets no response within `timeout`.
    params:
      - name: event
        isOptional: false
        type: String
        description: The name of the broadcast event.
      - name: payload
        isOptional: false
        type: Object
        description: The data to send, a `Map<String, dynamic>` or binary data.
      - name: timeout
        isOptional: true
        type: Duration
        description: How long to wait for the response. Defaults to the timeout of the Realtime client.
    examples:
      - id: http-send
        name: Send a message over HTTP
        isSpotlight: true
        code: |
          ```dart
          await supabase
              .channel('room1')
              .httpSend(event: 'cursor-pos', payload: {'x': 30, 'y': 50});
          ```

  - id: track
    description: |
      Shares the state of this client with every other client tracking presence on the channel.
    title: 'channel.track()'
    notes: |
      - Track only after the channel is subscribed.
      - `untrack()` removes the state of this client. Both take an optional `timeout`.
      - `presenceState()` returns the current state as a list of `SinglePresenceState`, each with a `key` and its `presences`.
      - Resolves to a `ChannelResponse`.
    params:
      - name: payload
        isOptional: false
        type: Map<String, dynamic>
        description: The state to share.
      - name: timeout
        isOptional: true
        type: Duration
        description: How long to wait for the server to acknowledge it. Defaults to the timeout of the Realtime client.
    examples:
      - id: track-presence
        name: Track presence
        isSpotlight: true
        code: |
          ```dart
          final channel = supabase.channel('room1');
          channel.onStatusChange.listen((change) async {
            if (change.status == RealtimeSubscribeStatus.subscribed) {
              final response = await channel.track(
                {'user_id': 'user-1'},
                timeout: const Duration(seconds: 5),
              );
              print('Tracked: $response');
            }
          });
          channel.subscribe();
          ```
      - id: untrack-presence
        name: Stop tracking presence
        code: |
          ```dart
          final channel = supabase.channel('room1');
          await channel.untrack();
          ```
      - id: read-presence-state
        name: Read the presence state
        code: |
          ```dart
          final channel = supabase.channel('room1');
          for (final state in channel.presenceState()) {
            print('${state.key}: ${state.presences.length} presences');
          }
          ```

  - id: remove-channel
    description: |
      Unsubscribes and removes Realtime channel from Realtime client.
    title: 'removeChannel()'
    notes: |
      - Removing a channel is a great way to maintain the performance of your project's Realtime service as well as your database if you're listening to Postgres changes. Supabase will automatically handle cleanup 30 seconds after a client is disconnected, but unused channels may cause degradation as more clients are simultaneously subscribed.
      - Resolves to a `ChannelResponse`, normally `ChannelResponse.ok`.
      - Cancel your stream subscriptions as well. The streams of the channel complete once it is removed.
    examples:
      - id: removes-a-channel
        name: Remove a channel
        isSpotlight: true
        code: |
          ```dart
          final channel = supabase.channel('room1');
          final ChannelResponse response = await supabase.removeChannel(channel);
          ```

  - id: remove-all-channels
    description: |
      Unsubscribes and removes all Realtime channels from Realtime client.
    title: 'removeAllChannels()'
    notes: |
      - Removing channels is a great way to maintain the performance of your project's Realtime service as well as your database if you're listening to Postgres changes. Supabase will automatically handle cleanup 30 seconds after a client is disconnected, but unused channels may cause degradation as more clients are simultaneously subscribed.
      - Resolves to one `ChannelResponse` per channel.
    examples:
      - id: remove-all-channels
        name: Remove all channels
        isSpotlight: true
        code: |
          ```dart
          final List<ChannelResponse> responses =
              await supabase.removeAllChannels();
          ```

  - id: get-channels
    description: |
      Returns all Realtime channels as an unmodifiable list.
    title: 'channels'
    notes: |
      - Each channel exposes its `topic` and its `state`, a `ChannelState`.
    examples:
      - id: get-all-channels
        name: Get all channels
        isSpotlight: true
        code: |
          ```dart
          final List<RealtimeChannel> channels = supabase.channels;
          ```
      - id: find-joined-channels
        name: Find the joined channels
        code: |
          ```dart
          final joined = supabase.channels.where(
            (channel) => channel.state == ChannelState.joined,
          );
          ```

  - id: on-connection-status-change
    description: |
      A `Stream` that emits every time the Realtime socket opens or closes.
    title: 'realtime.onStatusChange'
    notes: |
      - Each event is a `RealtimeConnectionStatusChange` with a `RealtimeConnectionStatus` and, when the socket closed, the `RealtimeCloseEvent`.
      - Connection errors are emitted as errors of the stream.
      - Use `supabase.realtime.isConnected` to check whether the socket is open right now.
    examples:
      - id: listen-to-connection-status
        name: Listen to the connection status
        isSpotlight: true
        code: |
          ```dart
          supabase.realtime.onStatusChange.listen(
            (change) => switch (change.status) {
              RealtimeConnectionStatus.open => print('Connected'),
              RealtimeConnectionStatus.closed => print(
                'Disconnected: ${change.closeEvent}',
              ),
            },
            onError: (error) => print('Connection error: $error'),
          );
          ```

  - id: on-heartbeat
    description: |
      A `Stream` that emits a status every time the Realtime client sends a heartbeat, receives an acknowledgement, or when a heartbeat goes unanswered.
    title: 'realtime.onHeartbeat'
    notes: |
      - Each event is a `RealtimeHeartbeatStatus`: `sent` when a heartbeat is pushed, `ok` or `error` when the server acknowledges it, and `timeout` when a prior heartbeat is not answered in time.
      - Useful for observing connection health, for example to surface a reconnecting indicator in your UI.
    examples:
      - id: listen-to-heartbeat
        name: Listen to heartbeat status
        isSpotlight: true
        code: |
          ```dart
          final subscription = supabase.realtime.onHeartbeat.listen((status) {
            print('Heartbeat status: $status');
          });
          ```

  - id: set-access-token
    description: |
      Sets the access token used to authorize channels, and sends it to every joined channel.
    title: 'realtime.setAccessToken()'
    notes: |
      - The client calls it for you whenever the auth session changes. Call it yourself when you manage the access token outside of Supabase Auth.
      - Passing `null` asks the `accessToken` callback of the client for a fresh token, or keeps the current one when there is none.
    params:
      - name: token
        isOptional: false
        type: String?
        description: The access token to use.
    examples:
      - id: set-access-token
        name: Set the access token
        isSpotlight: true
        code: |
          ```dart
          await supabase.realtime.setAccessToken('new-access-token');
          ```

  - id: stream
    description: |
      Returns real-time data from your table as a `Stream`.
    title: 'stream()'
    notes: |
      - Realtime is disabled by default for new tables. You can turn it on by [managing replication](/docs/guides/realtime/postgres-changes#replication-setup).
      - `stream()` fetches the matching rows, then applies every change, and emits the whole list each time. With `table()` it emits a `List` of the generated row type, with `from()` a `List<Map<String, dynamic>>`.
      - Takes the primary key columns, which are used to update and delete the proper rows.
      - `filter()` takes one column filter: `eq`, `neq`, `lt`, `lte`, `gt`, `gte`, `inFilter`, `like`, `ilike`, `matchRegex`, `imatchRegex`, `isNull`, `isTrue`, `isFalse` or `isDistinct`, optionally negated with `not()`. Several `filter()` calls are combined with `AND`. A filter combined with `&` or `|` throws an `ArgumentError`.
      - `order()` and `limit()` sort and cap the rows. `NULL` values sort last ascending and first descending.
      - `streamOnly()` receives only the listed columns and the primary key.
      - To use a private Realtime channel, pass `private: true`.
      - For `UPDATE` events, a filter is only evaluated against the new row. A row that stops matching after an update stays in the list in its last known state until it is deleted or the stream is restarted.
      - A failed fetch is reported as an error of the stream and retried. A dropped connection is not reported, since the rows are fetched again once the channel rejoins. A client error that a retry cannot fix, such as a missing table, closes the stream.
    examples:
      - id: listen-to-table
        name: Listen to a table
        isSpotlight: true
        code: |
          ```dart
          supabase
              .table(Countries.table)
              .stream(primaryKey: [Countries.id])
              .listen((List<CountriesRow> countries) {
                // Do something awesome with the countries
              });
          ```
      - id: with-filter-order-limit
        name: With filter, order and limit
        code: |
          ```dart
          final stream = supabase
              .table(Countries.table)
              .stream(primaryKey: [Countries.id])
              .filter(Countries.continent.eq('Asia'))
              .order(Countries.name)
              .limit(10);
          ```
      - id: with-in-filter
        name: With an IN filter
        code: |
          ```dart
          final stream = supabase
              .table(Countries.table)
              .stream(primaryKey: [Countries.id])
              .filter(Countries.id.inFilter([1, 2, 3]))
              .order(Countries.name.desc());
          ```
      - id: with-multiple-filters
        name: With multiple filters
        description: |
          Multiple filters can be chained together and are combined with `AND`.
        code: |
          ```dart
          final stream = supabase
              .table(Countries.table)
              .stream(primaryKey: [Countries.id])
              .filter(Countries.continent.eq('Asia'))
              .filter(Countries.name.like('%Republic%'));
          ```
      - id: with-some-columns
        name: With some columns
        code: |
          ```dart
          final names = supabase
              .table(Countries.table)
              .streamOnly(primaryKey: [Countries.id], columns: [Countries.name])
              .map((rows) => [for (final row in rows) row.read(Countries.name)]);
          ```
      - id: without-generated-types
        name: Without generated types
        code: |
          ```dart
          supabase
              .from('countries')
              .stream(primaryKey: ['id'])
              .eq('continent', 'Asia')
              .order('name')
              .listen((List<Map<String, dynamic>> data) {
                // Do something awesome with the data
              });
          ```
      - id: using-stream-with-stream-builder
        name: Using `stream()` with `StreamBuilder`
        description: |
          When using `stream()` with a `StreamBuilder` within your Flutter application, make sure to store your stream in a variable to prevent refetching upon rebuilding.
        code: |
          ```dart
          final supabase = Supabase.instance.client;

          class CountryList extends StatefulWidget {
            const CountryList({super.key});

            @override
            State<CountryList> createState() => _CountryListState();
          }

          class _CountryListState extends State<CountryList> {
            // Keep the stream in a field to prevent refetching upon rebuilds
            final _countries = supabase
                .table(Countries.table)
                .stream(primaryKey: [Countries.id]);

            @override
            Widget build(BuildContext context) {
              return StreamBuilder<List<CountriesRow>>(
                stream: _countries,
                builder: (context, snapshot) {
                  if (snapshot.hasError) return Text('${snapshot.error}');
                  final countries = snapshot.data ?? const [];
                  return Column(
                    children: [
                      for (final country in countries) Text(country.name),
                    ],
                  );
                },
              );
            }
          }
          ```
  - id: file-buckets
    title: 'Overview'
    category: Storage
    subcategory: File Buckets
    notes: |
      This section contains methods for working with File Buckets.

  - id: list-buckets
    description: |
      Retrieves the details of all Storage buckets within an existing project.
    title: 'listBuckets()'
    notes: |
      - Policy permissions required:
        - `buckets` permissions: `select`
        - `objects` permissions: none
      - Refer to the [Storage guide](https://supabase.com/docs/guides/storage/security/access-control) on how access control works
    params:
      - name: options
        isOptional: true
        type: ListBucketsOptions
        description: Optionally filter, sort and paginate the returned buckets. Calling `listBuckets()` without any options returns all buckets.
        subContent:
          - name: limit
            isOptional: true
            type: int
            description: The maximum number of buckets to return.
          - name: offset
            isOptional: true
            type: int
            description: The number of buckets to skip.
          - name: search
            isOptional: true
            type: String
            description: A search term used to filter buckets by name.
          - name: sortColumn
            isOptional: true
            type: BucketSortColumn
            description: The column to sort the buckets by. One of `BucketSortColumn.id`, `BucketSortColumn.name`, `BucketSortColumn.createdAt` or `BucketSortColumn.updatedAt`.
          - name: sortOrder
            isOptional: true
            type: SortDirection
            description: The direction to sort the buckets in. Either `SortDirection.ascending` or `SortDirection.descending`.
    examples:
      - id: list-buckets
        name: List buckets
        isSpotlight: true
        code: |
          ```dart
          final List<Bucket> buckets = await supabase.storage.listBuckets();
          ```
      - id: list-buckets-with-options
        name: With filter, sort and pagination
        code: |
          ```dart
          final List<Bucket> buckets = await supabase.storage.listBuckets(
            const ListBucketsOptions(
              limit: 10,
              offset: 0,
              search: 'avatar',
              sortColumn: BucketSortColumn.createdAt,
              sortOrder: SortDirection.descending,
            ),
          );
          ```

  - id: get-bucket
    description: |
      Retrieves the details of an existing Storage bucket.
    title: 'getBucket()'
    notes: |
      - Policy permissions required:
        - `buckets` permissions: `select`
        - `objects` permissions: none
      - Refer to the [Storage guide](https://supabase.com/docs/guides/storage/security/access-control) on how access control works
    params:
      - name: id
        isOptional: false
        type: String
        description: The unique identifier of the bucket you would like to retrieve.
    examples:
      - id: get-bucket
        name: Get bucket
        isSpotlight: true
        code: |
          ```dart
          final Bucket bucket = await supabase.storage.getBucket('avatars');
          print('${bucket.name} is public: ${bucket.public}');
          ```

  - id: create-bucket
    description: |
      Creates a new Storage bucket.
    title: 'createBucket()'
    notes: |
      - Completes once the bucket is created. Use `getBucket()` to read it back.
      - Policy permissions required:
        - `buckets` permissions: `insert`
        - `objects` permissions: none
      - Refer to the [Storage guide](https://supabase.com/docs/guides/storage/security/access-control) on how access control works
    params:
      - name: id
        isOptional: false
        type: String
        description: A unique identifier for the bucket you are creating.
      - name: bucketOptions
        isOptional: true
        type: BucketOptions
        description: Optionally makes the bucket public, limits what it accepts and turns on object versioning.
        subContent:
          - name: public
            isOptional: true
            type: bool
            description: The visibility of the bucket. Public buckets don't require an authorization token to download objects, but still require a valid token for all other operations. A bucket created without it is private.
          - name: fileSizeLimit
            isOptional: true
            type: int
            description: The maximum size in bytes of an uploaded file. The global file size limit takes precedence over this value. Without it, there is no per bucket file size limit.
          - name: allowedMimeTypes
            isOptional: true
            type: List<String>
            description: The MIME types this bucket accepts during upload. Without it, files of every MIME type are accepted. Each MIME type can be a wildcard, for example `image/*`, or a specific MIME type, for example `image/png`.
          - name: versioningStatus
            isOptional: true
            type: VersioningStatus
            description: Whether the bucket keeps previous versions of its objects. Either `VersioningStatus.disabled` or `VersioningStatus.enabled` when creating a bucket.
    examples:
      - id: create-bucket
        name: Create bucket
        isSpotlight: true
        code: |
          ```dart
          await supabase.storage.createBucket('avatars');
          ```
      - id: create-bucket-with-options
        name: With options
        code: |
          ```dart
          await supabase.storage.createBucket(
            'avatars',
            const BucketOptions(
              public: true,
              fileSizeLimit: 1024 * 1024,
              allowedMimeTypes: ['image/*'],
            ),
          );
          ```

  - id: empty-bucket
    description: |
      Removes all objects inside a single bucket.
    title: 'emptyBucket()'
    notes: |
      - The server queues the removal, so objects can still be listed for a while after this completes.
      - Policy permissions required:
        - `buckets` permissions: `select`
        - `objects` permissions: `select` and `delete`
      - Refer to the [Storage guide](https://supabase.com/docs/guides/storage/security/access-control) on how access control works
    params:
      - name: id
        isOptional: false
        type: String
        description: A unique identifier for the bucket you are emptying.
    examples:
      - id: empty-bucket
        name: Empty bucket
        isSpotlight: true
        code: |
          ```dart
          await supabase.storage.emptyBucket('avatars');
          ```

  - id: update-bucket
    description: |
      Updates an existing Storage bucket.
    title: 'updateBucket()'
    notes: |
      - Only the options that are set are changed. The other settings of the bucket stay as they are.
      - Policy permissions required:
        - `buckets` permissions: `update`
        - `objects` permissions: none
      - Refer to the [Storage guide](https://supabase.com/docs/guides/storage/security/access-control) on how access control works
    params:
      - name: id
        isOptional: false
        type: String
        description: A unique identifier for the bucket you are updating.
      - name: bucketOptions
        isOptional: false
        type: BucketOptions
        description: The settings to change.
        subContent:
          - name: public
            isOptional: true
            type: bool
            description: The visibility of the bucket. Public buckets don't require an authorization token to download objects, but still require a valid token for all other operations.
          - name: fileSizeLimit
            isOptional: true
            type: int
            description: The maximum size in bytes of an uploaded file. The global file size limit takes precedence over this value.
          - name: allowedMimeTypes
            isOptional: true
            type: List<String>
            description: The MIME types this bucket accepts during upload. Each MIME type can be a wildcard, for example `image/*`, or a specific MIME type, for example `image/png`.
          - name: versioningStatus
            isOptional: true
            type: VersioningStatus
            description: Whether the bucket keeps previous versions of its objects. Either `VersioningStatus.enabled` or `VersioningStatus.suspended`. A bucket has to be enabled before it can be suspended.
    examples:
      - id: update-bucket
        name: Update bucket
        isSpotlight: true
        code: |
          ```dart
          await supabase.storage.updateBucket(
            'avatars',
            const BucketOptions(public: false),
          );
          ```
      - id: update-bucket-versioning
        name: Enable versioning
        code: |
          ```dart
          await supabase.storage.updateBucket(
            'avatars',
            const BucketOptions(versioningStatus: VersioningStatus.enabled),
          );
          ```

  - id: delete-bucket
    description: |
      Deletes an existing bucket. A bucket can't be deleted with existing objects inside it. You must first `emptyBucket()` the bucket.
    title: 'deleteBucket()'
    notes: |
      - Policy permissions required:
        - `buckets` permissions: `select` and `delete`
        - `objects` permissions: none
      - Refer to the [Storage guide](https://supabase.com/docs/guides/storage/security/access-control) on how access control works
    params:
      - name: id
        isOptional: false
        type: String
        description: A unique identifier for the bucket you are deleting.
    examples:
      - id: delete-bucket
        name: Delete bucket
        isSpotlight: true
        code: |
          ```dart
          await supabase.storage.deleteBucket('avatars');
          ```

  - id: get-bucket-lifecycle
    description: |
      Retrieves the lifecycle policy of a bucket.
    title: 'getBucketLifecycle()'
    notes: |
      - Throws a `StorageApiException` with the error code `NoSuchLifecycleConfiguration` when the bucket has no policy, and `FeatureNotEnabled` when the storage server does not have lifecycle policies enabled.
    params:
      - name: id
        isOptional: false
        type: String
        description: The unique identifier of the bucket.
    examples:
      - id: get-bucket-lifecycle
        name: Get the lifecycle policy
        isSpotlight: true
        code: |
          ```dart
          final List<LifecycleRule> rules = await supabase.storage
              .getBucketLifecycle('avatars');
          ```

  - id: update-bucket-lifecycle
    description: |
      Replaces the lifecycle policy of a bucket.
    title: 'updateBucketLifecycle()'
    notes: |
      - The rules replace the whole policy. A policy has between 1 and 1000 rules.
      - The only action is `noncurrentVersionExpiration`, which expires previous versions of objects. It has nothing to act on until versioning is enabled on the bucket.
      - Returns the stored rules, including the identifiers the server generated for rules without one.
    params:
      - name: id
        isOptional: false
        type: String
        description: The unique identifier of the bucket.
      - name: rules
        isOptional: false
        type: List<LifecycleRule>
        description: The rules of the policy.
    examples:
      - id: update-bucket-lifecycle
        name: Expire previous versions after 30 days
        isSpotlight: true
        code: |
          ```dart
          final rules = await supabase.storage.updateBucketLifecycle('avatars', [
            const LifecycleRule(
              noncurrentVersionExpiration: NoncurrentVersionExpiration(
                noncurrentDays: 30,
              ),
            ),
          ]);
          ```

  - id: delete-bucket-lifecycle
    description: |
      Removes the lifecycle policy of a bucket.
    title: 'deleteBucketLifecycle()'
    notes: |
      - Succeeds even when the bucket has no policy.
    params:
      - name: id
        isOptional: false
        type: String
        description: The unique identifier of the bucket.
    examples:
      - id: delete-bucket-lifecycle
        name: Remove the lifecycle policy
        isSpotlight: true
        code: |
          ```dart
          await supabase.storage.deleteBucketLifecycle('avatars');
          ```

  - id: purge-bucket-cache
    description: |
      Invalidates the CDN cache for every object in a bucket.
    title: 'purgeBucketCache()'
    notes: |
      - Requires the `secret` key and the `purgeCache` feature enabled for your project on the storage server.
      - When `transformations` is `true`, only the resized and formatted variants are purged, leaving the original cached objects intact. Otherwise both are purged.
      - Policy permissions required:
        - `buckets` permissions: `select`
        - `objects` permissions: none
      - Refer to the [Storage guide](https://supabase.com/docs/guides/storage/security/access-control) on how access control works
    params:
      - name: id
        isOptional: false
        type: String
        description: The unique identifier of the bucket whose CDN cache should be purged.
      - name: transformations
        isOptional: true
        type: bool
        description: When true, only the transformed (resized or formatted) variants are purged, leaving the original cached objects intact. Defaults to false.
    examples:
      - id: purge-bucket-cache
        name: Purge the CDN cache for a bucket
        isSpotlight: true
        code: |
          ```dart
          await supabase.storage.purgeBucketCache('avatars');
          ```

  - id: purge-project-cache
    description: |
      Invalidates the CDN cache for every object in every bucket of the project.
    title: 'purgeProjectCache()'
    notes: |
      - Requires the `secret` key and the `purgeCache` feature enabled for your project on the storage server.
    params:
      - name: transformations
        isOptional: true
        type: bool
        description: When true, only the transformed (resized or formatted) variants are purged, leaving the original cached objects intact. Defaults to false.
    examples:
      - id: purge-project-cache
        name: Purge the CDN cache for the project
        isSpotlight: true
        code: |
          ```dart
          await supabase.storage.purgeProjectCache();
          ```

  - id: from-upload
    description: |
      Uploads a file to an existing bucket.
    title: 'from.upload()'
    notes: |
      - Returns an `UploadResponse` with the `id` of the stored object, its `path` within the bucket and its `fullPath`, prefixed with the bucket id.
      - `upload()` streams a `File` from disk. `uploadBinary()` uploads a `Uint8List` and works on the web. `uploadStream()` uploads a `Stream<List<int>>` as it arrives and is never retried, since a stream can only be read once.
      - Failed uploads are not retried unless retries are configured in `StorageClientOptions.retryOptions` or passed as `retryOptions`.
      - For large files that should survive a lost connection or an app restart, use [`resumableUpload()`](/docs/reference/dart/file-buckets-resumableupload).
      - Policy permissions required:
        - `buckets` permissions: none
        - `objects` permissions: `insert`
      - Refer to the [Storage guide](https://supabase.com/docs/guides/storage/security/access-control) on how access control works
    params:
      - name: path
        isOptional: false
        type: String
        description: The relative file path. Should be of the format folder/subfolder/filename.png. The bucket must already exist before attempting to upload.
      - name: file
        isOptional: false
        type: File, Uint8List or Stream<List<int>>
        description: The file to store in the bucket, depending on the method.
      - name: fileOptions
        isOptional: true
        type: FileOptions
        subContent:
          - name: cacheControl
            isOptional: true
            type: String
            description: The number of seconds the asset is cached in the browser and in the Supabase CDN. This is set in the `Cache-Control` header as `max-age=<seconds>`. Defaults to 3600 seconds.
          - name: upsert
            isOptional: true
            type: bool
            description: When upsert is set to true, the file is overwritten if it exists. When set to false, an error is thrown if the object already exists. Defaults to false.
          - name: contentType
            isOptional: true
            type: String
            description: The `Content-Type` header value. Throws a `FormatException` if the media type is invalid.
          - name: metadata
            isOptional: true
            type: Map<String, dynamic>
            description: Additional information about the file, stored with it.
          - name: headers
            isOptional: true
            type: Map<String, String>
            description: Extra headers to send with the upload.
      - name: retryOptions
        isOptional: true
        type: SupabaseRetryOptions
        description: Overrides the retry configuration of the storage client for this upload. Not available on `uploadStream()`.
      - name: abortSignal
        isOptional: true
        type: Future<void>
        description: Aborts the upload and any remaining retries when the future completes. The upload then throws a `RequestAbortedException`.
      - name: onProgress
        isOptional: true
        type: UploadProgressCallback
        description: Called as the file is sent, with the bytes sent so far and the total.
      - name: contentLength
        isOptional: true
        type: int
        description: Only on `uploadStream()`. The total number of bytes of the stream, so the server can reject a file over the size limit before it is sent.
    examples:
      - id: upload-file
        name: Upload file
        isSpotlight: true
        code: |
          ```dart
          final avatarFile = File('path/to/file');
          final UploadResponse response = await supabase.storage
              .from('avatars')
              .upload(
                'public/avatar1.png',
                avatarFile,
                fileOptions: const FileOptions(cacheControl: '3600'),
              );
          print(response.fullPath);
          ```
        response: |
          ```json
          UploadResponse(
            id: 'e668cf7f-821b-4a2f-9dce-7dfa5dd1cfd2',
            path: 'public/avatar1.png',
            fullPath: 'avatars/public/avatar1.png',
            versionId: null
          )
          ```
      - id: upload-file-on-web
        name: Upload file on web
        code: |
          ```dart
          import 'dart:typed_data';

          import 'package:supabase_flutter/supabase_flutter.dart';

          Future<UploadResponse> uploadAvatar(Uint8List bytes) {
            return Supabase.instance.client.storage
                .from('avatars')
                .uploadBinary('public/avatar1.png', bytes);
          }
          ```
      - id: upload-file-from-stream
        name: Upload a stream
        code: |
          ```dart
          final avatarFile = File('path/to/file');
          final response = await supabase.storage
              .from('avatars')
              .uploadStream(
                'public/avatar1.png',
                avatarFile.openRead(),
                contentLength: await avatarFile.length(),
              );
          ```
      - id: upload-file-with-progress
        name: Report progress
        code: |
          ```dart
          final response = await supabase.storage
              .from('avatars')
              .upload(
                'public/avatar1.png',
                File('path/to/file'),
                onProgress: (sentBytes, totalBytes) {
                  print('Sent $sentBytes of $totalBytes bytes');
                },
              );
          ```
      - id: upload-file-with-abort-signal
        name: Abort an upload
        description: |
          Complete the `abortSignal` future to abort the upload, for example from a cancel button or after a timeout.
        code: |
          ```dart
          try {
            await supabase.storage
                .from('avatars')
                .upload(
                  'public/avatar1.png',
                  File('path/to/file'),
                  abortSignal: Future.delayed(const Duration(seconds: 30)),
                );
          } on RequestAbortedException {
            print('The upload took too long');
          }
          ```

  - id: from-resumable-upload
    description: |
      Uploads a file in chunks with the tus protocol, so a large upload can be paused, resumed, cancelled and continued after the app restarts.
    title: 'from.resumableUpload()'
    notes: |
      - The upload starts right away. The returned `ResumableUpload` reports its `progress`, can be paused with `pause()`, continued with `resume()` and stopped with `cancel()`, and its `done` future completes with the `UploadResponse`.
      - `resumableUploadBinary()` uploads a `Uint8List` and works on the web.
      - `supabase.storage.resumableUploads()` lists the uploads that are running, paused or left unfinished by an earlier run of the app. Continue one with `supabase.storage.resumeUpload()` and the same file. `Supabase.initialize` keeps these records in the storage of the session, a `SupabaseClient` keeps them in memory unless `ResumableUploadOptions.storage` is set.
      - Configure the chunk size and retries with `ResumableUploadOptions`, passed as `StorageClientOptions.resumableUploadOptions`. Hosted Supabase only accepts the default chunk size of 6 MiB.
      - Policy permissions required:
        - `buckets` permissions: none
        - `objects` permissions: `insert`
      - Refer to the [Storage guide](https://supabase.com/docs/guides/storage/security/access-control) on how access control works
    params:
      - name: path
        isOptional: false
        type: String
        description: The relative file path. Should be of the format folder/subfolder/filename.png. The bucket must already exist before attempting to upload.
      - name: file
        isOptional: false
        type: File or Uint8List
        description: The file to store in the bucket.
      - name: fileOptions
        isOptional: true
        type: FileOptions
        description: The content type, cache control, upsert and metadata of the object.
      - name: token
        isOptional: true
        type: String
        description: A token created by `createSignedUploadUrl()`, to upload without authentication.
    examples:
      - id: resumable-upload
        name: Upload a large file
        isSpotlight: true
        code: |
          ```dart
          final upload = supabase.storage
              .from('videos')
              .resumableUpload('holiday.mp4', File('path/to/holiday.mp4'));
          upload.progress.listen((progress) {
            print('${progress.bytesUploaded} of ${progress.totalBytes}');
          });
          final UploadResponse response = await upload.done;
          ```
      - id: resume-unfinished-uploads
        name: Continue unfinished uploads
        code: |
          ```dart
          for (final record in await supabase.storage.resumableUploads()) {
            final upload = await supabase.storage.resumeUpload(
              record.id,
              File('path/to/${record.path}'),
            );
            await upload.done;
          }
          ```

  - id: from-update
    description: |
      Replaces an existing file at the specified path with a new one.
    title: 'from.update()'
    notes: |
      - Returns an `UploadResponse` like `upload()` does.
      - `updateBinary()` takes a `Uint8List` and works on the web. `updateStream()` takes a `Stream<List<int>>`.
      - Policy permissions required:
        - `buckets` permissions: none
        - `objects` permissions: `update` and `select`
      - Refer to the [Storage guide](https://supabase.com/docs/guides/storage/security/access-control) on how access control works
    params:
      - name: path
        isOptional: false
        type: String
        description: The relative file path. Should be of the format folder/subfolder/filename.png. The bucket must already exist before attempting to update.
      - name: file
        isOptional: false
        type: File, Uint8List or Stream<List<int>>
        description: The file to store in the bucket, depending on the method.
      - name: fileOptions
        isOptional: true
        type: FileOptions
        subContent:
          - name: cacheControl
            isOptional: true
            type: String
            description: The number of seconds the asset is cached in the browser and in the Supabase CDN. This is set in the `Cache-Control` header as `max-age=<seconds>`. Defaults to 3600 seconds.
          - name: upsert
            isOptional: true
            type: bool
            description: When upsert is set to true, the file is overwritten if it exists. When set to false, an error is thrown if the object already exists. Defaults to false.
          - name: contentType
            isOptional: true
            type: String
            description: The `Content-Type` header value. Throws a `FormatException` if the media type is invalid.
          - name: metadata
            isOptional: true
            type: Map<String, dynamic>
            description: Additional information about the file, stored with it.
      - name: retryOptions
        isOptional: true
        type: SupabaseRetryOptions
        description: Overrides the retry configuration of the storage client for this upload. Not available on `updateStream()`.
      - name: abortSignal
        isOptional: true
        type: Future<void>
        description: Aborts the upload and any remaining retries when the future completes. The upload then throws a `RequestAbortedException`.
      - name: onProgress
        isOptional: true
        type: UploadProgressCallback
        description: Called as the file is sent, with the bytes sent so far and the total.
    examples:
      - id: update-file
        name: Update file
        isSpotlight: true
        code: |
          ```dart
          final avatarFile = File('path/to/local/file');
          final UploadResponse response = await supabase.storage
              .from('avatars')
              .update(
                'public/avatar1.png',
                avatarFile,
                fileOptions: const FileOptions(cacheControl: '3600'),
              );
          ```
        response: |
          ```json
          UploadResponse(
            id: 'e668cf7f-821b-4a2f-9dce-7dfa5dd1cfd2',
            path: 'public/avatar1.png',
            fullPath: 'avatars/public/avatar1.png',
            versionId: null
          )
          ```
      - id: update-file-on-web
        name: Update file on web
        code: |
          ```dart
          import 'dart:typed_data';

          import 'package:supabase_flutter/supabase_flutter.dart';

          Future<UploadResponse> updateAvatar(Uint8List bytes) {
            return Supabase.instance.client.storage
                .from('avatars')
                .updateBinary('public/avatar1.png', bytes);
          }
          ```

  - id: from-upload-to-signed-url
    description: |
      Uploads a file with a token created by `createSignedUploadUrl()`.
    title: 'from.uploadToSignedUrl()'
    notes: |
      - Returns an `UploadResponse`. Its `id` is `null`, because the server does not report it for uploads through a signed URL.
      - `uploadBinaryToSignedUrl()` takes a `Uint8List` and works on the web. `uploadStreamToSignedUrl()` takes a `Stream<List<int>>`.
      - Takes the same named `fileOptions`, `retryOptions`, `abortSignal` and `onProgress` as `upload()`.
    params:
      - name: path
        isOptional: false
        type: String
        description: The file path, including the file name. For example folder/image.png.
      - name: token
        isOptional: false
        type: String
        description: The token created by `createSignedUploadUrl()`.
      - name: file
        isOptional: false
        type: File, Uint8List or Stream<List<int>>
        description: The file to store in the bucket, depending on the method.
      - name: fileOptions
        isOptional: true
        type: FileOptions
        description: The cache control, upsert flag, content type and metadata of the file.
    examples:
      - id: upload-to-signed-url
        name: Upload to a signed URL
        isSpotlight: true
        code: |
          ```dart
          final signed = await supabase.storage
              .from('avatars')
              .createSignedUploadUrl('folder/avatar1.png');

          final UploadResponse response = await supabase.storage
              .from('avatars')
              .uploadToSignedUrl(
                signed.path,
                signed.token,
                File('path/to/file'),
                fileOptions: const FileOptions(contentType: 'image/png'),
              );
          ```

  - id: from-move
    description: |
      Moves an existing file, optionally renaming it at the same time.
    title: 'from.move()'
    notes: |
      - Policy permissions required:
        - `buckets` permissions: none
        - `objects` permissions: `update` and `select`
      - Refer to the [Storage guide](https://supabase.com/docs/guides/storage/security/access-control) on how access control works
    params:
      - name: fromPath
        isOptional: false
        type: String
        description: The original file path, including the current file name. For example folder/image.png.
      - name: toPath
        isOptional: false
        type: String
        description: The new file path, including the new file name. For example folder/image-new.png.
      - name: destinationBucket
        isOptional: true
        type: String
        description: The bucket to move the file to. Defaults to the current bucket.
      - name: sourceVersionId
        isOptional: true
        type: String
        description: Moves that version of the file instead of the current one.
    examples:
      - id: move-file
        name: Move file
        isSpotlight: true
        code: |
          ```dart
          await supabase.storage
              .from('avatars')
              .move('public/avatar1.png', 'private/avatar2.png');
          ```
      - id: move-file-to-another-bucket
        name: Move to another bucket
        code: |
          ```dart
          await supabase.storage
              .from('avatars')
              .move(
                'public/avatar1.png',
                'avatar1.png',
                destinationBucket: 'archive',
              );
          ```

  - id: from-copy
    description: |
      Copies an existing file.
    title: 'from.copy()'
    notes: |
      - Returns an `UploadResponse` describing where the copy was stored.
      - Policy permissions required:
        - `buckets` permissions: none
        - `objects` permissions: `insert` and `select`
      - Refer to the [Storage guide](https://supabase.com/docs/guides/storage/security/access-control) on how access control works
    params:
      - name: fromPath
        isOptional: false
        type: String
        description: The original file path, including the current file name. For example folder/image.png.
      - name: toPath
        isOptional: false
        type: String
        description: The new file path, including the new file name. For example folder/image-copy.png.
      - name: destinationBucket
        isOptional: true
        type: String
        description: The bucket to copy the file to. Defaults to the current bucket.
      - name: sourceVersionId
        isOptional: true
        type: String
        description: Copies that version of the file instead of the current one.
    examples:
      - id: copy-file
        name: Copy file
        isSpotlight: true
        code: |
          ```dart
          final UploadResponse copy = await supabase.storage
              .from('avatars')
              .copy('public/avatar1.png', 'private/avatar2.png');
          ```
        response: |
          ```json
          UploadResponse(
            id: 'a3b1c2d4-821b-4a2f-9dce-7dfa5dd1cfd2',
            path: 'private/avatar2.png',
            fullPath: 'avatars/private/avatar2.png',
            versionId: null
          )
          ```

  - id: from-create-signed-url
    description: |
      Creates a signed URL to download a file without requiring permissions. This URL can be valid for a set number of seconds.
    title: 'from.createSignedUrl()'
    notes: |
      - Policy permissions required:
        - `buckets` permissions: none
        - `objects` permissions: `select`
      - Refer to the [Storage guide](https://supabase.com/docs/guides/storage/security/access-control) on how access control works
    params:
      - name: path
        isOptional: false
        type: String
        description: The file path, including the file name. For example folder/image.png.
      - name: expiresIn
        isOptional: false
        type: int
        description: The number of seconds until the signed URL expires. For example, 60 for a URL which is valid for one minute.
      - name: download
        isOptional: true
        type: DownloadBehavior
        description: Triggers the file to be downloaded rather than opened in the browser. Use `DownloadBehavior.withOriginalName` to keep the original file name or `DownloadBehavior.named('custom.png')` to override it.
      - name: cacheNonce
        isOptional: true
        type: String
        description: Appends a `cacheNonce` query parameter to the signed URL to bypass CDN caching for a specific file version.
      - name: versionId
        isOptional: true
        type: String
        description: Signs that version of the file instead of the current one.
      - name: transform
        isOptional: true
        type: TransformOptions
        description: Transform the asset before serving it to the client.
        subContent:
          - name: width
            isOptional: true
            type: int
            description: The width of the image in pixels.
          - name: height
            isOptional: true
            type: int
            description: The height of the image in pixels.
          - name: resize
            isOptional: true
            type: ResizeMode
            description: Specifies how image cropping should be handled when performing image transformations. Defaults to `ResizeMode.cover`.
          - name: quality
            isOptional: true
            type: int
            description: Set the quality of the returned image. A number from 20 to 100, with 100 being the highest quality. Defaults to 80
          - name: format
            isOptional: true
            type: RequestImageFormat
            description: Specify the format of the image requested. When using 'origin' we force the format to be the same as the original image. When this option is not passed in, images are optimized to modern image formats like Webp.
    examples:
      - id: create-signed-url
        name: Create Signed URL
        isSpotlight: true
        code: |
          ```dart
          final String signedUrl = await supabase.storage
              .from('avatars')
              .createSignedUrl('avatar1.png', 60);
          ```
        response: |
          ```json
          'https://example.supabase.co/storage/v1/object/sign/avatars/avatar1.png?token=<TOKEN>'
          ```
      - id: create-signed-url-with-transform
        name: With transform
        code: |
          ```dart
          final String signedUrl = await supabase.storage
              .from('avatars')
              .createSignedUrl(
                'avatar1.png',
                60,
                transform: const TransformOptions(width: 200, height: 200),
              );
          ```
      - id: create-signed-url-with-download
        name: With download
        code: |
          ```dart
          final String signedUrl = await supabase.storage
              .from('avatars')
              .createSignedUrl(
                'avatar1.png',
                60,
                download: DownloadBehavior.withOriginalName,
              );
          ```
      - id: create-signed-url-with-cache-nonce
        name: Bypass the CDN cache
        code: |
          ```dart
          final String signedUrl = await supabase.storage
              .from('avatars')
              .createSignedUrl('avatar1.png', 60, cacheNonce: 'v2');
          ```

  - id: from-create-signed-urls
    description: |
      Creates signed URLs for several files at once.
    title: 'from.createSignedUrls()'
    notes: |
      - Returns one `SignedUrlResult` per path: a `SignedUrlSuccess` with the `signedUrl`, or a `SignedUrlFailure` with the `error` when the server could not sign that path, for example because the file does not exist.
      - Policy permissions required:
        - `buckets` permissions: none
        - `objects` permissions: `select`
      - Refer to the [Storage guide](https://supabase.com/docs/guides/storage/security/access-control) on how access control works
    params:
      - name: paths
        isOptional: false
        type: List<String>
        description: The file paths, including the file names. For example ['folder/image.png'].
      - name: expiresIn
        isOptional: false
        type: int
        description: The number of seconds until the signed URLs expire.
      - name: download
        isOptional: true
        type: DownloadBehavior
        description: Triggers the files to be downloaded rather than opened in the browser.
      - name: cacheNonce
        isOptional: true
        type: String
        description: Appends a `cacheNonce` query parameter to each URL to bypass CDN caching.
    examples:
      - id: create-signed-urls
        name: Create signed URLs
        isSpotlight: true
        code: |
          ```dart
          final results = await supabase.storage
              .from('avatars')
              .createSignedUrls(['avatar1.png', 'avatar2.png'], 60);
          for (final result in results) {
            switch (result) {
              case SignedUrlSuccess(:final signedUrl):
                print(signedUrl);
              case SignedUrlFailure(:final path, :final error):
                print('Could not sign $path: $error');
            }
          }
          ```

  - id: from-create-signed-upload-url
    description: |
      Creates a signed upload URL. Signed upload URLs can be used to upload files to a bucket without further authentication.
    title: 'from.createSignedUploadUrl()'
    notes: |
      - Returns a `SignedUploadUrlResponse` with the `path`, the `signedUrl` and the `token` to pass to [`uploadToSignedUrl()`](/docs/reference/dart/file-buckets-uploadtosignedurl).
      - The storage server decides how long the URL stays valid. It is 2 hours by default.
      - Policy permissions required:
        - `buckets` permissions: none
        - `objects` permissions: `insert`
      - Refer to the [Storage guide](https://supabase.com/docs/guides/storage/security/access-control) on how access control works
    params:
      - name: path
        isOptional: false
        type: String
        description: The file path, including the current file name. For example folder/image.png.
      - name: upsert
        isOptional: true
        type: bool
        description: If true, the signed URL allows overwriting an existing file at the path. Defaults to false.
    examples:
      - id: create-signed-upload-url
        name: Create signed upload URL
        isSpotlight: true
        code: |
          ```dart
          final SignedUploadUrlResponse response = await supabase.storage
              .from('avatars')
              .createSignedUploadUrl('folder/avatar1.png');
          ```
      - id: create-signed-upload-url-with-upsert
        name: With upsert
        code: |
          ```dart
          final response = await supabase.storage
              .from('avatars')
              .createSignedUploadUrl('folder/avatar1.png', upsert: true);
          ```

  - id: from-get-public-url
    description: |
