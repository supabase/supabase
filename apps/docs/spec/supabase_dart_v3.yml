  - id: text-search
    title: textSearch()
    description: |
      Matches only rows where a `text` or `tsvector` column matches the full
      text search query.
    params:
      - name: query
        isOptional: false
        type: String
        description: The text search query.
      - name: config
        isOptional: true
        type: String
        description: The text search configuration, such as `english`. Defaults to the configuration of the database.
      - name: type
        isOptional: true
        type: TextSearchType
        description: How the query is parsed. Defaults to `to_tsquery`.
    examples:
      - id: text-search
        name: Text search
        isSpotlight: true
        code: |
          ```dart
          final data = await supabase
              .table(Quotes.table)
              .selectOnly([Quotes.catchphrase])
              .where(Quotes.catchphrase.textSearch("'fat' & 'cat'", config: 'english'));
          ```
        data:
          sql: |
            ```sql
            create table
              quotes (
                id int8 primary key,
                catchphrase text
              );

            insert into
              quotes (id, catchphrase)
            values
              (1, 'The cat sat on the mat'),
              (2, 'The fat cat sat on the mat');
            ```
        response: |
          ```json
          [
            {
              "catchphrase": "The fat cat sat on the mat"
            }
          ]
          ```
      - id: basic-normalization
        name: Basic normalization
        description: Uses the `plainto_tsquery` function of Postgres.
        code: |
          ```dart
          final data = await supabase
              .table(Quotes.table)
              .selectOnly([Quotes.catchphrase])
              .where(
                Quotes.catchphrase.textSearch(
                  'fat cat',
                  type: TextSearchType.plain,
                  config: 'english',
                ),
              );
          ```
      - id: full-normalization
        name: Full normalization
        description: Uses the `phraseto_tsquery` function of Postgres.
        code: |
          ```dart
          final data = await supabase
              .table(Quotes.table)
              .selectOnly([Quotes.catchphrase])
              .where(
                Quotes.catchphrase.textSearch(
                  'fat cat',
                  type: TextSearchType.phrase,
                  config: 'english',
                ),
              );
          ```
      - id: web-search
        name: Websearch
        description: |
          Uses the `websearch_to_tsquery` function of Postgres. It never
          raises syntax errors, so it accepts raw user input, and supports
          these operators:

          - `unquoted text`: words are combined with `&`, as with `plainto_tsquery`.
          - `"quoted text"`: words are combined with `<->`, as with `phraseto_tsquery`.
          - `or`: becomes the `|` operator.
          - `-`: becomes the `!` operator.
        code: |
          ```dart
          final data = await supabase
              .table(Quotes.table)
              .selectOnly([Quotes.catchphrase])
              .where(
                Quotes.catchphrase.textSearch(
                  'fat or cat',
                  type: TextSearchType.websearch,
                  config: 'english',
                ),
              );
          ```
      - id: with-from
        name: With `from()`
        code: |
          ```dart
          final data = await supabase
              .from('quotes')
              .select('catchphrase')
              .textSearch('catchphrase', "'fat' & 'cat'", config: 'english');
          ```

  - id: match
    title: match()
    description: |
      Matches only rows where every given column equals its value. On
      `table()`, combine `eq()` filters with `&`. On `from()`, pass a map of
      column names to values to `match()`.
    params:
      - name: query
        isOptional: false
        type: Map<String, Object>
        description: The column names mapped to the values to match, for `from()`.
    examples:
      - id: with-select
        name: With `select()`
        isSpotlight: true
        code: |
          ```dart
          final data = await supabase
              .table(Countries.table)
              .select()
              .where(Countries.id.eq(2) & Countries.name.eq('Albania'));
          ```
        data:
          sql: |
            ```sql
            create table
              countries (id int8 primary key, name text);

            insert into
              countries (id, name)
            values
              (1, 'Afghanistan'),
              (2, 'Albania'),
              (3, 'Algeria');
            ```
        response: |
          ```json
          [
            {
              "id": 2,
              "name": "Albania"
            }
          ]
          ```
      - id: with-from
        name: With `from()`
        code: |
          ```dart
          final data = await supabase.from('countries').select().match({
            'id': 2,
            'name': 'Albania',
          });
          ```

  - id: not
    title: not()
    description: |
      Matches only rows that don't satisfy the filter. Call it on any filter,
      including a combined one.
    examples:
      - id: with-select
        name: With `select()`
        isSpotlight: true
        code: |
          ```dart
          final data = await supabase
              .table(Countries.table)
              .select()
              .where(Countries.name.isNull().not());
          ```
        data:
          sql: |
            ```sql
            create table
              countries (id int8 primary key, name text);

            insert into
              countries (id, name)
            values
              (1, 'null'),
              (2, null);
            ```
        response: |
          ```json
          [
            {
              "id": 1,
              "name": "null"
            }
          ]
          ```
      - id: with-delete
        name: With `delete()`
        code: |
          ```dart
          await supabase
              .table(Countries.table)
              .delete()
              .where(Countries.name.inFilter(['Albania', 'Algeria']).not());
          ```
      - id: with-from
        name: With `from()`
        description: |
          On `from()`, `not()` takes the column, the operator and the value in
          [PostgREST syntax](https://postgrest.org/en/stable/api.html#horizontal-filtering-rows).
        code: |
          ```dart
          final data = await supabase
              .from('countries')
              .select()
              .not('name', 'is', null);
          ```

  - id: or
    title: or()
    description: |
      Matches only rows that satisfy at least one of the filters. On `table()`,
      combine filters with `|`.
    notes: |
      - On `from()`, `or()` takes the filters in raw
        [PostgREST syntax](https://postgrest.org/en/stable/api.html#horizontal-filtering-rows),
        separated by commas, and an optional `referencedTable`.
    params:
      - name: filters
        isOptional: false
        type: String
        description: The filters in PostgREST syntax, for `from()`.
      - name: referencedTable
        isOptional: true
        type: String
        description: Set this to filter on a referenced table instead of the parent table, for `from()`.
    examples:
      - id: with-select
        name: With `select()`
        isSpotlight: true
        code: |
          ```dart
          final data = await supabase
              .table(Countries.table)
              .selectOnly([Countries.name])
              .where(Countries.id.eq(2) | Countries.name.eq('Algeria'));
          ```
        data:
          sql: |
            ```sql
            create table
              countries (id int8 primary key, name text);

            insert into
              countries (id, name)
            values
              (1, 'Afghanistan'),
              (2, 'Albania'),
              (3, 'Algeria');
            ```
        response: |
          ```json
          [
            {
              "name": "Albania"
            },
            {
              "name": "Algeria"
            }
          ]
          ```
      - id: use-or-with-and
        name: Use `|` with `&`
        code: |
          ```dart
          final data = await supabase
              .table(Countries.table)
              .selectOnly([Countries.name])
              .where(
                Countries.id.gt(3) |
                    (Countries.id.eq(1) & Countries.name.eq('Afghanistan')),
              );
          ```
        data:
          sql: |
            ```sql
            create table
              countries (id int8 primary key, name text);

            insert into
              countries (id, name)
            values
              (1, 'Afghanistan'),
              (2, 'Albania'),
              (3, 'Algeria');
            ```
        response: |
          ```json
          [
            {
              "name": "Afghanistan"
            }
          ]
          ```
      - id: use-or-on-referenced-tables
        name: Use `|` on referenced tables
        code: |
          ```dart
          final data = await supabase
              .table(OrchestralSections.table)
              .selectOnly([
                OrchestralSections.name,
                OrchestralSections.instruments.select([Instruments.name]),
              ])
              .requiring(
                OrchestralSections.instruments,
                (instruments) => instruments.where(
                  Instruments.sectionId.eq(1) | Instruments.name.eq('guzheng'),
                ),
              );
          ```
        data:
          sql: |
            ```sql
            create table
              orchestral_sections (id int8 primary key, name text);
            create table
              instruments (
                id int8 primary key,
                section_id int8 not null references orchestral_sections,
                name text
              );

            insert into
              orchestral_sections (id, name)
            values
              (1, 'strings'),
              (2, 'woodwinds');
            insert into
              instruments (id, section_id, name)
            values
              (1, 2, 'flute'),
              (2, 1, 'violin');
            ```
        response: |
          ```json
          [
            {
              "name": "strings",
              "instruments": [
                {
                  "name": "violin"
                }
              ]
            }
          ]
          ```
        hideCodeBlock: true
      - id: with-from
        name: With `from()`
        code: |
          ```dart
          final data = await supabase
              .from('countries')
              .select('name')
              .or('id.eq.2,name.eq.Algeria');
          ```

  - id: filter
    title: raw()
    description: |
      Applies an operator that has no method of its own, written in
      [PostgREST syntax](https://postgrest.org/en/stable/api.html#horizontal-filtering-rows).
      Use it only as an escape hatch when no other filter works.

      `raw()` on a column keeps the column checked and takes the operator and
      value as one string. `PostgrestFilter.raw()` takes the column as a
      string too, for an expression no column constant can name. The string is
      sent as written, so keep it out of `|` and `not()` unless it is valid
      inside an `or` filter.
    params:
      - name: operand
        isOptional: false
        type: String
        description: The operator and value, such as `in.("Albania","Algeria")`.
    examples:
      - id: with-select
        name: With `select()`
        isSpotlight: true
        code: |
          ```dart
          final data = await supabase
              .table(Countries.table)
              .select()
              .where(Countries.name.raw('in.("Albania","Algeria")'));
          ```
        data:
          sql: |
            ```sql
            create table
              countries (id int8 primary key, name text);

            insert into
              countries (id, name)
            values
              (1, 'Afghanistan'),
              (2, 'Albania'),
              (3, 'Algeria');
            ```
        response: |
          ```json
          [
            {
              "id": 2,
              "name": "Albania"
            },
            {
              "id": 3,
              "name": "Algeria"
            }
          ]
          ```
      - id: on-an-expression
        name: On an expression
        code: |
          ```dart
          final data = await supabase
              .table(Countries.table)
              .select()
              .where(PostgrestFilter.raw('id::text', 'like.1%'));
          ```
      - id: with-from
        name: With `from()`
        description: |
          On `from()`, `filter()` takes the column, the operator and the value
          in PostgREST syntax.
        code: |
          ```dart
          final data = await supabase
              .from('countries')
              .select()
              .filter('name', 'in', '("Albania","Algeria")');
          ```
