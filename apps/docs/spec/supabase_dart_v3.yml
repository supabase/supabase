openref: 0.1

info:
  id: reference/dart
  title: Supabase Dart Client
  description: |

    Supabase Dart.
  slugPrefix: '/'
  specUrl: https://github.com/supabase/supabase/edit/master/apps/docs/spec/supabase_dart_v3.yml
  libraries:
    - name: 'Dart'
      id: 'dart'
      version: '0.0.1'

functions:
  - id: initializing
    title: 'Initializing'
    description: |
      Initialize Supabase once, before `runApp`, with the static `initialize()` method of the `Supabase` class. It restores the persisted session before it returns. Then use the client from `Supabase.instance.client` everywhere in the app.

      In Dart projects without Flutter, create a `SupabaseClient` instead. It takes the URL and the key as positional parameters and the same options, plus `functionsOptions`. `realtimeLifecycleOptions` does not exist there, and `authOptions` is an `AuthClientOptions`, which keeps the session in memory unless you set `persistSession` and pass an `asyncStorage`.

      The SDK never prints anything. All packages log through [package:logging](https://pub.dev/packages/logging) under the `supabase` logger, so attach a listener to see the logs.
    params:
      - name: url
        isOptional: false
        type: String
        description: The URL of your project, found in the dashboard under **Project Settings > API Keys**.
      - name: publishableKey
        isOptional: false
        type: String
        description: The publishable key of your project. A legacy anon key also works here. Never use the secret key in a Flutter app.
      - name: authOptions
        isOptional: true
        type: FlutterAuthClientOptions
        description: Options for the auth client.
        subContent:
          - name: authFlowType
            isOptional: true
            type: AuthFlowType
            description: Whether to use the `pkce` flow or the `implicit` flow. Defaults to `pkce`.
          - name: autoRefreshToken
            isOptional: true
            type: bool
            description: Whether to refresh the session in the background before it expires. Defaults to `true`.
          - name: persistSession
            isOptional: true
            type: bool
            description: Whether to store the session and restore it when the app starts. Defaults to `true`.
          - name: asyncStorage
            isOptional: true
            type: AuthAsyncStorage
            description: Where the session and the pkce code verifiers are stored. Defaults to `SharedPreferencesAsync`, or `localStorage` on the web.
          - name: storageKey
            isOptional: true
            type: String
            description: The key the session is stored under. Defaults to the key the other Supabase client libraries derive from the project URL.
          - name: oauthLauncher
            isOptional: true
            type: OAuthLauncher
            description: Opens the URL of an OAuth, SSO or identity linking flow. Defaults to `UrlLauncherOAuthLauncher`, which opens a browser. The [supabase_flutter_web_auth](https://pub.dev/packages/supabase_flutter_web_auth) package provides a launcher that closes itself when the redirect returns to the app.
          - name: detectSessionInUri
            isOptional: true
            type: bool
            description: Whether to exchange auth callback deep links, such as magic links and OAuth redirects, for a session. Defaults to `true`.
          - name: detectSessionInUriPredicate
            isOptional: true
            type: bool Function(Uri uri)
            description: Decides whether an incoming deep link is an auth callback. By default, a link with an `access_token`, `code` or `error` parameter is.
          - name: retryOptions
            isOptional: true
            type: SupabaseRetryOptions
            description: How a token refresh that never reached the server is retried. Defaults to 8 retries.
      - name: postgrestOptions
        isOptional: true
        type: PostgrestClientOptions
        description: Options for the database client.
        subContent:
          - name: schema
            isOptional: true
            type: String
            description: The schema `from()` and `rpc` query. Defaults to `public`. Tables used through `table()` carry their own schema.
          - name: retryOptions
            isOptional: true
            type: SupabaseRetryOptions
            description: How GET and HEAD requests that fail with a network error or a retryable status code are retried. Defaults to 3 retries.
          - name: requestTimeout
            isOptional: true
            type: Duration
            description: How long a request may go without progress before it is cancelled. Overrides the client wide `requestTimeout`.
      - name: realtimeOptions
        isOptional: true
        type: RealtimeClientOptions
        description: Options for the realtime client.
        subContent:
          - name: logLevel
            isOptional: true
            type: RealtimeLogLevel
            description: The level of the realtime server logs to send to the client.
          - name: timeout
            isOptional: true
            type: Duration
            description: How long to wait for the server to reply to a message.
          - name: heartbeatInterval
            isOptional: true
            type: Duration
            description: The interval at which a heartbeat is sent to the server.
      - name: realtimeLifecycleOptions
        isOptional: true
        type: RealtimeLifecycleOptions
        description: How the realtime connection follows the app lifecycle. By default it disconnects as soon as the app is paused and reconnects, rejoining every channel, when the app is resumed. Use `disconnectAfterPause` to keep it open through short pauses, or `RealtimeLifecycleOptions.manual()` to manage it yourself.
      - name: storageOptions
        isOptional: true
        type: StorageClientOptions
        description: Options for the storage client.
        subContent:
          - name: retryOptions
            isOptional: true
            type: SupabaseRetryOptions
            description: How an upload that failed because of a network interruption is retried. Uploads are not retried by default.
          - name: useNewHostname
            isOptional: true
            type: bool
            description: Whether to send storage requests to the dedicated storage host (`<ref>.storage.supabase.co`). Set to `true` only if your project has it enabled. Defaults to `false`.
          - name: requestTimeout
            isOptional: true
            type: Duration
            description: How long a request may go without progress before it is cancelled. Overrides the client wide `requestTimeout`.
      - name: requestTimeout
        isOptional: true
        type: Duration
        description: How long a request to the database, auth, storage or functions service may go without progress before it is cancelled. The timer restarts whenever data is sent or received.
      - name: accessToken
        isOptional: true
        type: Future<String?> Function()
        description: Returns the access token of a third-party auth provider to send with every request. When set, `supabase.auth` cannot be used.
      - name: headers
        isOptional: true
        type: Map<String, String>
        description: Headers sent with every request.
      - name: httpClient
        isOptional: true
        type: Client
        description: The HTTP client used for every request. By default the client creates its own and closes it when the client is disposed.
    examples:
      - id: flutter-initialize
        name: For Flutter
        code: |
          ```dart
          Future<void> main() async {
            WidgetsFlutterBinding.ensureInitialized();
            await Supabase.initialize(
              url: 'https://your-project.supabase.co',
              publishableKey: 'your-publishable-key',
            );
            runApp(const MyApp());
          }

          // Use this one client everywhere in the app.
          final supabase = Supabase.instance.client;
          ```
      - id: for-other-dart-projects
        name: For other Dart projects
        code: |
          ```dart
          final supabase = SupabaseClient(
            'https://your-project.supabase.co',
            'your-secret-key', // Only use the secret key on a server.
          );
          ```
      - id: with-custom-options
        name: With custom options
        code: |
          ```dart
          await Supabase.initialize(
            url: 'https://your-project.supabase.co',
            publishableKey: 'your-publishable-key',
            authOptions: const FlutterAuthClientOptions(
              authFlowType: AuthFlowType.implicit,
            ),
            postgrestOptions: const PostgrestClientOptions(
              schema: 'inventory',
            ),
            storageOptions: const StorageClientOptions(
              retryOptions: SupabaseRetryOptions(count: 5),
            ),
            realtimeOptions: const RealtimeClientOptions(
              logLevel: RealtimeLogLevel.info,
            ),
            requestTimeout: const Duration(seconds: 30),
          );
          ```
      - id: with-an-oauth-launcher
        name: With an OAuth launcher
        description: |
          The [supabase_flutter_web_auth](https://pub.dev/packages/supabase_flutter_web_auth) package runs OAuth flows in a system authentication session that closes itself when the redirect returns to the app.
        code: |
          ```dart
          await Supabase.initialize(
            url: 'https://your-project.supabase.co',
            publishableKey: 'your-publishable-key',
            authOptions: const FlutterAuthClientOptions(
              oauthLauncher: FlutterWebAuth2OAuthLauncher(),
            ),
          );
          ```
      - id: print-logs
        name: Print logs
        description: |
          Add the [logging](https://pub.dev/packages/logging) package to your app and listen to the records of the `supabase` loggers. `Logger.root.level` defaults to `Level.INFO`.
        code: |
          ```dart
          void main() {
            Logger.root.onRecord.listen((record) {
              if (record.loggerName.startsWith('supabase.')) {
                debugPrint(
                  '${record.loggerName}: ${record.level.name}: '
                  '${record.message} ${record.error ?? ''}',
                );
              }
            });
            runApp(const MyApp());
          }
          ```
  - id: auth-api
    title: 'Auth'
    category: Auth
  - id: sign-up
    title: 'signUp()'
    description: |
      Creates a new user.
    notes: |
      - Returns an `AuthResponse`. Its `session` is `null` until the user confirms their email address or phone number.
      - By default, the user needs to verify their email address before signing in. To turn this off, disable **Confirm email** in [your project](https://supabase.com/dashboard/project/_/auth/providers).
      - **Confirm email** determines if users need to confirm their email address after signing up.
        - If **Confirm email** is enabled, a `user` is returned but `session` is null.
        - If **Confirm email** is disabled, both a `user` and a `session` are returned.
      - When the user confirms their email address, they are redirected to the [`SITE_URL`](https://supabase.com/docs/guides/auth/redirect-urls) by default. You can modify your `SITE_URL` or add additional redirect URLs in [your project](https://supabase.com/dashboard/project/_/auth/url-configuration).
      - If `signUp()` is called for an existing confirmed user:
        - When both **Confirm email** and **Confirm phone** (even when phone provider is disabled) are enabled in [your project](/dashboard/project/_/auth/providers), an obfuscated or fake user object is returned.
        - When either **Confirm email** or **Confirm phone** (even when phone provider is disabled) is disabled, an `AuthApiException` with the message `User already registered` is thrown.
    params:
      - name: email
        isOptional: true
        type: String
        description: User's email address to be used for email authentication.
      - name: phone
        isOptional: true
        type: String
        description: User's phone number to be used for phone authentication.
      - name: password
        isOptional: false
        type: String
        description: Password to be used for authentication.
      - name: emailRedirectTo
        isOptional: true
        type: String
        description: The URL to redirect the user to after they confirm their email address.
      - name: data
        isOptional: true
        type: Map<String, dynamic>
        description: The user's metadata to be stored in the user's object.
      - name: captchaToken
        isOptional: true
        type: String
        description: The captcha token to be used for captcha verification.
      - name: channel
        isOptional: true
        type: OtpChannel
        description: Messaging channel to use, for example WhatsApp or SMS. Defaults to `OtpChannel.sms`.
    examples:
      - id: sign-up
        name: Sign up with an email and password
        isSpotlight: true
        code: |
          ```dart
          final response = await supabase.auth.signUp(
            email: 'example@email.com',
            password: 'example-password',
          );
          final Session? session = response.session;
          final User? user = response.user;
          ```
        response: |
          ```json
          // session is null if "Confirm email" is enabled.
          AuthResponse(
            user: User(
              id: '11111111-1111-1111-1111-111111111111',
              audience: 'authenticated',
              role: 'authenticated',
              email: 'example@email.com',
              emailConfirmedAt: DateTime.utc(2024, 1, 1),
              phone: '',
              lastSignInAt: DateTime.utc(2024, 1, 1),
              appMetadata: AppMetadata(
                provider: 'email',
                providers: ['email'],
              ),
              userMetadata: {},
              identities: [
                UserIdentity(
                  identityId: '22222222-2222-2222-2222-222222222222',
                  id: '11111111-1111-1111-1111-111111111111',
                  userId: '11111111-1111-1111-1111-111111111111',
                  identityData: {
                    'email': 'example@email.com',
                    'email_verified': false,
                    'phone_verified': false,
                    'sub': '11111111-1111-1111-1111-111111111111',
                  },
                  provider: 'email',
                  lastSignInAt: DateTime.utc(2024, 1, 1),
                  createdAt: DateTime.utc(2024, 1, 1),
                  updatedAt: DateTime.utc(2024, 1, 1),
                ),
              ],
              createdAt: DateTime.utc(2024, 1, 1),
              updatedAt: DateTime.utc(2024, 1, 1),
            ),
            session: Session(
              accessToken: '<ACCESS_TOKEN>',
              tokenType: 'bearer',
              expiresIn: 3600,
              refreshToken: '<REFRESH_TOKEN>',
              user: User(...),
            ),
          );
          ```
      - id: sign-up-phone
        name: Sign up with a phone number and password (SMS)
        isSpotlight: true
        code: |
          ```dart
          final response = await supabase.auth.signUp(
            phone: '+13334445555',
            password: 'example-password',
            channel: OtpChannel.sms,
          );
          ```
      - id: sign-up-with-metadata
        name: Sign up with additional metadata
        isSpotlight: true
        code: |
          ```dart
          final response = await supabase.auth.signUp(
            email: 'example@email.com',
            password: 'example-password',
            data: {'username': 'my_user_name'},
          );
          ```
      - id: sign-up-with-redirect-url
        name: Sign up with redirect URL
        isSpotlight: true
        description: |
          - See [redirect URLs and wildcards](/docs/guides/auth/redirect-urls#use-wildcards-in-redirect-urls) to add additional redirect URLs to your project.
        code: |
          ```dart
          final response = await supabase.auth.signUp(
            email: 'example@email.com',
            password: 'example-password',
            emailRedirectTo: 'com.supabase.myapp://callback',
          );
          ```
  - id: sign-in-anonymously
    title: 'signInAnonymously()'
    description: |
      Creates an anonymous user and returns its `Session`.
    notes: |
      - The access token of the new session carries an `is_anonymous` claim set to `true`.
      - It is recommended to set up captcha for anonymous sign-ins to prevent abuse. Pass the captcha token in `captchaToken`.
    params:
      - name: data
        isOptional: true
        type: Map<String, dynamic>
        description: The user's metadata to be stored in the user's object.
      - name: captchaToken
        isOptional: true
        type: String
        description: The captcha token to be used for captcha verification.
    examples:
      - id: sign-in-anonymously
        name: Create an anonymous user
        isSpotlight: true
        code: |
          ```dart
          final session = await supabase.auth.signInAnonymously();
          final isAnonymous = session.user.isAnonymous;
          ```
        response: |
          ```json
          Session(
            accessToken: '<ACCESS_TOKEN>',
            tokenType: 'bearer',
            expiresIn: 3600,
            refreshToken: '<REFRESH_TOKEN>',
            user: User(
              id: '11111111-1111-1111-1111-111111111111',
              audience: 'authenticated',
              role: 'authenticated',
              email: '',
              phone: '',
              lastSignInAt: DateTime.utc(2024, 1, 1),
              appMetadata: AppMetadata(),
              userMetadata: {},
              identities: [],
              createdAt: DateTime.utc(2024, 1, 1),
              updatedAt: DateTime.utc(2024, 1, 1),
              isAnonymous: true,
            ),
          );
          ```
      - id: sign-in-anonymously-with-user-metadata
        name: Create an anonymous user with custom user metadata
        isSpotlight: false
        code: |
          ```dart
          final session = await supabase.auth.signInAnonymously(
            data: {'hello': 'world'},
          );
          ```
  - id: sign-in-with-password
    title: 'signInWithPassword()'
    description: |
      Signs in an existing user with an email or phone number and a password, and returns the new `Session`.
    notes: |
      - Requires either an email and password or a phone number and password.
      - Throws an `AuthApiException` when the credentials are wrong or the email address is not confirmed yet. Compare its `errorCode` with the values of `ErrorCode`.
    params:
      - name: email
        isOptional: true
        type: String
        description: User's email address to be used for email authentication.
      - name: phone
        isOptional: true
        type: String
        description: User's phone number to be used for phone authentication.
      - name: password
        isOptional: false
        type: String
        description: Password to be used for authentication.
      - name: captchaToken
        isOptional: true
        type: String
        description: The captcha token to be used for captcha verification.
    examples:
      - id: sign-in-with-email-and-password
        name: Sign in with email and password
        isSpotlight: true
        code: |
          ```dart
          final session = await supabase.auth.signInWithPassword(
            email: 'example@email.com',
            password: 'example-password',
          );
          final user = session.user;
          ```
        response: |
          ```json
          Session(
            accessToken: '<ACCESS_TOKEN>',
            tokenType: 'bearer',
            expiresIn: 3600,
            refreshToken: '<REFRESH_TOKEN>',
            user: User(
              id: '11111111-1111-1111-1111-111111111111',
              audience: 'authenticated',
              role: 'authenticated',
              email: 'example@email.com',
              emailConfirmedAt: DateTime.utc(2024, 1, 1),
              phone: '',
              lastSignInAt: DateTime.utc(2024, 1, 1),
              appMetadata: AppMetadata(
                provider: 'email',
                providers: ['email'],
              ),
              userMetadata: {},
              identities: [
                UserIdentity(
                  identityId: '22222222-2222-2222-2222-222222222222',
                  id: '11111111-1111-1111-1111-111111111111',
                  userId: '11111111-1111-1111-1111-111111111111',
                  identityData: {
                    'email': 'example@email.com',
                    'email_verified': false,
                    'phone_verified': false,
                    'sub': '11111111-1111-1111-1111-111111111111',
                  },
                  provider: 'email',
                  lastSignInAt: DateTime.utc(2024, 1, 1),
                  createdAt: DateTime.utc(2024, 1, 1),
                  updatedAt: DateTime.utc(2024, 1, 1),
                ),
              ],
              createdAt: DateTime.utc(2024, 1, 1),
              updatedAt: DateTime.utc(2024, 1, 1),
            ),
          );
          ```
      - id: sign-in-with-phone-and-password
        name: Sign in with phone and password
        code: |
          ```dart
          final session = await supabase.auth.signInWithPassword(
            phone: '+13334445555',
            password: 'example-password',
          );
          ```
      - id: sign-in-with-password-error
        name: Handle a failed sign-in
        code: |
          ```dart
          try {
            await supabase.auth.signInWithPassword(
              email: 'example@email.com',
              password: 'example-password',
            );
          } on AuthApiException catch (error) {
            if (error.errorCode == ErrorCode.emailNotConfirmed.code) {
              print('Confirm your email address first');
            } else {
              print('Sign-in failed: ${error.message}');
            }
          }
          ```
  - id: sign-in-with-otp
    title: 'signInWithOtp()'
    description: |
      Sends a magic link or one-time password (OTP) to an email address or phone number.
    notes: |
      - Requires either an email or phone number.
      - This method is used for passwordless sign-ins where an OTP is sent to the user's email or phone number.
      - If you're using an email, you can configure whether you want the user to receive a magic link or an OTP.
      - If you're using phone, you can configure whether you want the user to receive an OTP.
      - The magic link's destination URL is determined by the [`SITE_URL`](https://supabase.com/docs/guides/auth/redirect-urls). You can modify the `SITE_URL` or add additional redirect URLs in [your project](https://supabase.com/dashboard/project/_/auth/url-configuration).
      - Returns a `SignInWithOtpResponse`. For phone sign-ins, its `messageId` holds the ID of the message the SMS provider sent. The session arrives later, through the magic link or [`verifyOTP()`](/docs/reference/dart/auth-verifyotp).
    params:
      - name: email
        isOptional: true
        type: String
        description: Email address to send the magic link or OTP to.
      - name: phone
        isOptional: true
        type: String
        description: Phone number to send the OTP to.
      - name: emailRedirectTo
        isOptional: true
        type: String
        description: The URL to redirect the user to after they click on the magic link.
      - name: shouldCreateUser
        isOptional: true
        type: bool
        description: If set to false, this method will not create a new user. Defaults to true.
      - name: data
        isOptional: true
        type: Map<String, dynamic>
        description: The user's metadata to be stored in the user's object.
      - name: captchaToken
        isOptional: true
        type: String
        description: The captcha token to be used for captcha verification.
      - name: channel
        isOptional: true
        type: OtpChannel
        description: Messaging channel to use, for example WhatsApp or SMS. Defaults to `OtpChannel.sms`.
    examples:
      - id: sign-in-with-email
        name: Sign in with email
        isSpotlight: true
        description: |
          The user will be sent an email which contains either a magic link or an OTP or both. By default, a given user can only request an OTP once every 60 seconds.
          You can pass `emailRedirectTo` with a deep link to bring the users back to your app after they click on the magic link.
        code: |
          ```dart
          await supabase.auth.signInWithOtp(
            email: 'example@email.com',
            emailRedirectTo: kIsWeb ? null : 'io.supabase.flutter://signin-callback/',
          );
          ```
        response: |
          ```json
          SignInWithOtpResponse(
            messageId: null,
          );
          ```
      - id: sign-in-with-sms-otp
        name: Sign in with SMS OTP
        description: The user will be sent an SMS which contains an OTP. By default, a given user can only request an OTP once every 60 seconds.
        code: |
          ```dart
          await supabase.auth.signInWithOtp(
            phone: '+13334445555',
          );
          ```
      - id: sign-in-with-whatsapp-otp
        name: Sign in with WhatsApp OTP
        isSpotlight: false
        description: The user will be sent a WhatsApp message which contains an OTP. By default, a given user can only request an OTP once every 60 seconds. Note that a user will need to have a valid WhatsApp account that is linked to Twilio in order to use this feature.
        code: |
          ```dart
          await supabase.auth.signInWithOtp(
            phone: '+13334445555',
            channel: OtpChannel.whatsapp,
          );
          ```
  - id: sign-in-with-id-token
    title: 'signInWithIdToken()'
    description: |
      Signs in with an ID token from a native sign-in SDK and returns the new `Session`. Combine it with [google_sign_in](https://pub.dev/packages/google_sign_in), [sign_in_with_apple](https://pub.dev/packages/sign_in_with_apple), or [flutter_facebook_auth](https://pub.dev/packages/flutter_facebook_auth) for native Google, Apple and Facebook sign-in.
    notes: |
      - Supported providers include Apple, Google, Facebook, Kakao and Keycloak.
      - Native sign-in does not leave the app, so it needs no redirect URL or deep link setup.
    params:
      - name: provider
        isOptional: false
        type: OAuthProvider
        description: The provider to perform the sign in with.
      - name: idToken
        isOptional: false
        type: String
        description: The identity token obtained from the third-party provider.
      - name: accessToken
        isOptional: true
        type: String
        description: Access token obtained from the third-party provider. Required when the ID token carries an `at_hash` claim, as Google ID tokens can.
      - name: nonce
        isOptional: true
        type: String
        description: Raw nonce value used to perform the third-party sign in. Required for Apple sign-in.
      - name: captchaToken
        isOptional: true
        type: String
        description: The captcha token to be used for captcha verification.
    examples:
      - id: sign-in-with-google
        name: Native Google sign in
        isSpotlight: true
        description: |
          You can perform native Google sign in on Android and iOS using [google_sign_in](https://pub.dev/packages/google_sign_in).
          For platform specific settings, follow the instructions in the package README.

          First, create client IDs for your app. You need to create a web client ID as well to perform Google sign-in with Supabase.

          - [Steps to obtain web client ID](https://developers.google.com/identity/sign-in/android/start-integrating#configure_a_project)
          - [Steps to obtain Android client ID](https://developers.google.com/identity/sign-in/android/start-integrating#configure_a_project)
          - [Steps to obtain iOS client ID](https://developers.google.com/identity/sign-in/ios/start-integrating#get_an_oauth_client_id)

          Add the web client ID to the `Authentication -> Providers -> Google -> Client IDs` section in your Supabase dashboard.
        code: |
          ```dart
          import 'package:google_sign_in/google_sign_in.dart';
          import 'package:supabase_flutter/supabase_flutter.dart';

          const webClientId = 'my-web.apps.googleusercontent.com';
          const iosClientId = 'my-ios.apps.googleusercontent.com';
          const scopes = ['email', 'profile'];

          final googleSignIn = GoogleSignIn.instance;
          await googleSignIn.initialize(
            clientId: iosClientId,
            serverClientId: webClientId,
          );

          final account = await googleSignIn.authenticate();
          final idToken = account.authentication.idToken;
          if (idToken == null) {
            throw const AuthException('No ID token found.');
          }
          final authorization =
              await account.authorizationClient.authorizationForScopes(scopes) ??
              await account.authorizationClient.authorizeScopes(scopes);

          final session = await supabase.auth.signInWithIdToken(
            provider: OAuthProvider.google,
            idToken: idToken,
            accessToken: authorization.accessToken,
          );
          ```
        response: |
          ```json
          Session(
            accessToken: '<ACCESS_TOKEN>',
            tokenType: 'bearer',
            expiresIn: 3600,
            refreshToken: '<REFRESH_TOKEN>',
            user: User(
              id: '11111111-1111-1111-1111-111111111111',
              audience: 'authenticated',
              role: 'authenticated',
              email: 'example@email.com',
              appMetadata: AppMetadata(
                provider: 'google',
                providers: ['google'],
              ),
              identities: [
                UserIdentity(
                  identityId: '22222222-2222-2222-2222-222222222222',
                  provider: 'google',
                  ...
                ),
              ],
              ...
            ),
          );
          ```
      - id: sign-in-with-apple
        name: Native Apple Sign in
        description: You need to [register your app ID with Apple](https://developer.apple.com/help/account/manage-identifiers/register-an-app-id/) with the `Sign In with Apple` capability selected, and add the bundle ID to your Supabase dashboard in `Authentication -> Providers -> Apple` before performing native Apple sign in.
        code: |
          ```dart
          import 'dart:convert';

          import 'package:crypto/crypto.dart';
          import 'package:sign_in_with_apple/sign_in_with_apple.dart';
          import 'package:supabase_flutter/supabase_flutter.dart';

          final rawNonce = supabase.auth.generateRawNonce();
          final hashedNonce = sha256.convert(utf8.encode(rawNonce)).toString();

          final credential = await SignInWithApple.getAppleIDCredential(
            scopes: [
              AppleIDAuthorizationScopes.email,
              AppleIDAuthorizationScopes.fullName,
            ],
            nonce: hashedNonce,
          );

          final idToken = credential.identityToken;
          if (idToken == null) {
            throw const AuthException('Could not find an ID token.');
          }

          final session = await supabase.auth.signInWithIdToken(
            provider: OAuthProvider.apple,
            idToken: idToken,
            nonce: rawNonce,
          );
          ```
      - id: sign-in-with-facebook
        name: Native Facebook Sign in
        description: |
          You can perform native Facebook sign in using [flutter_facebook_auth](https://pub.dev/packages/flutter_facebook_auth).

          First, set up your Facebook app in the [Facebook Developer Console](https://developers.facebook.com) and configure it in your Supabase dashboard under `Authentication -> Providers -> Facebook`.
        code: |
          ```dart
          import 'package:flutter_facebook_auth/flutter_facebook_auth.dart';
          import 'package:supabase_flutter/supabase_flutter.dart';

          final result = await FacebookAuth.instance.login(
            permissions: ['public_profile', 'email'],
          );

          if (result.status != LoginStatus.success) {
            throw AuthException('Facebook login failed: ${result.status}');
          }

          final session = await supabase.auth.signInWithIdToken(
            provider: OAuthProvider.facebook,
            idToken: result.accessToken!.tokenString,
          );
          ```
  - id: sign-in-with-oauth
    title: 'signInWithOAuth()'
    description: |
      Signs the user in using third-party OAuth providers.
    notes: |
      - Supabase supports many different [third-party providers](https://supabase.com/docs/guides/auth#providers).
      - Opens the sign-in page of the provider and returns whether it launched. The user signs in outside the app, so `true` does not mean the sign-in succeeded. Listen to [`onAuthStateChange`](/docs/reference/dart/auth-onauthstatechange) for `AuthSignedIn`. A failed code exchange arrives as an `AuthException` error on that stream.
      - The page is opened by the `OAuthLauncher` set in `FlutterAuthClientOptions.oauthLauncher`. The default, `UrlLauncherOAuthLauncher`, opens it with `url_launcher`, and always in an external browser for Google on Android.
      - To run the flow in a system web authentication session (`ASWebAuthenticationSession` on iOS and macOS, Custom Tabs on Android) that closes itself once the redirect arrives, add the [`supabase_flutter_web_auth`](https://pub.dev/packages/supabase_flutter_web_auth) package and pass `FlutterWebAuth2OAuthLauncher()` as the `oauthLauncher`. With it, the method returns `false` when the user closes the page without signing in.
      - The redirect URL must be in the redirect URL allow list of your project, and the app has to handle it as a deep link. Leave `redirectTo` null on web to return to the current page.
      - To get the URL without opening it, use `getOAuthSignInUrl()`.
    params:
      - name: provider
        isOptional: false
        type: OAuthProvider
        description: The OAuth provider to use for signing in.
      - name: redirectTo
        isOptional: true
        type: String
        description: The URL to redirect the user to after they sign in with the third-party provider.
      - name: scopes
        isOptional: true
        type: String
        description: A space-separated list of scopes to request from the third-party provider.
      - name: authScreenLaunchMode
        isOptional: true
        type: LaunchMode
        description: The launch mode for the auth screen. Defaults to `LaunchMode.platformDefault`.
      - name: queryParameters
        isOptional: true
        type: Map<String, String>
        description: Additional query parameters to be passed to the OAuth flow.
      - name: preferEphemeral
        isOptional: true
        type: bool
        description: Requests a session that does not share cookies with the system browser. Ignored by the default launcher, used by `FlutterWebAuth2OAuthLauncher`. Defaults to `false`.
    examples:
      - id: sign-in-using-a-third-party-provider
        name: Sign in using a third-party provider
        isSpotlight: true
        code: |
          ```dart
          await supabase.auth.signInWithOAuth(
            OAuthProvider.github,
            redirectTo: kIsWeb ? null : 'my.scheme://my-host',
          );
          ```
      - id: sign-in-with-web-auth-session
        name: Sign in with a web authentication session
        description: |
          Add [`supabase_flutter_web_auth`](https://pub.dev/packages/supabase_flutter_web_auth) and pass its launcher to `Supabase.initialize`. The sign-in page closes itself once the redirect arrives, and the method returns `false` when the user cancels.
        code: |
          ```dart
          import 'package:supabase_flutter/supabase_flutter.dart';
          import 'package:supabase_flutter_web_auth/supabase_flutter_web_auth.dart';

          await Supabase.initialize(
            url: 'https://your-project.supabase.co',
            publishableKey: 'your-publishable-key',
            authOptions: const FlutterAuthClientOptions(
              oauthLauncher: FlutterWebAuth2OAuthLauncher(),
            ),
          );

          final launched = await supabase.auth.signInWithOAuth(
            OAuthProvider.github,
            redirectTo: kIsWeb ? null : 'com.example.myapp://oauth-callback',
          );
          if (!launched) {
            print('Sign-in was cancelled');
          }
          ```
      - id: sign-in-with-custom-provider
        name: Sign in with a custom OIDC provider
        description: |
          Pass the identifier of a custom OIDC or OAuth provider to the `OAuthProvider` constructor.
        isSpotlight: false
        code: |
          ```dart
          await supabase.auth.signInWithOAuth(
            OAuthProvider('custom:my-oidc-provider'),
            redirectTo: kIsWeb ? null : 'my.scheme://my-host',
          );
          ```
      - id: sign-in-with-launch-mode
        name: With a launch mode
        description: |
          Choose how `url_launcher` opens the sign-in page.
        code: |
          ```dart
          await supabase.auth.signInWithOAuth(
            OAuthProvider.github,
            redirectTo: kIsWeb ? null : 'my.scheme://my-host',
            authScreenLaunchMode: kIsWeb
                ? LaunchMode.platformDefault
                : LaunchMode.externalApplication,
          );
          ```
      - id: sign-in-with-scopes
        name: With scopes
        description: |
          If you need additional data from an OAuth provider, you can include a space-separated list of scopes in your request to get back an OAuth provider token.
          You may also need to specify the scopes in the provider's OAuth app settings, depending on the provider.
        code: |
          ```dart
          await supabase.auth.signInWithOAuth(
            OAuthProvider.github,
            scopes: 'repo gist notifications',
          );

          // After the user comes back from the sign-in flow.
          final providerToken = supabase.auth.currentSession?.providerToken;
          ```
      - id: sign-in-with-query-parameters
        name: With additional query parameters
        code: |
          ```dart
          await supabase.auth.signInWithOAuth(
            OAuthProvider.google,
            queryParameters: {'prompt': 'select_account'},
          );
          ```
      - id: get-oauth-sign-in-url
        name: Get the sign-in URL without opening it
        description: |
          `getOAuthSignInUrl()` returns the URL as a `Uri` in `OAuthResponse.url`, for example to open it yourself or to redirect to it from a server.
        code: |
          ```dart
          final response = await supabase.auth.getOAuthSignInUrl(
            provider: OAuthProvider.github,
            redirectTo: 'https://example.com/callback',
          );
          final Uri url = response.url;
          ```
  - id: sign-in-with-sso
    title: 'signInWithSSO()'
    notes: |
      - Before you can call this method you need to [establish a connection](/docs/guides/auth/enterprise-sso/auth-sso-saml#managing-saml-20-connections) to an identity provider. Use the [CLI commands](/docs/reference/cli/supabase-sso) to do this.
      - If you've associated an email domain to the identity provider, you can use the `domain` property to start a sign-in flow.
      - In case you need to use a different way to start the authentication flow with an identity provider, you can use the `providerId` property. For example:
          - Mapping specific user email addresses with an identity provider.
          - Using different hints to identify the correct identity provider, like a company-specific page, IP address or other tracking information.
      - Like [`signInWithOAuth()`](/docs/reference/dart/auth-signinwithoauth), it opens the page through the configured `OAuthLauncher` and returns whether it launched. Listen to `onAuthStateChange` for the result.
      - To get the URL as a `Uri` without opening it, use `getSSOSignInUrl()`.
    params:
      - name: providerId
        isOptional: true
        type: String
        description: The ID of the SSO provider to use for signing in.
      - name: domain
        isOptional: true
        type: String
        description: The email domain to use for signing in.
      - name: redirectTo
        isOptional: true
        type: String
        description: The URL to redirect the user to after they sign in with the identity provider.
      - name: captchaToken
        isOptional: true
        type: String
        description: The captcha token to be used for captcha verification.
      - name: authScreenLaunchMode
        isOptional: true
        type: LaunchMode
        description: The launch mode for the auth screen. Defaults to `LaunchMode.platformDefault`.
      - name: preferEphemeral
        isOptional: true
        type: bool
        description: Requests a session that does not share cookies with the system browser. Ignored by the default launcher, used by `FlutterWebAuth2OAuthLauncher`. Defaults to `false`.
    examples:
      - id: sign-in-with-domain
        name: Sign in with email domain
        isSpotlight: true
        code: |
          ```dart
          await supabase.auth.signInWithSSO(
            domain: 'company.com',
          );
          ```
      - id: sign-in-with-provider-uuid
        name: Sign in with provider UUID
        isSpotlight: true
        code: |
          ```dart
          await supabase.auth.signInWithSSO(
            providerId: '21648a9d-8d5a-4555-a9d1-d6375dc14e92',
          );
          ```
  - id: sign-in-with-web3
    title: 'signInWithWeb3()'
    description: |
      Signs in a user by verifying a message signed with their Web3 wallet, and returns the new `Session`.
    notes: |
      - Supports Ethereum (Sign-In with Ethereum) and Solana (Sign-In with Solana), both of which derive from the [EIP-4361](https://eips.ethereum.org/EIPS/eip-4361) standard.
      - Handle the wallet interaction and message signing yourself with the wallet library of your choice, then provide the signed `message` together with its `signature`.
      - For `Web3Chain.ethereum` the signature is a hex encoded string. For `Web3Chain.solana` it is a base64url encoded string.
      - On failure, it throws an `AuthException`.
    params:
      - name: chain
        isOptional: false
        type: Web3Chain
        description: The blockchain used to sign in. One of `Web3Chain.ethereum` or `Web3Chain.solana`.
      - name: message
        isOptional: false
        type: String
        description: The EIP-4361 message that was signed by the user's wallet.
      - name: signature
        isOptional: false
        type: String
        description: The signature produced by the wallet. Hex encoded for Ethereum, base64url encoded for Solana.
      - name: captchaToken
        isOptional: true
        type: String
        description: The verification token received when the user completes the captcha on the app.
    examples:
      - id: sign-in-with-ethereum
        name: Sign in with an Ethereum wallet
        isSpotlight: true
        description: |
          Sign the EIP-4361 message with the user's Ethereum wallet, then pass the message and its hex encoded signature.
        code: |
          ```dart
          final session = await supabase.auth.signInWithWeb3(
            chain: Web3Chain.ethereum,
            message: message, // The EIP-4361 message signed by the wallet.
            signature: signature, // Hex encoded signature.
          );
          ```
      - id: sign-in-with-solana
        name: Sign in with a Solana wallet
        description: |
          Sign the message with the user's Solana wallet, then pass the message and its base64url encoded signature.
        code: |
          ```dart
          final session = await supabase.auth.signInWithWeb3(
            chain: Web3Chain.solana,
            message: message, // The message signed by the wallet.
            signature: signature, // base64url encoded signature.
          );
          ```
  - id: sign-in-with-passkey
    title: 'signInWithPasskey()'
    description: |
      Signs the user in with a passkey (WebAuthn) and returns the new `Session`.
    notes: |
      - An extension on `AuthClient` from `supabase_flutter`.
      - Drives the full WebAuthn ceremony end to end: starts the challenge with the Supabase server, calls the `authenticator` you supply to prompt the user for biometrics or a security key, and verifies the credential with the server.
      - Does not require an existing session. On success the session is persisted and `AuthSignedIn` is emitted on `onAuthStateChange`.
      - `supabase_flutter` does not depend on a passkey plugin directly. Pass an implementation of `PasskeyAuthenticatorInterface`, such as the [`passkeys`](https://pub.dev/packages/passkeys) plugin's `PasskeyAuthenticator`.
      - Rethrows whatever the authenticator throws when the platform ceremony fails or is cancelled, and throws an `AuthException` when the server rejects the credential.
      - For native flows or custom UI, use the lower-level [`auth.passkey`](/docs/reference/dart/auth-passkey) namespace instead.
      - Passkeys are a BETA feature and must be enabled for your project in the Supabase Dashboard under Authentication > Configuration > Passkeys.
      - Platform setup the library cannot perform (Associated Domains on iOS and macOS, Digital Asset Links on Android, the `passkeys` web SDK on web) is documented in the `supabase_flutter` package README.
    params:
      - name: authenticator
        isOptional: false
        type: PasskeyAuthenticatorInterface
        description: Performs the platform passkey ceremony (Face ID, Touch ID or a security key). For example, a `PasskeyAuthenticator` from the `passkeys` package.
      - name: captchaToken
        isOptional: true
        type: String
        description: Captcha token to be used for captcha verification.
    examples:
      - id: sign-in-with-passkey
        name: Sign in with a passkey
        isSpotlight: true
        code: |
          ```dart
          import 'package:passkeys/authenticator.dart';

          final authenticator = PasskeyAuthenticator();

          final session = await supabase.auth.signInWithPasskey(authenticator);
          final user = session.user;
          ```
  - id: register-passkey
    title: 'registerPasskey()'
    description: |
      Registers a new passkey (WebAuthn credential) for the signed-in user.
    notes: |
      - An extension on `AuthClient` from `supabase_flutter`.
      - Drives the full WebAuthn ceremony end to end: starts the registration with the Supabase server, calls the `authenticator` you supply to create a credential on the device, and verifies it with the server.
      - Requires a signed in, non-anonymous user. If the user has verified MFA factors, the session has to be at `aal2` to manage passkeys.
      - `supabase_flutter` does not depend on a passkey plugin directly. Pass an implementation of `PasskeyAuthenticatorInterface`, such as the [`passkeys`](https://pub.dev/packages/passkeys) plugin's `PasskeyAuthenticator`.
      - For native flows or custom UI, use the lower-level [`auth.passkey`](/docs/reference/dart/auth-passkey) namespace instead.
      - Passkeys are a BETA feature and must be enabled for your project in the Supabase Dashboard under Authentication > Configuration > Passkeys.
    params:
      - name: authenticator
        isOptional: false
        type: PasskeyAuthenticatorInterface
        description: Performs the platform passkey ceremony (Face ID, Touch ID or a security key). For example, a `PasskeyAuthenticator` from the `passkeys` package.
      - name: friendlyName
        isOptional: true
        type: String
        description: The account label the authenticator shows for the passkey when the server does not provide a `user.name`. Defaults to `Passkey`.
    examples:
      - id: register-passkey
        name: Register a passkey for the current user
        isSpotlight: true
        code: |
          ```dart
          import 'package:passkeys/authenticator.dart';

          final authenticator = PasskeyAuthenticator();

          final passkey = await supabase.auth.registerPasskey(
            authenticator,
            friendlyName: 'Work laptop',
          );
          ```
  - id: create-restore-key
    title: 'createRestoreKey()'
    description: |
      Creates an Android restore key for the signed-in user and registers it as a passkey, so the user is signed in again without any interaction after restoring the app on a new device.
    notes: |
      - An extension on `AuthClient` from `supabase_flutter`. Restore Credentials only exist on Android, so guard the call with `defaultTargetPlatform == TargetPlatform.android`.
      - Call it right after a non-anonymous user signs in, and on a later launch if the user is signed in and has no restore key yet.
      - Android keeps one restore key per app. Store the returned `Passkey.id` and delete the previous key with [`passkey.delete()`](/docs/reference/dart/auth-passkey-delete) before creating a new one.
      - When the user signs out, delete the key on both sides: the passkey with `passkey.delete()` and the key on the device with `clearRestoreCredential()` of the `RestoreCredentialInterface`. Otherwise the user is signed in again on the next launch.
      - Requires passkeys to be enabled for your project and Digital Asset Links for the relying party ID, as for passkeys.
    params:
      - name: restoreCredential
        isOptional: false
        type: RestoreCredentialInterface
        description: Performs the platform calls. The `passkeys` plugin's `PasskeyAuthenticator` implements it.
      - name: friendlyName
        isOptional: true
        type: String
        description: The friendly name of the passkey, to tell restore keys apart from the passkeys the user created. Defaults to `Android restore key`.
      - name: isCloudBackupEnabled
        isOptional: true
        type: bool
        description: Backs the key up to the cloud when the device has end-to-end encrypted backup, and stores it locally otherwise. Pass `false` to always keep it local. Defaults to `true`.
    examples:
      - id: create-restore-key
        name: Create a restore key after signing in
        isSpotlight: true
        code: |
          ```dart
          import 'package:flutter/foundation.dart';
          import 'package:passkeys/authenticator.dart';

          if (defaultTargetPlatform == TargetPlatform.android) {
            final restoreKey = await supabase.auth.createRestoreKey(
              PasskeyAuthenticator(),
            );
            // Store restoreKey.id to delete the key on sign out.
          }
          ```
      - id: delete-restore-key-on-sign-out
        name: Delete the restore key on sign out
        code: |
          ```dart
          import 'package:passkeys/authenticator.dart';

          final authenticator = PasskeyAuthenticator();
          await supabase.auth.passkey.delete(passkeyId: restoreKeyId);
          await authenticator.clearRestoreCredential();
          await supabase.auth.signOut();
          ```
  - id: sign-in-with-restore-key
    title: 'signInWithRestoreKey()'
    description: |
      Signs the user in with the Android restore key on the device and returns the new `Session`.
    notes: |
      - An extension on `AuthClient` from `supabase_flutter`, for Android only.
      - Call it on the first launch after the app was restored on a new device. Does not require an existing session.
      - The new session is independent of the refresh tokens of the old device. On success the session is persisted and `AuthSignedIn` is emitted on `onAuthStateChange`.
      - Rethrows whatever the `RestoreCredentialInterface` throws, for example when the device has no restore key, and throws an `AuthException` when the server rejects the credential.
    params:
      - name: restoreCredential
        isOptional: false
        type: RestoreCredentialInterface
        description: Performs the platform calls. The `passkeys` plugin's `PasskeyAuthenticator` implements it.
      - name: captchaToken
        isOptional: true
        type: String
        description: Captcha token to be used for captcha verification.
    examples:
      - id: sign-in-with-restore-key
        name: Sign in with the restore key
        isSpotlight: true
        code: |
          ```dart
          import 'package:flutter/foundation.dart';
          import 'package:passkeys/authenticator.dart';

          if (defaultTargetPlatform == TargetPlatform.android) {
            try {
              final session = await supabase.auth.signInWithRestoreKey(
                PasskeyAuthenticator(),
              );
            } on AuthException catch (error) {
              print('The restore key was rejected: ${error.message}');
            } catch (error) {
              // No restore key on this device, show the sign in screen.
            }
          }
          ```
  - id: sign-out
    title: 'signOut()'
    description: |
      Signs out the current user, if there is a signed-in user.
    notes: |
      - With `SignOutScope.local`, the default, the session is removed from the device first, so signing out works offline and `AuthSignedOut` is emitted right away. The returned future then waits up to 10 seconds for the server to revoke the session. It does not throw: a failed revoke is logged.
      - With `SignOutScope.global` or `SignOutScope.others`, the server is asked first. When that fails, `signOut()` throws an `AuthException` and keeps the session, so you can retry.
      - `SignOutScope.others` signs out every other session and keeps the current one, so no `AuthSignedOut` is emitted.
    params:
      - name: scope
        isOptional: true
        type: SignOutScope
        description: Whether to sign out the current session, every session of the user, or every other session. Defaults to `SignOutScope.local`.
    examples:
      - id: sign-out
        name: Sign out
        isSpotlight: true
        code: |
          ```dart
          await supabase.auth.signOut();
          ```
      - id: sign-out-all-sessions
        name: Sign out of every device
        code: |
          ```dart
          try {
            await supabase.auth.signOut(scope: SignOutScope.global);
          } on AuthException catch (error) {
            print('Could not sign out every device: ${error.message}');
          }
          ```
  - id: verify-otp
    title: 'verifyOTP()'
    notes: |
      - The `verifyOTP` method takes in different verification types. If a phone number is used, the type can either be `OtpType.sms` or `OtpType.phoneChange`. If an email address is used, the type can be one of `OtpType.email`, `OtpType.recovery`, `OtpType.invite` or `OtpType.emailChange` (`OtpType.signup` and `OtpType.magiclink` are deprecated).
      - The verification type used should be determined based on the corresponding auth method called before `verifyOTP` to sign up or sign in a user.
      - Returns an `AuthResponse`. Once a session is issued, `AuthSignedIn` is emitted, except for `OtpType.recovery`, which emits `AuthPasswordRecovery`, and `OtpType.emailChange` and `OtpType.phoneChange`, which emit `AuthUserUpdated`.
    params:
      - name: token
        isOptional: true
        type: String
        description: The token that user was sent to their email or mobile phone. Required unless `tokenHash` is passed.
      - name: type
        isOptional: false
        type: OtpType
        description: Type of the OTP to verify.
      - name: email
        isOptional: true
        type: String
        description: Email address that the OTP was sent to.
      - name: phone
        isOptional: true
        type: String
        description: Phone number that the OTP was sent to.
      - name: redirectTo
        isOptional: true
        type: String
        description: URL to redirect the user to after the OTP is verified.
      - name: captchaToken
        isOptional: true
        type: String
        description: The captcha token to be used for captcha verification.
      - name: tokenHash
        isOptional: true
        type: String
        description: Token hash used in an email link.
    examples:
      - id: verify-sms-one-time-password(otp)
        name: Verify SMS One-Time Password (OTP)
        isSpotlight: true
        code: |
          ```dart
          final response = await supabase.auth.verifyOTP(
            type: OtpType.sms,
            token: '111111',
            phone: '+13334445555',
          );
          final Session? session = response.session;
          final User? user = response.user;
          ```
        response: |
          ```json
          AuthResponse(
            user: User(...),
            session: Session(
              accessToken: '<ACCESS_TOKEN>',
              tokenType: 'bearer',
              expiresIn: 3600,
              refreshToken: '<REFRESH_TOKEN>',
              user: User(...),
            ),
          );
          ```
      - id: verify-email-one-time-password(otp)
        name: Verify Email One-Time Password (OTP)
        code: |
          ```dart
          final response = await supabase.auth.verifyOTP(
            type: OtpType.email,
            token: token,
            email: 'example@email.com',
          );
          ```
      - id: verify-token-hash
        name: Verify a token hash from an email link
        code: |
          ```dart
          final response = await supabase.auth.verifyOTP(
            type: OtpType.recovery,
            tokenHash: tokenHash,
          );
          ```
  - id: get-session
    title: 'currentSession'
    description: |
      Returns the session data, if there is an active session.
    notes: |
      - `currentSession` is a synchronous getter that returns whatever session is stored, even one whose access token has already expired.
      - `getSession()` is an asynchronous alternative that guarantees a valid access token when it resolves: a still-valid session is returned as-is, while an expired one is refreshed on demand first. It returns `null` when there is no session and throws an `AuthException` when an expired session cannot be refreshed. An expired session without a refresh token is signed out and throws an `AuthSessionMissingException`.
    examples:
      - id: get-the-session-data
        name: Get the session data
        isSpotlight: true
        code: |
          ```dart
          final Session? session = supabase.auth.currentSession;
          ```
        response: |
          ```json
          Session(
            accessToken: '<ACCESS_TOKEN>',
            tokenType: 'bearer',
            expiresIn: 3600,
            refreshToken: '<REFRESH_TOKEN>',
            user: User(
              id: '11111111-1111-1111-1111-111111111111',
              audience: 'authenticated',
              role: 'authenticated',
              email: 'example@email.com',
              emailConfirmedAt: DateTime.utc(2024, 1, 1),
              phone: '',
              lastSignInAt: DateTime.utc(2024, 1, 1),
              appMetadata: AppMetadata(
                provider: 'email',
                providers: ['email'],
              ),
              userMetadata: {},
              identities: [
                UserIdentity(
                  identityId: '22222222-2222-2222-2222-222222222222',
                  id: '11111111-1111-1111-1111-111111111111',
                  userId: '11111111-1111-1111-1111-111111111111',
                  identityData: {
                    'email': 'example@email.com',
                    'email_verified': false,
                    'phone_verified': false,
                    'sub': '11111111-1111-1111-1111-111111111111',
                  },
                  provider: 'email',
                  lastSignInAt: DateTime.utc(2024, 1, 1),
                  createdAt: DateTime.utc(2024, 1, 1),
                  updatedAt: DateTime.utc(2024, 1, 1),
                ),
              ],
              createdAt: DateTime.utc(2024, 1, 1),
              updatedAt: DateTime.utc(2024, 1, 1),
            ),
          );
          ```
      - id: get-the-session-data-async
        name: Get the session data, refreshing if needed
        description: |
          Use the asynchronous `getSession()` to get a session whose access token is guaranteed to be valid, refreshing it on demand when it has expired.
        code: |
          ```dart
          final session = await supabase.auth.getSession();
          ```
  - id: get-user
    title: 'currentUser'
    description: |
      Returns the user data, if there is a signed-in user.
    notes: |
      - `currentUser` is read from the stored session without a request. To fetch the latest user data from the server, use [`getUser()`](/docs/reference/dart/auth-getuser).
    examples:
      - name: Get the signed-in user
