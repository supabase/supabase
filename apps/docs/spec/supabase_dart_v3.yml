          ```
      - id: update-the-users-metadata
        name: Update the user's metadata
        isSpotlight: true
        code: |
          ```dart
          final response = await supabase.auth.updateUser(
            UserAttributes(
              data: {'hello': 'world'},
            ),
          );
          ```
      - id: update-password-with-reauthentication
        name: Update the user's password with a nonce
        description: If **Secure password change** is enabled, updating the user's password requires a nonce. Send it to the user's email or phone number with [`reauthenticate()`](/docs/reference/dart/auth-reauthenticate).
        isSpotlight: true
        code: |
          ```dart
          await supabase.auth.updateUser(
            UserAttributes(
              password: 'new password',
              nonce: '123456',
            ),
