      - name: download
        isOptional: true
        type: DownloadBehavior
        description: Triggers the file to be downloaded rather than opened in the browser. Use `DownloadBehavior.withOriginalName` to keep the original file name or `DownloadBehavior.named('custom.png')` to override it.
      - name: cacheNonce
        isOptional: true
        type: String
        description: Appends a `cacheNonce` query parameter to the URL to bypass CDN caching for a specific file version.
      - name: versionId
        isOptional: true
        type: String
        description: Points the URL at that version of the file instead of the current one.
      - name: transform
        isOptional: true
        type: TransformOptions
        description: Transform the asset before serving it to the client.
        subContent:
          - name: width
            isOptional: true
            type: int
            description: The width of the image in pixels.
          - name: height
            isOptional: true
            type: int
            description: The height of the image in pixels.
          - name: resize
            isOptional: true
            type: ResizeMode
            description: Specifies how image cropping should be handled when performing image transformations. Defaults to `ResizeMode.cover`.
          - name: quality
            isOptional: true
            type: int
            description: Set the quality of the returned image. A number from 20 to 100, with 100 being the highest quality. Defaults to 80
          - name: format
            isOptional: true
            type: RequestImageFormat
            description: Specify the format of the image requested. When using 'origin' we force the format to be the same as the original image. When this option is not passed in, images are optimized to modern image formats like Webp.
    examples:
      - id: returns-the-url-for-an-asset-in-a-public-bucket
        name: Returns the URL for an asset in a public bucket
        isSpotlight: true
        code: |
          ```dart
          final String publicUrl = supabase.storage
              .from('public-bucket')
              .getPublicUrl('avatar1.png');
          ```
        response: |
          ```json
          'https://example.supabase.co/storage/v1/object/public/public-bucket/avatar1.png'
          ```
      - id: returns-the-url-for-an-asset-in-a-public-bucket-with-transform
        name: With transform
        code: |
          ```dart
          final String publicUrl = supabase.storage
              .from('public-bucket')
              .getPublicUrl(
                'avatar1.png',
                transform: const TransformOptions(width: 200, height: 200),
              );
          ```
      - id: returns-the-url-for-an-asset-with-download
        name: Trigger download
        code: |
          ```dart
          final String publicUrl = supabase.storage
              .from('public-bucket')
              .getPublicUrl(
                'avatar1.png',
                download: DownloadBehavior.withOriginalName,
              );
          ```
      - id: returns-the-url-for-an-asset-with-cache-nonce
        name: Bypass the CDN cache
        code: |
          ```dart
          final String publicUrl = supabase.storage
              .from('public-bucket')
              .getPublicUrl('avatar1.png', cacheNonce: 'v2');
          ```
        response: |
          ```json
          'https://example.supabase.co/storage/v1/object/public/public-bucket/avatar1.png?cacheNonce=v2'
          ```

  - id: from-download
    description: |
      Downloads a file.
    title: 'from.download()'
    notes: |
      - Policy permissions required:
        - `buckets` permissions: none
        - `objects` permissions: `select`
      - Refer to the [Storage guide](https://supabase.com/docs/guides/storage/security/access-control) on how access control works
    params:
      - name: path
        isOptional: false
        type: String
        description: The full path and file name of the file to be downloaded. For example folder/image.png.
      - name: cacheNonce
        isOptional: true
        type: String
        description: Adds a `cacheNonce` query parameter to bypass CDN caching for a specific file version.
      - name: versionId
        isOptional: true
        type: String
        description: Downloads that version of the file instead of the current one.
      - name: range
        isOptional: true
        type: ByteRange
        description: Downloads only the given bytes of the file. Both offsets are zero based and inclusive. Cannot be combined with `transform`.
      - name: abortSignal
        isOptional: true
        type: Future<void>
        description: Aborts the download when the future completes. The download then throws a `RequestAbortedException`.
      - name: onProgress
        isOptional: true
        type: DownloadProgressCallback
        description: Called as the file arrives, with the bytes received so far and the total. The total is `null` when the response has no `Content-Length`, as for a transformed image.
      - name: transform
        isOptional: true
        type: TransformOptions
        description: Transform the asset before serving it to the client.
        subContent:
          - name: width
            isOptional: true
            type: int
            description: The width of the image in pixels.
          - name: height
            isOptional: true
            type: int
            description: The height of the image in pixels.
          - name: resize
            isOptional: true
            type: ResizeMode
            description: Specifies how image cropping should be handled when performing image transformations. Defaults to `ResizeMode.cover`.
          - name: quality
            isOptional: true
            type: int
            description: Set the quality of the returned image. A number from 20 to 100, with 100 being the highest quality. Defaults to 80
          - name: format
            isOptional: true
            type: RequestImageFormat
            description: Specify the format of the image requested. When using 'origin' we force the format to be the same as the original image. When this option is not passed in, images are optimized to modern image formats like Webp.
    examples:
      - id: download-file
        name: Download file
        isSpotlight: true
        code: |
          ```dart
          final Uint8List file = await supabase.storage
              .from('avatars')
              .download('avatar1.png');
          ```
      - id: download-file-with-transform
        name: With transform
        code: |
          ```dart
          final Uint8List file = await supabase.storage
              .from('avatars')
              .download(
                'avatar1.png',
                transform: const TransformOptions(width: 200, height: 200),
              );
          ```
      - id: download-file-with-progress
        name: Report progress
        code: |
          ```dart
          final Uint8List file = await supabase.storage
              .from('videos')
              .download(
                'holiday.mp4',
                onProgress: (receivedBytes, totalBytes) {
                  print('Received $receivedBytes of $totalBytes bytes');
                },
              );
          ```
      - id: download-file-range
        name: Download part of a file
        code: |
          ```dart
          final Uint8List firstKilobyte = await supabase.storage
              .from('videos')
              .download('holiday.mp4', range: ByteRange(0, 1023));
          ```
      - id: download-file-with-cache-nonce
        name: Bypass the CDN cache
        code: |
          ```dart
          final Uint8List file = await supabase.storage
              .from('avatars')
              .download('avatar1.png', cacheNonce: 'v2');
          ```

  - id: from-download-stream
    description: |
      Downloads a file as a lazy `Stream<Uint8List>`, streaming the bytes instead of buffering the whole file into memory like `download()`.
    title: 'from.downloadStream()'
    notes: |
      - The request is sent when the stream is listened to. A non-success response surfaces as a `StorageException` on the stream before any bytes are emitted.
      - An abort through `abortSignal` surfaces as a `RequestAbortedException` error on the stream, which then closes.
      - Takes the same parameters as [`download()`](/docs/reference/dart/file-buckets-download), including `range` and `onProgress`.
      - Prefer this over `download()` for large files to keep memory usage low.
      - Policy permissions required:
        - `buckets` permissions: none
        - `objects` permissions: `select`
      - Refer to the [Storage guide](https://supabase.com/docs/guides/storage/security/access-control) on how access control works
    params:
      - name: path
        isOptional: false
        type: String
        description: The full path and file name of the file to be downloaded. For example folder/image.png.
    examples:
      - id: download-file-as-stream
        name: Download a file as a stream
        isSpotlight: true
        code: |
          ```dart
          final Stream<Uint8List> stream = supabase.storage
              .from('avatars')
              .downloadStream('avatar1.png');

          await for (final chunk in stream) {
            // Handle each chunk of bytes as it arrives
          }
          ```
      - id: download-stream-to-file
        name: Save a large file to disk
        code: |
          ```dart
          final sink = File('path/to/holiday.mp4').openWrite();
          await sink.addStream(
            supabase.storage.from('videos').downloadStream('holiday.mp4'),
          );
          await sink.close();
          ```

  - id: from-get-metadata
    description: |
      Retrieves the details of an existing file.
    title: 'from.getMetadata()'
    notes: |
      - Returns a `FileObjectV2` with the size, content type, ETag, timestamps and metadata of the file.
      - Policy permissions required:
        - `buckets` permissions: none
        - `objects` permissions: `select`
      - Refer to the [Storage guide](https://supabase.com/docs/guides/storage/security/access-control) on how access control works
    params:
      - name: path
        isOptional: false
        type: String
        description: The file path, including the file name. For example folder/image.png.
      - name: versionId
        isOptional: true
        type: String
        description: Describes that version of the file instead of the current one.
    examples:
      - id: get-file-metadata
        name: Get file metadata
        isSpotlight: true
        code: |
          ```dart
          final FileObjectV2 file = await supabase.storage
              .from('avatars')
              .getMetadata('avatar1.png');
          print('${file.size} bytes of ${file.contentType}');
          ```

  - id: from-exists
    description: |
      Checks whether a file exists.
    title: 'from.exists()'
    notes: |
      - Returns `false` only when the file is missing. Any other failure, such as a missing bucket or an invalid access token, throws a `StorageApiException`.
      - Policy permissions required:
        - `buckets` permissions: none
        - `objects` permissions: `select`
      - Refer to the [Storage guide](https://supabase.com/docs/guides/storage/security/access-control) on how access control works
    params:
      - name: path
        isOptional: false
        type: String
        description: The file path, including the file name. For example folder/image.png.
    examples:
      - id: check-file-exists
        name: Check whether a file exists
        isSpotlight: true
        code: |
          ```dart
          try {
            final found = await supabase.storage
                .from('avatars')
                .exists('avatar1.png');
            print(found ? 'Found' : 'Missing');
          } on StorageApiException catch (error) {
            print('Could not check: ${error.errorCode}');
          }
          ```

  - id: from-purge-cache
    description: |
      Invalidates the CDN cache for a single object in a bucket.
    title: 'from.purgeCache()'
    notes: |
      - Requires the `secret` key and the `purgeCache` feature enabled for your project on the storage server.
      - When `transformations` is `true`, only the resized and formatted variants are purged, leaving the original cached object intact. Otherwise both are purged.
      - Policy permissions required:
        - `buckets` permissions: none
        - `objects` permissions: `select`
      - Refer to the [Storage guide](https://supabase.com/docs/guides/storage/security/access-control) on how access control works
    params:
      - name: path
        isOptional: false
        type: String
        description: The path and name of the object to purge from the CDN cache. For example folder/image.png.
      - name: transformations
        isOptional: true
        type: bool
        description: When true, only the transformed (resized or formatted) variants are purged, leaving the original cached object intact. Defaults to false.
    examples:
      - id: purge-object-cache
        name: Purge the CDN cache for an object
        isSpotlight: true
        code: |
          ```dart
          await supabase.storage.from('avatars').purgeCache('avatar1.png');
          ```
      - id: purge-object-transformations-cache
        name: Purge only the transformed variants
        code: |
          ```dart
          await supabase.storage
              .from('avatars')
              .purgeCache('avatar1.png', transformations: true);
          ```

  - id: from-remove
    description: |
      Deletes files within the same bucket.
    title: 'from.remove()'
    notes: |
      - Returns the deleted files as `FileObject`s.
      - Policy permissions required:
        - `buckets` permissions: none
        - `objects` permissions: `delete` and `select`
      - Refer to the [Storage guide](https://supabase.com/docs/guides/storage/security/access-control) on how access control works
    params:
      - name: paths
        isOptional: false
        type: List<String>
        description: A list of files to delete, including the path and file name. For example ['folder/image.png'].
    examples:
      - id: delete-file
        name: Delete file
        isSpotlight: true
        code: |
          ```dart
          final List<FileObject> objects = await supabase.storage
              .from('avatars')
              .remove(['avatar1.png']);
          ```

  - id: from-remove-versions
    description: |
      Deletes specific versions of files within the same bucket.
    title: 'from.removeVersions()'
    notes: |
      - Unlike `remove()`, which deletes whatever is currently at a path, this deletes exactly the given versions, whether they are current or not.
      - Requires a bucket that has had versioning enabled.
    params:
      - name: versions
        isOptional: false
        type: List<FileVersion>
        description: The versions to delete, each with its `path` and `versionId`.
    examples:
      - id: delete-file-versions
        name: Delete a version
        isSpotlight: true
        code: |
          ```dart
          await supabase.storage.from('avatars').removeVersions([
            const FileVersion(path: 'avatar1.png', versionId: 'version-id'),
          ]);
          ```

  - id: from-list
    description: |
      Lists all the files within a bucket.
    title: 'from.list()'
    notes: |
      - Policy permissions required:
        - `buckets` permissions: none
        - `objects` permissions: `select`
      - Refer to the [Storage guide](https://supabase.com/docs/guides/storage/security/access-control) on how access control works
    params:
      - name: path
        isOptional: true
        type: String
        description: The folder path.
      - name: searchOptions
        isOptional: true
        type: SearchOptions
        description: Options for the search operations such as limit and offset.
        subContent:
          - name: limit
            isOptional: true
            type: int
            description: The number of files you want to be returned. Defaults to 100.
          - name: offset
            isOptional: true
            type: int
            description: The starting position. Defaults to 0.
          - name: sortBy
            isOptional: true
            type: SortBy
            description: The column and direction to sort by.
            subContent:
              - name: column
                isOptional: true
                type: String
                description: The column to sort by. Can be any column inside a `FileObject`. Defaults to `name`.
              - name: order
                isOptional: true
                type: SortDirection
                description: The sort direction. Defaults to `SortDirection.ascending`.
          - name: search
            isOptional: true
            type: String
            description: The search string to filter files by.
          - name: noncurrentVersions
            isOptional: true
            type: ListInclusion
            description: Whether previous versions of the files are listed. Requires a bucket that has had versioning enabled.
          - name: deleteMarkers
            isOptional: true
            type: ListInclusion
            description: Whether the entries marking deleted files are listed. Requires a bucket that has had versioning enabled.
    examples:
      - id: list-files-in-a-bucket
        name: List files in a bucket
        isSpotlight: true
        code: |
          ```dart
          final List<FileObject> objects = await supabase.storage
              .from('avatars')
              .list();
          ```
      - id: list-files-with-options
        name: With search and sort
        code: |
          ```dart
          final List<FileObject> objects = await supabase.storage
              .from('avatars')
              .list(
                path: 'public',
                searchOptions: const SearchOptions(
                  limit: 10,
                  search: 'avatar',
                  sortBy: SortBy(
                    column: 'created_at',
                    order: SortDirection.descending,
                  ),
                ),
              );
          ```

  - id: storagefile-list-v2
    description: |
      Lists files and folders within a bucket with cursor-based pagination and hierarchical (delimiter) listing.
    title: 'from.listPaginated()'
    notes: |
      - Folder entries in `PaginatedListResult.folders` only contain a name (and optionally a key). Full metadata is only available on the file entries in `PaginatedListResult.objects`.
      - To fetch the next page, pass the `PaginatedListResult.nextCursor` value from the previous request as `PaginatedSearchOptions.cursor`. Use `PaginatedListResult.hasNext` to check whether more results are available.
      - Policy permissions required:
        - `buckets` permissions: none
        - `objects` permissions: `select`
      - Refer to the [Storage guide](https://supabase.com/docs/guides/storage/security/access-control) on how access control works
    params:
      - name: options
        isOptional: true
        type: PaginatedSearchOptions
        description: Options for the paginated search operation.
        subContent:
          - name: limit
            isOptional: true
            type: int
            description: The number of files to return. Defaults to 1000 on the server when omitted.
          - name: prefix
            isOptional: true
            type: String
            description: The prefix to filter files by.
          - name: cursor
            isOptional: true
            type: String
            description: The cursor used for pagination. Pass the `PaginatedListResult.nextCursor` value from the previous request to fetch the next page.
          - name: withDelimiter
            isOptional: true
            type: bool
            description: Whether to emulate a hierarchical listing of objects using delimiters. When `false` (default) all objects are listed as a flat list. When `true` the response groups objects by delimiter, separating them into `PaginatedListResult.folders` and `PaginatedListResult.objects`.
          - name: sortBy
            isOptional: true
            type: FileSort
            description: The column and direction to sort by.
            subContent:
              - name: column
                isOptional: true
                type: FileSortColumn
                description: The column to sort by. One of `FileSortColumn.name`, `FileSortColumn.updatedAt` or `FileSortColumn.createdAt`. Defaults to `FileSortColumn.name`.
              - name: order
                isOptional: true
                type: SortDirection
                description: The sort direction. Either `SortDirection.ascending` or `SortDirection.descending`. Defaults to `SortDirection.ascending`.
    examples:
      - id: list-files-paginated
        name: List files with pagination
        isSpotlight: true
        code: |
          ```dart
          final PaginatedListResult result = await supabase.storage
              .from('avatars')
              .listPaginated(
                options: const PaginatedSearchOptions(
                  prefix: 'folder/',
                  limit: 100,
                  withDelimiter: true,
                  sortBy: FileSort(
                    column: FileSortColumn.createdAt,
                    order: SortDirection.descending,
                  ),
                ),
              );

          for (final folder in result.folders) {
            // Handle each folder
          }
          for (final object in result.objects) {
            // Handle each file
          }
          ```
      - id: list-files-paginated-next-page
        name: Fetch the next page
        code: |
          ```dart
          var result = await supabase.storage.from('avatars').listPaginated();

          while (result.hasNext) {
            result = await supabase.storage
                .from('avatars')
                .listPaginated(
                  options: PaginatedSearchOptions(cursor: result.nextCursor),
                );
          }
          ```

  - id: analytics-buckets
    title: 'Overview'
    category: Storage
    subcategory: Analytics Buckets
    notes: |
      This section contains methods for working with Analytics Buckets.
  - id: storageanalytics-from
    description: |
      Returns an Iceberg REST Catalog client for an analytics bucket, used to manage the namespaces and tables (the warehouse) inside it.
    title: 'storage.analyticsCatalog()'
    notes: |
      - Analytics buckets are backed by the Apache Iceberg table format.
      - `analyticsCatalog()` returns an `IcebergRestCatalog` scoped to a single analytics bucket. Use it to create and manage namespaces and tables within that bucket.
      - The options of the catalog operations are named parameters, and every operation takes an optional `abortSignal` future that aborts the request when it completes.
      - Failures throw an `IcebergException` with the error the server sent.
      - Refer to the [Storage guide](https://supabase.com/docs/guides/storage/security/access-control) on how access control works
    params:
      - name: bucketId
        isOptional: false
        type: String
        description: The identifier of the analytics bucket (the warehouse) whose namespaces and tables you want to manage.
      - name: accessDelegation
        isOptional: true
        type: List<AccessDelegation>
        description: Requests server side access delegation for the catalog operations.
    examples:
      - id: get-analytics-catalog
        name: Get an analytics catalog client
        isSpotlight: true
        code: |
          ```dart
          final catalog = supabase.storage.analyticsCatalog('my-analytics-bucket');

          await catalog.createNamespace(['analytics']);
          ```
      - id: list-namespaces
        name: List namespaces and tables
        code: |
          ```dart
          final catalog = supabase.storage.analyticsCatalog('my-analytics-bucket');

          final namespaces = await catalog.listNamespaces(
            options: const ListNamespacesOptions(pageSize: 100),
          );
          for (final namespace in namespaces.namespaces) {
            final tables = await catalog.listTables(
              namespace,
              abortSignal: Future.delayed(const Duration(seconds: 10)),
            );
            print('$namespace: ${tables.identifiers.length} tables');
          }
          ```
  - id: storageanalytics-createbucket
    description: |
      Creates a new analytics bucket backed by the Apache Iceberg table format.
    title: 'createAnalyticsBucket()'
    notes: |
      - Policy permissions required:
        - `buckets` permissions: `insert`
        - `objects` permissions: none
      - Refer to the [Storage guide](https://supabase.com/docs/guides/storage/security/access-control) on how access control works
    params:
      - name: id
        isOptional: false
        type: String
        description: A unique identifier for the analytics bucket you are creating.
    examples:
      - id: create-analytics-bucket
        name: Create analytics bucket
        isSpotlight: true
        code: |
          ```dart
          final AnalyticsBucket bucket = await supabase.storage
              .createAnalyticsBucket('warehouse');
          ```
        response: |
          ```json
          AnalyticsBucket(
            id: 'warehouse',
            name: 'warehouse',
            created_at: '2024-01-01T00:00:00.000Z',
            updated_at: '2024-01-02T00:00:00.000Z'
          )
          ```
  - id: storageanalytics-listbuckets
    description: |
      Retrieves the details of all analytics buckets within an existing project.
    title: 'listAnalyticsBuckets()'
    notes: |
      - Calling `listAnalyticsBuckets()` without any options returns all analytics buckets.
      - Policy permissions required:
        - `buckets` permissions: `select`
        - `objects` permissions: none
      - Refer to the [Storage guide](https://supabase.com/docs/guides/storage/security/access-control) on how access control works
    params:
      - name: options
        isOptional: true
        type: ListBucketsOptions
        description: Optionally filter, sort and paginate the returned buckets.
        subContent:
          - name: limit
            isOptional: true
            type: int
            description: The maximum number of buckets to return.
          - name: offset
            isOptional: true
            type: int
            description: The number of buckets to skip.
          - name: search
            isOptional: true
            type: String
            description: A search term used to filter buckets by name.
          - name: sortColumn
            isOptional: true
            type: BucketSortColumn
            description: The column to sort the buckets by. One of `BucketSortColumn.id`, `BucketSortColumn.name`, `BucketSortColumn.createdAt` or `BucketSortColumn.updatedAt`.
          - name: sortOrder
            isOptional: true
            type: SortDirection
            description: The direction to sort the buckets in. Either `SortDirection.ascending` or `SortDirection.descending`.
    examples:
      - id: list-analytics-buckets
        name: List analytics buckets
        isSpotlight: true
        code: |
          ```dart
          final List<AnalyticsBucket> buckets = await supabase.storage
              .listAnalyticsBuckets();
          ```
        response: |
          ```json
          [
            AnalyticsBucket(
              id: 'warehouse',
              name: 'warehouse',
              created_at: '2024-01-01T00:00:00.000Z',
              updated_at: '2024-01-02T00:00:00.000Z'
            ),
          ]
          ```
      - id: list-analytics-buckets-with-options
        name: With filter, sort and pagination
        code: |
          ```dart
          final List<AnalyticsBucket> buckets = await supabase.storage
              .listAnalyticsBuckets(
                const ListBucketsOptions(
                  limit: 10,
                  offset: 0,
                  search: 'ware',
                  sortColumn: BucketSortColumn.createdAt,
                  sortOrder: SortDirection.descending,
                ),
              );
          ```
  - id: storageanalytics-deletebucket
    description: |
      Deletes an existing analytics bucket. A bucket can't be deleted while it still contains namespaces or tables.
    title: 'deleteAnalyticsBucket()'
    notes: |
      - Policy permissions required:
        - `buckets` permissions: `select` and `delete`
        - `objects` permissions: none
      - Refer to the [Storage guide](https://supabase.com/docs/guides/storage/security/access-control) on how access control works
    params:
      - name: id
        isOptional: false
        type: String
        description: The unique identifier of the analytics bucket you would like to delete.
    examples:
      - id: delete-analytics-bucket
        name: Delete analytics bucket
        isSpotlight: true
        code: |
          ```dart
          await supabase.storage.deleteAnalyticsBucket('warehouse');
          ```

  - id: vector-buckets
    title: 'Overview'
    category: Storage
    subcategory: Vector Buckets
    notes: |
      This section contains methods for working with Vector Buckets.
  - id: storagevectors-from
    title: 'from()'
    notes: |
      Scopes index operations to a single vector bucket. Returns a `StorageVectorBucketApi`.
    examples:
      - id: vectors-from
        name: Scope operations to a bucket
        isSpotlight: true
        code: |
          ```dart
          final bucket = supabase.storage.vectors.from('embeddings');

          await bucket.createIndex(
            name: 'documents',
            dimension: 3,
            distanceMetric: DistanceMetric.cosine,
          );
          ```
  - id: storagevectors-create-bucket
    title: 'createBucket()'
    notes: |
      Creates a new vector bucket. Access the vectors client through `supabase.storage.vectors`.
    examples:
      - id: create-vector-bucket
        name: Create a vector bucket
        isSpotlight: true
        code: |
          ```dart
          final vectors = supabase.storage.vectors;

          await vectors.createBucket('embeddings');
          ```
  - id: storagevectors-delete-bucket
    title: 'deleteBucket()'
    notes: |
      Deletes a vector bucket. The bucket must have no indexes before it can be deleted.
    examples:
      - id: delete-vector-bucket
        name: Delete a vector bucket
        isSpotlight: true
        code: |
          ```dart
          final vectors = supabase.storage.vectors;

          await vectors.deleteBucket('embeddings');
          ```
  - id: storagevectors-get-bucket
    title: 'getBucket()'
    notes: |
      Retrieves the metadata of an existing vector bucket.
    examples:
      - id: get-vector-bucket
        name: Get a vector bucket
        isSpotlight: true
        code: |
          ```dart
          final vectors = supabase.storage.vectors;

          final VectorBucket bucket = await vectors.getBucket('embeddings');
          ```
  - id: storagevectors-list-buckets
    title: 'listBuckets()'
    notes: |
      Lists vector buckets. Use `prefix` to filter by name and `maxResults` / `nextToken` to paginate.
    examples:
      - id: list-vector-buckets
        name: List vector buckets
        isSpotlight: true
        code: |
          ```dart
          final vectors = supabase.storage.vectors;

          final VectorBucketList result = await vectors.listBuckets();

          for (final bucket in result.buckets) {
            print(bucket.name);
          }
          ```
      - id: list-vector-buckets-paginated
        name: Paginate and filter buckets
        code: |
          ```dart
          final vectors = supabase.storage.vectors;

          final result = await vectors.listBuckets(
            prefix: 'prod-',
            maxResults: 50,
          );

          final nextToken = result.nextToken;
          ```
  - id: vectorbucket-createindex
    title: 'createIndex()'
    notes: |
      Creates a new vector index in the scoped bucket. `dimension` is the length of the vectors the index will store and `distanceMetric` is the metric used for similarity queries. Keys listed in `nonFilterableMetadataKeys` can be stored on vectors but not used in query filters. `dataType` defaults to `VectorDataType.float32`.
    examples:
      - id: create-index
        name: Create an index
        isSpotlight: true
        code: |
          ```dart
          final bucket = supabase.storage.vectors.from('embeddings');

          await bucket.createIndex(
            name: 'documents',
            dimension: 3,
            distanceMetric: DistanceMetric.cosine,
          );
          ```
      - id: create-index-non-filterable
        name: Create an index with non-filterable metadata
        code: |
          ```dart
          final bucket = supabase.storage.vectors.from('embeddings');

          await bucket.createIndex(
            name: 'documents',
            dimension: 3,
            distanceMetric: DistanceMetric.euclidean,
            nonFilterableMetadataKeys: ['rawText'],
          );
          ```
  - id: vectorbucket-deleteindex
    title: 'deleteIndex()'
    notes: |
      Deletes an index and all of its vectors from the scoped bucket.
    examples:
      - id: delete-index
        name: Delete an index
        isSpotlight: true
        code: |
          ```dart
          final bucket = supabase.storage.vectors.from('embeddings');

          await bucket.deleteIndex('documents');
          ```
  - id: vectorbucket-getindex
    title: 'getIndex()'
    notes: |
      Retrieves the metadata of an index in the scoped bucket.
    examples:
      - id: get-index
        name: Get an index
        isSpotlight: true
        code: |
          ```dart
          final bucket = supabase.storage.vectors.from('embeddings');

          final VectorIndex index = await bucket.getIndex('documents');

          print(index.dimension);
          print(index.distanceMetric);
          ```
  - id: vectorbucket-listindexes
    title: 'listIndexes()'
    notes: |
      Lists indexes in the scoped bucket. Use `prefix` to filter by name and `maxResults` / `nextToken` to paginate.
    examples:
      - id: list-indexes
        name: List indexes
        isSpotlight: true
        code: |
          ```dart
          final bucket = supabase.storage.vectors.from('embeddings');

          final VectorIndexList result = await bucket.listIndexes();

          for (final index in result.indexes) {
            print(index.name);
          }
          ```
  - id: vectorbucket-index
    title: 'index()'
    notes: |
      Scopes vector data operations to a single index within a bucket. Returns a `StorageVectorIndexApi`.
    examples:
      - id: bucket-index
        name: Scope operations to an index
        isSpotlight: true
        code: |
          ```dart
          final bucket = supabase.storage.vectors.from('embeddings');

          final index = bucket.index('documents');

          await index.putVectors([
            Vector(key: 'doc-1', data: [0.1, 0.2, 0.3]),
          ]);
          ```
  - id: vectorindex-deletevectors
    title: 'deleteVectors()'
    notes: |
      Deletes vectors by their keys. The batch must contain between 1 and 500 keys.
    examples:
      - id: delete-vectors
        name: Delete vectors
        isSpotlight: true
        code: |
          ```dart
          final index = supabase.storage.vectors
              .from('embeddings')
              .index('documents');

          await index.deleteVectors(['doc-1', 'doc-2']);
          ```
  - id: vectorindex-getvectors
    title: 'getVectors()'
    notes: |
      Retrieves vectors by their keys. Set `returnData` and `returnMetadata` to include the embeddings and metadata in the result. Keys that do not exist are omitted from the returned list.
    examples:
      - id: get-vectors
        name: Get vectors by key
        isSpotlight: true
        code: |
          ```dart
          final index = supabase.storage.vectors
              .from('embeddings')
              .index('documents');

          final List<VectorMatch> vectors = await index.getVectors(
            keys: ['doc-1', 'doc-2'],
            returnData: true,
            returnMetadata: true,
          );

          for (final vector in vectors) {
            print('${vector.key}: ${vector.metadata}');
          }
          ```
  - id: vectorindex-listvectors
    title: 'listVectors()'
    notes: |
      Lists vectors in the scoped index with pagination. A full-index scan can be distributed across multiple workers by giving each worker a different `segmentIndex` (0 to `segmentCount - 1`) for the same `segmentCount` (1 to 16).
    examples:
      - id: list-vectors
        name: List vectors
        isSpotlight: true
        code: |
          ```dart
          final index = supabase.storage.vectors
              .from('embeddings')
              .index('documents');

          final VectorList result = await index.listVectors(
            maxResults: 100,
            returnMetadata: true,
          );

          for (final vector in result.vectors) {
            print(vector.key);
          }
          ```
      - id: list-vectors-parallel-scan
        name: Parallel scan with segments
        code: |
          ```dart
          final index = supabase.storage.vectors
              .from('embeddings')
              .index('documents');

          // Worker 2 of a 4-way parallel scan.
          final result = await index.listVectors(
            segmentCount: 4,
            segmentIndex: 2,
          );
          ```
  - id: vectorindex-putvectors
    title: 'putVectors()'
    notes: |
      Inserts or updates a batch of vectors in the scoped index. The batch must contain between 1 and 500 vectors, and each vector's `data` length must match the index dimension.
    examples:
      - id: put-vectors
        name: Put vectors
        isSpotlight: true
        code: |
          ```dart
          final index = supabase.storage.vectors
              .from('embeddings')
              .index('documents');

          await index.putVectors([
            Vector(
              key: 'doc-1',
              data: [0.1, 0.2, 0.3],
              metadata: {'title': 'Intro'},
            ),
            Vector(
              key: 'doc-2',
              data: [0.4, 0.5, 0.6],
              metadata: {'title': 'Guide'},
            ),
          ]);
          ```
  - id: vectorindex-queryvectors
    title: 'queryVectors()'
    notes: |
      Searches the scoped index for the vectors most similar to `queryVector`. `topK` limits the number of matches returned. `filter` restricts the search to vectors whose metadata matches the given expression. Set `returnDistance` and `returnMetadata` to include the distance scores and metadata in the result.
    examples:
      - id: query-vectors
        name: Query vectors
        isSpotlight: true
        code: |
          ```dart
          final index = supabase.storage.vectors
              .from('embeddings')
              .index('documents');

          final VectorQueryResult result = await index.queryVectors(
            queryVector: [0.1, 0.2, 0.3],
            topK: 5,
            returnDistance: true,
            returnMetadata: true,
          );

          for (final match in result.matches) {
            print('${match.key}: ${match.distance}');
          }
          ```
      - id: query-vectors-filter
        name: Query with a metadata filter
        code: |
          ```dart
          final index = supabase.storage.vectors
              .from('embeddings')
              .index('documents');

          final result = await index.queryVectors(
            queryVector: [0.1, 0.2, 0.3],
            topK: 10,
            filter: {'category': 'docs'},
            returnMetadata: true,
          );
          ```
  - id: using-modifiers
    title: Using Modifiers
    category: Database
    subcategory: Using modifiers
    description: |
      Filters work on the row level: they return only the rows that match
      certain conditions without changing the shape of the rows. Modifiers are
      everything else. They sort the rows, limit how many come back, or change
      the format of the response, for example to a CSV string.

      Modifiers come after filters. Some modifiers only apply to queries that
      return rows, such as `select()` or a database function that returns a
      table.

      The examples use the typed `table()` API with types
      [generated from your database schema](/docs/guides/api/rest/generating-types).
      Where a modifier takes a column, the column is a generated constant, such
      as `Countries.name`. On `from()` the same modifiers take column names as
      strings.

  - id: db-modifiers-select
    title: select()
    description: |
      By default, `insert()`, `upsert()`, `update()` and `delete()` resolve to
      `void`. Chain `select()` to return the rows they wrote, typed as the row
      type of the table.
    examples:
      - id: with-upsert
        name: With `upsert()`
        code: |
          ```dart
          final List<CountriesRow> countries = await supabase
              .table(Countries.table)
              .upsert(CountriesInsert(id: 1, name: 'Albania'))
              .select();
          ```
        data:
          sql: |
            ```sql
            create table
              countries (id int8 primary key, name text);

            insert into
              countries (id, name)
            values
              (1, 'Afghanistan');
            ```
        response: |
          ```json
          [
            {
              "id": 1,
              "name": "Albania"
            }
          ]
          ```
        hideCodeBlock: true
        isSpotlight: true

  - id: order
    title: order()
    description: |
      Orders the result by a column. The order is ascending unless you call
      `desc()` on the column. Repeated calls append, so a later ordering breaks
      ties in an earlier one.
    params:
      - name: ordering
        isOptional: false
        type: PostgrestOrdering
        description: |
          The column to order by, such as `Countries.name`, optionally followed
          by `asc()` or `desc()` and then `nullsFirst()` or `nullsLast()`.
    examples:
      - id: with-select
        name: With `select()`
        isSpotlight: true
        code: |
          ```dart
          final data = await supabase
              .table(Countries.table)
              .select()
              .order(Countries.name.desc());
          ```
        data:
          sql: |
            ```sql
            create table
              countries (id int8 primary key, name text);

            insert into
              countries (id, name)
            values
              (1, 'Afghanistan'),
              (2, 'Albania'),
              (3, 'Algeria');
            ```
        response: |
          ```json
          [
            {
              "id": 3,
              "name": "Algeria"
            },
            {
              "id": 2,
              "name": "Albania"
            },
            {
              "id": 1,
              "name": "Afghanistan"
            }
          ]
          ```
      - id: placing-nulls
        name: Placing `null` values
        description: |
          Without `nullsFirst()` or `nullsLast()`, Postgres puts `null` values
          last in ascending order and first in descending order.
        code: |
          ```dart
          final data = await supabase
              .table(Countries.table)
              .select()
              .order(Countries.name.desc().nullsLast());
          ```
        data:
          sql: |
            ```sql
            create table
              countries (id int8 primary key, name text);

            insert into
              countries (id, name)
            values
              (1, 'Afghanistan'),
              (2, null),
              (3, 'Algeria');
            ```
        response: |
          ```json
          [
            {
              "id": 3,
              "name": "Algeria"
            },
            {
              "id": 1,
              "name": "Afghanistan"
            },
            {
              "id": 2,
              "name": null
            }
          ]
          ```
      - id: on-a-referenced-table
        name: On a referenced table
        description: |
          Order the rows of an embedded table inside
          [`embedded()`](/docs/reference/dart/embedded). The parent rows keep
          their order.
        code: |
          ```dart
          final data = await supabase
              .table(OrchestralSections.table)
              .selectOnly([
                OrchestralSections.name,
                OrchestralSections.instruments.select([Instruments.name]),
              ])
              .embedded(
                OrchestralSections.instruments,
                (instruments) => instruments.order(Instruments.name.desc()),
              );
          ```
        data:
          sql: |
            ```sql
            create table
              orchestral_sections (id int8 primary key, name text);
            create table
              instruments (
                id int8 primary key,
                section_id int8 not null references orchestral_sections,
                name text
              );

            insert into
              orchestral_sections (id, name)
            values
              (1, 'strings'),
              (2, 'woodwinds');
            insert into
              instruments (id, section_id, name)
            values
              (1, 1, 'harp'),
              (2, 1, 'violin');
            ```
        response: |
          ```json
          [
            {
              "name": "strings",
              "instruments": [
                {
                  "name": "violin"
                },
                {
                  "name": "harp"
                }
              ]
            },
            {
              "name": "woodwinds",
              "instruments": []
            }
          ]
          ```
      - id: order-parent-table-by-a-referenced-table
        name: Order parent table by a referenced table
        description: |
          A column of a to-one relation can order the parent rows.
        code: |
          ```dart
          final data = await supabase
              .table(Instruments.table)
              .selectOnly([
                Instruments.name,
                Instruments.orchestralSections(OrchestralSections.name),
              ])
              .order(Instruments.orchestralSections(OrchestralSections.name));
          ```
        data:
          sql: |
            ```sql
            create table
              orchestral_sections (id int8 primary key, name text);
            create table
              instruments (
                id int8 primary key,
                section_id int8 not null references orchestral_sections,
                name text
              );

            insert into
              orchestral_sections (id, name)
            values
              (1, 'strings'),
              (2, 'woodwinds');
            insert into
              instruments (id, section_id, name)
            values
              (1, 2, 'flute'),
              (2, 1, 'violin');
            ```
        response: |
          ```json
          [
            {
              "name": "violin",
              "orchestral_sections": { "name": "strings" }
            },
            {
              "name": "flute",
              "orchestral_sections": { "name": "woodwinds" }
            }
          ]
          ```
      - id: with-from
        name: With `from()`
        description: |
          On `from()`, `order()` takes the column name, `ascending` (defaults
          to `true`), `nullsFirst` and `referencedTable`.
        code: |
          ```dart
          final data = await supabase
              .from('countries')
              .select()
              .order('name', ascending: false);
          ```

  - id: limit
    title: limit()
    description: |
      Limits the result to the given number of rows.
    params:
      - name: count
        isOptional: false
        type: int
        description: The maximum number of rows to return.
    examples:
      - id: with-select
        name: With `select()`
        isSpotlight: true
        code: |
          ```dart
          final data = await supabase
              .table(Countries.table)
              .selectOnly([Countries.name])
              .limit(1);
          ```
        data:
          sql: |
            ```sql
            create table
              countries (id int8 primary key, name text);

            insert into
              countries (id, name)
            values
              (1, 'Afghanistan'),
              (2, 'Albania'),
              (3, 'Algeria');
            ```
        response: |
          ```json
          [
            {
              "name": "Afghanistan"
            }
          ]
          ```
      - id: on-a-referenced-table
        name: On a referenced table
        description: |
          Limit the rows of an embedded table inside
          [`embedded()`](/docs/reference/dart/embedded).
        code: |
          ```dart
          final data = await supabase
              .table(OrchestralSections.table)
              .selectOnly([
                OrchestralSections.name,
                OrchestralSections.instruments.select([Instruments.name]),
              ])
              .embedded(
                OrchestralSections.instruments,
                (instruments) => instruments.limit(1),
              );
          ```
        data:
          sql: |
            ```sql
            create table
              orchestral_sections (id int8 primary key, name text);
            create table
              instruments (
                id int8 primary key,
                section_id int8 not null references orchestral_sections,
                name text
              );

            insert into
              orchestral_sections (id, name)
            values
              (1, 'strings');
            insert into
              instruments (id, section_id, name)
            values
              (1, 1, 'violin'),
              (2, 1, 'viola');
            ```
        response: |
          ```json
          [
            {
              "name": "strings",
              "instruments": [
                {
                  "name": "violin"
                }
              ]
            }
          ]
          ```
      - id: with-from
        name: With `from()`
        description: |
          On `from()`, pass `referencedTable` to limit the rows of an embedded
          table.
        code: |
          ```dart
          final data = await supabase
              .from('orchestral_sections')
              .select('name, instruments(name)')
              .limit(1, referencedTable: 'instruments');
          ```

  - id: range
    title: range()
    description: |
      Limits the result to the rows from index `from` to index `to`, both
      inclusive. The first row has index 0. Throws an `ArgumentError` when `to`
      is less than `from`.
    params:
      - name: from
        isOptional: false
        type: int
        description: The index of the first row to return.
      - name: to
        isOptional: false
        type: int
        description: The index of the last row to return.
    examples:
      - id: with-select
        name: With `select()`
        isSpotlight: true
        code: |
          ```dart
          final data = await supabase
              .table(Countries.table)
              .selectOnly([Countries.name])
              .order(Countries.id)
              .range(0, 1);
          ```
        data:
          sql: |
            ```sql
            create table
              countries (id int8 primary key, name text);

            insert into
              countries (id, name)
            values
              (1, 'Afghanistan'),
              (2, 'Albania'),
              (3, 'Algeria');
            ```
        response: |
          ```json
          [
            {
              "name": "Afghanistan"
            },
            {
              "name": "Albania"
            }
          ]
          ```
      - id: on-a-referenced-table
        name: On a referenced table
        description: |
          Page through the rows of an embedded table inside
          [`embedded()`](/docs/reference/dart/embedded). On `from()`, pass
          `referencedTable` instead.
        code: |
          ```dart
          final data = await supabase
              .table(OrchestralSections.table)
              .selectOnly([
                OrchestralSections.name,
                OrchestralSections.instruments.select([Instruments.name]),
              ])
              .embedded(
                OrchestralSections.instruments,
                (instruments) => instruments.range(0, 9),
              );
          ```

  - id: max-affected
    title: maxAffected()
    description: |
      Sets the maximum number of rows an `update()` or `delete()` may change.
      When more rows match, the request fails and no rows are changed.
    notes: |
      - Only applies to `update()` and `delete()`.
      - Requires PostgREST v13 or higher.
    params:
      - name: value
        isOptional: false
        type: int
        description: The maximum number of rows the request may change.
    examples:
      - id: with-update
        name: With `update()`
        isSpotlight: true
        code: |
          ```dart
          await supabase
              .table(Countries.table)
              .update(CountriesUpdate(name: 'Albania'))
              .where(Countries.id.eq(2))
              .maxAffected(1);
          ```
      - id: with-delete
        name: With `delete()`
        code: |
          ```dart
          await supabase
              .table(Countries.table)
              .delete()
              .where(Countries.name.isNull())
              .maxAffected(10);
          ```

  - id: single
    title: single()
    description: |
      Returns one row instead of a list. Throws a `PostgrestApiException` when
      the query returns zero rows or more than one.
    examples:
      - id: with-select
        name: With `select()`
        isSpotlight: true
        code: |
          ```dart
          final CountriesRow country = await supabase
              .table(Countries.table)
              .select()
              .where(Countries.id.eq(1))
              .single();
          ```
        data:
          sql: |
            ```sql
            create table
              countries (id int8 primary key, name text);

            insert into
              countries (id, name)
            values
              (1, 'Afghanistan'),
              (2, 'Albania'),
              (3, 'Algeria');
            ```
        response: |
          ```json
          {
            "id": 1,
            "name": "Afghanistan"
          }
          ```

  - id: maybe-single
    title: maybeSingle()
    description: |
      Returns one row or `null` when the query returns no rows. Throws a
      `PostgrestApiException` when it returns more than one.
    examples:
      - id: with-select
        name: With `select()`
        code: |
          ```dart
          final CountriesRow? country = await supabase
              .table(Countries.table)
              .select()
              .where(Countries.name.eq('Andorra'))
              .maybeSingle();
          ```
        data:
          sql: |
            ```sql
            create table
              countries (id int8 primary key, name text);

            insert into
              countries (id, name)
            values
              (1, 'Afghanistan'),
              (2, 'Albania'),
              (3, 'Algeria');
            ```
        response: |
          ```json
          null
          ```
        hideCodeBlock: true
        isSpotlight: true

  - id: csv
    title: csv()
    description: |
      Returns the rows as a CSV string instead of JSON.
    examples:
      - id: return-data-as-csv
        name: Return data as CSV
        code: |
          ```dart
          final String csv = await supabase.table(Countries.table).select().csv();
          ```
        data:
          sql: |
            ```sql
            create table
              countries (id int8 primary key, name text);

            insert into
              countries (id, name)
            values
              (1, 'Afghanistan'),
              (2, 'Albania'),
              (3, 'Algeria');
            ```
        response: |
          ```
          id,name
          1,Afghanistan
          2,Albania
          3,Algeria
          ```
        hideCodeBlock: true
        isSpotlight: true

  - id: strip-nulls
    title: stripNulls()
    description: |
      Leaves `null` values out of the returned rows.
    notes: |
      - This uses the `nulls=stripped` variant of the `Accept` header and
        requires PostgREST 11.2 or higher.
    examples:
      - id: strip-null-values-from-the-response
        name: Strip null values from the response
        isSpotlight: true
        code: |
          ```dart
          final data = await supabase.table(Countries.table).select().stripNulls();
          ```

  - id: dry-run
    title: dryRun()
    description: |
      Runs the request in a transaction that is rolled back, so nothing is
      written. With `select()`, the request still returns the rows it would
      have written, which previews the effect of a write.
    examples:
      - id: preview-an-insert
        name: Preview an insert
        isSpotlight: true
        code: |
          ```dart
          final List<CountriesRow> preview = await supabase
              .table(Countries.table)
              .insert(CountriesInsert(id: 4, name: 'Andorra'))
              .select()
              .dryRun();
          ```

  - id: with-converter
    title: withConverter()
    description: |
      Converts the result of a `from()` request, for example into your own
      model classes. The converter receives whatever the request resolves to
      at that point. Rows from `table()` are already typed and don't need a
      converter.

      Combined with `count()`, call `withConverter()` first, so the converter
      receives the rows. A converter after `count()` receives the whole
      `PostgrestResponse`.
    params:
      - name: converter
        isOptional: false
        type: U Function(T data)
        description: Converts the result of the request.
    examples:
      - id: convert-rows
        name: Convert the rows
        isSpotlight: true
        code: |
          ```dart
          final List<String> names = await supabase
              .from('countries')
              .select('name')
              .withConverter((rows) => [for (final row in rows) row['name'] as String]);
          ```
      - id: with-count
        name: With `count()`
        code: |
          ```dart
          final response = await supabase
              .from('countries')
              .select('name')
              .withConverter((rows) => [for (final row in rows) row['name'] as String])
              .count(CountOption.exact);
          final List<String> names = response.data;
          final int total = response.count;
          ```

  - id: abort-signal
    title: abortSignal()
    description: |
      Cancels the request when the given `Future` completes, which also stops
      any retries. The request then throws a `RequestAbortedException`.
    params:
      - name: abortSignal
        isOptional: false
        type: Future<void>
        description: Aborts the request when it completes. It must not complete with an error.
    examples:
      - id: abort-on-an-event
        name: Abort on an event
        isSpotlight: true
        code: |
          ```dart
          final cancel = Completer<void>();
          // Call cancel.complete() to abort, for example when a page closes.

          try {
            final data = await supabase
                .table(Countries.table)
                .select()
                .abortSignal(cancel.future);
          } on RequestAbortedException {
            print('The request was aborted');
          }
          ```
      - id: abort-after-a-delay
        name: Abort after a delay
        code: |
          ```dart
          final data = await supabase
              .table(Countries.table)
              .select()
              .abortSignal(Future.delayed(const Duration(seconds: 5)));
          ```

  - id: retry
    title: retry()
    description: |
      Overrides the retry behavior of the client for this request. Only `GET`
      and `HEAD` requests, such as `select()`, are retried, after a network
      error or a retryable status code.
    params:
      - name: enabled
        isOptional: true
        type: bool
        description: Whether to retry this request. Defaults to `true`.
      - name: count
        isOptional: true
        type: int
        description: The number of retries for this request. Defaults to the count of the client.
    examples:
      - id: retry-more-often
        name: Retry more often
        isSpotlight: true
        code: |
          ```dart
          final data = await supabase.table(Countries.table).select().retry(count: 5);
          ```
      - id: disable-retries
        name: Disable retries
        code: |
          ```dart
          final data = await supabase
              .table(Countries.table)
              .select()
              .retry(enabled: false);
          ```

  - id: request-timeout
    title: requestTimeout()
    description: |
      Overrides the request timeout of the client for this request. The
      timeout bounds how long an attempt may go without progress, not the
      whole request, so a large response that keeps arriving is not cut short.
      A timed-out request throws a `PostgrestTransportException`, unless it is
      retried.
    params:
      - name: timeout
        isOptional: false
        type: Duration
        description: How long an attempt may go without sending or receiving data.
    examples:
      - id: set-a-timeout
        name: Set a timeout
        isSpotlight: true
        code: |
          ```dart
          final data = await supabase
              .table(Countries.table)
              .select()
              .requestTimeout(const Duration(seconds: 5));
          ```

  - id: explain
    title: Using Explain
    description: |
      For debugging slow queries, you can get the
      [Postgres `EXPLAIN` execution plan](https://www.postgresql.org/docs/current/sql-explain.html)
      of a query with `explain()`. It works on any query, including database
      functions and writes.

      Explain is not enabled by default because it can reveal sensitive
      information about your database. Only enable it for testing environments.
      To enable it in production, protect it with a `pre-request` function.

      Follow the [Performance Debugging Guide](/docs/guides/database/debugging-performance)
      to enable the functionality on your project.
    params:
      - name: analyze
        isOptional: true
        type: bool
        description: If `true`, the query is executed and the actual run time is returned.
      - name: verbose
        isOptional: true
        type: bool
