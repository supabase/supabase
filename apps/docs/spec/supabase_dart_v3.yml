            user: User(
              id: '11111111-1111-1111-1111-111111111111',
              audience: 'authenticated',
              role: 'authenticated',
              email: 'example@email.com',
              emailConfirmedAt: DateTime.utc(2024, 1, 1),
              phone: '',
              lastSignInAt: DateTime.utc(2024, 1, 1),
              appMetadata: AppMetadata(
                provider: 'email',
                providers: ['email'],
              ),
              userMetadata: {},
              identities: [
                UserIdentity(
                  identityId: '22222222-2222-2222-2222-222222222222',
                  id: '11111111-1111-1111-1111-111111111111',
                  userId: '11111111-1111-1111-1111-111111111111',
                  identityData: {
                    'email': 'example@email.com',
                    'email_verified': false,
                    'phone_verified': false,
                    'sub': '11111111-1111-1111-1111-111111111111',
                  },
                  provider: 'email',
                  lastSignInAt: DateTime.utc(2024, 1, 1),
                  createdAt: DateTime.utc(2024, 1, 1),
                  updatedAt: DateTime.utc(2024, 1, 1),
                ),
              ],
              createdAt: DateTime.utc(2024, 1, 1),
              updatedAt: DateTime.utc(2024, 1, 1),
            ),
          );
          ```
      - id: update-the-password-for-an-authenticated-user
        name: Update the password for an authenticated user
        isSpotlight: false
        code: |
          ```dart
          final response = await supabase.auth.updateUser(
            UserAttributes(
              password: 'new password',
            ),
          );
          ```
      - id: update-the-password-with-current-password
        name: Update the password with the current password
        description: |
          When the auth server is configured to require the current password on password changes, pass it in `currentPassword`.
        isSpotlight: false
        code: |
          ```dart
          final response = await supabase.auth.updateUser(
            UserAttributes(
              password: 'new password',
              currentPassword: 'current password',
            ),
