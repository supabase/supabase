  - id: get-user-from-server
    title: 'getUser()'
    description: |
      Fetches the user of the current session, or of the given JWT, from the Auth server.
    notes: |
      - Sends a request to the Auth server every time, so the result reflects changes made on the server, such as an email change or a ban.
      - Throws an `AuthSessionMissingException` when no JWT is passed and nobody is signed in.
      - To read the claims of the access token without a request, use [`getClaims()`](/docs/reference/dart/auth-getclaims).
    params:
      - name: jwt
        isOptional: true
        type: String
        description: The access token of the user to fetch. Defaults to the access token of the current session.
    examples:
      - id: get-the-current-user
        name: Get the current user from the server
        isSpotlight: true
        code: |
          ```dart
          final response = await supabase.auth.getUser();
          final user = response.user;
          ```
      - id: get-user-by-jwt
        name: Get the user of a JWT
        code: |
          ```dart
          final response = await supabase.auth.getUser(jwt);
          ```
  - id: get-claims
    title: 'getClaims()'
    description: |
      Verifies the access token and returns its claims.
    notes: |
      - When the project uses an asymmetric JWT signing key (RSA or ECC), the token is verified against the JSON Web Key Set at `/.well-known/jwks.json`. The keys are cached, so most calls need no request. Prefer this method over `getUser()` to check a token.
      - With a symmetric signing key, the token is verified by the Auth server, as `getUser()` does.
      - Throws an `AuthException` when the token is expired or invalid.
    params:
      - name: jwt
        isOptional: true
        type: String
        description: The JWT to verify. Defaults to the access token of the current session.
      - name: options
        isOptional: true
        type: GetClaimsOptions
        description: Options for the verification. Set `allowExpired` to read the claims of an expired token.
    examples:
      - id: get-claims
        name: Get the claims of the current session
        isSpotlight: true
        code: |
          ```dart
          final response = await supabase.auth.getClaims();
          final userId = response.claims.subject;
          final role = response.claims.claims['role'];
          ```
      - id: get-claims-allow-expired
        name: Read the claims of an expired token
        code: |
          ```dart
          final response = await supabase.auth.getClaims(
            jwt,
            const GetClaimsOptions(allowExpired: true),
          );
          ```
  - id: update-user
    title: 'updateUser()'
    description: |
      Updates user data for a signed-in user.
    notes: |
      - In order to use the `updateUser()` method, the user needs to be signed in first. Otherwise it throws an `AuthSessionMissingException`.
      - By default, email updates send a confirmation link to both the user's current and new email.
      To only send a confirmation link to the user's new email, disable **Secure email change** in your project's [email auth provider settings](https://supabase.com/dashboard/project/_/auth/providers).
      - Confirming an email or phone change emits `AuthUserUpdated` on `onAuthStateChange`.
    params:
      - name: attributes
        isOptional: false
        type: UserAttributes
        description: Attributes to update for the user.
        subContent:
          - name: email
            isOptional: true
            type: String
            description: The new email address for the user.
          - name: phone
            isOptional: true
            type: String
            description: The new phone number for the user.
          - name: password
            isOptional: true
            type: String
            description: The new password for the user.
          - name: data
            isOptional: true
            type: Map<String, dynamic>
            description: The user's metadata to be stored in the user's object.
          - name: nonce
            isOptional: true
            type: String
            description: The nonce sent for reauthentication if the user's password is to be updated.
          - name: currentPassword
            isOptional: true
            type: String
            description: The user's current password. Required when changing the password and the auth server enforces the current password on password changes.
      - name: emailRedirectTo
        isOptional: true
        type: String
        description: The URI to redirect the user to after the email is updated.
    examples:
      - id: update-the-email-for-an-authenticated-user
        name: Update the email for an authenticated user
        description: Sends a "Confirm Email Change" email to the new email address.
        isSpotlight: true
        code: |
          ```dart
          final response = await supabase.auth.updateUser(
            UserAttributes(
              email: 'example@email.com',
            ),
          );
          final User? updatedUser = response.user;
          ```
        response: |
          ```json
