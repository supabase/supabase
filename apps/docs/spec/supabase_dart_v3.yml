            refreshToken: '<REFRESH_TOKEN>',
            user: User(
              id: '11111111-1111-1111-1111-111111111111',
              audience: 'authenticated',
              role: 'authenticated',
              email: 'example@email.com',
              emailConfirmedAt: DateTime.utc(2024, 1, 1),
              phone: '',
              lastSignInAt: DateTime.utc(2024, 1, 1),
              appMetadata: AppMetadata(
                provider: 'email',
                providers: ['email'],
              ),
              userMetadata: {},
              identities: [
                UserIdentity(
                  identityId: '22222222-2222-2222-2222-222222222222',
                  id: '11111111-1111-1111-1111-111111111111',
                  userId: '11111111-1111-1111-1111-111111111111',
                  identityData: {
                    'email': 'example@email.com',
                    'email_verified': false,
                    'phone_verified': false,
                    'sub': '11111111-1111-1111-1111-111111111111',
                  },
                  provider: 'email',
                  lastSignInAt: DateTime.utc(2024, 1, 1),
                  createdAt: DateTime.utc(2024, 1, 1),
                  updatedAt: DateTime.utc(2024, 1, 1),
                ),
              ],
              createdAt: DateTime.utc(2024, 1, 1),
              updatedAt: DateTime.utc(2024, 1, 1),
            ),
          );
          ```
  - id: auth-mfa-api
    title: 'Overview'
    category: Auth
    subcategory: Auth MFA
    notes: |
      This section contains methods commonly used for Multi-Factor Authentication (MFA) and are invoked behind the `supabase.auth.mfa` namespace.

      Currently, Supabase supports time-based one-time passwords (TOTP) and phone verification codes as the second factor. Users can enroll multiple factors, with an upper limit of 10. Recovery codes, behind `supabase.auth.mfa.recoveryCodes`, let a user who lost their factors reach `aal2`. They are an experimental feature and must be enabled on the Supabase Auth server.

      Verifying a factor returns the upgraded `aal2` `Session` and emits `AuthMfaChallengeVerified` on `onAuthStateChange`. The methods act on the signed-in user and throw an `AuthSessionMissingException` when nobody is signed in.

      Learn more about implementing MFA on your application on our guide [here](https://supabase.com/docs/guides/auth/auth-mfa#overview).
  - id: mfa-enroll
    title: 'mfa.enroll()'
    notes: |
      Starts the enrollment process for a new Multi-Factor Authentication (MFA) factor. This method creates a new `unverified` factor.
      To verify a factor, present the QR code or secret to the user and ask them to add it to their authenticator app.
      The user has to enter the code from their authenticator app to verify it.
      - Enrolling a phone factor does not send an SMS. Call `mfa.challenge()` to send the code.
      - Use the returned `id` to create a challenge.
      - To create a challenge, see [`mfa.challenge()`](/docs/reference/dart/auth-mfa-challenge).
      - To verify a challenge, see [`mfa.verify()`](/docs/reference/dart/auth-mfa-verify).
      - To create and verify a challenge in a single step, see [`mfa.challengeAndVerify()`](/docs/reference/dart/auth-mfa-challengeandverify).
    params:
      - name: factorType
        isOptional: true
        type: FactorType
        description: Type of factor being enrolled, `FactorType.totp` or `FactorType.phone`. Defaults to `FactorType.totp`.
      - name: issuer
        isOptional: true
        type: String
        description: Domain which the user is enrolled with. TOTP only.
      - name: friendlyName
        isOptional: true
        type: String
        description: Human readable name assigned to the factor.
      - name: phone
        isOptional: true
        type: String
        description: Phone number to enroll for phone factor type.
    examples:
      - id: enroll-totp-factor
        name: Enroll a time-based, one-time password (TOTP) factor
        isSpotlight: true
        code: |
          ```dart
          final response = await supabase.auth.mfa.enroll(factorType: FactorType.totp);
          final qrCode = response.totp?.qrCode;
          ```
        response: |
          ```json
          AuthMFAEnrollResponse(
            id: '<ID>',
            type: FactorType.totp,
            totp: TOTPEnrollment(
              qrCode: '<QR_CODE_AS_SVG_DATA>',
              secret: '<SECRET>',
              uri: '<URI>',
            ),
            phone: null,
          );
          ```
      - id: enroll-phone-factor
        name: Enroll a Phone Factor
        isSpotlight: true
        code: |
          ```dart
          final response = await supabase.auth.mfa.enroll(
            factorType: FactorType.phone,
            phone: '+1234567890',
          );
          ```
        response: |
          ```json
          AuthMFAEnrollResponse(
            id: '<ID>',
            type: FactorType.phone,
            totp: null,
            phone: PhoneEnrollment(
              phone: '+1234567890',
            ),
          );
          ```
  - id: mfa-challenge
    title: 'mfa.challenge()'
    notes: |
      Prepares a challenge used to verify that a user has access to a MFA factor.
      - An [enrolled factor](/docs/reference/dart/auth-mfa-enroll) is required before creating a challenge.
      - To verify a challenge, see [`mfa.verify()`](/docs/reference/dart/auth-mfa-verify).
    params:
      - name: factorId
        isOptional: false
        type: String
        description: System assigned identifier for authenticator device as returned by enroll.
      - name: channel
        isOptional: true
        type: OtpChannel
        description: Messaging channel to use for phone factors, `OtpChannel.whatsapp` or `OtpChannel.sms`. Defaults to SMS when omitted. Ignored for TOTP factors.
    examples:
      - id: create-mfa-challenge
        name: Create a challenge for a factor
        isSpotlight: true
        code: |
          ```dart
          final response = await supabase.auth.mfa.challenge(
            factorId: '34e770dd-9ff9-416c-87fa-43b31d7ef225',
          );
          ```
        response: |
          ```json
          AuthMFAChallengeResponse(
            id: '<ID>',
            expiresAt: DateTime.utc(2024, 1, 1, 0, 5),
          );
          ```
      - id: create-mfa-challenge-with-channel
        name: Create a challenge for a phone factor over WhatsApp
        description: |
          For phone factors you can choose the messaging channel used to deliver the verification code.
        code: |
          ```dart
          final response = await supabase.auth.mfa.challenge(
            factorId: '34e770dd-9ff9-416c-87fa-43b31d7ef225',
            channel: OtpChannel.whatsapp,
          );
          ```
  - id: mfa-verify
    title: 'mfa.verify()'
    notes: |
      Verifies a code against a challenge and returns the upgraded `aal2` `Session`, which also becomes the current one. The verification code is provided by the user by entering a code seen in their authenticator app.
      - To verify a challenge, please [create a challenge](/docs/reference/dart/auth-mfa-challenge) first.
      - Emits `AuthMfaChallengeVerified` on `onAuthStateChange`.
      - A user who lost their factors can reach `aal2` with a recovery code through `mfa.recoveryCodes.verify()`, see [`mfa.recoveryCodes.generate()`](/docs/reference/dart/auth-mfa-generate).
    params:
      - name: factorId
        isOptional: false
        type: String
        description: System assigned identifier for authenticator device as returned by enroll.
      - name: challengeId
        isOptional: false
        type: String
        description: The ID of the challenge to verify.
      - name: code
        isOptional: false
        type: String
        description: The verification code on the user's authenticator app.
    examples:
      - id: verify-challenge
        name: Verify a challenge for a factor
        isSpotlight: true
        code: |
          ```dart
          final session = await supabase.auth.mfa.verify(
            factorId: '34e770dd-9ff9-416c-87fa-43b31d7ef225',
            challengeId: '4034ae6f-a8ce-4fb5-8ee5-69a5863a7c15',
            code: '123456',
          );
          ```
        response: |
          ```json
          Session(
            accessToken: '<ACCESS_TOKEN>',
            tokenType: 'bearer',
            expiresIn: 3600,
            refreshToken: '<REFRESH_TOKEN>',
            user: User(
              id: '11111111-1111-1111-1111-111111111111',
              audience: 'authenticated',
              role: 'authenticated',
              email: 'example@email.com',
              emailConfirmedAt: DateTime.utc(2024, 1, 1),
              phone: '',
              lastSignInAt: DateTime.utc(2024, 1, 1),
              appMetadata: AppMetadata(
                provider: 'email',
                providers: ['email'],
              ),
              userMetadata: {},
              identities: [
                UserIdentity(
                  identityId: '22222222-2222-2222-2222-222222222222',
                  id: '11111111-1111-1111-1111-111111111111',
                  userId: '11111111-1111-1111-1111-111111111111',
                  identityData: {
                    'email': 'example@email.com',
                    'email_verified': false,
                    'phone_verified': false,
                    'sub': '11111111-1111-1111-1111-111111111111',
                  },
                  provider: 'email',
                  lastSignInAt: DateTime.utc(2024, 1, 1),
                  createdAt: DateTime.utc(2024, 1, 1),
                  updatedAt: DateTime.utc(2024, 1, 1),
                ),
              ],
              createdAt: DateTime.utc(2024, 1, 1),
              updatedAt: DateTime.utc(2024, 1, 1),
              factors: [
                Factor(
                  id: '<ID>',
                  friendlyName: 'Important Auth App',
                  factorType: FactorType.totp,
                  status: FactorStatus.verified,
                  createdAt: DateTime.utc(2024, 1, 1),
                  updatedAt: DateTime.utc(2024, 1, 1),
                ),
              ],
            ),
          );
          ```
      - id: verify-recovery-code
        name: Verify a recovery code
        description: |
          Upgrades the session to `aal2` with one of the user's recovery codes. Each code works once. Letter case, whitespace and `-` separators are ignored.
        code: |
          ```dart
          final session = await supabase.auth.mfa.recoveryCodes.verify(
            'K4M9-X7QP-2AB8-HT3Z',
          );
          ```
  - id: mfa-challenge-and-verify
    title: 'mfa.challengeAndVerify()'
    notes: |
      Helper method which creates a challenge and immediately uses the given code to verify against it thereafter. Returns the upgraded `aal2` `Session`. The verification code is provided by the user by entering a code seen in their authenticator app.
      - An [enrolled factor](/docs/reference/dart/auth-mfa-enroll) is required before invoking `challengeAndVerify()`.
      - Executes [`mfa.challenge()`](/docs/reference/dart/auth-mfa-challenge) and [`mfa.verify()`](/docs/reference/dart/auth-mfa-verify) in a single step.
    params:
      - name: factorId
        isOptional: false
        type: String
        description: System assigned identifier for authenticator device as returned by enroll.
      - name: code
        isOptional: false
        type: String
        description: The verification code on the user's authenticator app.
    examples:
      - id: challenge-and-verify
        name: Create and verify a challenge for a factor
        isSpotlight: true
        code: |
          ```dart
          final session = await supabase.auth.mfa.challengeAndVerify(
            factorId: '34e770dd-9ff9-416c-87fa-43b31d7ef225',
            code: '123456',
          );
          ```
        response: |
          ```json
          Session(
            accessToken: '<ACCESS_TOKEN>',
            tokenType: 'bearer',
            expiresIn: 3600,
            refreshToken: '<REFRESH_TOKEN>',
            user: User(
              id: '11111111-1111-1111-1111-111111111111',
              audience: 'authenticated',
              role: 'authenticated',
              email: 'example@email.com',
              emailConfirmedAt: DateTime.utc(2024, 1, 1),
              phone: '',
              lastSignInAt: DateTime.utc(2024, 1, 1),
              appMetadata: AppMetadata(
                provider: 'email',
                providers: ['email'],
              ),
              userMetadata: {},
              identities: [
                UserIdentity(
                  identityId: '22222222-2222-2222-2222-222222222222',
                  id: '11111111-1111-1111-1111-111111111111',
                  userId: '11111111-1111-1111-1111-111111111111',
                  identityData: {
                    'email': 'example@email.com',
                    'email_verified': false,
                    'phone_verified': false,
                    'sub': '11111111-1111-1111-1111-111111111111',
                  },
                  provider: 'email',
                  lastSignInAt: DateTime.utc(2024, 1, 1),
                  createdAt: DateTime.utc(2024, 1, 1),
                  updatedAt: DateTime.utc(2024, 1, 1),
                ),
              ],
              createdAt: DateTime.utc(2024, 1, 1),
              updatedAt: DateTime.utc(2024, 1, 1),
              factors: [
                Factor(
                  id: '<ID>',
                  friendlyName: 'Important Auth App',
                  factorType: FactorType.totp,
                  status: FactorStatus.verified,
                  createdAt: DateTime.utc(2024, 1, 1),
                  updatedAt: DateTime.utc(2024, 1, 1),
                ),
              ],
            ),
          );
          ```
  - id: mfa-unenroll
    title: 'mfa.unenroll()'
    notes: |
      Unenroll removes a MFA factor.
      A user has to have an `aal2` authenticator level in order to unenroll a `verified` factor.
    params:
      - name: factorId
        isOptional: false
        type: String
        description: System assigned identifier for authenticator device as returned by enroll.
    examples:
      - id: unenroll-a-factor
        name: Unenroll a factor
        isSpotlight: true
        code: |
          ```dart
          final response = await supabase.auth.mfa.unenroll(
            '34e770dd-9ff9-416c-87fa-43b31d7ef225',
          );
          ```
        response: |
          ```json
          AuthMFAUnenrollResponse(
            id: '<FACTOR_ID>',
          );
          ```
      - id: unenroll-recovery-codes
        name: Remove the recovery codes
        description: |
          Removes the recovery codes factor together with all of its codes. Requires an `aal2` session.
        code: |
          ```dart
          await supabase.auth.mfa.recoveryCodes.unenroll();
          ```
  - id: mfa-list-factors
    title: 'mfa.listFactors()'
    notes: |
      Returns the MFA factors of the signed-in user.
      - Fetches the user from the server, so the list is up to date, and stores the factors on the current session.
      - `all` holds every factor. `totp`, `phone`, `webauthn` and `recoveryCode` hold the verified factors of each type.
    examples:
      - id: list-factors
        name: List the factors of the user
        isSpotlight: true
        code: |
          ```dart
          final response = await supabase.auth.mfa.listFactors();
          final verifiedTotpFactors = response.totp;
          ```
        response: |
          ```json
          AuthMFAListFactorsResponse(
            all: [
              Factor(
                id: '<ID>',
                friendlyName: 'Important Auth App',
                factorType: FactorType.totp,
                status: FactorStatus.verified,
                createdAt: DateTime.utc(2024, 1, 1),
                updatedAt: DateTime.utc(2024, 1, 1),
              ),
            ],
            totp: [Factor(...)],
            phone: [],
            webauthn: [],
            recoveryCode: [],
          );
          ```
  - id: mfa-get-authenticator-assurance-level
    title: 'mfa.getAuthenticatorAssuranceLevel()'
    notes: |
      Returns the Authenticator Assurance Level (AAL) for the active session.
      - Authenticator Assurance Level (AAL) is the measure of the strength of an authentication mechanism.
      - In Supabase, having an AAL of `aal1` means the user has signed in with their first factor, such as email, password, or OAuth sign-in. An AAL of `aal2` means the user has also signed in with their second factor, such as a time-based, one-time-password (TOTP).
      - If the user has a verified factor, the `nextLevel` field returns `aal2`. Otherwise, it returns `aal1`.
      - Reads the current session without a request. Both levels are `null` when nobody is signed in.
    examples:
      - id: get-aal
        name: Get the AAL details of a session
        isSpotlight: true
        code: |
          ```dart
          final response = supabase.auth.mfa.getAuthenticatorAssuranceLevel();
          final currentLevel = response.currentLevel;
          final nextLevel = response.nextLevel;
          final currentAuthenticationMethods = response.currentAuthenticationMethods;

          if (nextLevel == AuthenticatorAssuranceLevel.aal2 &&
              currentLevel != nextLevel) {
            // Ask the user to verify their second factor.
          }
          ```
        response: |
          ```json
          AuthMFAGetAuthenticatorAssuranceLevelResponse(
            currentLevel: AuthenticatorAssuranceLevel.aal1,
            nextLevel: AuthenticatorAssuranceLevel.aal2,
            currentAuthenticationMethods: [
              AuthenticationMethodReferenceEntry(
                method: AuthenticationMethodReference.password,
                timestamp: DateTime.utc(2024, 1, 1),
              ),
            ],
          );
          ```
  - id: mfa-recovery-codes-generate
    title: 'mfa.recoveryCodes.generate()'
    notes: |
      Generates the user's set of MFA recovery codes. Recovery codes are single-use backup codes that let a user reach `aal2` when they cannot use their other factors.
      - The codes are returned exactly once in `codes`. Show them to the user and ask them to store them safely.
      - The session must be at `aal2` and the user must already have another verified factor. Recovery codes can never be the only factor.
      - A user has one set of recovery codes. Use [`mfa.recoveryCodes.regenerate()`](/docs/reference/dart/auth-mfa-regenerate) to replace it.
      - Verify a code with `mfa.recoveryCodes.verify()`, see [`mfa.verify()`](/docs/reference/dart/auth-mfa-verify). Remove the codes with `mfa.recoveryCodes.unenroll()`, see [`mfa.unenroll()`](/docs/reference/dart/auth-mfa-unenroll).
      - Recovery codes are an experimental feature and must be enabled on the Supabase Auth server.
    params:
      - name: friendlyName
        isOptional: true
        type: String
        description: The name of the recovery codes factor, unique among the user's factors. The server defaults it to `Recovery codes`.
    examples:
      - id: generate-recovery-codes
        name: Generate recovery codes
        isSpotlight: true
        code: |
          ```dart
          final response = await supabase.auth.mfa.recoveryCodes.generate(
            friendlyName: 'Backup codes',
          );
          final List<String> codes = response.codes;
          ```
        response: |
          ```json
          AuthMFARecoveryCodesGenerateResponse(
            id: '<FACTOR_ID>',
            friendlyName: 'Backup codes',
            total: 10,
            codes: ['K4M9-X7QP-2AB8-HT3Z', ...],
          );
          ```
  - id: mfa-recovery-codes-get-status
    title: 'mfa.recoveryCodes.getStatus()'
    notes: |
      Returns how many recovery codes the user has in total and how many are still unused. Never returns the codes themselves.
      - Works at any authenticator assurance level.
      - Throws an `AuthApiException` with `ErrorCode.mfaFactorNotFound` when the user has not generated recovery codes yet.
    examples:
      - id: get-recovery-codes-status
        name: Check the remaining recovery codes
        isSpotlight: true
        code: |
          ```dart
          final response = await supabase.auth.mfa.recoveryCodes.getStatus();
          if (response.remaining == 0) {
            // Offer to regenerate the codes.
          }
          ```
        response: |
          ```json
          AuthMFARecoveryCodesStatusResponse(
            id: '<FACTOR_ID>',
            total: 10,
            remaining: 7,
          );
          ```
  - id: mfa-recovery-codes-regenerate
    title: 'mfa.recoveryCodes.regenerate()'
    notes: |
      Replaces the user's recovery codes with a new set, returned exactly once.
      - The remaining codes of the previous set stop working immediately.
      - The session must be at `aal2`.
    examples:
      - id: regenerate-recovery-codes
        name: Regenerate recovery codes
        isSpotlight: true
        code: |
          ```dart
          final response = await supabase.auth.mfa.recoveryCodes.regenerate();
          final List<String> codes = response.codes;
          ```
  - id: passkey-api
    title: 'Auth Passkey'
    category: Auth
    subcategory: Auth Passkey
    notes: |
      This section contains methods for WebAuthn passkey registration, authentication, and management. Methods are invoked behind the `supabase.auth.passkey` namespace.

      These methods expose the server side of the WebAuthn ceremony. The client side (the Face ID, Touch ID or security key prompt) has to be performed with a platform passkey API: `navigator.credentials.create()` and `get()` on web, or a passkey plugin on iOS, Android and macOS. Options and credentials are exchanged as `Map<String, dynamic>` in the W3C WebAuthn Level 3 JSON format.

      For a one-call alternative that runs the full ceremony, see [`signInWithPasskey()`](/docs/reference/dart/auth-signinwithpasskey) and [`registerPasskey()`](/docs/reference/dart/auth-registerpasskey) on `supabase_flutter`. Android restore keys, created with [`createRestoreKey()`](/docs/reference/dart/auth-createrestorekey), are stored as passkeys too.

      The methods that manage the passkeys of the signed-in user throw an `AuthSessionMissingException` when nobody is signed in.

      Passkey support is a BETA feature and must be enabled for your project in the Supabase Dashboard under Authentication > Configuration > Passkeys.
  - id: passkey-list
    title: 'passkey.list()'
    notes: |
      Returns the list of passkeys registered to the signed-in user.
    examples:
      - id: list-passkeys
        name: List the current user's passkeys
        isSpotlight: true
        code: |
          ```dart
          final List<Passkey> passkeys = await supabase.auth.passkey.list();
          ```
  - id: passkey-update
    title: 'passkey.update()'
    notes: |
      Updates the friendly name of a passkey.
    params:
      - name: passkeyId
        isOptional: false
        type: String
        description: ID of the passkey to rename.
      - name: friendlyName
        isOptional: false
        type: String
        description: New human readable name for the passkey. Limited to 120 characters.
    examples:
      - id: rename-passkey
        name: Rename a passkey
        isSpotlight: true
        code: |
          ```dart
          final passkey = await supabase.auth.passkey.update(
            passkeyId: '34e770dd-9ff9-416c-87fa-43b31d7ef225',
            friendlyName: 'Work laptop',
          );
          ```
  - id: passkey-delete
    title: 'passkey.delete()'
    notes: |
      Deletes a passkey from the signed-in user.
      - If the user has verified MFA factors, the session has to be at `aal2` to manage passkeys.
    params:
      - name: passkeyId
        isOptional: false
        type: String
        description: ID of the passkey to delete.
    examples:
      - id: delete-passkey
        name: Delete a passkey
        isSpotlight: true
        code: |
          ```dart
          await supabase.auth.passkey.delete(
            passkeyId: '34e770dd-9ff9-416c-87fa-43b31d7ef225',
          );
          ```
  - id: passkey-start-registration
    title: 'passkey.startRegistration()'
    notes: |
      Starts the registration of a new passkey for the signed-in user.
      - Requires a signed in, non-anonymous user.
      - Pass the returned `options` to the platform's passkey API to create the credential, then call [`passkey.verifyRegistration()`](/docs/reference/dart/auth-passkey-verifyregistration) with the result.
      - When the server omits `user.name` and `displayName` in the registration options, they are filled with `friendlyName`, or a generic `Passkey` default, before the platform ceremony.
    params:
      - name: friendlyName
        isOptional: true
        type: String
        description: Human readable name used as a fallback for the WebAuthn `user.name` and `displayName` when the server omits them. Defaults to `Passkey`.
    examples:
      - id: start-passkey-registration
        name: Start a passkey registration
        isSpotlight: true
        code: |
          ```dart
          final registration = await supabase.auth.passkey.startRegistration(
            friendlyName: 'Work laptop',
          );

          // Hand registration.options to the platform passkey API.
          ```
  - id: passkey-verify-registration
    title: 'passkey.verifyRegistration()'
    notes: |
      Completes the registration of a new passkey and returns the stored `Passkey`.
    params:
      - name: challengeId
        isOptional: false
        type: String
        description: The challenge ID returned by `passkey.startRegistration()`.
      - name: credential
        isOptional: false
        type: 'Map<String, dynamic>'
        description: The credential created by the platform's passkey API, serialized in the W3C `RegistrationResponseJSON` format.
    examples:
      - id: verify-passkey-registration
        name: Verify a passkey registration
        isSpotlight: true
        code: |
          ```dart
          final passkey = await supabase.auth.passkey.verifyRegistration(
            challengeId: registration.challengeId,
            credential: credential,
          );
          ```
  - id: passkey-start-authentication
    title: 'passkey.startAuthentication()'
    notes: |
      Starts a passkey sign in.
      - Does not require an existing session.
      - Pass the returned `options` to the platform's passkey API to obtain an assertion, then call [`passkey.verifyAuthentication()`](/docs/reference/dart/auth-passkey-verifyauthentication) with the result.
    params:
      - name: captchaToken
        isOptional: true
        type: String
        description: Captcha token to be used for captcha verification.
    examples:
      - id: start-passkey-authentication
        name: Start a passkey sign in
        isSpotlight: true
        code: |
          ```dart
          final authentication = await supabase.auth.passkey.startAuthentication();

          // Hand authentication.options to the platform passkey API.
          ```
  - id: passkey-verify-authentication
    title: 'passkey.verifyAuthentication()'
    notes: |
      Completes a passkey sign in and returns the new `Session`.
      - On success the session is persisted and `AuthSignedIn` is emitted on `onAuthStateChange`.
    params:
      - name: challengeId
        isOptional: false
        type: String
        description: The challenge ID returned by `passkey.startAuthentication()`.
      - name: credential
        isOptional: false
        type: 'Map<String, dynamic>'
        description: The assertion produced by the platform's passkey API, serialized in the W3C `AuthenticationResponseJSON` format.
    examples:
      - id: verify-passkey-authentication
        name: Verify a passkey sign in
        isSpotlight: true
        code: |
          ```dart
          final session = await supabase.auth.passkey.verifyAuthentication(
            challengeId: authentication.challengeId,
            credential: credential,
          );
          ```
  - id: oauth-server-api
    title: 'OAuth Server'
    category: Auth
    subcategory: OAuth Server
    notes: |
      Methods under the `supabase.auth.oauth` namespace are used when your Supabase project acts as an OAuth 2.1 server. They drive the user-facing consent flow, let users manage the grants they have issued to third-party clients, and require a signed-in user. Without one, they throw an `AuthSessionMissingException`. The OAuth 2.1 server feature must be enabled in your Supabase Auth configuration.
  - id: oauth-get-authorization-details
    title: 'oauth.getAuthorizationDetails()'
    notes: |
      Retrieves details about a pending OAuth authorization request so you can render a consent screen. The `authorizationId` is provided as a query parameter on the redirect URL that starts the flow.
      - Returns a sealed `OAuthAuthorizationResponse`. Handle both subtypes: `OAuthAuthorizationDetailsResponse` carries the requesting `client`, the authorizing `user` and the requested `scope` for the consent screen, while `OAuthAuthorizationRedirectResponse` is returned when the user has already granted consent and only carries a `redirectUrl` to forward to.
    params:
      - name: authorizationId
        isOptional: false
        type: String
        description: The unique identifier of the pending authorization request.
    examples:
      - id: get-authorization-details
        name: Get authorization details
        isSpotlight: true
        code: |
          ```dart
          final authorizationId =
              Uri.parse(currentUrl).queryParameters['authorization_id']!;

          final response = await supabase.auth.oauth.getAuthorizationDetails(
            authorizationId,
          );

          switch (response) {
            case OAuthAuthorizationRedirectResponse(:final redirectUrl):
              // The user already consented, send them to redirectUrl.
              print(redirectUrl);
            case OAuthAuthorizationDetailsResponse(:final client, :final scope):
              // Render a consent screen for client requesting scope.
              print('${client.clientName} requests $scope');
          }
          ```
  - id: oauth-approve-authorization
    title: 'oauth.approveAuthorization()'
    notes: |
      Approves a pending OAuth authorization request on behalf of the signed-in user. The response contains the redirect URL the user should be sent to.
    params:
      - name: authorizationId
        isOptional: false
        type: String
        description: The unique identifier of the pending authorization request.
    examples:
      - id: approve-authorization
        name: Approve authorization
        isSpotlight: true
        code: |
          ```dart
          final response = await supabase.auth.oauth.approveAuthorization(
            authorizationId,
          );
          // Send the user to response.redirectUrl.
          ```
  - id: oauth-deny-authorization
    title: 'oauth.denyAuthorization()'
    notes: |
      Denies a pending OAuth authorization request on behalf of the signed-in user. The response contains the redirect URL the user should be sent to.
    params:
      - name: authorizationId
        isOptional: false
        type: String
        description: The unique identifier of the pending authorization request.
    examples:
      - id: deny-authorization
        name: Deny authorization
        isSpotlight: true
        code: |
          ```dart
          final response = await supabase.auth.oauth.denyAuthorization(
            authorizationId,
          );
          // Send the user to response.redirectUrl.
          ```
  - id: oauth-list-grants
    title: 'oauth.listGrants()'
    description: |
      Lists the OAuth grants the signed-in user has issued to third-party OAuth clients.
    notes: |
      - Requires a signed-in user. Returns the grants issued by the current user.
    examples:
      - id: list-oauth-grants
        name: List OAuth grants
        isSpotlight: true
        code: |
          ```dart
          final grants = await supabase.auth.oauth.listGrants();

          for (final grant in grants) {
            print('${grant.client.clientId}: ${grant.scopes}');
          }
          ```
  - id: oauth-revoke-grant
    title: 'oauth.revokeGrant()'
    description: |
      Revokes a grant the signed-in user previously issued to a third-party OAuth client.
    params:
      - name: clientId
        isOptional: false
        type: String
        description: The identifier of the OAuth client whose grant should be revoked.
    examples:
      - id: revoke-oauth-grant
        name: Revoke an OAuth grant
        isSpotlight: true
        code: |
          ```dart
          await supabase.auth.oauth.revokeGrant('client-id');
          ```
  - id: admin-api
    title: 'Overview'
    category: Auth
    subcategory: Auth Admin
    notes: |
      - Any method under the `supabase.auth.admin` namespace requires a `secret` key.
      - These methods are considered admin methods and should be called on a trusted server. Never expose your `secret` key in the Flutter app.
      - On a server, create the client from `package:supabase` with the `secret` key. A server has no user session to refresh or persist.
    examples:
      - id: create-auth-admin-client
        name: Create server-side auth client
        isSpotlight: true
        code: |
          ```dart
          final supabase = SupabaseClient(
            'https://your-project.supabase.co',
            'your-secret-key',
            authOptions: const AuthClientOptions(autoRefreshToken: false),
          );
          ```
  - id: get-user-by-id
    title: 'getUserById()'
    notes: |
      Get user by ID.
      - Fetches the user object from the database based on the user's ID.
      - The `getUserById()` method requires the user's ID which maps to the `auth.users.id` column.
    params:
      - name: userId
        isOptional: false
        type: String
        description: ID of the user to fetch.
    examples:
      - id: fetch-the-user-object-using-the-access-token-jwt
        name: Fetch a user by ID
        isSpotlight: true
        code: |
          ```dart
          final response = await supabase.auth.admin.getUserById(
            '11111111-1111-1111-1111-111111111111',
          );
          final user = response.user;
          ```
        response: |
          ```json
          UserResponse(
            user: User(
              id: '11111111-1111-1111-1111-111111111111',
              audience: 'authenticated',
              role: 'authenticated',
              email: 'example@email.com',
              emailConfirmedAt: DateTime.utc(2024, 1, 1),
              phone: '',
              lastSignInAt: DateTime.utc(2024, 1, 1),
              appMetadata: AppMetadata(
                provider: 'email',
                providers: ['email'],
              ),
              userMetadata: {},
              identities: [
                UserIdentity(
                  identityId: '22222222-2222-2222-2222-222222222222',
                  id: '11111111-1111-1111-1111-111111111111',
                  userId: '11111111-1111-1111-1111-111111111111',
                  identityData: {
                    'email': 'example@email.com',
                    'email_verified': false,
                    'phone_verified': false,
                    'sub': '11111111-1111-1111-1111-111111111111'
                  },
                  provider: 'email',
                  lastSignInAt: DateTime.utc(2024, 1, 1),
                  createdAt: DateTime.utc(2024, 1, 1),
                  updatedAt: DateTime.utc(2024, 1, 1),
                )
              ],
              createdAt: DateTime.utc(2024, 1, 1),
              updatedAt: DateTime.utc(2024, 1, 1),
            ),
          )
          ```
  - id: list-users
    title: 'listUsers()'
    notes: |
      Get one page of users.
      - Returns a `ListUsersResponse` with the users of the page in `users`.
      - `total` is the number of users across all pages, `nextPage` is the page to request next and `null` on the last page, and `lastPage` is the number of the last page.
      - The server returns 50 users per page when `perPage` is not given.
      - To go through every user without tracking pages yourself, use [`listAllUsers()`](/docs/reference/dart/auth-admin-listallusers).
    params:
      - name: page
        isOptional: true
        type: int
        description: The page of users to return, starting at 1.
      - name: perPage
        isOptional: true
        type: int
        description: How many users to return per page. Defaults to 50.
    examples:
      - id: get-a-full-list-of-users
        name: Get a page of users
        isSpotlight: true
        code: |
          ```dart
          final response = await supabase.auth.admin.listUsers();
          final users = response.users;
          ```
        response: |
          ```json
          ListUsersResponse(
            users: [
              User(
                id: '11111111-1111-1111-1111-111111111111',
                audience: 'authenticated',
                role: 'authenticated',
                email: 'example@email.com',
                emailConfirmedAt: DateTime.utc(2024, 1, 1),
                phone: '',
                lastSignInAt: DateTime.utc(2024, 1, 1),
                appMetadata: AppMetadata(
                  provider: 'email',
                  providers: ['email'],
                ),
                userMetadata: {},
                createdAt: DateTime.utc(2024, 1, 1),
                updatedAt: DateTime.utc(2024, 1, 1),
              )
            ],
            total: 1,
            nextPage: null,
            lastPage: 1,
            audience: 'authenticated',
          )
          ```
      - id: get-paginated-list-of-users
        name: Paginated list of users
        isSpotlight: false
        code: |
          ```dart
          // Returns the 101st to 200th users.
          final response = await supabase.auth.admin.listUsers(page: 2, perPage: 100);
          final nextPage = response.nextPage;
          ```
  - id: list-all-users
    title: 'listAllUsers()'
    notes: |
      Stream every user in the project, one page at a time.
      - A page is only requested once the previous one has been consumed. Stopping early, for example with `break` in an `await for` loop or with `take()`, does not fetch the remaining pages.
      - Pages are offsets into the user list, so a user created or deleted while the stream is being read can be emitted twice or skipped.
    params:
      - name: perPage
        isOptional: true
        type: int
        description: How many users to fetch per request. Defaults to the server's page size.
    examples:
      - id: list-all-users
        name: Go through every user
        isSpotlight: true
        code: |
          ```dart
          await for (final user in supabase.auth.admin.listAllUsers()) {
            print(user.email);
          }
          ```
      - id: find-a-user
        name: Stop at the first match
        code: |
          ```dart
          final admin = await supabase.auth.admin
              .listAllUsers(perPage: 100)
              .firstWhere((user) => user.email == 'admin@example.com');
          ```
  - id: create-user
    title: 'createUser()'
    notes: |
      Creates a new user.
      - To confirm the user's email address or phone number, set `emailConfirm` or `phoneConfirm` to `true`. Both default to `false`.
      - `createUser()` will not send a confirmation email to the user. You can use [`inviteUserByEmail()`](/docs/reference/dart/auth-admin-inviteuserbyemail) if you want to send them an email invite instead.
      - If you are sure that the created user's email or phone number is legitimate and verified, you can set `emailConfirm` or `phoneConfirm` to `true`.
    params:
      - name: attributes
        isOptional: false
        type: AdminUserAttributes
        description: Attributes to create the user with. Requires either an `email` or a `phone`.
        subContent:
          - name: email
            isOptional: true
            type: String
            description: The email address of the user.
          - name: password
            isOptional: true
            type: String
            description: The password of the user.
          - name: phone
            isOptional: true
            type: String
            description: The phone number of the user.
          - name: userMetadata
            isOptional: true
            type: Map<String, dynamic>
            description: A custom data object to store the user's metadata. This maps to the `auth.users.user_metadata` column.
          - name: appMetadata
            isOptional: true
            type: Map<String, dynamic>
            description: A custom data object to store the user's application specific metadata. This maps to the `auth.users.app_metadata` column.
          - name: emailConfirm
            isOptional: true
            type: bool
            description: Whether to confirm the user's email address.
          - name: phoneConfirm
            isOptional: true
            type: bool
            description: Whether to confirm the user's phone number.
          - name: banDuration
            isOptional: true
            type: String
            description: Determines how long a user is banned for. Some possible durations include '300ms', '2h45m'. `'none'` lifts the ban.
    examples:
      - id: create-a-new-user-with-custom-user-metadata
        name: With custom user metadata
        isSpotlight: true
        code: |
          ```dart
          final response = await supabase.auth.admin.createUser(
            AdminUserAttributes(
              email: 'user@email.com',
              password: 'password',
              userMetadata: {'name': 'Yoda'},
            ),
          );
          final user = response.user;
          ```
        response: |
          ```json
          UserResponse(
            user: User(
              id: '11111111-1111-1111-1111-111111111111',
              audience: 'authenticated',
              role: 'authenticated',
              email: 'user@email.com',
              emailConfirmedAt: DateTime.utc(2024, 1, 1),
              phone: '',
              lastSignInAt: DateTime.utc(2024, 1, 1),
              appMetadata: AppMetadata(
                provider: 'email',
                providers: ['email'],
              ),
              userMetadata: {'name': 'Yoda'},
              identities: [
                UserIdentity(
                  identityId: '22222222-2222-2222-2222-222222222222',
                  id: '11111111-1111-1111-1111-111111111111',
                  userId: '11111111-1111-1111-1111-111111111111',
                  identityData: {
                    'email': 'user@email.com',
                    'email_verified': false,
                    'phone_verified': false,
                    'sub': '11111111-1111-1111-1111-111111111111'
                  },
                  provider: 'email',
                  lastSignInAt: DateTime.utc(2024, 1, 1),
                  createdAt: DateTime.utc(2024, 1, 1),
                  updatedAt: DateTime.utc(2024, 1, 1),
                )
              ],
              createdAt: DateTime.utc(2024, 1, 1),
              updatedAt: DateTime.utc(2024, 1, 1),
            ),
          )
          ```
      - id: auto-confirm-the-users-email
        name: Auto-confirm the user's email
        code: |
          ```dart
          await supabase.auth.admin.createUser(
            AdminUserAttributes(email: 'user@email.com', emailConfirm: true),
          );
          ```
      - id: auto-confirm-the-users-phone-number
        name: Auto-confirm the user's phone number
        code: |
          ```dart
          await supabase.auth.admin.createUser(
            AdminUserAttributes(phone: '1234567890', phoneConfirm: true),
          );
          ```
  - id: delete-user
    title: 'deleteUser()'
    notes: |
      Delete a user.
      - The `deleteUser()` method requires the user's ID, which maps to the `auth.users.id` column.
      - When `shouldSoftDelete` is `true`, the user is soft-deleted: their record and associated data are retained but the user is marked as deleted. Defaults to `false`, which permanently removes the user.
    params:
      - name: id
        isOptional: false
        type: String
        description: ID of the user to be deleted.
      - name: shouldSoftDelete
        isOptional: true
        type: bool
        description: If true, soft-deletes the user (keeps the record but marks it deleted). Defaults to false (permanent delete).
    examples:
      - id: removes-a-user
        name: Removes a user
        isSpotlight: true
        code: |
          ```dart
          await supabase.auth.admin.deleteUser('715ed5db-f090-4b8c-a067-640ecee36aa0');
          ```
      - id: soft-delete-a-user
        name: Soft-delete a user
        code: |
          ```dart
          await supabase.auth.admin.deleteUser(
            '715ed5db-f090-4b8c-a067-640ecee36aa0',
            shouldSoftDelete: true,
          );
          ```
  - id: invite-user-by-email
    title: 'inviteUserByEmail()'
    notes: |
      Sends an invite link to the user's email address.
    params:
      - name: email
        isOptional: false
        type: String
        description: Email address of the user to invite.
      - name: redirectTo
        isOptional: true
        type: String
        description: URI to redirect the user to after they open the invite link.
      - name: data
        isOptional: true
        type: Map<String, dynamic>
        description: A custom data object to store the user's metadata. This maps to the `auth.users.user_metadata` column.
    examples:
      - id: invite-a-user
        name: Invite a user
        isSpotlight: true
        code: |
          ```dart
          final response = await supabase.auth.admin.inviteUserByEmail(
            'email@example.com',
          );
          final user = response.user;
          ```
        response: |
          ```json
          UserResponse(
            user: User(
              id: '11111111-1111-1111-1111-111111111111',
              audience: 'authenticated',
              role: 'authenticated',
              email: 'email@example.com',
              invitedAt: DateTime.utc(2024, 1, 1),
              phone: '',
              appMetadata: AppMetadata(
                provider: 'email',
                providers: ['email'],
              ),
              userMetadata: {},
              identities: [
                UserIdentity(
                  identityId: '22222222-2222-2222-2222-222222222222',
                  id: '11111111-1111-1111-1111-111111111111',
                  userId: '11111111-1111-1111-1111-111111111111',
                  identityData: {
                    'email': 'email@example.com',
                    'email_verified': false,
                    'phone_verified': false,
                    'sub': '11111111-1111-1111-1111-111111111111'
                  },
                  provider: 'email',
                  createdAt: DateTime.utc(2024, 1, 1),
                  updatedAt: DateTime.utc(2024, 1, 1),
                )
              ],
              createdAt: DateTime.utc(2024, 1, 1),
              updatedAt: DateTime.utc(2024, 1, 1),
            ),
          )
          ```
  - id: generate-link
    title: 'generateLink()'
    notes: |
      Generates email links and OTPs. This will not send links or OTPs to the end user. This function is for custom admin functionality.
      - The following types can be passed into `generateLink()`: `signup`, `magiclink`, `invite`, `recovery`, `emailChangeCurrent`, `emailChangeNew`.
      - `generateLink()` only generates the email link for `emailChangeNew` if the "Secure email change" setting is enabled under the "Email" provider in your Supabase project.
      - `generateLink()` handles the creation of the user for `signup`, `invite` and `magiclink`.
    params:
      - name: type
        isOptional: false
        type: GenerateLinkType
        description: The type of link to generate.
      - name: email
        isOptional: false
        type: String
        description: Email address of the user.
      - name: newEmail
        isOptional: true
        type: String
        description: The new email address of the user. Required for `emailChangeCurrent` and `emailChangeNew`.
      - name: password
        isOptional: true
        type: String
        description: Password for the user. Required for `signup`.
      - name: redirectTo
        isOptional: true
        type: String
        description: URI to redirect the user to after they open the link.
      - name: data
        isOptional: true
        type: Map<String, dynamic>
        description: A custom data object to store the user's metadata. This maps to the `auth.users.user_metadata` column. Applies to `signup`, `invite` and `magiclink`.
    examples:
      - id: generate-a-signup-link
        name: Generate a signup link
        isSpotlight: true
        code: |
          ```dart
          final response = await supabase.auth.admin.generateLink(
            type: GenerateLinkType.signup,
            email: 'email@example.com',
            password: 'secret',
          );
          final actionLink = response.properties.actionLink;
          ```
        response: |
          ```json
          GenerateLinkResponse(
            properties: GenerateLinkProperties(
              actionLink: '<LINK_TO_SEND_TO_USER>',
              emailOtp: '999999',
              hashedToken: '<HASHED_TOKEN>',
              redirectTo: '<REDIRECT_URL>',
              verificationType: GenerateLinkType.signup,
            ),
            user: User(
              id: '11111111-1111-1111-1111-111111111111',
              audience: 'authenticated',
              role: 'authenticated',
              email: 'email@example.com',
              phone: '',
              confirmationSentAt: DateTime.utc(2024, 1, 1),
              appMetadata: AppMetadata(
                provider: 'email',
                providers: ['email'],
              ),
              userMetadata: {},
              createdAt: DateTime.utc(2024, 1, 1),
              updatedAt: DateTime.utc(2024, 1, 1),
            ),
          )
          ```
      - id: generate-an-email-change-link
        name: Generate an email change link
        code: |
          ```dart
          final response = await supabase.auth.admin.generateLink(
            type: GenerateLinkType.emailChangeCurrent,
            email: 'email@example.com',
            newEmail: 'new@example.com',
          );
          ```
  - id: update-user-by-id
    title: 'updateUserById()'
    notes: |
      Updates a user. Only the attributes that are given are changed.
    params:
      - name: userId
        isOptional: false
        type: String
        description: ID of the user to update.
      - name: attributes
        isOptional: false
        type: AdminUserAttributes
        description: Attributes to update for the user.
        subContent:
          - name: email
            isOptional: true
            type: String
            description: The email address of the user.
          - name: password
            isOptional: true
            type: String
            description: The password of the user.
          - name: phone
            isOptional: true
            type: String
            description: The phone number of the user.
          - name: userMetadata
            isOptional: true
            type: Map<String, dynamic>
            description: A custom data object to store the user's metadata. This maps to the `auth.users.user_metadata` column.
          - name: appMetadata
            isOptional: true
            type: Map<String, dynamic>
            description: A custom data object to store the user's application specific metadata. This maps to the `auth.users.app_metadata` column.
          - name: emailConfirm
            isOptional: true
            type: bool
            description: Whether to confirm the user's email address.
          - name: phoneConfirm
            isOptional: true
            type: bool
            description: Whether to confirm the user's phone number.
          - name: banDuration
            isOptional: true
            type: String
            description: Determines how long a user is banned for. Some possible durations include '300ms', '2h45m'. `'none'` lifts the ban.
    examples:
      - id: updates-a-users-email
        name: Updates a user's email
        isSpotlight: true
        code: |
          ```dart
          await supabase.auth.admin.updateUserById(
            '6aa5d0d4-2a9f-4483-b6c8-0cf4c6c98ac4',
            attributes: AdminUserAttributes(email: 'new@email.com'),
          );
          ```
      - id: ban-a-user
        name: Ban a user for a day
        code: |
          ```dart
          await supabase.auth.admin.updateUserById(
            '6aa5d0d4-2a9f-4483-b6c8-0cf4c6c98ac4',
            attributes: AdminUserAttributes(banDuration: '24h'),
          );
          ```
  - id: admin-mfa-list-factors
