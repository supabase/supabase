  - id: link-identity
    title: 'linkIdentity()'
    description: |
      Links an OAuth identity to an existing user. This method supports the PKCE flow.
    notes: |
      - The **Enable Manual Linking** option must be enabled from your [project's authentication settings](/dashboard/project/_/auth/providers).
      - The user needs to be signed in to call `linkIdentity()`. Otherwise it throws an `AuthSessionMissingException`.
      - If the candidate identity is already linked to the existing user or another user, `linkIdentity()` will fail.
      - Like [`signInWithOAuth()`](/docs/reference/dart/auth-signinwithoauth), it opens the page through the configured `OAuthLauncher` and returns whether it launched. Listen to `onAuthStateChange` for the result.
      - To get the URL as a `Uri` without opening it, use `getLinkIdentityUrl()`.
    params:
      - name: provider
        isOptional: false
        type: OAuthProvider
        description: The provider to link the identity to.
      - name: redirectTo
        isOptional: true
        type: String
        description: The URL to redirect the user to after they sign in with the third-party provider.
      - name: scopes
        isOptional: true
        type: String
        description: A space-separated list of scopes to request from the third-party provider.
      - name: authScreenLaunchMode
        isOptional: true
        type: LaunchMode
        description: The launch mode for the auth screen. Defaults to `LaunchMode.platformDefault`.
      - name: queryParameters
        isOptional: true
        type: Map<String, String>
        description: Additional query parameters to be passed to the OAuth flow.
      - name: preferEphemeral
        isOptional: true
        type: bool
        description: Requests a session that does not share cookies with the system browser. Ignored by the default launcher, used by `FlutterWebAuth2OAuthLauncher`. Defaults to `false`.
    examples:
      - id: link-identity
        name: Link an identity to a user
        isSpotlight: true
        code: |
          ```dart
          await supabase.auth.linkIdentity(OAuthProvider.google);
          ```
  - id: unlink-identity
    title: 'unlinkIdentity()'
    description: |
      Unlinks an identity from a user by deleting it. The user will no longer be able to sign in with that identity once it's unlinked.
    params:
      - name: identity
        isOptional: false
        type: UserIdentity
        description: The user identity to unlink.
    notes: |
      - The **Enable Manual Linking** option must be enabled from your [project's authentication settings](/dashboard/project/_/auth/providers).
      - The user needs to be signed in to call `unlinkIdentity()`. Otherwise it throws an `AuthSessionMissingException`.
      - The user must have at least 2 identities in order to unlink an identity.
      - The identity to be unlinked must belong to the user.
    examples:
      - id: unlink-identity
        name: Unlink an identity
        isSpotlight: true
        code: |
          ```dart
          final identities = await supabase.auth.getUserIdentities();

          final googleIdentity = identities.firstWhere(
            (identity) => identity.provider == 'google',
          );

          await supabase.auth.unlinkIdentity(googleIdentity);
          ```
  - id: link-identity-with-id-token
    title: 'linkIdentityWithIdToken()'
    description: |
      Links an identity to the signed-in user with an ID token from a native sign-in SDK, and returns the updated `Session`. It works like `signInWithIdToken()`, but links instead of signing in.
    notes: |
      - The **Enable Manual Linking** option must be enabled from your [project's authentication settings](/dashboard/project/_/auth/providers).
      - The user needs to be signed in to call `linkIdentityWithIdToken()`. Otherwise it throws an `AuthSessionMissingException`.
      - Supports the same OAuth providers as `signInWithIdToken()`: Google, Apple, Facebook, Kakao, and Keycloak.
      - If the candidate identity is already linked to another user, the operation will fail.
    params:
      - name: provider
        isOptional: false
        type: OAuthProvider
        description: The OAuth provider to link the identity from.
      - name: idToken
        isOptional: false
        type: String
        description: The identity token obtained from the third-party provider.
      - name: accessToken
        isOptional: true
        type: String
        description: Access token obtained from the third-party provider. Required when the ID token carries an `at_hash` claim, as Google ID tokens can.
      - name: nonce
        isOptional: true
        type: String
        description: Raw nonce value used to perform the third-party sign in. Required for Apple sign-in.
      - name: captchaToken
        isOptional: true
        type: String
        description: The captcha token to be used for captcha verification.
    examples:
      - id: link-apple-identity
        name: Link Apple identity
        isSpotlight: true
        description: |
          Link an Apple identity to the signed-in user using native Apple Sign In. Getting the ID token works as for [`signInWithIdToken()`](/docs/reference/dart/auth-signinwithidtoken), which also shows Google and Facebook.
        code: |
          ```dart
          import 'dart:convert';

          import 'package:crypto/crypto.dart';
          import 'package:sign_in_with_apple/sign_in_with_apple.dart';
          import 'package:supabase_flutter/supabase_flutter.dart';

          final rawNonce = supabase.auth.generateRawNonce();
          final hashedNonce = sha256.convert(utf8.encode(rawNonce)).toString();

          final credential = await SignInWithApple.getAppleIDCredential(
            scopes: [AppleIDAuthorizationScopes.email],
            nonce: hashedNonce,
          );

          final idToken = credential.identityToken;
          if (idToken == null) {
            throw const AuthException('Could not find an ID token.');
          }

          final session = await supabase.auth.linkIdentityWithIdToken(
            provider: OAuthProvider.apple,
            idToken: idToken,
            nonce: rawNonce,
          );
          ```
  - id: send-password-reauthentication
    title: 'reauthenticate()'
    notes: |
      - This method is used together with `updateUser()` when a user's password needs to be updated.
      - This method sends a nonce to the user's email. If the user doesn't have a confirmed email address, the method sends the nonce to the user's confirmed phone number instead.
    examples:
      - id: send-reauthentication-nonce
        name: Send reauthentication nonce
        description: Sends a reauthentication nonce to the user's email or phone number.
        isSpotlight: true
        code: |
          ```dart
          await supabase.auth.reauthenticate();
          ```
  - id: resend-email-or-phone-otps
    title: 'resend()'
    notes: |
      - Resends a signup confirmation, email change, or phone change email to the user.
      - Passwordless sign-ins can be resent by calling the `signInWithOtp()` method again.
      - Password recovery emails can be resent by calling the `resetPasswordForEmail()` method again.
      - This method only resends an email or phone OTP to the user if an initial signup, email change, or phone change request was made.
      - Pass `email` for `OtpType.signup` and `OtpType.emailChange`, and `phone` for `OtpType.sms` and `OtpType.phoneChange`.
    params:
      - name: type
        isOptional: false
        type: OtpType
        description: The kind of message to resend.
      - name: email
        isOptional: true
        type: String
        description: The email address to resend to.
      - name: phone
        isOptional: true
        type: String
        description: The phone number to resend to.
      - name: emailRedirectTo
        isOptional: true
        type: String
        description: The URL to redirect the user to after they confirm their email address.
      - name: captchaToken
        isOptional: true
        type: String
        description: The captcha token to be used for captcha verification.
    examples:
      - id: resend-email-signup-confirmation
        name: Resend an email signup confirmation
        description: Resends the email signup confirmation to the user
        isSpotlight: true
        code: |
          ```dart
          final response = await supabase.auth.resend(
            type: OtpType.signup,
            email: 'email@example.com',
          );
          ```
  - id: on-auth-state-change
    title: 'onAuthStateChange()'
    description: |
      Receive a notification every time an auth event happens.
    notes: |
      - Emits a sealed `AuthState`. Each event has its own subtype carrying the data it produces: `AuthInitialSession`, `AuthSignedIn`, `AuthSignedOut`, `AuthTokenRefreshed`, `AuthUserUpdated`, `AuthPasswordRecovery` and `AuthMfaChallengeVerified`. Use a `switch` over them.
      - `session` is non-nullable on every subtype except `AuthInitialSession`, where it is the session at subscription time or `null`, and `AuthSignedOut`, where it is always `null`.
      - Every new subscriber first receives `AuthInitialSession`. Earlier events are not replayed.
      - `AuthSignedOut.reason` tells a sign-out the client did on its own apart from a call to `signOut()`, for example `SignOutReason.sessionExpired` when the session could not be refreshed.
      - **Always provide an `onError` handler.** Network errors, such as a token refresh while offline, and failed sign-in callbacks are emitted as stream errors. Without `onError`, they are unhandled and reach the zone's error handler.
    examples:
      - id: listen-to-auth-changes
        name: Listen to auth changes
        isSpotlight: true
        code: |
          ```dart
          final authSubscription = supabase.auth.onAuthStateChange.listen(
            (state) {
              switch (state) {
                case AuthInitialSession(:final session):
                  // The session restored at startup, or null.
                  print(session == null ? 'Show sign in' : 'Show home');
                case AuthSignedIn(:final session):
                  print('Signed in as ${session.user.email}');
                case AuthSignedOut(:final reason):
                  print('Signed out, reason: $reason');
                case AuthPasswordRecovery():
                  print('Show the form that sets a new password');
                case AuthTokenRefreshed():
                case AuthUserUpdated():
                case AuthMfaChallengeVerified():
                  break;
              }
            },
            onError: (Object error, StackTrace stackTrace) {
              // Network errors, such as a token refresh while offline, and failed
              // sign-in callbacks are emitted here.
              print('Auth error: $error');
            },
          );
          ```
      - id: listen-to-a-specific-event
        name: Listen to a specific event
        code: |
          ```dart
          supabase.auth.onAuthStateChange.listen(
            (state) {
              if (state case AuthSignedIn(:final session)) {
                print('Signed in as ${session.user.email}');
              }
            },
            onError: (Object error, StackTrace stackTrace) {},
          );
          ```
      - id: listen-to-expired-sessions
        name: React to an expired session
        code: |
          ```dart
          supabase.auth.onAuthStateChange.listen(
            (state) {
              if (state case AuthSignedOut(reason: SignOutReason.sessionExpired)) {
                print('Your session expired, please sign in again');
              }
            },
            onError: (Object error, StackTrace stackTrace) {},
          );
          ```
      - id: unsubscribe-from-auth-subscription
        name: Unsubscribe from auth subscription
        code: |
          ```dart
          final authSubscription = supabase.auth.onAuthStateChange.listen(
            (state) {},
            onError: (Object error, StackTrace stackTrace) {},
          );

          await authSubscription.cancel();
          ```
  - id: auth-reset-password-for-email
    title: 'resetPasswordForEmail()'
    description: |
      Sends a password reset request to an email address.
    notes: |
      - When the user clicks the reset link in the email, they are redirected back to your application and `AuthPasswordRecovery` is emitted on `onAuthStateChange`. Prompt the user for a new password and call `updateUser()`.
      - `redirectTo` opens the app through a deep link. Leave it null on web.
    params:
      - name: email
        isOptional: false
        type: String
        description: The email address of the user.
      - name: redirectTo
        isOptional: true
        type: String
        description: The URL to send the user to after they click the reset link.
      - name: captchaToken
        isOptional: true
        type: String
        description: The captcha token to be used for captcha verification.
    examples:
      - id: reset-password
        name: Reset password for Flutter
        isSpotlight: true
        code: |
          ```dart
          await supabase.auth.resetPasswordForEmail(
            'sample@email.com',
            redirectTo: kIsWeb ? null : 'io.supabase.flutter://reset-callback/',
          );
          ```
      - id: set-new-password
        name: Set the new password
        description: |
          Once `AuthPasswordRecovery` is emitted, update the password of the user.
        code: |
          ```dart
          await supabase.auth.updateUser(UserAttributes(password: 'a-new-password'));
          ```
  - id: exchange-code-for-session
    title: 'exchangeCodeForSession()'
    description: |
      Exchanges the code of a PKCE flow for a session.
    notes: |
      - `supabase_flutter` exchanges the code of a deep link or web callback URL for you. Call this method yourself when you handle the callback elsewhere, for example on a server.
      - The code verifier is read from the `asyncStorage` of the client, so the exchange has to happen on the device or process that started the flow.
      - Returns an `AuthSessionUrlResponse` with the `session` and a `redirectType`, which is `AuthRedirectType.passwordRecovery` for a password reset and `AuthRedirectType.emailChange` for an email change.
    params:
      - name: authCode
        isOptional: false
        type: String
        description: The `code` query parameter of the callback URL.
      - name: flowId
        isOptional: true
        type: String
        description: The ID of the flow the code belongs to, when several PKCE flows are pending at the same time.
    examples:
      - id: exchange-code-for-session
        name: Exchange a code for a session
        isSpotlight: true
        code: |
          ```dart
          final response = await supabase.auth.exchangeCodeForSession(code);
          final session = response.session;
          ```
  - id: set-session
    title: 'setSession()'
    notes: |
      - `setSession()` takes in a refresh token and uses it to get a new session, which it returns.
      - When an access token that has not expired yet is passed as well, the session is restored from the tokens without a refresh request.
      - The refresh token can only be used once to obtain a new session.
      - [Refresh token rotation](/docs/guides/local-development/cli/config#auth.enable_refresh_token_rotation) is enabled by default on all projects to guard against replay attacks.
      - You can configure the [`REFRESH_TOKEN_REUSE_INTERVAL`](/docs/guides/local-development/cli/config#auth.refresh_token_reuse_interval) which provides a short window in which the same refresh token can be used multiple times in the event of concurrency or offline issues.
    params:
      - name: refreshToken
        isOptional: false
        type: String
        description: Refresh token to use to get a new session.
      - name: accessToken
        isOptional: true
        type: String
        description: Optional access token to set along with the refresh token.
    examples:
      - id: refresh-the-session
        name: Set the session
        description: Sets the session from a refresh token and returns it. Throws an `AuthException` if the refresh token is invalid.
        isSpotlight: true
        code: |
          ```dart
          final session = await supabase.auth.setSession(refreshToken);
          ```
        response: |
          ```json
          Session(
            accessToken: '<ACCESS_TOKEN>',
            tokenType: 'bearer',
            expiresIn: 3600,
            refreshToken: '<REFRESH_TOKEN>',
            user: User(
              id: '11111111-1111-1111-1111-111111111111',
              audience: 'authenticated',
              role: 'authenticated',
              email: 'example@email.com',
              emailConfirmedAt: DateTime.utc(2024, 1, 1),
              phone: '',
              lastSignInAt: DateTime.utc(2024, 1, 1),
              appMetadata: AppMetadata(
                provider: 'email',
                providers: ['email'],
              ),
              userMetadata: {},
              identities: [
                UserIdentity(
                  identityId: '22222222-2222-2222-2222-222222222222',
                  id: '11111111-1111-1111-1111-111111111111',
                  userId: '11111111-1111-1111-1111-111111111111',
                  identityData: {
                    'email': 'example@email.com',
                    'email_verified': false,
                    'phone_verified': false,
                    'sub': '11111111-1111-1111-1111-111111111111',
                  },
                  provider: 'email',
                  lastSignInAt: DateTime.utc(2024, 1, 1),
                  createdAt: DateTime.utc(2024, 1, 1),
                  updatedAt: DateTime.utc(2024, 1, 1),
                ),
              ],
              createdAt: DateTime.utc(2024, 1, 1),
              updatedAt: DateTime.utc(2024, 1, 1),
            ),
          );
          ```
      - id: set-session-with-access-token
        name: Set session with access token
        description: You can optionally provide an access token along with the refresh token.
        isSpotlight: false
        code: |
          ```dart
          final session = await supabase.auth.setSession(
            refreshToken,
            accessToken: accessToken,
          );
          ```
  - id: refresh-session
    title: 'refreshSession()'
    notes: |
      - This method will refresh and return a new session whether the current one is expired or not.
      - Pass a refresh token to refresh that one instead of the refresh token of the current session.
    params:
      - name: refreshToken
        isOptional: true
        type: String
        description: The refresh token to use. Defaults to the refresh token of the current session.
    examples:
      - id: refresh-session-using-the-current-session
        name: Refresh session using the current session
        isSpotlight: true
        code: |
          ```dart
          final session = await supabase.auth.refreshSession();
          ```
        response: |
          ```json
          Session(
            accessToken: '<ACCESS_TOKEN>',
            tokenType: 'bearer',
