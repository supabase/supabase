  - id: contains
    title: Operator.Contains
    examples:
      - id: with-select
        name: With `Select()`
        isSpotlight: true
        code: |
          ```c#
          var result = await supabase.From<City>()
            .Filter(x => x.MainExports, Operator.Contains, new List<object> { "oil", "fish" })
            .Get();
          ```

  - id: contained-by
    title: Operator.ContainedIn
    examples:
      - id: with-select
        name: With `Select()`
        isSpotlight: true
        code: |
          ```c#
          var result = await supabase.From<City>()
            .Filter(x => x.MainExports, Operator.ContainedIn, new List<object> { "oil", "fish" })
            .Get();
          ```

  - id: text-search
    title: Operator.[FTS,PLFTS,PHFTS,WFTS] (Full Text Search)
    description: |
      Finds all rows whose tsvector value on the stated `column` matches to_tsquery(query).
    examples:
      - id: text-search
        name: Text search
        code: |
          ```c#
          var result = await supabase.From<Quote>()
            .Select(x => x.Catchphrase)
            .Filter(x => x.Catchphrase, Operator.FTS, new FullTextSearchConfig("'fat' & 'cat", "english"))
            .Get();
          ```
      - id: basic-normalization
        name: Basic normalization
        description: Uses PostgreSQL's `plainto_tsquery` function.
        code: |
          ```c#
          var result = await supabase.From<Quote>()
            .Select(x => x.Catchphrase)
            .Filter(x => x.Catchphrase, Operator.PLFTS, new FullTextSearchConfig("'fat' & 'cat", "english"))
            .Get();
          ```
      - id: full-normalization
        name: Full normalization
        description: Uses PostgreSQL's `phraseto_tsquery` function.
        code: |
          ```c#
          var result = await supabase.From<Quote>()
            .Select(x => x.Catchphrase)
            .Filter(x => x.Catchphrase, Operator.PHFTS, new FullTextSearchConfig("'fat' & 'cat", "english"))
            .Get();
          ```
      - id: web-search
        name: Websearch
        description: |
          Uses PostgreSQL's `websearch_to_tsquery` function.
          This function will never raise syntax errors, which makes it possible to use raw user-supplied input for search, and can be used
          with advanced operators.

          - `unquoted text`: text not inside quote marks will be converted to terms separated by & operators, as if processed by plainto_tsquery.
          - `"quoted text"`: text inside quote marks will be converted to terms separated by `<->` operators, as if processed by phraseto_tsquery.
          - `OR`: the word “or” will be converted to the | operator.
          - `-`: a dash will be converted to the ! operator.

        code: |
          ```c#
          var result = await supabase.From<Quote>()
            .Select(x => x.Catchphrase)
            .Filter(x => x.Catchphrase, Operator.WFTS, new FullTextSearchConfig("'fat' & 'cat", "english"))
            .Get();
          ```
  - id: sign-up-async
    title: 'SignUpAsync()'
    description: |
      Creates a new user and returns a `SignUpState` that tells a signed-in user apart from one who still has to confirm.
    notes: |
      - `SignUpAsync()` replaces `SignUp()`. `SignUp()` is marked `[Obsolete]` and is removed in v9. It ignores `SignUpOptions.FlowType` and `SignUpOptions.Channel`, and it returns a `Session` that means two different things depending on whether confirmation is required.
      - `SignUpState.Session` is set when the user is signed in. It is `null` while the user has to confirm their email address or phone number. The client stores the session and raises `AuthState.SignedIn` when a session is returned.
      - `SignUpState.User` is the signed-up user, including one that is waiting for confirmation.
      - `SignUpState.PKCEVerifier` is set for an email sign-up with `FlowType = OAuthFlowType.PKCE`. Keep it and pass it with the code from the confirmation link to `ExchangeCodeForSession()`.
      - For a phone sign-up, `SignUpOptions.Channel` chooses how the code is sent (SMS or WhatsApp). The default is SMS.
      - Set `SignUpOptions.CaptchaToken` when CAPTCHA protection is enabled for your project.
      - If the email or phone number already belongs to an account, the server does not reveal it. You get either an obfuscated user whose `Identities` list is empty, or a `GotrueException` with the reason `UserAlreadyRegistered`.
    examples:
      - id: sign-up-with-email-and-password
        name: Sign up with an email and password
        isSpotlight: true
        code: |
          ```c#
          var signedUp = await supabase.Auth.SignUpAsync(SignUpType.Email, email, password);

          if (signedUp.Session == null)
          {
              // The user has to confirm their email address before signing in.
          }
          ```
      - id: sign-up-with-pkce
        name: Sign up with the PKCE flow
        code: |
          ```c#
          var signedUp = await supabase.Auth.SignUpAsync(SignUpType.Email, email, password,
              new SignUpOptions { FlowType = OAuthFlowType.PKCE, RedirectTo = "https://example.com/confirm" });

          // Keep the verifier until the user comes back with the code from the confirmation link.
          var verifier = signedUp.PKCEVerifier;
          ```
      - id: sign-up-with-phone-and-captcha
        name: Sign up with a phone number and a CAPTCHA token
        code: |
          ```c#
          var signedUp = await supabase.Auth.SignUpAsync(SignUpType.Phone, "+13334445555", password,
              new SignUpOptions
              {
                  CaptchaToken = captchaToken,
                  Channel = SignInWithPasswordlessPhoneOptions.MessagingChannel.WHATSAPP
              });
          ```
  - id: sign-in-with-password-options
    title: 'SignInWithPassword() with options'
    description: |
      Signs in a user with a password and passes a CAPTCHA token.
    notes: |
      - Use this overload when CAPTCHA protection is enabled for your project. Set `SignInWithPasswordOptions.CaptchaToken` to the token your CAPTCHA widget returned.
      - The `SignInType` says whether the identifier is an email address or a phone number.
    examples:
      - id: sign-in-with-password-and-captcha
        name: Sign in with a CAPTCHA token
        isSpotlight: true
        code: |
          ```c#
          var session = await supabase.Auth.SignInWithPassword(
              SignInType.Email,
              email,
              password,
              new SignInWithPasswordOptions { CaptchaToken = captchaToken });
          ```
  - id: sign-in-with-web3
    title: 'SignInWithWeb3Async()'
    description: |
      Signs in a user with a signed message from a Solana or Ethereum wallet.
    notes: |
      - Your app asks the wallet to sign a Sign-In with Solana or Sign-In with Ethereum (EIP-4361) message. Pass the message and the signature to `Web3Credentials`.
      - `Web3Credentials.ForSolana()` takes the 64-byte signature. `Web3Credentials.ForEthereum()` takes the 65-byte signature as a hex string, with or without the `0x` prefix. Both throw an `ArgumentException` when the signature has the wrong length.
      - Enable the Web3 provider for the chain in [your project](https://supabase.com/dashboard/project/_/auth/providers). Otherwise the server returns the error code `web3_provider_disabled`.
      - Set `SignInWithWeb3Options.CaptchaToken` when CAPTCHA protection is enabled.
      - The client stores the session and raises `AuthState.SignedIn`.
    examples:
      - id: sign-in-with-ethereum
        name: Sign in with Ethereum
        isSpotlight: true
        code: |
          ```c#
          var session = await supabase.Auth.SignInWithWeb3Async(
              Web3Credentials.ForEthereum(message, signatureHex));
          ```
      - id: sign-in-with-solana
        name: Sign in with Solana
        code: |
          ```c#
          var session = await supabase.Auth.SignInWithWeb3Async(
              Web3Credentials.ForSolana(message, signatureBytes),
              new SignInWithWeb3Options { CaptchaToken = captchaToken });
          ```
  - id: get-claims
    title: 'GetClaimsAsync()'
    description: |
      Verifies an access token and returns its claims.
    notes: |
      - Without arguments, it reads the access token of the current session.
      - The SDK verifies RS256 and ES256 tokens locally when a matching public key is available. Otherwise it asks the auth server to verify the token.
      - An expired token throws, unless you set `GetClaimsOptions.AllowExpired` to `true`.
      - `GetClaimsResponse.Claims` holds the standard claims (`Sub`, `Role`, `Aal`, `SessionId`, `Exp`, and so on). Any other claim is in `AdditionalClaims`.
    examples:
      - id: get-claims-of-current-session
        name: Get the claims of the current session
        isSpotlight: true
        code: |
          ```c#
          var response = await supabase.Auth.GetClaimsAsync();
          var userId = response.Claims.Sub;
          ```
      - id: get-claims-of-a-token
        name: Get the claims of a given token
        code: |
          ```c#
          var response = await supabase.Auth.GetClaimsAsync(jwt, new GetClaimsOptions { AllowExpired = true });
          ```
  - id: resend-email-or-phone-otps
    title: 'Resend()'
    description: |
      Resends a confirmation email or a one-time password (OTP) by SMS.
    notes: |
      - `ResendType.SignUp` and `ResendType.EmailChange` send an email. Set `Email` on the parameters.
      - `ResendType.Sms` and `ResendType.PhoneChange` send an SMS. Set `Phone` on the parameters.
      - Pass an `OAuthFlowType` as the second argument to send the PKCE code challenge. The call then returns a `ResendState` with the `PKCEVerifier` to keep. `Resend()` does not read the flow type set at client creation.
      - Set `ResendOptions.CaptchaToken` when CAPTCHA protection is enabled. `EmailRedirectTo` applies to emails only.
    examples:
      - id: resend-a-signup-confirmation-email
        name: Resend a sign-up confirmation email
        isSpotlight: true
        code: |
          ```c#
          await supabase.Auth.Resend(
              new ResendParameters(ResendType.SignUp, email, null, new ResendOptions(captchaToken: null, emailRedirectTo: "https://example.com/welcome")));
          ```
      - id: resend-a-phone-otp
        name: Resend a phone OTP
        code: |
          ```c#
          await supabase.Auth.Resend(new ResendParameters(ResendType.Sms, null, "+13334445555", null));
          ```
      - id: resend-with-pkce
        name: Resend with the PKCE flow
        code: |
          ```c#
          var state = await supabase.Auth.Resend(
              new ResendParameters(ResendType.SignUp, email, null, null),
              OAuthFlowType.PKCE);

          var verifier = state.PKCEVerifier;
          ```
  - id: start-auto-refresh
    title: 'StartAutoRefresh()'
    description: |
      Starts the background refresh of the session, or resumes it after `StopAutoRefresh()`.
    notes: |
      - The client starts the refresh when it is created, as long as `ClientOptions.AutoRefreshToken` is `true`, which is the default.
      - Call it when your app returns to the foreground. If the session has expired, it is refreshed right away.
    examples:
      - id: start-auto-refresh
        name: Resume the refresh when the app returns to the foreground
        isSpotlight: true
        code: |
          ```c#
          supabase.Auth.StartAutoRefresh();
          ```
  - id: stop-auto-refresh
    title: 'StopAutoRefresh()'
    description: |
      Stops the background refresh of the session.
    notes: |
      - The session is kept. Signing in again does not restart the refresh: call `StartAutoRefresh()`.
      - Call it when your app goes to the background.
    examples:
      - id: stop-auto-refresh
        name: Pause the refresh when the app goes to the background
        isSpotlight: true
        code: |
          ```c#
          supabase.Auth.StopAutoRefresh();
          ```
  - id: get-user-identities
    title: 'GetUserIdentitiesAsync()'
    description: |
      Lists the external identities linked to the signed-in user.
    notes: |
      - The list is read from the server, so identities linked or unlinked since sign-in are included. It is empty when the user has none.
      - It throws a `GotrueException` with the reason `NoSessionFound` when no user is signed in.
    examples:
      - id: get-the-identities-of-a-user
        name: Get the identities of the signed-in user
        isSpotlight: true
        code: |
          ```c#
          var identities = await supabase.Auth.GetUserIdentitiesAsync();
          var github = identities.FirstOrDefault(identity => identity.Provider == "github");
          ```
  - id: sign-out-reason
    title: 'SignOutReason'
    description: |
      Tells why the user was signed out. Read it while handling `AuthState.SignedOut`.
    notes: |
      - `SignOutReason.UserInitiated` is an explicit call to `SignOut()`.
      - `SignOutReason.SessionExpired` is a session the server rejected, for example when a refresh token is no longer valid.
      - `SignOutReason.SessionMissing` is a stored session that could not be restored when the client loaded.
      - The value is `null` while a user is signed in, and when the client cannot tell why no user is signed in.
    examples:
      - id: show-a-notice-when-the-session-expires
        name: Show a notice when the session expires
        isSpotlight: true
        code: |
          ```c#
          supabase.Auth.AddStateChangedListener((sender, changed) =>
          {
              if (changed == AuthState.SignedOut && sender.SignOutReason == SignOutReason.SessionExpired)
              {
                  ShowSessionExpiredNotice();
              }
          });
          ```
  - id: auth-flow-type
    title: 'AuthFlowType'
    description: |
      Chooses the OAuth flow type for the whole client when you create it.
    notes: |
      - The default is `OAuthFlowType.Implicit`. PKCE is recommended for mobile and server-side apps.
      - The setting applies to OAuth, SSO, identity linking, email sign-up, email OTP, and password reset flows.
      - A flow type set in the options of a single call overrides it. `Resend()` takes its flow type as an argument and ignores this setting.
      - When you use the standalone auth client, set `ClientOptions.FlowType` instead.
    examples:
      - id: use-pkce-for-all-flows
        name: Use PKCE for all flows
        isSpotlight: true
        code: |
          ```c#
          var options = new Supabase.SupabaseOptions
          {
              AuthFlowType = Constants.OAuthFlowType.PKCE
          };

          var supabase = new Supabase.Client(url, key, options);
          await supabase.InitializeAsync();

          var state = await supabase.Auth.SignIn(Provider.Github);

          // After the user comes back with a code:
          var session = await supabase.Auth.ExchangeCodeForSession(state.PKCEVerifier!, code);
          ```
  - id: passkey-list
    title: 'ListPasskeysAsync()'
    description: |
      Lists the passkeys of the signed-in user.
    notes: |
      - Each `Passkey` has an `Id`, a `FriendlyName`, a `CreatedAt` date, and a `LastUsedAt` date that is `null` until the passkey is used.
      - Passkeys must be enabled on your auth server. Otherwise the server returns the error code `passkey_disabled`.
    examples:
      - id: list-passkeys
        name: List passkeys
        isSpotlight: true
        code: |
          ```c#
          var passkeys = await supabase.Auth.ListPasskeysAsync();
          ```
  - id: passkey-update
    title: 'RenamePasskeyAsync()'
    description: |
      Renames a passkey of the signed-in user.
    notes: |
      - The name can be up to 120 characters. An empty name throws an `ArgumentException` before any request is sent.
      - It works at any authenticator assurance level.
    examples:
      - id: rename-a-passkey
        name: Rename a passkey
        isSpotlight: true
        code: |
          ```c#
          var passkey = await supabase.Auth.RenamePasskeyAsync(passkeyId, "Work laptop");
          ```
  - id: passkey-delete
    title: 'DeletePasskeyAsync()'
    description: |
      Deletes a passkey of the signed-in user. The passkey can no longer be used to sign in.
    notes: |
      - If the user has MFA enabled, the session must be at the `aal2` assurance level. Otherwise the server returns the error code `insufficient_aal`.
      - No admin privileges are needed.
    examples:
      - id: delete-a-passkey
        name: Delete a passkey
        isSpotlight: true
        code: |
          ```c#
          await supabase.Auth.DeletePasskeyAsync(passkeyId);
          ```
  - id: passkey-start-registration
    title: 'StartPasskeyRegistrationAsync()'
    description: |
      Starts the registration of a passkey and returns a challenge for the platform authenticator.
    notes: |
      - The user must be signed in.
      - `PasskeyChallenge.Options` is the WebAuthn creation options as JSON. Pass it to your platform API (for example the browser, or the Credential Manager on Android) to create the credential. The SDK does not talk to the authenticator.
      - Finish the registration with `RegisterPasskeyAsync()` before `ExpiresAt`. A challenge can be used once, even when the attempt fails.
    examples:
      - id: start-passkey-registration
        name: Start a passkey registration
        isSpotlight: true
        code: |
          ```c#
          var challenge = await supabase.Auth.StartPasskeyRegistrationAsync();
          ```
  - id: passkey-verify-registration
    title: 'RegisterPasskeyAsync()'
    description: |
      Completes the registration of a passkey with the credential the authenticator created.
    notes: |
      - `credential` is the W3C `RegistrationResponseJSON` object, as a `JsonElement`. It is sent to the server unchanged. Passing anything but a JSON object throws an `ArgumentException`.
      - The returned passkey is named after the authenticator. Use `RenamePasskeyAsync()` to change the name.
    examples:
      - id: register-a-passkey
        name: Register a passkey
        isSpotlight: true
        code: |
          ```c#
          var challenge = await supabase.Auth.StartPasskeyRegistrationAsync();

          // Create the credential with your platform API, using challenge.Options.
          JsonElement credential = await CreateCredentialAsync(challenge.Options);

          var passkey = await supabase.Auth.RegisterPasskeyAsync(challenge.Id, credential);
          ```
  - id: passkey-start-authentication
    title: 'StartPasskeySignInAsync()'
    description: |
      Starts a passkey sign-in and returns a challenge for the platform authenticator.
    notes: |
      - No user needs to be signed in.
      - Set `SignInWithPasskeyOptions.CaptchaToken` when CAPTCHA protection is enabled.
      - `PasskeyChallenge.Options` is the WebAuthn request options as JSON. Finish with `SignInWithPasskeyAsync()` before `ExpiresAt`.
    examples:
      - id: start-passkey-sign-in
        name: Start a passkey sign-in
        isSpotlight: true
        code: |
          ```c#
          var challenge = await supabase.Auth.StartPasskeySignInAsync(
              new SignInWithPasskeyOptions { CaptchaToken = captchaToken });
          ```
  - id: passkey-verify-authentication
    title: 'SignInWithPasskeyAsync()'
    description: |
      Signs in a user with the assertion the authenticator produced.
    notes: |
      - `credential` is the W3C `AuthenticationResponseJSON` object, as a `JsonElement`. It is sent to the server unchanged.
      - The client stores the session and raises `AuthState.SignedIn`.
    examples:
      - id: sign-in-with-a-passkey
        name: Sign in with a passkey
        isSpotlight: true
        code: |
          ```c#
          var challenge = await supabase.Auth.StartPasskeySignInAsync();

          // Get the assertion with your platform API, using challenge.Options.
          JsonElement assertion = await GetAssertionAsync(challenge.Options);

          var session = await supabase.Auth.SignInWithPasskeyAsync(challenge.Id, assertion);
          ```
  - id: mfa-get-recovery-codes-status
    title: 'GetRecoveryCodesStatusAsync()'
    description: |
      Returns how many MFA recovery codes the signed-in user has and how many are unused.
    notes: |
      - It returns `null` when the user has no recovery codes.
      - Recovery codes are experimental on the auth server and must be enabled for your project.
    examples:
      - id: get-the-recovery-codes-status
        name: Get the recovery codes status
        isSpotlight: true
        code: |
          ```c#
          var status = await supabase.Auth.GetRecoveryCodesStatusAsync();

          if (status == null)
          {
              // Offer to generate recovery codes.
          }
          else if (status.Remaining == 0)
          {
              // Every code is used. Ask the user to regenerate them.
          }
          ```
  - id: mfa-generate-recovery-codes
    title: 'GenerateRecoveryCodesAsync()'
    description: |
      Creates the first set of MFA recovery codes for the signed-in user.
    notes: |
      - The session must be at the `aal2` assurance level, so verify an MFA factor first.
      - The codes are returned once and cannot be read back. Show them to the user and ask them to store them safely.
      - It fails with `mfa_verified_factor_exists` when the user already has recovery codes. Use `RegenerateRecoveryCodesAsync()` to replace them.
    examples:
      - id: generate-recovery-codes
        name: Generate recovery codes
        isSpotlight: true
        code: |
          ```c#
          var recoveryCodes = await supabase.Auth.GenerateRecoveryCodesAsync(
              new GenerateRecoveryCodesOptions { FriendlyName = "Backup codes" });

          foreach (var code in recoveryCodes.Codes)
          {
              // Show each code to the user.
          }
          ```
  - id: mfa-regenerate-recovery-codes
    title: 'RegenerateRecoveryCodesAsync()'
    description: |
      Replaces the MFA recovery codes of the signed-in user with a new set.
    notes: |
      - Every previous code stops working at once.
      - The session must be at the `aal2` assurance level, and the user must already have recovery codes.
      - The new codes are returned once and cannot be read back.
    examples:
      - id: regenerate-recovery-codes
        name: Regenerate recovery codes
        isSpotlight: true
        code: |
          ```c#
          var recoveryCodes = await supabase.Auth.RegenerateRecoveryCodesAsync();
          ```
  - id: mfa-verify-recovery-code
    title: 'VerifyRecoveryCodeAsync()'
    description: |
      Verifies a recovery code and returns a session at the `aal2` assurance level.
    notes: |
      - Use it when the user cannot provide a code from their MFA factor. A recovery code can be used once.
      - A wrong or used code throws a `GotrueException` with the reason `MfaChallengeUnverified`. After too many failed attempts the server locks verification and the reason is `UserTooManyRequests`.
      - The current session is kept when verification fails.
    examples:
      - id: verify-a-recovery-code
        name: Verify a recovery code
        isSpotlight: true
        code: |
          ```c#
          await supabase.Auth.SignInWithPassword(email, password);

          var session = await supabase.Auth.VerifyRecoveryCodeAsync("K4M9-X7QP-2AB8-HT3Z");
          ```
  - id: mfa-unenroll-recovery-codes
    title: 'UnenrollRecoveryCodesAsync()'
    description: |
      Removes the MFA recovery codes of the signed-in user.
    notes: |
      - Every remaining code stops working.
      - The session must be at the `aal2` assurance level.
      - Sessions that reached `aal2` with a recovery code are lowered to `aal1` on the server. The current session keeps its tokens until it is refreshed.
    examples:
      - id: unenroll-recovery-codes
        name: Unenroll recovery codes
        isSpotlight: true
        code: |
          ```c#
          await supabase.Auth.UnenrollRecoveryCodesAsync();
          ```
  - id: auth-js-gotrueadminapi-signout
    title: 'AdminAuth().SignOutAsync()'
    description: |
      Signs a user out on the server, using their access token.
    notes: |
      - This is an admin method. Call it with your service role key, and only from a trusted server environment. Never call it from a client app.
      - It revokes the refresh tokens of the sessions in `scope`. `Global` (the default) revokes every session of the user, `Local` only the session of the token, and `Others` every session but the one of the token.
      - Access tokens that were already issued stay valid until they expire.
      - The access token authenticates the request. An expired or malformed token throws a `GotrueException` with the reason `AdminTokenRequired`.
    examples:
      - id: sign-out-a-user
        name: Sign out a user
        isSpotlight: true
        code: |
          ```c#
          var admin = supabase.AdminAuth(SUPABASE_SERVICE_KEY);
          await admin.SignOutAsync(userAccessToken, SignOutScope.Global);
          ```
