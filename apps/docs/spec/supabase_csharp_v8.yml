      - The identifier must start with `custom:`, for example `custom:mycompany`.
      - Use `NewCustomProvider.Oidc()` with an issuer URL, or `NewCustomProvider.OAuth2()` with the authorization, token, and user info URLs.
      - The client secret is never returned by the server.
      - Custom providers must be enabled for your project. Otherwise the server returns the error code `feature_disabled`.
    examples:
      - id: create-an-oidc-provider
        name: Create an OIDC provider
        isSpotlight: true
        code: |
          ```c#
          var admin = supabase.AdminAuth(SUPABASE_SERVICE_KEY);
          var provider = await admin.CreateCustomProviderAsync(
              NewCustomProvider.Oidc("custom:mycompany", "My Company", clientId, clientSecret, new Uri("https://login.example.com")),
              new CustomProviderOptions { Scopes = new[] { "openid", "email", "profile" } });
          ```
      - id: create-an-oauth2-provider
        name: Create an OAuth 2.0 provider
        code: |
          ```c#
          var admin = supabase.AdminAuth(SUPABASE_SERVICE_KEY);
          var provider = await admin.CreateCustomProviderAsync(
              NewCustomProvider.OAuth2(
                  "custom:mycompany", "My Company", clientId, clientSecret,
                  new Uri("https://login.example.com/authorize"),
                  new Uri("https://login.example.com/token"),
                  new Uri("https://login.example.com/userinfo")));
