openref: 0.1

info:
  id: reference/csharp
  title: Supabase C# Client
  description: |

    Supabase C#.

  definition: spec/enrichments/tsdoc_v2/combined.json
  slugPrefix: '/'
  specUrl: https://github.com/supabase/supabase/edit/master/apps/docs/spec/supabase_csharp_v8.yml
  libraries:
    - name: 'C#'
      id: 'csharp'
      version: '8.13.0'

functions:
  - id: initializing
    title: Initializing
    description: |
      Initializing a new client is pretty straightforward. Find your project url and public key from the
      admin panel and pass it into your client initialization function.

      `Supabase` is heavily dependent on Models deriving from `BaseModel`. To interact with the API, one must have the associated model (see example) specified.

      Leverage `Table`, `PrimaryKey`, and `Column` attributes to specify names of classes/properties that are different from their C# Versions.

    notes: |
      - Pick the setup that matches your app. For ASP.NET Core and Blazor, use `AddSupabase()` from the `Supabase.Extensions.DependencyInjection` package. For other apps (console, desktop, mobile, Unity), create a `Supabase.Client` yourself, call `InitializeAsync()`, and reuse it. A new client per operation means a new `HttpClient` (and socket) each time.
      - ASP.NET Core and Blazor: `AddSupabase()` registers a **scoped** `Supabase.Client`, and each sub-client individually: `IGotrueClient<User, Session>`, `IPostgrestClient`, `IStorageClient<Bucket, FileObject>`, `IFunctionsClient`, and `IRealtimeClient<RealtimeSocket, RealtimeChannel>`. Inject only the one a class needs.
      - ASP.NET Core and Blazor: a scope gets its own `Client`, with its own Auth state. In ASP.NET Core a scope is one request. In Blazor Server it is one circuit, and in Blazor WebAssembly it lasts as long as the app runs.
      - ASP.NET Core and Blazor: every client's traffic goes through pooled `HttpClient`s from `IHttpClientFactory`. Without the extension, a scoped or transient `Client` builds a new `HttpClient` per resolution, which exhausts the connection pool under load. `AddSupabase()` sets `SupabaseOptions.HttpClient` and the three `StorageClientOptions` HTTP clients (`HttpRequestClient`, `HttpUploadClient`, `HttpDownloadClient`) itself, so values you set for those in `configureOptions` are replaced. Everything else you set stays, including `Proxy`, `StorageClientOptions.Proxy`, the Storage timeouts, and the retry options such as `PostgrestRetry`.
      - ASP.NET Core and Blazor: `AddSupabase()` does not call `InitializeAsync()` on the client it creates. `AutoConnectRealtime` and restoring a persisted session only happen in `InitializeAsync()`, so call it yourself if you rely on either. `Subscribe()` on a Realtime channel connects the socket on its own.
      - ASP.NET Core and Blazor: if an `ILoggerFactory` is registered in the service provider and you did not set `SupabaseOptions.LoggerFactory`, the client uses it.
      - Keep the key out of source control and read it from configuration, such as user secrets or an environment variable. Use a publishable or anon key unless the code runs on the server and needs to bypass Row Level Security.
      - OpenTelemetry: the SDK emits traces and metrics through `System.Diagnostics` and propagates trace context. See [client-side tracing](/docs/guides/observability/client-side-tracing?language=csharp).
      - `SupabaseOptions.ThirdPartyAccessToken` authenticates the client through a third-party auth provider instead of Supabase Auth.
    examples:
      - id: csharp-init-standard
        name: Standard
        code: |
          ```c#
          var url = Environment.GetEnvironmentVariable("SUPABASE_URL");
          var key = Environment.GetEnvironmentVariable("SUPABASE_KEY");

          var options = new Supabase.SupabaseOptions
          {
              AutoConnectRealtime = true
          };

          var supabase = new Supabase.Client(url, key, options);
          await supabase.InitializeAsync();
          ```
      - id: csharp-init-aspnetcore
        name: 'ASP.NET Core: register the client'
        description: |
          Recommended for web apps. Install `Supabase.Extensions.DependencyInjection` (it brings in `Supabase`) and register the client once in `Program.cs`.
        code: |
          ```c#
          using Supabase.Core.Http;
          using Supabase.Extensions.DependencyInjection;

          var builder = WebApplication.CreateBuilder(args);

          builder.Services.AddSupabase(
              supabaseUrl: builder.Configuration["Supabase:Url"]!,
              supabaseKey: builder.Configuration["Supabase:Key"]!,
              configureOptions: options =>
              {
                  options.AutoConnectRealtime = true;
                  options.PostgrestRetry = new RetryOptions { MaxRetries = 3 };
              });

          var app = builder.Build();
          ```
      - id: csharp-init-aspnetcore-inject
        name: 'ASP.NET Core: inject the client'
        description: |
          Inject `Supabase.Client` in a minimal API endpoint, a controller, or your own service.
        code: |
          ```c#
          app.MapGet("/todos", async (Supabase.Client supabase) =>
          {
              var result = await supabase.From<Todo>().Get();
              return result.Models;
          });

          public class TodoService
          {
              private readonly Supabase.Client _supabase;

              public TodoService(Supabase.Client supabase) => _supabase = supabase;

              public async Task<List<Todo>> GetOpen()
              {
                  var result = await _supabase
                      .From<Todo>()
                      .Where(t => t.IsComplete == false)
                      .Get();

                  return result.Models;
              }
          }
          ```
      - id: csharp-init-aspnetcore-sub-client
        name: 'ASP.NET Core: inject a single sub-client'
        description: |
          A handler that uses one service can depend on that client alone.
        code: |
          ```c#
          app.MapGet("/todos", async (IPostgrestClient postgrest) =>
              await postgrest.Table<Todo>().Get());
          ```
      - id: csharp-init-aspnetcore-initialize
        name: 'ASP.NET Core: initialize the client'
        description: |
          Call `InitializeAsync()` on the injected client when you need `AutoConnectRealtime` or a session restored from your `SessionHandler`.
        code: |
          ```c#
          app.MapGet("/todos", async (Supabase.Client supabase) =>
          {
              await supabase.InitializeAsync();

              var result = await supabase.From<Todo>().Get();
              return result.Models;
          });
          ```
      - id: csharp-init-blazor
        name: Blazor
        description: |
          Register the client in `Program.cs` as shown in the ASP.NET Core example, then inject it in a component. In Blazor Server, the client lives for the circuit.
        code: |
          ```c#
          @page "/todos"
          @using Supabase
          @inject Client SupabaseClient

          <ul>
              @foreach (var todo in _todos)
              {
                  <li>@todo.Task</li>
              }
          </ul>

          @code {
              private List<Todo> _todos = new();

              protected override async Task OnInitializedAsync()
              {
                  var result = await SupabaseClient.From<Todo>().Get();
                  _todos = result.Models;
              }
          }
          ```
      - id: csharp-init-maui
        name: Dependency Injection (Maui-like)
        code: |
          ```c#
          public static MauiApp CreateMauiApp()
          {
                // ...
                var builder = MauiApp.CreateBuilder();

                var url = Environment.GetEnvironmentVariable("SUPABASE_URL");
                var key = Environment.GetEnvironmentVariable("SUPABASE_KEY");
                var options = new SupabaseOptions
                {
                  AutoRefreshToken = true,
                  AutoConnectRealtime = true,
                  // SessionHandler = new SupabaseSessionHandler() <-- This must be implemented by the developer
                };

                // Note the creation as a singleton.
                builder.Services.AddSingleton(provider => new Supabase.Client(url, key, options));
          }
          ```
      - id: csharp-init-session-persistence
        name: With session persistence
        description: By default the session lives in memory only (`SessionPersistence.Disabled`). Implement `IGotrueSessionPersistence<Session>` and pass it as `SessionHandler` to keep the session between app launches.
        code: |
          ```c#
          var options = new Supabase.SupabaseOptions
          {
              SessionHandler = new MySessionHandler() // Implements IGotrueSessionPersistence<Session>
          };

          var supabase = new Supabase.Client(url, key, options);
          await supabase.InitializeAsync();
          ```
      - id: csharp-init-oauth-flow
        name: With the PKCE flow
        description: Sets the OAuth flow type once for the client. A flow type set on a call's own options takes precedence. PKCE is recommended for mobile and server-side apps.
        code: |
          ```c#
          var options = new Supabase.SupabaseOptions
          {
              AuthFlowType = Supabase.Gotrue.Constants.OAuthFlowType.PKCE
          };

          var supabase = new Supabase.Client(url, key, options);
          ```
      - id: csharp-init-logging
        name: With logging
        description: Sends request outcomes and retries (Debug) and background failures such as token refresh and Realtime reconnects (Warning) to your logger factory. Credentials, tokens, bodies, query strings, and header values are never logged.
        code: |
          ```c#
          var options = new Supabase.SupabaseOptions
          {
              LoggerFactory = loggerFactory
          };

          var supabase = new Supabase.Client(url, key, options);
          ```
      - id: csharp-init-http-client
        name: With your own HttpClient
        description: Requests from every client, including Storage uploads and downloads, go through this client when you supply one. Set its `Timeout` to `Timeout.InfiniteTimeSpan` if you transfer large files.
        code: |
          ```c#
          var options = new Supabase.SupabaseOptions
          {
              HttpClient = new HttpClient(new MyLoggingHandler())
          };

          var supabase = new Supabase.Client(url, key, options);
          ```
      - id: csharp-init-trace-propagation
        name: Disable trace context propagation
        description: By default the SDK adds `traceparent`, `tracestate`, and `baggage` from `Activity.Current` to each Auth, Database, Storage, and Functions request. Realtime does not propagate trace context.
        code: |
          ```c#
          var options = new Supabase.SupabaseOptions
          {
              TracePropagation = Supabase.Core.Http.TracePropagation.Disabled
          };

          var supabase = new Supabase.Client(url, key, options);
          ```
      - id: csharp-init-showing-models
        name: With Models Example
        code: |
          ```c#
          // Given the following Model representing the Supabase Database (Message.cs)
          [Table("messages")]
          public class Message : BaseModel
          {
              [PrimaryKey("id")]
              public int Id { get; set; }

              [Column("username")]
              public string UserName { get; set; }

              [Column("channel_id")]
              public int ChannelId { get; set; }

              public override bool Equals(object obj)
              {
                  return obj is Message message &&
                          Id == message.Id;
              }

              public override int GetHashCode()
              {
                  return HashCode.Combine(Id);
              }
          }

          // Get All Messages
          var response = await supabase.From<Message>().Get();
          List<Message> models = response.Models;

          // Insert
          var newMessage = new Message { UserName = "acupofjose", ChannelId = 1 };
          await supabase.From<Message>().Insert(newMessage);

          // Update
          var model = response.Models.First();
          model.UserName = "elrhomariyounes";
          await model.Update<Message>();

          // Delete
          await response.Models.Last().Delete<Message>();

          // etc.
          ```
  - id: sign-up
    title: 'SignUp()'
    description: |
      Creates a new user.
    notes: |
      - By default, the user needs to verify their email address before signing in. To turn this off, disable **Confirm email** in [your project](https://supabase.com/dashboard/project/_/auth/providers).
      - **Confirm email** determines if users need to confirm their email address after signing up.
        - If **Confirm email** is enabled, a `user` is returned but `session` is null.
        - If **Confirm email** is disabled, both a `user` and a `session` are returned.
      - When the user confirms their email address, they are redirected to the [`SITE_URL`](https://supabase.com/docs/guides/auth/concepts/redirect-urls) by default. You can modify your `SITE_URL` or add additional redirect URLs in [your project](https://supabase.com/dashboard/project/_/auth/url-configuration).
      - If SignUp() is called for an existing confirmed user:
        - When both **Confirm email** and **Confirm phone** (even when phone provider is disabled) are enabled in [your project](/dashboard/project/_/auth/providers), an obfuscated/fake user object is returned.
        - When either **Confirm email** or **Confirm phone** (even when phone provider is disabled) is disabled, the error message, `User already registered` is returned.
    examples:
      - id: sign-up
        name: Sign up.
        isSpotlight: true
        code: |
          ```c#
          var session = await supabase.Auth.SignUp(email, password);
          ```
  - id: sign-in-with-password
    title: 'SignIn(email, password)'
    description: |
      Sign in an existing user using email or phone number with password.
    notes: |
      - Requires either an email and password or a phone number and password.
    examples:
      - id: sign-in-with-email-and-password
        name: Sign in with email and password
        isSpotlight: true
        code: |
          ```c#
          var session = await supabase.Auth.SignIn(email, password);
          ```
      - id: sign-in-with-phone-and-password
        name: Sign in with phone and password
        code: |
          ```c#
          var session = await supabase.Auth.SignIn(SignInType.Phone, phoneNumber, password);
          ```
  - id: sign-in-with-otp
    title: 'SendMagicLink() and SignIn(SignInType, Phone)'
    notes: |
      - Requires either an email or phone number.
      - This method is used for passwordless sign-ins where a OTP is sent to the user's email or phone number.
      - If you're using an email, you can configure whether you want the user to receive a magiclink or a OTP.
      - If you're using phone, you can configure whether you want the user to receive a OTP.
      - The magic link's destination URL is determined by the [`SITE_URL`](https://supabase.com/docs/guides/auth/concepts/redirect-urls). You can modify the `SITE_URL` or add additional redirect urls in [your project](https://supabase.com/dashboard/project/_/auth/settings).
    examples:
      - id: sign-in-with-email
        name: Send Magic Link.
        isSpotlight: true
        description: |
          The user will be sent an email which contains either a magiclink or a OTP or both. By default, a given user can only request a OTP once every 60 seconds.
          You can pass `emailRedirectTo` with dynamic link to bring the users back to your app after they click on the magic link.
        code: |
          ```c#
          var options = new SignInOptions { RedirectTo = "http://myredirect.example" };
          var didSendMagicLink = await supabase.Auth.SendMagicLink("joseph@supabase.io", options);
          ```
      - id: sign-in-with-sms-otp
        name: Sign in with SMS OTP.
        description: The user will be sent a SMS which contains a OTP. By default, a given user can only request a OTP once every 60 seconds.
        code: |
          ```c#
          await supabase.Auth.SignIn(SignInType.Phone, "+13334445555");

          // Paired with `VerifyOTP` to get a session
          var session = await supabase.Auth.VerifyOTP("+13334445555", TOKEN, MobileOtpType.SMS);
          ```
  - id: sign-in-with-oauth
    title: 'SignIn(Provider)'
    description: |
      Signs the user in using third party OAuth providers.
    notes: |
      - This method is used for signing in using a third-party provider.
      - Supabase supports many different [third-party providers](https://supabase.com/docs/guides/auth#providers).
    examples:
      - id: sign-in-using-a-third-party-provider
        name: Sign in using a third-party provider
        isSpotlight: true
        code: |
          ```c#
          var signInUrl = supabase.Auth.SignIn(Provider.Github);
          ```
      - id: sign-in-with-scopes
        name: With scopes
        description: |
          If you need additional data from an OAuth provider, you can include a space-separated list of scopes in your request to get back an OAuth provider token.
          You may also need to specify the scopes in the provider's OAuth app settings, depending on the provider.
        code: |
          ```c#
          var signInUrl = supabase.Auth.SignIn(Provider.Github, 'repo gist notifications');

          // after user comes back from signin flow
          var session = supabase.Auth.GetSessionFromUrl(REDIRECTED_URI);
          ```
  - id: sign-out
    title: 'SignOut()'
    description: |
      Signs out the current user, if there is a signed-in user.
    notes: |
      - In order to use the `SignOut()` method, the user needs to be signed in first.
    examples:
      - id: sign-out
        name: Sign out
        isSpotlight: true
        code: |
          ```c#
          await supabase.Auth.SignOut();
          ```
      - id: sign-out-with-scope
        name: Sign out with a scope
        description: |
          By default, `SignOut()` uses the `Global` scope, which revokes every session for the user. Pass `SignOutScope.Local` to sign out only the current session, or `SignOutScope.Others` to keep the current session and revoke all the rest.
        code: |
          ```c#
          await supabase.Auth.SignOut(SignOutScope.Local);
          ```
  - id: verify-otp
    title: 'VerifyOtp()'
    notes: |
      - The `VerifyOtp` method takes in different verification types. If a phone number is used, the type can either be `sms` or `phone_change`. If an email address is used, the type can be one of the following: `signup`, `magiclink`, `recovery`, `invite` or `email_change`.
      - The verification type used should be determined based on the corresponding auth method called before `VerifyOtp` to sign up / sign-in a user.
    examples:
      - id: verify-sms-one-time-password(otp)
        name: Verify Sms One-Time Password (OTP)
        isSpotlight: true
        code: |
          ```c#
          var session = await supabase.Auth.VerifyOTP("+13334445555", TOKEN, MobileOtpType.SMS);
          ```
  - id: get-session
    title: 'CurrentSession'
    description: |
      Returns the session data, if there is an active session.
    examples:
      - id: get-the-session-data
        name: Get the session data
        isSpotlight: true
        code: |
          ```c#
          var session = supabase.Auth.CurrentSession;
          ```
  - id: get-user
    title: 'CurrentUser'
    description: |
      Returns the user data, if there is a signed-in user.
    examples:
      - name: Get the signed-in user
        isSpotlight: true
        code: |
          ```c#
          var user = supabase.Auth.CurrentUser;
          ```
  - id: update-user
    title: 'UpdateUser()'
    description: |
      Updates user data, if there is a signed-in user.
    notes: |
      - In order to use the `UpdateUser()` method, the user needs to be signed in first.
      - By Default, email updates sends a confirmation link to both the user's current and new email.
      To only send a confirmation link to the user's new email, disable **Secure email change** in your project's [email auth provider settings](https://supabase.com/dashboard/project/_/auth/settings).
    examples:
      - id: update-the-email-for-an-authenticated-user
        name: Update the email for an authenticated user
        description: Sends a "Confirm Email Change" email to the new email address.
        isSpotlight: true
        code: |
          ```c#
          var attrs = new UserAttributes { Email = "new-email@example.com" };
          var response = await supabase.Auth.Update(attrs);
          ```
      - id: update-the-password-for-an-authenticated-user
        name: Update the password for an authenticated user
        isSpotlight: false
        code: |
          ```c#
          var attrs = new UserAttributes { Password = "***********" };
          var response = await supabase.Auth.Update(attrs);
          ```
      - id: update-the-users-metadata
        name: Update the user's metadata
        isSpotlight: true
        code: |
          ```c#
          var attrs = new UserAttributes
          {
            Data = new Dictionary<string, string> { {"example", "data" } }
          };
          var response = await supabase.Auth.Update(attrs);
          ```
  - id: on-auth-state-change
    title: 'StateChanged'
    description: |
      Receive a notification every time an auth event happens.
    notes: |
      - Types of auth events: `AuthState.SignedIn`, `AuthState.SignedOut`, `AuthState.UserUpdated`, `AuthState.PasswordRecovery`, `AuthState.TokenRefreshed`
    examples:
      - id: listen-to-auth-changes
        name: Listen to auth changes
        isSpotlight: true
        code: |
          ```c#
          supabase.Auth.AddStateChangedListener((sender, changed) =>
          {
              switch (changed)
              {
                  case AuthState.SignedIn:
                      break;
                  case AuthState.SignedOut:
                      break;
                  case AuthState.UserUpdated:
                      break;
                  case AuthState.PasswordRecovery:
                      break;
                  case AuthState.TokenRefreshed:
                      break;
              }
          });
          ```
  - id: reset-password-for-email
    title: 'ResetPasswordForEmail()'
    description: |
      Sends a reset request to an email address.
    notes: |
      Sends a password reset request to an email address. When the user clicks the reset link in the email they are redirected back to your application. Prompt the user for a new password and call Auth.UpdateUser():

    examples:
      - id: reset-password
        name: Reset password for email
        isSpotlight: true
        code: |
          ```c#
          await supabase.Auth.ResetPasswordForEmail("joseph@supabase.io");
          ```
  - id: sign-in-anonymously
    title: 'SignInAnonymously()'
    description: |
      Creates a new anonymous user.
    notes: |
      - Returns an anonymous user with a session. The user's `IsAnonymous` claim is set to `true`.
      - You can later convert an anonymous user into a permanent one by calling [`UpdateUser()`](/docs/reference/csharp/auth-updateuser) with an email or phone number, or by linking an OAuth identity with [`LinkIdentity()`](/docs/reference/csharp/auth-linkidentity).
      - Enable anonymous sign-ins in [your project's auth settings](https://supabase.com/dashboard/project/_/settings/auth).
    examples:
      - id: create-an-anonymous-user
        name: Create an anonymous user
        isSpotlight: true
        code: |
          ```c#
          var session = await supabase.Auth.SignInAnonymously();
          ```
      - id: create-an-anonymous-user-with-metadata
        name: With user metadata
        code: |
          ```c#
          var options = new SignInAnonymouslyOptions
          {
            Data = new Dictionary<string, object> { { "display_name", "Anonymous" } }
          };

          var session = await supabase.Auth.SignInAnonymously(options);
          ```

  - id: sign-in-with-id-token
    title: 'SignInWithIdToken()'
    description: |
      Signs in a user using an ID token issued by a supported OIDC provider.
    notes: |
      - The ID token is verified for validity before a session is established.
      - Supported providers are `Provider.Google`, `Provider.Apple`, `Provider.Azure`, and `Provider.Facebook`.
      - If the ID token contains an `at_hash` claim, pass the matching `accessToken`. If it contains a `nonce` claim, pass the `nonce` used to obtain the token.
    examples:
      - id: sign-in-with-google-id-token
        name: Sign in with a Google ID token
        isSpotlight: true
        code: |
          ```c#
          var session = await supabase.Auth.SignInWithIdToken(Provider.Google, idToken);
          ```
      - id: sign-in-with-nonce
        name: With a nonce
        code: |
          ```c#
          var session = await supabase.Auth.SignInWithIdToken(Provider.Apple, idToken, nonce: nonce);
          ```

  - id: sign-in-with-sso
    title: 'SignInWithSSO()'
    description: |
      Signs in a user through enterprise single sign-on (SSO).
    notes: |
      - Before you can use SSO, register your identity provider with the [Supabase CLI](https://supabase.com/docs/guides/auth/enterprise-sso/auth-sso-saml).
      - You can sign in either by email domain or by the provider's ID (a `Guid`).
      - The call returns a URL. Redirect the user to it to complete sign-in with their identity provider.
    examples:
      - id: sign-in-with-email-domain
        name: Sign in with an email domain
        isSpotlight: true
        code: |
          ```c#
          var response = await supabase.Auth.SignInWithSSO("acme.com");

          // Redirect the user to complete sign-in.
          var ssoUrl = response.Uri;
          ```
      - id: sign-in-with-provider-id
        name: Sign in with a provider ID
        code: |
          ```c#
          var response = await supabase.Auth.SignInWithSSO(providerId);
          var ssoUrl = response.Uri;
          ```

  - id: refresh-session
    title: 'RefreshSession()'
    description: |
      Refreshes the current session and returns the new session data.
    notes: |
      - Requires a signed-in user.
      - The SDK refreshes tokens automatically in the background. Call this only when you need to force a refresh.
    examples:
      - id: refresh-the-session
        name: Refresh the session
        isSpotlight: true
        code: |
          ```c#
          var session = await supabase.Auth.RefreshSession();
          ```

  - id: link-identity
    title: 'LinkIdentity()'
    description: |
      Links an OAuth identity to the signed-in user.
    notes: |
      - Requires a signed-in user, and uses the PKCE flow.
      - Enable [manual linking](https://supabase.com/docs/guides/auth/auth-identity-linking#manual-linking-beta) in your project before using this method.
      - The call returns a URL. Redirect the user to it to authorize the new identity.
    examples:
      - id: link-an-identity
        name: Link an identity
        isSpotlight: true
        code: |
          ```c#
          var state = await supabase.Auth.LinkIdentity(Provider.Github, new SignInOptions());

          // Redirect the user to authorize the linked provider.
          var authorizeUrl = state.Uri;
          ```

  - id: unlink-identity
    title: 'UnlinkIdentity()'
    description: |
      Unlinks an identity from the signed-in user.
    notes: |
      - Requires a signed-in user with more than one linked identity.
      - Once unlinked, the user can no longer sign in with that identity.
      - Retrieve the user's identities from `supabase.Auth.CurrentUser.Identities`.
    examples:
      - id: unlink-an-identity
        name: Unlink an identity
        isSpotlight: true
        code: |
          ```c#
          var identity = supabase.Auth.CurrentUser.Identities.First();
          await supabase.Auth.UnlinkIdentity(identity);
          ```

  - id: exchange-code-for-session
    title: 'ExchangeCodeForSession()'
    description: |
      Exchanges an auth code for a session as part of the PKCE flow.
    notes: |
      - Used to complete a PKCE sign-in flow (for example after an OAuth redirect or a password reset).
      - Pass the code verifier you generated at the start of the flow along with the auth code returned in the redirect.
    examples:
      - id: exchange-an-auth-code
        name: Exchange an auth code
        isSpotlight: true
        code: |
          ```c#
          var session = await supabase.Auth.ExchangeCodeForSession(codeVerifier, authCode);
          ```

  - id: send-password-reauthentication
    title: 'Reauthenticate()'
    description: |
      Sends a reauthentication nonce to the signed-in user's email or phone number.
    notes: |
      - Requires a signed-in user.
      - Use this before updating a password when [secure password change](https://supabase.com/docs/guides/auth/passwords#secure-password-change) is enabled. Pass the nonce the user receives to [`UpdateUser()`](/docs/reference/csharp/auth-updateuser).
    examples:
      - id: send-a-reauthentication-nonce
        name: Send a reauthentication nonce
        isSpotlight: true
        code: |
          ```c#
          await supabase.Auth.Reauthenticate();
          ```

  - id: mfa-enroll
    title: 'Enroll()'
    description: |
      Starts the enrollment process for a new multi-factor authentication (MFA) factor.
    notes: |
      - Creates a new `unverified` factor. Present the returned QR code or secret to the user, then verify it with [`Verify()`](/docs/reference/csharp/auth-mfa-verify) or [`ChallengeAndVerify()`](/docs/reference/csharp/auth-mfa-challengeandverify).
      - Only Time-based One-Time Password (TOTP) factors are supported. Set `FactorType` to `"totp"`.
    examples:
      - id: enroll-a-factor
        name: Enroll a factor
        isSpotlight: true
        code: |
          ```c#
          var response = await supabase.Auth.Enroll(new MfaEnrollParams
          {
            FactorType = "totp",
            FriendlyName = "My Authenticator App"
          });

          // Present the QR code to the user so they can add it to their authenticator app.
          var qrCode = response.Totp.QrCode;
          ```

  - id: mfa-challenge
    title: 'Challenge()'
    description: |
      Creates a challenge for an enrolled MFA factor.
    notes: |
      - Pair the returned challenge with [`Verify()`](/docs/reference/csharp/auth-mfa-verify) to complete verification.
      - Use [`ChallengeAndVerify()`](/docs/reference/csharp/auth-mfa-challengeandverify) to create and verify a challenge in a single call.
    examples:
      - id: create-a-challenge
        name: Create a challenge
        isSpotlight: true
        code: |
          ```c#
          var response = await supabase.Auth.Challenge(new MfaChallengeParams
          {
            FactorId = factorId
          });
          ```

  - id: mfa-verify
    title: 'Verify()'
    description: |
      Verifies a code against an MFA challenge.
    notes: |
      - The code is the one the user reads from their authenticator app.
      - On success, the session's assurance level is promoted to `aal2`.
    examples:
      - id: verify-a-challenge
        name: Verify a challenge
        isSpotlight: true
        code: |
          ```c#
          var session = await supabase.Auth.Verify(new MfaVerifyParams
          {
            FactorId = factorId,
            ChallengeId = challengeId,
            Code = "123456"
          });
          ```

  - id: mfa-challenge-and-verify
    title: 'ChallengeAndVerify()'
    description: |
      Creates a challenge and immediately verifies it with the given code.
    notes: |
      - A convenience method that combines [`Challenge()`](/docs/reference/csharp/auth-mfa-challenge) and [`Verify()`](/docs/reference/csharp/auth-mfa-verify).
      - The code is the one the user reads from their authenticator app.
    examples:
      - id: create-and-verify-a-challenge
        name: Create and verify a challenge
        isSpotlight: true
        code: |
          ```c#
          var session = await supabase.Auth.ChallengeAndVerify(new MfaChallengeAndVerifyParams
          {
            FactorId = factorId,
            Code = "123456"
          });
          ```

  - id: mfa-unenroll
    title: 'Unenroll()'
    description: |
      Removes an MFA factor from the signed-in user.
    notes: |
      - Unenrolling a `verified` factor requires an `aal2` session.
    examples:
      - id: unenroll-a-factor
        name: Unenroll a factor
        isSpotlight: true
        code: |
          ```c#
          await supabase.Auth.Unenroll(new MfaUnenrollParams
          {
            FactorId = factorId
          });
          ```

  - id: mfa-get-authenticator-assurance-level
    title: 'GetAuthenticatorAssuranceLevel()'
    description: |
      Returns the Authenticator Assurance Level (AAL) for the active session.
    notes: |
      - `aal1` (or `null`) means the user signed in with a single factor (password, OTP, magic link, or social sign-in).
      - `aal2` means the user also verified an MFA factor.
      - Use this to decide whether to prompt the user to complete an MFA challenge.
    examples:
      - id: get-the-assurance-level
        name: Get the assurance level
        isSpotlight: true
        code: |
          ```c#
          var response = await supabase.Auth.GetAuthenticatorAssuranceLevel();
          ```

  - id: get-user-by-id
