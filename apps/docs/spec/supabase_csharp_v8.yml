  - id: request-timeout
    title: 'Request timeout'
    description: |
      Sets a time limit on Database requests. A request that runs longer than the limit, retries included, is cancelled.
    notes: |
      - The timeout is off by default. The underlying `HttpClient` timeout (100 seconds by default) still applies.
      - A request that hits the limit throws a `TaskCanceledException` whose inner exception is a `TimeoutException`. Cancelling through your own `CancellationToken` throws the usual cancellation exception instead.
    examples:
      - id: set-a-timeout-on-the-supabase-client
        name: Set a timeout on the Supabase client
        isSpotlight: true
        code: |
          ```c#
          var options = new Supabase.SupabaseOptions
          {
              PostgrestTimeout = TimeSpan.FromSeconds(10)
          };

          var supabase = new Supabase.Client(url, key, options);
          await supabase.InitializeAsync();
          ```
      - id: set-a-timeout-on-a-standalone-postgrest-client
        name: Set a timeout on a standalone Postgrest client
        code: |
          ```c#
          var client = new Supabase.Postgrest.Client(url, new Supabase.Postgrest.ClientOptions
          {
              Timeout = TimeSpan.FromSeconds(10)
          });
          ```
  - id: strip-nulls
    title: 'StripNulls()'
    description: |
      Leaves null values out of the returned rows.
    notes: |
      - Requires PostgREST 11.2 or later.
      - Columns that are null are missing from the response, so the matching model properties keep their default values.
    examples:
      - id: with-select
        name: With `Select()`
        isSpotlight: true
        code: |
          ```c#
          var result = await supabase
            .From<City>()
            .Select("name, country_id")
            .StripNulls()
            .Get();
          ```
  - id: third-party-access-token
    title: 'Supplying an access token from a callback'
    description: |
      Supplies the access token for Database, Storage and Edge Functions requests from an async callback. The callback is awaited before every request and its token is sent as `Authorization: Bearer`. Use it with a third-party auth provider such as Clerk, Auth0, Firebase or Cognito.
    notes: |
      - If the callback returns `null`, the request is sent with the project API key, as when no user is signed in. If the callback throws, the request fails with that exception.
      - With `SupabaseOptions.ThirdPartyAccessToken`, the client builds no Supabase Auth client. `supabase.Auth` and `supabase.AdminAuth` throw `InvalidOperationException`.
      - It cannot be combined with an `Authorization` entry in `SupabaseOptions.Headers`.
      - The project must be configured to trust the provider's JWTs.
      - Standalone clients expose the same callback as `RetrieveAccessToken` on their `ClientOptions` (`Supabase.Postgrest`, `Supabase.Storage` and `Supabase.Functions`). The Functions callback is skipped when the call passes a token or an `Authorization` header of its own.
    examples:
      - id: with-the-supabase-client
        name: With the Supabase client
        isSpotlight: true
        code: |
          ```c#
          var options = new Supabase.SupabaseOptions
          {
              ThirdPartyAccessToken = cancellationToken => clerk.GetTokenAsync(cancellationToken)
          };

          var supabase = new Supabase.Client(url, key, options);
          var result = await supabase.From<City>().Get();
          ```
      - id: with-a-standalone-postgrest-client
        name: With a standalone Postgrest client
        code: |
          ```c#
          var client = new Supabase.Postgrest.Client(url, new Supabase.Postgrest.ClientOptions
          {
              RetrieveAccessToken = cancellationToken => tokenStore.GetTokenAsync(cancellationToken)
          });
          ```
  - id: functions-setauth
    title: 'SetAuth()'
    description: |
      Sets the access token that the Functions client sends as `Authorization: Bearer` on later invocations.
    notes: |
      - A token passed to `Invoke()` overrides the one set here.
      - A `ClientOptions.RetrieveAccessToken` callback, when set, is used in place of this token.
    examples:
      - id: set-the-token
        name: Set the token
        isSpotlight: true
        code: |
          ```c#
          supabase.Functions.SetAuth(session.AccessToken);

          await supabase.Functions.Invoke("hello");
          ```
  - id: invoke-stream
    title: 'InvokeStream()'
    description: |
      Invokes a Supabase Function and returns the `HttpResponseMessage` as soon as the response headers arrive, so the body can be read as it is produced.
    notes: |
      - The caller must dispose the returned response.
      - `InvokeFunctionOptions.HttpTimeout` (100 seconds by default) covers the request and any error body. Cancel reads of a successful body with their own `CancellationToken`.
      - A non-success status code throws a `FunctionsException`.
    examples:
      - id: read-a-streamed-response
        name: Read a streamed response
        isSpotlight: true
        code: |
          ```c#
          using var response = await supabase.Functions.InvokeStream("stream-numbers");
          using var stream = await response.Content.ReadAsStreamAsync();
          using var reader = new StreamReader(stream);

          while (await reader.ReadLineAsync() is { } line)
          {
              Console.WriteLine(line);
          }
          ```
  - id: storagefile-list-v2
    title: 'From().ListV2Async()'
    description: |
      Lists the objects under a prefix, one page at a time.
    notes: |
      - Policy permissions required:
        - `buckets` permissions: none
        - `objects` permissions: `select`
      - The server returns at most 1,000 entries per page, which is also the default.
      - Pass `NextCursor` from one page as `Cursor` in the options of the next page. Stop when `HasNext` is `false`.
      - With `WithDelimiter = true`, sub-folders are returned in `Folders` and `Objects` holds only the objects directly under the prefix. Without it, `Objects` holds every nested object and `Name` is the full path.
      - `SortBy` accepts the columns `name`, `updated_at` and `created_at`.
    examples:
      - id: list-the-first-page
        name: List the first page
        isSpotlight: true
        code: |
          ```c#
          var page = await supabase.Storage
            .From("avatars")
            .ListV2Async(new SearchV2Options
            {
                Prefix = "public/",
                Limit = 100
            });

          foreach (var file in page.Objects)
              Console.WriteLine(file.Name);
          ```
      - id: page-through-all-objects
        name: Page through all objects
        code: |
          ```c#
          var bucket = supabase.Storage.From("avatars");
          var options = new SearchV2Options { Prefix = "public/", Limit = 100 };

          SearchV2Result? page;
          do
          {
              page = await bucket.ListV2Async(options);
              foreach (var file in page.Objects)
                  Console.WriteLine(file.Name);

              options.Cursor = page.NextCursor;
          } while (page.HasNext);
          ```
      - id: group-folders-and-sort
        name: Group folders and sort
        code: |
          ```c#
          var page = await supabase.Storage
            .From("avatars")
            .ListV2Async(new SearchV2Options
            {
                Prefix = "public/",
                WithDelimiter = true,
                SortBy = new SortBy { Column = "updated_at", Order = "desc" }
            });

          var folders = page.Folders;
          var files = page.Objects;
          ```
  - id: max-affected
    title: 'MaxAffected()'
    description: |
      Sets the most rows an `Update()` or `Delete()` may affect. If the mutation would affect more rows, PostgREST rolls it back and the call throws.
    notes: |
      - Requires PostgREST 13 or later. An older server ignores the limit.
      - The call throws a `PostgrestException` with `Reason` set to `FailureHint.Reason.MaxAffectedExceeded`.
      - A negative value throws an `ArgumentOutOfRangeException`. A value of zero forbids any affected row.
      - Using it with a terminal call other than `Update()` or `Delete()` throws an `InvalidOperationException`.
    examples:
      - id: cap-a-delete
        name: Cap a delete
        isSpotlight: true
        code: |
          ```c#
          await supabase
            .From<City>()
            .Filter("country_id", Operator.Equals, "554")
            .MaxAffected(10)
            .Delete();
          ```
      - id: handle-the-limit-being-exceeded
        name: Handle the limit being exceeded
        code: |
          ```c#
          try
          {
              await supabase
                .From<City>()
                .Where(x => x.CountryId == 554)
                .Set(x => x.Name, "Renamed")
                .MaxAffected(5)
                .Update();
          }
          catch (PostgrestException ex) when (ex.Reason == FailureHint.Reason.MaxAffectedExceeded)
          {
              // More than 5 rows matched, nothing was changed.
          }
          ```
  - id: single-or-throw
    title: 'SingleOrThrowAsync()'
    description: |
      Retrieves exactly one row. Returns the model when one row matches and throws a `PostgrestException` when no row or several rows match.
    notes: |
      - The exception has `Reason` set to `FailureHint.Reason.UnexpectedRowCount` and status code `406`.
      - `Single()` returns `null` when no row matches. Use `SingleOrThrowAsync()` when a missing row is an error.
      - Only reads are supported.
    examples:
      - id: read-one-row
        name: Read one row
        isSpotlight: true
        code: |
          ```c#
          var city = await supabase
            .From<City>()
            .Filter("id", Operator.Equals, "554")
            .SingleOrThrowAsync();
          ```
  - id: broadcast-message
    title: 'Broadcast over HTTP'
    description: |
      Sends a broadcast message through the Realtime REST API instead of the websocket. The channel does not have to be subscribed.
    notes: |
      - Added in 8.11.0.
      - The payload is serialized as JSON. A `byte[]` payload is sent as raw binary, which subscribers of this client do not receive.
      - On a private channel (see `PrivateChannel()`), the request carries the client's current access token.
      - Throws a `RealtimeException` with the HTTP status code when the server rejects the request.
      - Since 8.13.0, `Channel()` no longer requires `ConnectAsync()` first. On 8.11.0 and 8.12.0, connect the client before creating the channel.
    examples:
      - id: broadcast-without-subscribing
        name: Broadcast without subscribing
        isSpotlight: true
        code: |
          ```c#
          var channel = supabase.Realtime.Channel("cursor");

          await channel.HttpSendAsync("cursor", new Dictionary<string, object>
          {
              { "cursorX", 123 },
              { "cursorY", 456 }
          });
          ```
      - id: broadcast-http-private
        name: Broadcast on a private channel
        code: |
          ```c#
          var channel = supabase.Realtime.PrivateChannel("room:1");

          await channel.HttpSendAsync("announcement", new Dictionary<string, object>
          {
              { "text", "Hello" }
          }, cancellationToken);
          ```

  - id: realtime-connection-state
    title: 'ConnectionState'
    description: |
      Returns the current state of the Realtime connection: `Closed`, `Connecting`, or `Open`.
    notes: |
      - Added in 8.11.0.
      - `Connecting` also covers a socket that is reconnecting after it lost the connection.
      - To react to changes instead of polling, add a handler with `AddStateChangedHandler()`.
    examples:
      - id: read-connection-state
        name: Read the connection state
        isSpotlight: true
        code: |
          ```c#
          var state = supabase.Realtime.ConnectionState;

          if (state == Supabase.Realtime.Constants.ConnectionState.Open)
          {
              Debug.WriteLine("Connected");
          }
          ```
      - id: listen-to-state-changes
        name: Listen to socket state changes
        code: |
          ```c#
          supabase.Realtime.AddStateChangedHandler((sender, state) =>
          {
              Debug.WriteLine($"Socket state: {state}");
          });
          ```

  - id: realtime-access-token-callback
    title: 'RetrieveAccessToken'
    description: |
      A callback on the Realtime client options that returns the current access token. The client calls it on connect and on every heartbeat, so a refreshed token reaches the server without a call to `SetAuth()`.
    notes: |
      - Added in 8.11.0.
      - Returning `null` keeps the current token.
      - A failure on connect propagates out of `ConnectAsync()`. A failure on a heartbeat is logged and keeps the current token.
      - The `Supabase.Client` sets this callback for you when you use `SupabaseOptions.ThirdPartyAccessToken`. Set it yourself when you use the standalone `Supabase.Realtime` package.
    examples:
      - id: realtime-retrieve-access-token
        name: Supply the token from a callback
        isSpotlight: true
        code: |
          ```c#
          var options = new Supabase.Realtime.ClientOptions
          {
              RetrieveAccessToken = async () => await tokenStore.GetAccessTokenAsync()
          };

          var realtime = new Supabase.Realtime.Client("wss://<project>.supabase.co/realtime/v1", options);
          await realtime.ConnectAsync();
          ```

  - id: realtime-heartbeat-handlers
    title: 'AddHeartbeatHandler()'
    description: |
      Adds a handler that is called for each heartbeat the client sends and for its outcome. The status is `Sent`, `Ok`, `Error`, or `Timeout`.
    notes: |
      - Added in 8.10.0.
      - `latency` is set only for `Ok` and `Error`.
      - On `Timeout`, the socket reconnects.
      - A handler that throws does not stop the socket.
      - Remove handlers with `RemoveHeartbeatHandler()` or `ClearHeartbeatHandlers()`.
      - Change the interval with `ClientOptions.HeartbeatInterval` (20 seconds by default).
    examples:
      - id: listen-to-heartbeats
        name: Listen to heartbeats
        isSpotlight: true
        code: |
          ```c#
          supabase.Realtime.AddHeartbeatHandler((sender, status, latency) =>
          {
              Debug.WriteLine($"Heartbeat {status} {latency?.TotalMilliseconds}ms");
          });
          ```

  - id: realtime-probe-connection
    title: 'ProbeConnection()'
    description: |
      Checks the connection now instead of waiting for the next heartbeat. If no reply arrives within `ClientOptions.ProbeTimeout` (5 seconds by default), the socket reconnects.
    notes: |
      - Added in 8.12.0.
      - Call it when your app returns to the foreground, for example from `OnApplicationPause(false)` in Unity or the resume event in MAUI.
      - Does nothing when the socket is not open.
    examples:
      - id: probe-on-foreground
        name: Probe when the app returns to the foreground
        isSpotlight: true
        code: |
          ```c#
          void OnApplicationPause(bool paused)
          {
              if (!paused)
              {
                  supabase.Realtime.ProbeConnection();
              }
          }
          ```

  - id: remove-all-channels
    title: 'RemoveAll()'
    description: |
      Unsubscribes from every channel and disconnects the Realtime socket.
    notes: |
      - Added in 8.9.0.
      - To remove a single channel, use `Unsubscribe()` on the channel or `Remove(channel)` on the client.
    examples:
      - id: remove-all-channels-example
        name: Remove all channels
        isSpotlight: true
        code: |
          ```c#
          supabase.Realtime.RemoveAll();
          ```

  - id: realtime-disconnect-when-empty
    title: 'DisconnectOnEmptyChannelsAfter'
    description: |
      A Realtime client option that disconnects the socket once the last channel has been closed for the given time. Left unset, the socket stays open.
    notes: |
      - Added in 8.5.0.
      - Opt-in. The default keeps the socket open.
      - Since 8.13.0, the next `Subscribe()` connects the socket again. On earlier versions, call `ConnectAsync()` again before you create new channels.
    examples:
      - id: disconnect-when-idle
        name: Disconnect after 30 seconds without channels
        isSpotlight: true
        code: |
          ```c#
          var options = new Supabase.Realtime.ClientOptions
          {
              DisconnectOnEmptyChannelsAfter = TimeSpan.FromSeconds(30)
          };

          var realtime = new Supabase.Realtime.Client("wss://<project>.supabase.co/realtime/v1", options);
          ```

  - id: realtime-private-channel
    title: 'PrivateChannel()'
    description: |
      Creates a private channel. The server authorizes the join against your Row Level Security policies on `realtime.messages`. The join carries the client's current access token, so a policy that uses `auth.uid()` sees the signed-in user.
    notes: |
      - Added in 8.12.0.
      - The token is the one set by `SetAuth()` or returned by `ClientOptions.RetrieveAccessToken`. With `Supabase.Client`, it follows the signed-in session.
      - To join with a token from another source, use `Channel(name, ChannelOptions.Private(...))`.
      - See [Realtime authorization](/docs/guides/realtime/authorization).
    examples:
      - id: join-private-channel
        name: Join a private channel
        isSpotlight: true
        code: |
          ```c#
          var channel = supabase.Realtime.PrivateChannel($"user:{userId}");
          var broadcast = channel.Register<CursorBroadcast>();

          await channel.Subscribe();
          ```

  - id: realtime-presence-options
    title: 'PresenceOptions'
    description: |
      Controls whether a channel receives presence updates from other clients. `Register<T>(presenceKey)` enables presence. Use `PresenceOptions.WithoutPresence()` when this client only needs to make itself visible with `Track()`.
    notes: |
      - The `enabled` flag was added in 8.1.0.
      - With presence off, the channel does not receive the initial `presence_state` sync or later updates from other clients.
      - Adding presence handlers after `Subscribe()` while presence is off throws a `RealtimeException`.
    examples:
      - id: presence-enabled
        name: Receive presence updates
        isSpotlight: true
        code: |
          ```c#
          var channel = supabase.Realtime.Channel("room");
          var presence = channel.Register<UserPresence>(PresenceOptions.WithPresence("user-1"));

          await channel.Subscribe();
          ```
      - id: presence-track-only
        name: Track without receiving updates
        code: |
          ```c#
          var channel = supabase.Realtime.Channel("room");
          var presence = channel.Register<UserPresence>(PresenceOptions.WithoutPresence("user-1"));

          await channel.Subscribe();
          presence.Track(new UserPresence { LastSeen = DateTime.UtcNow });
          ```

  - id: realtime-presence-join-leave
    title: 'AddJoinHandler() and AddLeaveHandler()'
    description: |
      Adds handlers that run once for each presence key that gains or loses presences. The handler receives the key and the presences involved.
    notes: |
      - Added in 8.13.0.
      - A join handler receives `Key`, `CurrentPresences` (what the key already had, empty for a new key), and `NewPresences`.
      - A leave handler receives `Key`, `CurrentPresences` (what the key still has), and `LeftPresences`.
      - Handlers run before `CurrentState` changes.
      - Remove them with `RemoveJoinHandler()` and `RemoveLeaveHandler()`.
    examples:
      - id: presence-join-leave
        name: Listen to joins and leaves
        isSpotlight: true
        code: |
          ```c#
          var channel = supabase.Realtime.Channel("room");
          var presence = channel.Register<UserPresence>("user-1");

          presence.AddJoinHandler(join =>
          {
              Debug.WriteLine($"{join.Key} joined: {join.NewPresences.Count} new");
          });

          presence.AddLeaveHandler(leave =>
          {
              Debug.WriteLine($"{leave.Key} left: {leave.LeftPresences.Count} gone");
          });

          await channel.Subscribe();
          ```

  - id: third-party-auth
    title: 'Third-party auth'
    description: |
      Authenticates the client through a third-party auth provider such as Clerk, Auth0, Firebase, or Cognito, instead of Supabase Auth. Set `SupabaseOptions.ThirdPartyAccessToken` to a callback that returns the provider's current JWT, or `null` when no user is signed in.
    notes: |
      - Added in 8.12.0.
      - The callback is awaited before every Database, Storage, and Edge Functions request. The token is sent as `Authorization: Bearer`. Realtime asks for it on connect and on every heartbeat.
      - A `null` token sends the request with the project API key. A callback that throws fails the request with the same exception. The client does not fall back to the API key.
      - With this option set, `Auth` and `AdminAuth` throw `InvalidOperationException`, and `InitializeAsync()` restores no session. `SessionHandler`, `AutoRefreshToken`, and `AuthFlowType` are ignored.
      - You cannot combine it with an `Authorization` entry in `SupabaseOptions.Headers`.
      - Configure your project to trust the provider's JWTs. See [third-party auth](/docs/guides/auth/third-party/overview).
    examples:
      - id: third-party-auth-clerk
        name: Use a third-party token
        isSpotlight: true
        code: |
          ```c#
          var options = new Supabase.SupabaseOptions
          {
              ThirdPartyAccessToken = cancellationToken => clerk.GetTokenAsync(cancellationToken)
          };

          var supabase = new Supabase.Client(url, publishableKey, options);
          await supabase.InitializeAsync();

          var todos = await supabase.From<Todo>().Get();
          ```

  - id: access-token-callback
    title: 'RetrieveAccessToken (HTTP clients)'
    description: |
      The standalone Postgrest, Storage, and Functions clients accept an async `RetrieveAccessToken` callback in their options. It supplies the bearer token for every request, so you do not need to call `SetAuth()` after each refresh.
    notes: |
      - Added in 8.12.0.
      - Signature: `Func<CancellationToken, Task<string?>>`.
      - The callback is awaited before every request. A `null` token leaves the headers unchanged.
      - Storage uploads to a signed URL keep the URL's own token.
      - For Functions, the callback is skipped when the call has a token argument or its own `Authorization` header.
      - With `Supabase.Client`, use `SupabaseOptions.ThirdPartyAccessToken`, which wires this callback into each client for you.
    examples:
      - id: postgrest-access-token-callback
        name: Postgrest
        isSpotlight: true
        code: |
          ```c#
          var options = new Supabase.Postgrest.ClientOptions
          {
              RetrieveAccessToken = async cancellationToken => await tokenStore.GetAccessTokenAsync(cancellationToken)
          };

          var postgrest = new Supabase.Postgrest.Client("https://<project>.supabase.co/rest/v1", options);
          ```
      - id: storage-access-token-callback
        name: Storage
        code: |
          ```c#
          var options = new Supabase.Storage.ClientOptions
          {
              RetrieveAccessToken = async cancellationToken => await tokenStore.GetAccessTokenAsync(cancellationToken)
          };

          var storage = new Supabase.Storage.Client("https://<project>.supabase.co/storage/v1", options);
          ```
      - id: functions-access-token-callback
        name: Functions
        code: |
          ```c#
          var options = new Supabase.Functions.ClientOptions
          {
              RetrieveAccessToken = async cancellationToken => await tokenStore.GetAccessTokenAsync(cancellationToken)
          };

          var functions = new Supabase.Functions.Client("https://<project>.supabase.co/functions/v1", options: options);
          ```
