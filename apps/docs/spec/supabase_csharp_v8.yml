    description: |
      Lists the single sign-on providers of your project.
    notes: |
      - This is an admin method. Call it with your service role key, and only from a trusted server environment. Never call it from a client app.
      - Use `SsoProviderFilter.ByResourceId()` or `SsoProviderFilter.ByResourceIdPrefix()` to narrow the list.
    examples:
      - id: list-sso-providers
        name: List SSO providers
        isSpotlight: true
