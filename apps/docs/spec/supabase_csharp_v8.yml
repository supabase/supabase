  - id: admin-create-sso-provider
    title: 'AdminAuth().CreateSsoProviderAsync()'
    description: |
      Registers a single sign-on (SAML 2.0) identity provider.
    notes: |
      - This is an admin method. Call it with your service role key, and only from a trusted server environment. Never call it from a client app.
      - Give the identity provider metadata with `SamlMetadata.FromUrl()` or `SamlMetadata.FromXml()`. A metadata URL must be absolute.
      - Use `SsoProviderOptions` to set the email domains, the resource ID, the name ID format, the attribute mapping, and whether the provider is enabled.
      - Users with an email address in one of the domains can then sign in with `SignInWithSSO()`.
    examples:
      - id: create-an-sso-provider
        name: Create an SSO provider
        isSpotlight: true
        code: |
          ```c#
          var admin = supabase.AdminAuth(SUPABASE_SERVICE_KEY);
          var provider = await admin.CreateSsoProviderAsync(
              SamlMetadata.FromUrl(new Uri("https://idp.acme.com/saml/metadata")),
              new SsoProviderOptions
              {
                  Domains = new[] { "acme.com" },
                  ResourceId = "acme",
                  NameIdFormat = SamlNameIdFormat.EmailAddress
              });
          ```
  - id: admin-get-sso-provider
    title: 'AdminAuth().GetSsoProviderAsync()'
    description: |
      Retrieves a single sign-on provider, including its metadata and email domains.
    notes: |
      - This is an admin method. Call it with your service role key, and only from a trusted server environment. Never call it from a client app.
      - Address the provider with `SsoProviderReference.ById()` or `SsoProviderReference.ByResourceId()`. A resource ID cannot contain `/`.
      - It throws a `GotrueException` with the reason `SsoProviderNotFound` when no provider matches.
    examples:
      - id: get-an-sso-provider
        name: Get an SSO provider
        isSpotlight: true
        code: |
          ```c#
          var admin = supabase.AdminAuth(SUPABASE_SERVICE_KEY);
          var provider = await admin.GetSsoProviderAsync(SsoProviderReference.ByResourceId("acme"));
          ```
