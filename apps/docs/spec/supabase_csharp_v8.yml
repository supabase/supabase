          await admin.DeleteSsoProviderAsync(SsoProviderReference.ByResourceId("acme"));
          ```
  - id: session-persistence-disabled
    title: 'SessionPersistence.Disabled'
    description: |
      Keeps the session in memory only, and saves nothing.
    notes: |
      - A client that uses it starts signed out, because there is nothing to restore.
      - It is the default for `SupabaseOptions.SessionHandler`, so you only set it to state the intent, or to turn persistence off again with `SetPersistence()`.
      - It replaces `DefaultSupabaseSessionHandler`, which is `[Obsolete]` and is removed in v9.
    examples:
      - id: disable-session-persistence
        name: Disable session persistence
        isSpotlight: true
        code: |
          ```c#
          var options = new Supabase.SupabaseOptions
          {
              SessionHandler = SessionPersistence.Disabled
          };

          var supabase = new Supabase.Client(url, key, options);
          await supabase.InitializeAsync();
          ```
      - id: disable-persistence-on-an-existing-client
        name: Disable persistence on an existing client
        code: |
          ```c#
          supabase.Auth.SetPersistence(SessionPersistence.Disabled);
          ```
  - id: admin-oauth-create-client
    title: 'AdminAuth().CreateOAuthClientAsync()'
    description: |
      Registers an OAuth client with the OAuth 2.1 server of your project.
    notes: |
      - This is an admin method. Call it with your service role key, and only from a trusted server environment. Never call it from a client app.
      - Use `NewOAuthClient.Confidential()` for a client that can keep a secret, or `NewOAuthClient.Public()` for one that cannot. A name and at least one redirect URI are required.
      - The server generates the client ID. For a confidential client it also generates a secret, and shows it only in this response (`ClientSecret`). Public clients have no secret.
      - `OAuthClientOptions` sets the grant types, the client URI, and the logo URI.
    examples:
      - id: create-a-confidential-oauth-client
        name: Create a confidential OAuth client
        isSpotlight: true
        code: |
          ```c#
          var admin = supabase.AdminAuth(SUPABASE_SERVICE_KEY);
          var created = await admin.CreateOAuthClientAsync(
              NewOAuthClient.Confidential("My App", new[] { new Uri("https://app.example.com/callback") }),
              new OAuthClientOptions { ClientUri = new Uri("https://app.example.com") });

          var clientId = created.Client.ClientId;
          var clientSecret = created.ClientSecret;
          ```
      - id: create-a-public-oauth-client
        name: Create a public OAuth client
        code: |
          ```c#
          var admin = supabase.AdminAuth(SUPABASE_SERVICE_KEY);
          var created = await admin.CreateOAuthClientAsync(
              NewOAuthClient.Public("My Mobile App", new[] { new Uri("myapp://callback") }));
          ```
