  - id: admin-update-sso-provider
    title: 'AdminAuth().UpdateSsoProviderAsync()'
    description: |
      Updates a single sign-on provider.
    notes: |
      - This is an admin method. Call it with your service role key, and only from a trusted server environment. Never call it from a client app.
      - `SsoProviderChanges` has no public constructor. Start from `KeepingNameIdFormatOf(provider)`, `WithNameIdFormat(format)`, or `WithoutNameIdFormat()`, then set the other members with `with`. This makes you choose what happens to the name ID format.
      - New metadata must carry the same entity ID as the provider. Otherwise the server returns the error code `saml_entity_id_mismatch`.
    examples:
      - id: add-a-domain-to-an-sso-provider
        name: Add a domain to an SSO provider
        isSpotlight: true
        code: |
          ```c#
          var admin = supabase.AdminAuth(SUPABASE_SERVICE_KEY);
          var current = await admin.GetSsoProviderAsync(SsoProviderReference.ByResourceId("acme"));

          var updated = await admin.UpdateSsoProviderAsync(
              SsoProviderReference.ById(current.Id),
              SsoProviderChanges.KeepingNameIdFormatOf(current) with { Domains = new[] { "acme.com", "acme.org" } });
          ```
